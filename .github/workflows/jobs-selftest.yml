# The job scripts under docs/testing/jobs run only on the owner's host, and
# the sessions that write them cannot execute them. selftest.sh runs the real
# scripts against a fake host (shimmed gh/systemctl/adb, a generated goldens
# tree, the real request.sh). It is the check that would have caught the
# three defects of 2026-09-19 before they reached the host.
name: jobs selftest

# Manual dispatch only (2026-10-03): the forge runs this gate from
# .forgejo/workflows/forge-selftest.yml. See android.yml and
# docs/lanes/localforge/RETURN.md, section 2a.
on:
  workflow_dispatch:

# hakux-ci-throttle (2026-09-29): a newer push cancels the older run
concurrency:
  group: jobs-selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job per shard (selftest.sh, "the shards"): run whole it took 18-25 min
  # against this same cap, and a capped run is CANCELLED, which fold.sh reads
  # as red. Each shard builds its own fake host. Every `selftest (k)` check
  # must be green; fold.sh's ci_green() reads every check in the rollup.
  # Changing the shard count: the list and the /N below together, or
  # selftest.sh's guard refuses every shard.
  selftest:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SELFTEST_SHARD: ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false
      - name: Fetch the trunk and the lane branches the arms job reads
        run: git fetch origin master '+refs/heads/lane/*:refs/remotes/origin/lane/*'
      - name: Run the self-test
        run: bash docs/testing/jobs/selftest.sh
