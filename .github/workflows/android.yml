name: Android

# The Android app is the reason this fork exists and nothing built it. The
# existing workflows cover Linux, macOS and Windows only, which is how a
# subproject pinned to a nonexistent revision, a JDK path belonging to one
# developer's machine, and an unvalidated frontend integration all shipped.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false   # the QEMU ROM submodules are unused by this build

      - name: Free disk space
        # The native build unpacks the NDK, glib and several fetched
        # dependencies; a stock runner is tight without this.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
                      /opt/ghc /usr/local/share/boost
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install the SDK components this build pins
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;29.0.14206865" \
            "cmake;3.30.3"

      - name: Install host build tools
        # meson is not in the project's documented toolchain but the native
        # build compiles glib with it, and its absence fails late and
        # obscurely rather than at configure time.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config flex bison
          python3 -m pip install --upgrade meson
          meson --version && ninja --version

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Report what was built
        working-directory: android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$APK"
          "$ANDROID_HOME/build-tools/36.1.0/aapt2" dump badging "$APK" \
            | grep -E "^package|application-label:'" || true
          sha256sum "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: hakux-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
