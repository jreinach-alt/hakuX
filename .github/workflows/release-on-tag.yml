name: Release (Tag Pushed)

# Desktop builds are not maintained in this fork; see ci.yml. Releases are
# cut by hand, so this no longer fires on a v* tag.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: github.repository_owner == 'xemu-project'
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ github.ref_name }}
      tag: ${{ github.ref_name }}
