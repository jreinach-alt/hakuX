name: Desktop build

# WHY THIS EXISTS
#
# Until 2026-09 the Linux target did not build, so hw/xbox/nv2a's headers had
# exactly one consumer: the Android port. Two commits on the docs/tooling
# sprint changed those headers, were verified against the desktop build that
# had just been unblocked, and broke Android - which is the build that ships.
# Nothing caught it; a person reading the diff did.
#
# A header shared by two builds needs both of them gated. Android is covered by
# android.yml. This is the other half, and it deliberately carries the same
# triggers so a single push runs both.
#
# It is also the tier-2 test target: a place to run the emulator without the
# handheld. Mesa's lavapipe supplies a conformant software Vulkan device on a
# stock runner, so this can grow into running the pgraph suite here. Today it
# proves the build and a headless start.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false   # the QEMU ROM submodules are unused by this build

      # Found by iteration against a bare container; every one of these was a
      # hard configure failure, not an optional feature. glib and pixman are
      # QEMU's own requirements; the rest are xemu's UI and the NV2A backends.
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ninja-build ccache python3-venv pkg-config \
            libglib2.0-dev libpixman-1-dev \
            libsdl2-dev libepoxy-dev libgtk-3-dev \
            libvulkan-dev mesa-vulkan-drivers \
            libslirp-dev libpcap-dev libssl-dev libgmp-dev \
            libpng-dev libsamplerate0-dev libasound2-dev libpulse-dev \
            libcap-ng-dev libattr1-dev libdrm-dev libpcre2-dev \
            nlohmann-json3-dev \
            xvfb

      # Seconds, and it fails for a reason no other gate here catches: the
      # differ compiles psh.c out of the tree with the emulator-state functions
      # carved out by signature. Rename or reshape one of those and the carve
      # stops matching. Running it first means that shows up before the
      # twenty-minute build rather than after.
      - name: Pixel shader state differ
        run: |
          set -o pipefail
          make -C docs/testing/psh_differ
          ./docs/testing/psh_differ/build/psh-differ > psh-differ.log 2> psh-differ.err
          if grep -q 'does not generate' psh-differ.err; then
            echo "::error::a psh-differ baseline no longer generates a shader"
            cat psh-differ.err
            exit 1
          fi
          if ! grep -q '^TOTAL' psh-differ.log; then
            echo "::error::psh-differ produced no report"
            tail -40 psh-differ.log psh-differ.err
            exit 1
          fi
          grep -E '^(field|-----|TOTAL)' psh-differ.log
          sed -n '/^No effect on the emitted GLSL/,/^$/p' psh-differ.log

      # meson is not installed; QEMU's configure bootstraps it into a venv,
      # which is why python3-venv is above.
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: desktop-ccache-${{ github.sha }}
          restore-keys: desktop-ccache-

      - name: Configure
        run: |
          mkdir -p build-linux
          cd build-linux
          ../configure \
            --target-list=i386-softmmu \
            --extra-cflags="-DXBOX=1" \
            --disable-werror --disable-docs --disable-guest-agent --disable-tools

      - name: Build
        run: ninja -C build-linux -j"$(nproc)" qemu-system-i386

      # Compiling is not enough: the two breakages this gate exists for were a
      # missing include and a missing symbol, and one of those only shows at
      # link. Starting the machine also exercises NV2A init, which is where the
      # shared headers actually get used.
      - name: Start the emulated machine headless
        env:
          SDL_VIDEODRIVER: offscreen
          SDL_AUDIODRIVER: dummy
        run: |
          cd build-linux
          set +e
          timeout -k 5 40 ./qemu-system-i386 -machine xbox -display none > smoke.log 2>&1
          rc=$?
          set -e
          # 124 is the timeout killing a healthy long-running process, which is
          # the expected outcome - there is no BIOS or disc here to boot.
          if [ "$rc" -ne 124 ] && [ "$rc" -ne 0 ]; then
            echo "::error::emulator exited $rc instead of running"
            grep -viE '^ALSA lib|snd_' smoke.log | tail -40
            exit 1
          fi
          if grep -qiE 'Assertion|assert failed|Segmentation fault' smoke.log; then
            echo "::error::assertion or crash during startup"
            grep -viE '^ALSA lib|snd_' smoke.log | tail -40
            exit 1
          fi
          if ! grep -q 'xemu_version' smoke.log; then
            echo "::error::no version banner - the binary did not get far enough to be meaningful"
            tail -40 smoke.log
            exit 1
          fi
          echo "started clean:"
          grep -viE '^ALSA lib|snd_' smoke.log | head -12

      # The renderer Android actually ships is Vulkan, so a GL-only gate would
      # miss the path that matters. Mesa's lavapipe gives a stock runner a
      # conformant software Vulkan device; SDL's offscreen driver cannot make a
      # Vulkan surface, so this one needs a virtual X server.
      - name: Start the emulated machine headless, requesting Vulkan
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          cd build-linux
          mkdir -p ~/.local/share/xemu/xemu
          printf '[display]\nrenderer = "VULKAN"\n' > ~/.local/share/xemu/xemu/xemu.toml
          set +e
          xvfb-run -a --server-args="-screen 0 1280x720x24" \
            timeout -k 5 40 ./qemu-system-i386 -machine xbox -display none \
            > smoke-vk.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 124 ] && [ "$rc" -ne 0 ]; then
            echo "::error::Vulkan startup exited $rc instead of running"
            grep -viE '^ALSA lib|snd_|^sdl:|^audio:' smoke-vk.log | tail -40
            exit 1
          fi
          if grep -qiE 'Assertion|assert failed|Segmentation fault' smoke-vk.log; then
            echo "::error::assertion or crash during Vulkan startup"
            grep -viE '^ALSA lib|snd_' smoke-vk.log | tail -40
            exit 1
          fi
          # This used to grep for 'Available physical devices' and call that
          # proof the Vulkan backend came up. It is not: nv2a_context_init
          # initialises every registered renderer regardless of which one is
          # selected, so that line appears on an OpenGL run too. The gate was
          # green either way and proved nothing.
          #
          # nv2a now names the renderer it actually uses. Check that instead.
          if ! grep -q '^nv2a: renderer:' smoke-vk.log; then
            echo "::error::no renderer line - binary predates it, or died first"
            grep -viE '^ALSA lib|snd_' smoke-vk.log | tail -40
            exit 1
          fi
          renderer=$(grep -m1 '^nv2a: renderer:' smoke-vk.log | cut -d' ' -f3-)
          echo "renderer in use: $renderer"
          if [ "$renderer" != "Vulkan" ]; then
            # lavapipe lacks VK_KHR_external_semaphore_fd. Until 611c2b4 the
            # desktop build required it, so the toml selected Vulkan and the
            # run silently continued on OpenGL, and this branch could only
            # warn. The FD interop extensions are optional now -- presentation
            # falls back to a download -- the device is accepted, and this
            # step is the Vulkan gate it claims to be. Falling back is a
            # regression, not a runner limitation; the nv2a: lines say what
            # was refused.
            echo "::error::asked for Vulkan, got '$renderer' - the Vulkan renderer did not come up on lavapipe"
            grep -iE '^nv2a:|physical device|extension' smoke-vk.log | head -20
            exit 1
          fi

      - name: Upload startup log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-log
          path: |
            build-linux/smoke.log
            build-linux/smoke-vk.log
          if-no-files-found: ignore
