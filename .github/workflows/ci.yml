name: CI

# The Linux, macOS and Windows builds are not maintained in this fork, which
# targets Android. They are kept runnable on demand rather than deleted, but
# they no longer run on every push: a permanently red matrix hides a real
# failure in the Android build, which is the check that matters here.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.ref }}
