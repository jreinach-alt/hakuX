note = "#84, the BLEND_AND 32bpp overrun, and it is dispatched WHILE THE FLEET IS HELD DELIBERATELY rather than for want of anything else to do. This is the one defect on the board whose evidence is COMPLETE WITHOUT A DEVICE and whose evidence could never be completed WITH one: all 20 ImgBlt_BLENDAND_* captures are XRGB/ZRGB, both 32bpp, so no arm on this or any fleet could exercise the narrow-format path. Audit pass 1 over the blit fix found it, pre-existing, and explicitly recommended it not hold that fold. perform_blit indexes s[x*4+ch] and loads 16 bytes per 4 pixels while the caller admits LE_Y8 (1 byte) and LE_R5G6B5 (2); bytes_per_pixel is threaded into perform_blit_tiled() and never into perform_blit(). The overrun is BOUNDED -- CORRECTED AT WAVE 81, and the wrong word was the orchestrator's in all three places it appeared. max_row_pixels divides by bytes_per_pixel and clamps row_pixels, so the surplus is 3 extra pitches at Y8, 1 at R5G6B5, 0 at 32bpp -- swept over pitches 256-4096 x widths 1-65535 by lane.blitsafe, independently of the audit that found the overstatement. nv_dma_map()'s end-of-object assert IS commented out at nv2a.c:96 and the caller DOES check only dest_offset < dest_dma_len, and neither fact is about extent: they mean nothing CATCHES it. The surplus is still outside the download range and the invalidate, so it is still silent. THIS ROW WAS THE LAST SURFACE CARRYING 'unbounded' after the issue body and the tracker were corrected, and the lane flagged it precisely because a row is what someone reads when they pick the work up. TWO REFERENCE IMPLEMENTATIONS EXIST, which is why this is a small job rather than a design one: pgraph_vk_solid_line() at blit.c:637 answers the identical narrow-format question at :689-700 with a warn-once early return under a comment refusing to invent an answer for narrow formats -- and note its reasoning, that these are SOFT GUARDS not asserts because an unset destination is reachable GUEST state rather than an internal invariant, which applies here too. And lane.remote has already landed the GL-side equivalent as b9d845d316. ALSO GRANTED: vk/surface.c, for #88 -- 292,446 px Vulkan loses that GL now gets, with the fix direction already decided and evidenced by the goldens. Ordered SECOND and explicitly so: #84 is memory safety and needs no arm, #88 needs an arm this fleet cannot currently run, so do not let the bigger number pull the ordering. vk/draw.c HELD (not started) and surface.h GRANTED at wave 89, both on this lane's own request and framing. It asked for a HOLD on vk/draw.c rather than a start, because #91's fix probably lives there and WHETHER IT IS THE RIGHT FIX DEPENDS ON TWO DIAGNOSIS ARMS NOBODY HAS JUDGED YET -- a conditional need is exactly what a hold is for, and starting would have been a fit. #92 comes with surface.h because this lane FOUND it and is already waiting on its own arms: SurfaceShape carries no address, so framebuffer_dirty() cannot see a DMA-context swap, and that is a plausible mechanism for Swap reading 165,447 on BOTH renderers before any of #88's work. ITS FIRST STEP IS AN INSTRUMENTED RUN, INDEPENDENT OF #91's OUTCOME -- log framebuffer_dirty()'s verdict across TestSwap()'s SET_CONTEXT_DMA_COLOR writes -- so it is not ordered behind anything. BLAST RADIUS BEFORE ANY EDIT: changing that struct changes SURFACE IDENTITY FOR BOTH RENDERERS, and #55 and #60 are both about surface-binding identity. #89 ADDED AT WAVE 91, because its fix site is a file this lane already holds. pgraph_vk_get_clear_color() at vk/draw.c:758-771 takes its pad-alpha decision from pgraph_vk_surface_drawn_format(r->color_binding) -- WHAT THE SURFACE WAS LAST DRAWN WITH -- instead of pg->surface_shape.color_format, so a surface reused across suites carries the previous suite's format into the clear. That is why Blend surface (built from the padded X_O*/X_Z* formats) triggers it and Color mask blend (A8R8G8B8 only) does not. IT IS A NARROWING OF #59's STAMP AND NOT A REVER