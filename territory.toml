note = "glsl/common.c GRANTED for #72: the GL renderer never emits noperspective because the gate is `noperspective && location` and location is Vulkan-only -- the Texture_perspective suite splits PERFECTLY on that bit, TexPerspective_Textured 9,014 vs Vulkan's 1. Condition on the grant: the fix must distinguish DESKTOP GL from GLES, because noperspective is core in desktop GLSL 1.30+ and needs GL_NV_shader_noperspective_interpolation on GLES, where the failure is a shader that does not compile. ORDERING: #71 before #60 -- #60's stale-format bug is HIDING #71, because refusing the s2t fast path for the wrong reason is doing useful work, and #60's fix regresses four captures by 31,948 px that are entirely thirty s2t decisions flipping false->true. Also holds the desktop build and the GL renderer as a CAPABILITY: renderer = 'OPENGL' produces captures, so GL-only defects are measurable there and nowhere else in the fleet. GLOB NARROWED AND #85 REASSIGNED AT WAVE 86 -- an allocation decision, not bookkeeping. gl/*.c was a glob; gl/surface.c is now NAMED OUT of it and granted to lane.swizzle87, which needs it together with vk/texture.c AS ONE CLAIM because #87's fix must land on both backends or its arm is void. This lane was asked for that file TWICE and delivered other work instead; it is a one-way cloud session with 71 unfolded commits and three unremediated findings, so #87 was serialising on the slower lane for no benefit -- the exact case this file's own rules say to GRANT rather than wait on. #85 MOVES WITH THE FILE: its mem_dirty gate is at gl/surface.c:2874-2892 in update_surface_part(), while #87's gates are at :1131 and :1487 in surface_to_texture_can_fastpath() and its caller -- different functions about 1,400 lines apart, verified at the tip, so one lane holds both without the edits meeting. THE REST OF gl/ IS STILL THIS LANE'S, now ENUMERATED rather than globbed so the next narrowing is visible: blit.c, draw.c, texture.c, shaders.c, renderer.c, debug.c. #86 stays here, in gl/shaders.c. glsl/psh.c GRANTED OUTRIGHT AT WAVE 87, and the delay was the ORCHESTRATOR'S FAULT rather than this lane's. Audit pass 2 found M1, M2 and L8 UNREMEDIATED -- psh.c is absent from this lane's entire unfolded diff -- and those three are the only thing between its 74 commits and the tree. The lane was twice told 'ask and I will grant it'. It did not ask, I did not follow up, AND THE FILE SAT IN [free] THE WHOLE TIME -- so a grant I could have made unilaterally at any moment blocked the largest body of finished work on the board for hours. Told-to-ask is not a handoff; it is a deadlock with a polite face. THE THREE, written out so they need no re-derivation: M1 (psh.c:2376) reads dotSTR%d.x/.y TWENTY LINES AFTER apply_border_adjustment() has rewritten the vector, and for a cubemap that call emits remapBorderCube which forces the major axis to +-1.0 rather than scaling in place -- so with a border enabled the signs sampled are NOT the dot signs the measured rule is stated in; fix by snapshotting the signs from the raw dot products BEFORE the call. M2 (psh.c:2381): the coordinate is a four-valued step function handed to an implicit-LOD texture(), so the fetch takes LOD 0 regardless of minification and the coarsest level on the straddling quad -- fix with textureLod(..., 0.0), available in all three targets pgraph_glsl_append_version emits. L8 (psh.c:2729): DOT_STR_3D_K is emitted into EVERY pixel shader whether or not a stage took the cube branch -- a logged decision is acceptable, silence is not. M1 IS UNREACHABLE BY ANYTHING ON THE TEST DISC, which is why no arm found it and why reading is the only evidence it will ever get. #86 AND gl/shaders.c MOVED OUT 2026-09-19 (job.board): the sentence above saying '#86 stays here' was wave-87 prose describing a claim that no longer holds it. lane.glerr86 -- an unmanaged/unworktreed session this row never tracked, the same shape as the swizzle87/padwrite precedent -- wrote the actual fix (7140d94731, a