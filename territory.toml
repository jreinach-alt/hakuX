note = "STANDING LANE, not a task lane. It owns the instruments for as long as they need an owner, so its claim does NOT go stale when no agent is running -- which is the distinction the territory/fleet cross-check needs, since every other lane here retires when its agent reports. Two kinds of lane: a TASK lane holds files to do one job and releases them, a STANDING lane owns a domain. Only the first is a stale claim when idle. tcg_pages.py ADDED at wave 52. lane.tcgcount edited it under this lane's own 'analysis scripts belong to whoever is measuring with them' clause and FLAGGED IT rather than assuming -- correctly, because it is not an analysis script written for one issue, it is the judging tool for every soak prediction. It hard-coded one discard model as an invariant and voided a correct arm; it now tests both and names which one a build matched. fleet.py ADDED at wave 48 on the lane request: it was in NO row and not in [free], and the lane had just shipped a gate whose entire subject is that an unrecorded claim is invisible. It asked rather than took, and flagged the irony itself. It also DECLINED nv2a_index.py, score_sweep.py and collect_sweep.sh with a reason for each. RE-DISPATCHED 2026-09-14 wave 45, with one URGENT item: the queue-time expect-key gate in request.sh refuses EVERY soak prediction, because it assumes an expect key is Results_Directory/TestName and a soak produces no captures. #68's registered arm is blocked on it now. That is the sixth false positive in that gate; this lane already found five of eighty-one predictions falsely refused for legitimate glob keys. The gate models one request shape and there are two. preflight.sh GRANTED 2026-09-14 on request: it is where the audit gate belongs, because preflight is invoked FRESH while the watchdog holds the script it started with -- the same asymmetry that made one of this lane's own fixes live immediately and another inert. The lane asked rather than taking it, which is the behaviour the board wants; a lane briefed with files that were never claimed is a mistake this project made the same day. THE INSTRUMENTS, taken out of the orchestrator's hands 2026-09-14 at the owner's prompt: 'Why are you handling the manipulation of dispatch scripts?' Six instrument fixes landed tonight inline -- inert prediction legs, lane-claim-as-description, blockers behind retired lanes, cited commits compared as shas, advice that could not see its own fleet, and a guard nobody could state correctly. Each emerged from a failure being diagnosed, which justifies the first and not the sixth: it serialised work that could have run in parallel and spent orchestrator context on editing rather than on allocating. NOT IN THIS CLAIM, deliberately: territory.toml and nv2a_issues.toml. The tracker is the ONE hand-maintained table in the index and the claim registry is what arbitrates lanes -- an agent editing the registry while claiming territory in it is circular, and concurrent edits to the board conflict badly. Those stay with the orchestrator. Analysis scripts written BY a lane for its own issue (line_extent_phase.py, stencil_outliers.py, wbuf31_blocker_audit.py and the rest) are not claimed either: they belong to whoever is measuring with them. TWO FILES ADDED AT WAVE 63. classify_residuals.py -- it has no _ZB branch and so calls EVERY one-ULP depth pixel structural, which has now been flagged by two separate lanes and was the trap #52's brief had to warn about by hand. The patch is already written out in zb-packing-float-depth.md, unapplied. dispatcher.sh -- logged as the paper cut 'dispatcher-sh-unlisted' and placed rather than left in the state profile.c was in until wave 51: neither claimed nor in [free], so nobody is refused it and nobody is responsible for it. It is the file that defines LOGCAT_SPEC, the queue protocol and the soak/disc branch, and #81 is blocked on a one-token change to it. NOTE THE PATH: it lives under $DISPATCH_DIR and not in this repo, so check_territory.py cannot verify the row the way it verifies the rest -- the claim is a statement of ownership, not a machine-checked one. THE ORCHESTRATOR IS NOT TO EDIT IT; that is the division the owner set when asking why dispatch scripts were flowing through this session at all. ROW CORRECTED AT WAVE 74, BY THE LANE THAT HOLDS IT. Wave 63 claimed $DISPATCH_DIR/bin/dispatcher.sh and said 'it lives outside this repo, so check_territory.py cannot verify this row'. BOTH HALVES WERE WRONG: that path is a cp -f SNAPSHOT, and the tracked source docs/testing/dispatcher.sh was in NO row at all -- so the claim named the copy nobody should edit and left the original unclaimed, which is the unlisted-file hazard the same wave was logged to fix, reproduced while fixing it. The row now names the tracked file and IS machine-checkable. Editing the snapshot is the dangerous option twice over: a live byte-offset read, and it is overwritten at the next re-exec. sweep_diff.py ADDED because the lane DECLINED item 7 as outside its files and then diagnosed it read-only anyway, with numbers: over 749 scored runs, 115 carry a partial suite and 112 of those COMPLETED NORMALLY -- 97% false positives -- so floors go 103 -> 129 and six suites gain one for the first time, including Image blit, whose disc is permanently 41 of 42 and whose floor is therefore unobtainable forever. Declining and then doing the diagnosis is the behaviour this board wants; the file is granted so the patch can land. WHEN THE dispatcher.sh CHANGES TAKE EFFECT: the fold reaching the shared tree, on the worker's next loop tick -- the re-exec check sits BEFORE request claiming, so no run is disturbed. NO RESTART IS NEEDED; DO NOT SCHEDULE ONE. And one ordering detail nobody had written down: the hold check continues BEFORE the re-exec check, so while the fleet is held no worker picks up a script change and the log stays silent. That is expected, not a failed fold. FLAGGED AT WAVE 101: PR #134 (lane.backlogstate, an invisible-lane running with no territory row until this wave) edited fleet.py (60/5) and check_coverage.py (188/12) without asking -- see [lane.backlogstate]. Not granted here; this lane's claim does not go stale and a finished PR is not a request. Read #134's diff against the classify_residuals.py _ZB trap and the dispatcher.sh snapshot-vs-source split above before it folds. GRANTED AT WAVE 149 (host session): docs/testing/dispatcher.sh and docs/testing/fleet.py moved to [lane.xbox] for PR #206's audit remediation (H1, M1, M2, L1-L5), which that session is doing on the owner's instruction while this standing lane has no agent. RETURN BOTH HERE when #206 folds or closes. BRIEFED AT WAVE 150 (host session): dispatcher hardening, two serve-path defects lane.xbox found on PR #206 (the legacy sweep preemption that cannot work, and unbounded adb calls that hung the Thor for four days on 09-14). Brief: briefs/toolsmith-dispatch-hardening.md. DISPATCH AFTER #206 FOLDS, when dispatcher.sh returns here -- lane-local's poll starts it. docs/testing/sweep_queue.sh (unclaimed until now) and docs/lanes/dispatch-hardening/** added for it. SECOND JOB BRIEFED AT WAVE 152 (host session): run nxdk_vsh_tests on a handheld and diff hakuX's printed values against the console's (lane.xbox's spec after its silicon runs, PR #225): briefs/toolsmith-vsh-program.md. ORDER, decided: the vsh job FIRST, then dispatch hardening -- both edit dispatcher.sh so they run as sequential lanes, and the vsh job has live consumers (#112 item 4, #223's 5.1 M px) while the hardening job's hang has a backstop (host-tools/dispatch_jamcheck.sh). Both start only after PR #206 folds and returns dispatcher.sh here. run_disc.sh, make_test_iso.py, extract_results.py (all unclaimed until now), docs/testing/vsh_score.py and docs/lanes/vsh-program/** added for it. CANDIDATE THIRD JOB, not briefed yet (wave 153): arms.sh cannot resolve a renderer-variant ref ('<sha> with xemu.toml [display] renderer = OpenGL'), so PR #115's registered #109 arm has sat skipped since 2026-09-19 (arms/skipped d1b07db0..., d8522a7e...); lane.remote runs it by hand meanwhile. RETURNED AT WAVE 155: dispatcher.sh and fleet.py are back from lane.xbox -- PR #206 folded as 9a4cce6570 (2026-09-25 00:32 PDT). The vsh job is dispatched now. WAVE 166 (host session): + docs/testing/jobs/allowed-tools.lane and docs/testing/jobs/deliver.sh for briefs/toolsmith-dispatch-hardening.md defects 8 (the allowlist's docs/testing/* prefix never matches a direct call) and 9 (deliver.sh scan stamps only lanes with new comments, so check_coverage reports a running sweep as stopped). WAVE 176 (host session): + docs/orchestration.md, docs/testing/devices.sh, docs/testing/jobs/arms.sh, docs/testing/score_sweep.py, docs/testing/jobs/selftest.d/51-dispatch-hardening.sh, docs/testing/jobs/selftest.d/66-deliveries.sh -- files PR #249 (dispatch hardening) edits beyond this row; granted so its audit and fold gates see them claimed."

