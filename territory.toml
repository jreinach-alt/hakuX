note = "#84 REMOVED FROM THIS ROW AT WAVE 100: the fold landed (PR #129, lane.blit84, merged as 642b557e77 -- 9db71ddcb2 and 3c4892563b are both ancestors of HEAD) and the lane's own report recommended closing #84 on the mechanism, which the board did this tick (see issue.84 in nv2a_issues.toml). This is exactly the stale-claim failure mode the old note below warned about, reproduced once more before being cleared -- read it as the reason to remove a fold's issue claim the moment it lands rather than as still-live. OLD NOTE: The fold job's own fleet row named #84 in `asked` and a previous tick added it to dispatch/fleet/fold.json, but fleet.py builds ownership from THIS file and not from the fleet row -- so for two ticks #84 read as DISPATCHABLE while the fold job was holding it, and a lane dispatched on that reading would have landed in a tree being folded. issues[] is the claim; `asked` is prose. STANDING LANE. It owns FOLDING: cherry-pick, preflight, push, fast-forward. Created 2026-09-18 at the owner's direction after the orchestrator's own folds caused three distinct defects -- the shared tree went dirty twice and stalled every uncached build in the fleet, and a prediction was folded ahead of its own code, breaking the binding it exists for. The owner had asked whether this lane was needed once before and the orchestrator did not act on it. FOLD IN THE SCRATCH WORKTREE at /home/justin/hakux-work/fold and fast-forward the shared tree, so the dirty window is one ref update rather than several minutes -- AGENTS.md carries the procedure. CLAIMS NO SOURCE FILES: it moves commits, it does not author them, and a merge conflict in compiled code it does not hold goes BACK to the authoring lane rather than being resolved here. A generated file (the nv2a index) is REGENERATED, never hand-merged."
