wants; a lane briefed with files that were never claimed is a mistake this project made the same day. THE INSTRUMENTS, taken out of the orchestrator's hands 2026-09-14 at the owner's prompt: 'Why are you handling the manipulation of dispatch scripts?' Six instrument fixes landed tonight inline -- inert prediction legs, lane-claim-as-description, blockers behind retired lanes, cited commits compared as shas, advice that could not see its own fleet, and a guard nobody could state correctly. Each emerged from a failure being diagnosed, which justifies the first and not the sixth: it serialised work that could have run in parallel and spent orchestrator context on editing rather than on allocating. NOT IN THIS CLAIM, deliberately: territory.toml and nv2a_issues.toml. The tracker is the ONE hand-maintained table in the index and the claim registry is what arbitrates lanes -- an agent editing the registry while claiming territory in it is circular, and concurrent edits to the board conflict badly. Those stay with the orchestrator. Analysis scripts written BY a lane for its own issue (line_extent_phase.py, stencil_outliers.py, wbuf31_blocker_audit.py and the rest) are not claimed either: they belong to whoever is measuring with them. TWO FILES ADDED AT WAVE 63. classify_residuals.py -- it has no _ZB branch and so calls EVERY one-ULP depth pixel structural, which has now been flagged by two separate lanes and was the trap #52's brief had to warn about by hand. The patch is already written out in zb-packing-float-depth.md, unapplied. dispatcher.sh -- logged as the paper cut 'dispatcher-sh-unlisted' and placed rather than left in the state profile.c was in until wave 51: neither claimed nor in [free], so nobody is refused it and nobody is responsible for it. It is the file that defines LOGCAT_SPEC, the queue protocol and the soak/disc branch, and #81 is blocked on a one-token change to it. NOTE THE PATH: it lives under $DISPATCH_DIR and not in this repo, so check_territory.py