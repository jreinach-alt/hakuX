note = "RELEASED #38 and #59 2026-09-19 by the host session: `arms` is the arms JOB, not a lane. This row held zero files, had no unit, and fleet.py reported it as LANE CLAIMED WITH NO RUNNING AGENT -- so two accuracy issues read as covered and were dispatchable to nobody. A job does not hold territory. THREE ARMS THAT WERE READY AND UNQUEUED WHILE BOTH DEVICES SAT IDLE. Claims no source files -- it registers and queues, it does not edit hw/. THE OWNER SPOTTED THIS BEFORE I DID: 'I find it odd that neither device appears to have any testing running at the moment.' The cause was not a blocked lane; it was that the orchestrator had not queued work that was already ready. (1) #38's blit pair: arm A is 5 of 5 proven, arm B is 3 of 5, ab_compare REFUSED on MIN_RUNS, and BOTH arms need re-queueing rather than just B -- arm A's runs are sound and that was never the question; the question is whether the pair is one population, and a 09-14 A against a half-09-18 B is not. (2) #59's arm: its 600 lines ARE NOW FOLDED, so its prediction needs re-pointing at the FOLDED shas and then queueing -- and note the fleet cannot verify H1/H3 at all in the default build, because OPT_DYNAMIC_BLEND leaves the static pipeline path dead on Adreno, so an arm here confirms accuracy and NOT the remediation. (3) #89: a full iso_surf1 disc run, which is the only thing that separates renderer from disc composition on Swap_ZB -- 236 captures against the 9-capture narrowed disc. REGISTER AFTER THE LAST REBASE: a rebase silently un-ancestors a b_ref and a reachable-but-stale ref makes the dispatcher build fine and measure the WRONG BINARY. Three occurrences, one of them the orchestrator's. NO AGENT AND NO CAPACITY, 2026-09-19T01:30Z -- read this row as a CLAIM AWAITING CAPACITY, NOT AS COVERAGE. The device holds are lifted and all three arms above are still ready and unqueued, but LANE_MAX is 2 and two local lanes (blitsafe, swizzle87) are running, so lane.sh would refuse a start. The board did not qu