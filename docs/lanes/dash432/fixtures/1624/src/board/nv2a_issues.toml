status_note = "BOARD wave 254 (job.board, 2026-09-26T17:40Z): CLOSED on GitHub 2026-09-26T17:19Z by lane.remote: the fix covers every route the stock suite takes; the three not-reached cases each read 0 draws across all 99 per-suite discs on desktop Vulkan against master e26f8608, with a positive control that counts 10 case-2 events when the tex_reg_cache invalidation is removed. A title that takes an unreached path gets a new issue. || PRIOR: 2026-09-25 10:10 PDT (host session): FIX IN PR #256 (lane.remote; vk/draw.c pgraph_vk_surface_written_while_sampled, body-only): iso_pre_clear PASS 35/35 and iso_surf1 guard PASS 238/238, pre-registered, 0 unreadable; the six aliased captures fixed, disc 517,568 -> 182,024 px; the X1A7 residuals now equal GL's (#60's alpha rule, not this defect); SCF/SFC pixel-identical across runs, so the timing dependence is gone. NOT REACHED (decide at fold whether #184 stays open for them or they get their own row): a stage sampled while its own memory is written with no register write between; a stage first sampled through SET_SHADER_STAGE_PROGRAM alone; whether the same tex_reg_cache shortcut skips a direct view's barrier. PRIOR: MECHANISM FOUND by lane.remote (2026-09-25 05:58Z, #184 comment 5827596169; desktop Vulkan, two identical instrumented runs): on the six collapsing captures pgraph_vk_bind_textures is NEVER CALLED for swatches 1-5 -- the call-site gates (vk/draw.c:2092, :3932, :4117) open only when texture_state_gen or texture_vram_gen moves, and a clear into a surface moves neither (TestSurfaceFmt writes the same register values; a GPU redraw writes no guest VRAM). X1R5G5B5 is exempt because real VRAM dirty bits get consumed there every swatch. There is no stale refill: nothing refills. FIX (specified): extend pgraph_vk_surface_written_while_sampled() in vk/draw.c so a write to a surface invalidates every stage whose binding was built from that surface's range. vk/draw.c is lane.shadeflat224's until PR #235 folds; promised to lane.remote then (territory wave 162). || UNBLOCKED 2026-09-25 (board wave 147): vk/draw.c and vk/surface.c returned to [free] when lane.clrsurf91 retired (PR #148 closed by owner decision #207). THE ANALYSIS HALF IS DONE (issue comments 5750715962, 5754916258, 5754941299; instrument docs/testing/clear_surface_fmt.py folded in #204). The open question is the measurement in briefs/184.md, claimed by lane.remote at wave 147. CORRECTED 2026-09-25 (board wave 147, from lane.remote's comments 5751042040 and 5766171256): (1) SIX of eight Clear::SCF_* captures collapse, not four -- SCF_R5G6B5 also does (the original table read it with 128x128 swatches when TestSurfaceFmt halves quad_height for two-byte formats); (2) the colour they collapse to is swatch 0's, not swatch 1's bacada, on five of six; (3) the collapse is WITHIN one capture -- swatches 1-5 carry swatch 0's RGB in the same frame -- so the 'capture N shows capture N-1' falsifier was on the wrong axis. The reused-binding hypothesis is confirmed in pattern and refuted in its stated form (SCF_X1R5G5B5_O1R5G5B5 runs the identical sequence and Vulkan is byte-exact on it), and the duplication holds with and without pad_alpha_needs_rebuild across 13 refs. OPEN: which source the stale refill reads, and why X1R5G5B5 is exempt while R5G6B5 (same two bytes, adjacent in the run) is not -- settled by one desktop Vulkan Clear run counting pgraph_vk_bind_textures' three exits per bind. Prior note: Filed 2026-09-20 (issue text): Clear is in none of the six suites [job.arms] scores and none of iso_surf1's 236 captures, so its 32 captures have been outside every instrument this campaign uses, on both renderers. ClearTests::TestSurfaceFmt is the only place in the corpus that displays a surface's stored bytes rather than a composite of them. Measured (desktop, both renderers, 6fc89b02/47d8822c, iso_pre_clear.iso): whole disc GL -> Vulkan is 3 better, 4 worse, 26 same, and Vulkan is worse on two captures (SCF_R5G6B5, SCF_X8R8G8B8_O8R8G8B8) GL gets pixel-exact. On the X1A7/X8R8G8B8 captures four distinct golden swatch colours all come out as one colour (bacada, swatch 1's), on 4x16,368px -- the filer's own hypothesis, explicitly NOT instrumented or claimed, is the same shape as #60 (a texture binding at GetTextureMemoryForStage(0) reused across TestSurfaceFmt's six clears/samples without refreshing surface->shape on a format-only change). That exact 'a reused binding does not carry the current format' mechanism is already documented in hw/xbox/nv2a/pgraph/vk/draw.c (~line 505-525, written against #158's DstAlpha_ARGB8 case), which is the most direct candidate fix site. GL-worse rows are largely #164's clear-half fix (already specified, lane.clrpad164/PR #172). The issue's own suggested first question: should Clear be in the scored set at all, not just 'fix Vulkan's clears'."
