no_suites = "not a pgraph suite defect: this is TCG/FPU behaviour, so no golden suite scores it"
disposition = "defect"
blocker_falsifier = "if 'a five-year-old SMC correctness decision' were false, git log -S on the `#ifndef XBOX` that disables the range test would date it inside the fork's recent perf work; and if 'correctness decision' were false, that commit would carry no SMC rationale while the predicate and its inputs would still be sitting in the file."
blocker_tested = "date CONFIRMED, justification REFUTED. 703566ce33 'tcg: Invalidate all TBs on target page', Matt Borgerson, 2021-10-04 -- 4y11m, so 'five-year-old' is fair. But the commit body is EMPTY: no rationale, no SMC reference, no comment added; the diff just wraps the range test in `#ifndef XBOX`. The range data was never dropped (translation-block.h:111 `uint16_t size`, :129 `page_addr[2]`); the predicat [cut]"
status = "fixed-part"
status_note = "Measured over six Crimson Skies soaks. sp_share over LIVE blocks is 1.000 with four independent checks on what a systematic error would do, the last not using the predicate at all: the notdirty tracker puts the stores in 1,168- and 540-byte windows of 4,096-byte pages -- two hot data structures sharing a page with code. New cost symbol tcg_flush_jmp_cache 8.77% self, scaling with discards not visits. The block-extent lever is dead separately: blk is already 5.97-6.49 guest instructions, below the 8 the clamp was written at, so it could never bind."
blocked_on = "ANSWERED 2026-09-14 BY THE THREE-ARM RE-RUN, and the answer is that the counters BOUND the trade without SETTLING it. Nine 90 s Crimson Skies soaks, three per ref, prediction committed before queueing, chain verified by rev-parse of each ref's PARENT. EVERY REGISTERED LEG HOLDS. THE MIDDLE ARM MOVES BOTH HALVES IN OPPOSITE DIRECTIONS, which is why two arms could not answer it: #73 alone removes the stranded population (ai/visited 0.93 -> 0.000) and 85% of events and visits, but with nothing stranded to block it EVERY event now empties its page (em/ev -> 1.000) and pr == em, so #73 ALONE RAISES the arming walk 930-1868 -> 2160-2199. So two figures from the two-arm run were wrong in OPPOSITE directions: #68's prize is BIGGER (pr 2162 -> 0, not 1846 -> 0) and its visited cost is 6x BIGGER (3,605x attributable to #68 alone, not the ~560x that spanned both commits, splitting as ev 46.8x times page-list length 79.1x -- and only the first factor appears in `stores`, confirming leg 68-4's blind spot). NONE OF THE THREE STOP-THE-FOLD THRESHOLDS FIRED: the list plateaus (0.995/0.901/0.968 against 1.25), sits at ~a third of a 4 KiB page's capacity, and stores rose 4.44x against a 10x stop. AND IT STILL DOES NOT LICENSE THE FOLD. R = 3,627 visits added per arming walk removed; in like units #68 removes >=12.6M TLB entry touches per window and adds 7.84M page-list visits plus 99,055 extra slow stores, i.e. >=1.6 touches removed per visit added -- A LOWER BOUND. A contiguous array scan and a linked-list pointer chase are not equivalent per touch, and the difference is enough to invert 1.6:1, and the extra slow stores are on neither side. THE NEXT STEP IS A DIRECT TIMING INSTRUMENT, NOT ANOTHER SOAK. Full record in docs/investigations/tcg-invalidation-three-arm.md. RE-DISPATCHED 2026-09-14 to lane.tcgarm, wave 53: three arms this time -- 117203fe9b (neither), a94386a3c8 (#73 ALONE, the arm the first attempt never ran) and 937848c9e7 (#73 + #68) -- plus the leg nobody had, bounding `visited`. AND M5 IS ORDERED BEHIND THIS, deliberately rather than deferred: the same soaks show tb_gen_code calls falling 34x and the recycle rate going 35.0 -> 1.000 under 937848c9e7, so #68 removes most of the traffic M5 is about. Sizing an MRU-N bound now would size it against a population about to change by 34x. RETRACTED AND REPLACED 2026-09-14. I recorded here that the arm was VOID by its own instrument. IT WAS NOT -- the instrument was wrong. tcg_pages.py hard-coded sp + ov == di, which holds only while the loop discards every live block it visits, i.e. under whole-page invalidation, which is exactly what 937848c9e7 stops doing: a spared block is a VISIT, not a discard. The held commit's own message said so before any soak ran -- 'visits = discards + already no longer holds, deliberately' -- and I read the instrument's complaint rather than the commit. WHAT HOLDS, off the same six logcats: xx == 0 in both arms; di == ov + sp holds 22/22x3 on arm A and fails on arm B; di == ov + ai does the reverse; and visited == ov + sp + ai holds in BOTH, which is the population identity and is invariant across this change. The 160,836,959 residual is the SPARED COUNT and the 573x visited rise is leg 68-3 happening. RE-JUDGED: G, 68-1 (em 42,456 -> 12), 68-3 and 68-4 PASS. 68-2's pr_per_em FAILS because leg 68-1 OF THE SAME PREDICTION drives its denominator to zero -- it should have been pr per generation. 73-1/73-2 are NOT ATTRIBUTABLE: the prediction specified THREE arms and two ran, so arm B on disk is #68 stacked on #73. IT STILL MUST NOT FOLD, for a reason nobody had before: visits rose ~560x, 13,270 to 7.5M per window, each a page-list traversal plus a range test, and leg 68-4 counts STORES and cannot see it. It plateaus at 70-95 visits/event from window 5 in all three runs -- steady state, not a leak -- but bounded by translation-buffer flush, which #68 does not control. THE RE-DISPATCH NEEDS THE MISSING MIDDLE ARM (three soaks at #73 alone) AND A LEG BOUNDING visited. THE ARM RAN AND IS VOID BY ITS OWN INSTRUMENT, 2026-09-14. Six soaks, three per ref, judged with tcg_pages.py against the prediction lane.tcginval -- since RETIRED -- registered before any of them ran. No lane holds this; what it needs next is a lane on the INSTRUMENT. ARM A IS COHERENT: xx = 0 over 21 windows, sp + ov == di in EVERY window, visits 280,384 = discards 40,880 + already-invalid 239,504 with residual 0, waste 11.69 discards per generation. ARM B DISAGREES WITH ITSELF: sp + ov != di in 21 of 21 windows -- two separate counts of the same live population on ONE log line, which must agree exactly -- and visited is up 573x to 160,838,266 with a residual of 160,836,959. em does fall from 38,177 to ~0, which is the shape the prediction expected, and it CANNOT BE READ off an instrument whose own consistency check fails in every window. SO 937848c9e7 MUST NOT FOLD, and the recommendation to hold it is now vindicated by measurement rather than by caution. THE NEXT STEP IS THE INSTRUMENT, NOT THE DEVICE: more soaks cannot fix a counter that disagrees with itself. This is audit pass 1's M1 from the other direction -- the #73 fix silently altered what ws counts because the identity it relied on was true only by accident, and something in 937848c9e7 does the same to sp/ov/di. Full record in docs/investigations/issue68-arm-void.md. ranked and costed; restoring the range test is a five-year-old SMC correctness decision on every guest instruction, not a lane call"

[issue.94]
title = "request.sh silently drops all but the last --only-tests/--skip-tests/--tests/--suites, and it nearly published a bracket that excluded the true answer"
no_suites = "an instrument defect, not a renderer one -- no golden suite scores request.sh. Its oracle is the queued .req itself: only_tests length in the request record against what the caller passed."
disposition = "harness"
blocker_falsifier = "if 'repeated --only-tests is silently overwritten' were false, a request built with one flag per test would carry every test in its only_tests array -- and two arms on disk carry ONE each where 2 and 8 were passed."
blocker_tested = "CONFIRMED BY READING request.sh:76-81 at HEAD, independently by lane.disc89 and by the orchestrator, and CONFIRMED EMPIRICALLY by two queued requests: disc89-G-pre2 and disc89-H-pre8 both show only_tests length 1 and Blend_surface scored 1. --env) ENV_VARS+=(\"$2\") appends into an array; --suites, --tests, --skip-tests and --only-tests are scalar assignments and clobber. Nothing in the parse loop d [cut]"
status = "fixed-verified"
status_note = "TRACKER SYNC 2026-09-18 (job.board): GitHub closed #94 as completed; lane.toolsmith reported the fix already in master as 99800a64d0 (the four list flags append, duplicates refused, the queued record re-read and its composition printed before rename) and verified it against a scratch DISPATCH_DIR (8 --only-tests flags in, 8 read back independently). lane/toolsmith @ baa5b32698 is an ancestor of origin/master. FOUND BY lane.disc89 2026-09-18 when two arms of #89's composition bisect came back void. THE COST IS NOT THE WASTED ARMS, IT IS THE NEAR-MISS: disc89-H-pre8 was named for an 8-test prefix, ran ONE test, and its pre-registration said in as many words '0 puts the threshold in 9..32'. IT READ 0. Read as registered that arm concludes the threshold lies in 9..32 WHEN THE ANSWER IS 2 -- so the mis-specification would have produced a confident, pre-registered, numerically-bracketed conclusion that EXCLUDED THE TRUE VALUE, on a run that completed normally and scored cleanly. Both arms were caught ONLY because their pre-registered impossible-row checks failed, 1 scored row where 2 and 8 were required; without those legs this would have gone onto the board as a bracket. That is this project's most expensive error class -- a clean result from a measurement that could not have come out as intended -- and here the INSTRUMENT was the cause rather than the hypothesis. THE ORCHESTRATOR FILED THIS ARGUING refuse-the-repeat OVER append, AND THE LANE RANKS IT THE OTHER WAY AND IS RIGHT: --env already appends, so 'flags repeat' is a CORRECT inference from this same interface and the caller who hit this drew it; refusing would reject a command whose meaning is unambiguous to any reader. Preferred fix is APPEND, comma-joined to match what the consumer parses, after grepping docs/testing/ and $DISPATCH_DIR/bin/ for a caller that relies on last-wins. THIRD MITIGATION IS WORTH LANDING EITHER WAY because it needs no code change and does not trust the caller: assert only_tests length in the queued .req before the device claims it. SECOND, SMALLER DEFECT IN THE SAME BLOCK: --device) DEVICE=\"$2\" appears TWICE in one case statement. Harmless, since case takes the first match, but it is dead code in the file that arbitrates every device run and it is the same drift that let the scalar/array inconsistency sit unnoticed."
blocked_on = "NOT BLOCKED. docs/testing/request.sh is held by the instruments standing lane, which is where the owner's division of labour puts dispatch scripts -- 'Why are you handling the manipulation of dispatch scripts?' -- so this is filed rather than fixed by the orchestrator. Needs no device and no build."

[issue.95]
title = "The prediction schema has no composition field, so the comparability rule cannot be enforced -- and disc_id conflates composition with the skip list"
no_suites = "a schema gap in the judging tool, not a renderer defect. Every pgraph suite is affected in principle; #89's Color_zeta_overlap/Swap_ZB is the only capture where it has been MEASURED to matter."
disposition = "harness"
blocker_falsifier = "if 'composition is not a prediction field' were false, some prediction file would carry the disc it was derived on -- exactly 1 of 107 does, and ab_compare --register has no such key to write."
blocker_tested = "CONFIRMED BY READING at HEAD and by counting the files on disk: ab_compare.py:1052-1085 writes registered_utc, who, issue, prediction, a_ref, b_ref, must_not_move, must_not_regress, expect and expect_counts and nothing else; request.sh:837-862 binds disc_id into the REQUEST and never into the prediction; ab_compare.py:486-489 refuses a pair whose two arms disagree on disc_id. 1 of 107 prediction f [cut]"
status = "fixed-part"
status_note = "TRACKER SYNC 2026-09-18 (job.board): GitHub closed #95 as completed; lane.toolsmith reported step (1) of the suggested shape already in master as baa5b32698 -- --disc-from / --disc-suites|--disc-skip-tests|--disc-only-tests write a disc block, and composition_notes() refuses an absolute / downgrades a delta on a composition mismatch (ancestor of origin/master). Steps (2)/(3) (rejecting composition mismatches at judge time more broadly, and un-overloading disc_id) and the grandfathering rule for the 106 of 107 predictions still lacking the field are NOT landed; reopen as its own issue if that scope is wanted. FOUND BY lane.disc89 while auditing all 107 files in docs/testing/predictions/ for #89. THE TWO HALVES ARE ONE GAP SEEN FROM TWO SIDES: the comparability rule this project relies on is REMEMBERED RATHER THAN ENFORCED. ab_compare catches the easy case, two arms of one pair disagreeing, and is STRUCTURALLY UNABLE to catch the case that actually bites -- an absolute registered on one composition and later judged against an arm run on another -- because there is no field to compare against. AND disc_id CANNOT SUBSTITUTE: it encodes composition AND the skip list in one string, so a scan grouping by it reports the known RenderTextureLoop poison test as a composition effect, which cost the lane a wrong classification of 24 Texture_render_target/TexFmt_* captures; it is also truncated to ~60 chars, so the 9-suite and 14-suite discs at the centre of #89 are indistinguishable from their prefixes. NOT AN EMERGENCY, AND THE REASSURING HALF IS MEASURED: 31 predictions register an absolute on a narrowed disc with no arm-A reproduction condition and NONE touches Color_zeta_overlap/Swap_ZB, the only capture known to be composition-sensitive. Three files name it and ALL THREE handle it correctly as a delta -- blend-stack-c-aliasing.json is a live demonstration of the delta protecting the claim, since both its refs are 9-suite runs reading 141,125 and its registered delta was correctly zero. So this is a latent gap with one near-miss. THE ARGUMENT FOR FIXING IT NOW is that the 13 indeterminate files cannot be audited at all without the field and that number only grows. SUGGESTED SHAPE, independently landable in order: (1) add disc_id -- ideally decomposed into suites + skip_tests -- to what --register writes, populated from the arm's own request record; (2) at judge time compare registered composition against each arm's and REFUSE OR DOWNGRADE an absolute whose composition does not match, as a b_ref mismatch already is; (3) stop overloading disc_id, since composition and skip list are different axes and one of them is a DEFECT WORKAROUND. Step (1) alone converts 13 unauditable files into auditable ones."
blocked_on = "NOT BLOCKED. docs/testing/ab_compare.py and docs/testing/request.sh are both held by the instruments standing lane, per the owner's division of labour on dispatch scripts. Needs no device and no build. Note the ordering constraint if it lands while arms are live: adding a field is backward-compatible, but step (2)'s refusal is NOT -- it would invalidate every prediction registered without the field, which is 106 of 107, so (2) needs a grandfathering rule decided BEFORE it ships."

