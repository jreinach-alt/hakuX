n all four units, SURFACE bit 0; and two DECLARED fields hakuX never writes: CSV0_D FOG_MODE and CSV1_A T0_ENABLE/MODE/TEXTURE. One declared-field divergence recorded, not chased: CSV0_D FOGENABLE in Fog gen. Next: a modelling lane (nv2a_regs.h names + the method handlers in pgraph.c) proved by the same per-test diff on the Thor. INSTRUMENT DEFECT for its reuser: pgraph-per-test-instrument.patch's DumpDiff label buffer is 64 bytes, so long test names truncate and the canary is glued on (the judge works around it; the patch does not). PRIOR: BLOCKED ON SILICON 2026-09-25 07:25 PDT (host session): PR #230 folded the static half; the register diff on the console is routed to lane.xbox on #112; the cloud label is removed so the audit outlet does not claim it again. PRIOR: Filed 2026-09-20 (issue text), measured emulator-vs-hardware on Blend tests::#spot_0_ADD with enable_pgraph_region_diff, then traced to a mechanism: DEF_METHOD(NV097, SET_TEXTURE_FORMAT) (pgraph.c:4058) and NV_PGRAPH_SURFACE's writers (pgraph.c:934,2275,2281,2287,2296) are PG_SET_MASK calls against named fields only, so any bit outside a declared field never leaves its zero init -- NV_PGRAPH_SURFACE bit 0 and NV_PGRAPH_TEXFMT0/1 bits 4-5 are structurally unreachable. Also names a width mismatch in the same handler: NV097_SET_TEXTURE_FORMAT_DIMENSIONALITY reads a 4-bit guest value (mask 0x000000F0, bits 4-7) into NV_PGRAPH_TEXFMT0_DIMENSIONALITY's 2-bit field (mask 0x000000C0, bits 6-7) -- the two bits that fall out, 4 and 5, are exactly where hardware and emulator disagreed. Offered as the leading explanation, not proven. A suite run moves 135 PGRAPH registers; the header names 14 -- previously filed as a documentation gap, now argued to be a correctness property (every header hole is a hole in reachable state, by construction). Cross-reference #112, #38, #188. CORRECTED (job.board, board tick 2026-09-20): the DIMENSIONALITY width-mismatch is NOT the mechanism, checked by reading pgraph.c:4058-4090 plus GET_MASK/SET_MASK (nv2a_regs.h:25-33) and confirmed by running SET_MASK(0,0xC0,dim) for all 16 guest nibble values -- SET_MASK shifts by ctz32(0xC0)=6 and masks to 0xC0, so only the guest nibble's LOW two bits (guest bits 4-5) ever reach the register, landing at TEXFMT0 bits 6-7 (the DIMENSIONALITY field itself), never at bits 4-5; the guest's high two bits (6-7) are what actually get dropped. This handler contains no PG_SET_MASK call against mask 0x30 for any field, and grep of pgraph.c/texture.c finds no other TEXFMT0 writer -- bits 4-5 are unreached for the plain reason the title already gives (no code names them), not because of this width truncation. The 'leading explanation' conflated two different bit-numbering spaces (guest parameter bits vs. register bits) and should not be chased as the mechanism for the measured TEXFMT0 4-5 divergence specifically; the broader unreachable-bits thesis is unaffected. BLOCKED_ON MOVED HERE (job.board, board tick 2026-09-25T05Z): a `blocked_on` naming files nobody holds reads as a grant request to check_coverage.py, and there is nothing to grant -- the files are free. Was: FILES FREE, BRIEF REFRESHED (job.board, board tick 2026-09-21T19:11Z): nv2a_regs.h and pgraph.c both free in territory.toml (wave 144). briefs/200.md rewritten this tick to drop the DIMENSIONALITY goal (already answered and refuted as the mechanism, see status_note CORRECTED) and keep only the still-undone enumeration (every PG_SET_MASK call vs. declared mask, register by register) -- reading-only, no files touched, needs no device and no NDK. Labelled `cloud` this tick for the outlet to claim."
