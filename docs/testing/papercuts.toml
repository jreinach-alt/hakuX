# Friction that has cost real time, tracked so it can be fixed on a cadence
# rather than only at the moment it bites.
#
# WHY THIS FILE EXISTS. Six instruments were fixed on 2026-09-13/14 and every
# one was fixed REACTIVELY -- at the moment it cost something. That works, and
# it means the only paper cuts that ever get fixed are the ones that draw
# blood twice. The rest stay, are rediscovered by the next agent, and cost the
# same time again. Nothing was tracked; the record lived in commit messages.
#
# A DX pass is dispatched daily against this file. Entries are removed when
# fixed, with the commit named.
#
#   cost      what it actually cost, measured where possible
#   bit       how many separate times it has been observed
#   owner     lane that would fix it, or "unassigned"

[[cut]]
id = "heredoc-commit-chain"
what = "`python3 - <<PY ... PY && git commit` commits over an edit that never landed: the heredoc asserts, dies before writing, and the && still runs because python's exit is not what git sees in a multi-command chain."
cost = "Committed lane.lineext's territory claim without its blocker declarations, then repeated it an hour later with lane.readfreq's. Both needed a follow-up commit to correct the board."
bit = 2
owner = "unassigned"
fix = "Verify the edit landed before committing -- `git diff --cached --name-only`, or split the write and the commit into separate tool calls. Possibly a wrapper."

[[cut]]
id = "backticks-in-commit-m"
what = "Backticks inside a double-quoted `git commit -m \"...\"` are command substitution, so a word in the message runs as a command and vanishes from the text."
cost = "Ate the word `agentwork` out of a commit message; caught only by reading the message back."
bit = 1
owner = "unassigned"
fix = "Always `git commit -F -` with a quoted heredoc for anything containing backticks or $."

[[cut]]
id = "watchdog-holds-its-script"
what = "bash reads a script lazily by byte offset, so editing idle-watchdog.sh mid-session changes nothing in the running instance -- and a length-changing edit can in principle make it resume mid-token."
cost = "A lane-aware branch was written, committed, and had no effect for the rest of the session."
bit = 1
owner = "toolsmith"
fix = "Item 3 on toolsmith's backlog. Header comment added; the structural fix is undecided."

[[cut]]
id = "checkout-restores-staged"
what = "`git checkout -- <file>` after a staged change restores the file from the INDEX, i.e. the staged version, not HEAD. Needs `git checkout HEAD -- <file>`."
cost = "A cherry-pick test left the tree dirty and the next cherry-pick aborted with 'Please commit your changes'."
bit = 1
owner = "unassigned"
fix = "Documentation, or a habit. Not automatable."

[[cut]]
id = "gh-body-at-file"
what = "`gh issue create --body \"@file\"` does not expand @; it files the literal string."
cost = "#77 was filed with a literal path as its body."
bit = 1
owner = "unassigned"
fix = "Always --body-file."

[[cut]]
id = "prediction-bound-into-worktree"
what = "An arm queued from a lane's worktree records the prediction's path INSIDE that worktree. If the worktree is removed before anyone re-judges, the binding path breaks."
cost = "Flagged by two separate lanes in their final reports; no loss yet because both were folded in time."
bit = 2
owner = "toolsmith"
fix = "request.sh could resolve the prediction to a repo-relative path, or record the content hash as the primary key rather than the path."

[[cut]]
id = "two-suite-spellings"
what = "The derived suite name uses spaces (`Blend tests`) and the results directory uses underscores (`Blend_tests`). Predictions key on the second; the tracker and the test binary use the first."
cost = "Ten expect legs matched no capture and could not fail, on an arm that still returned PRE-REGISTERED."
bit = 1
owner = "toolsmith"
fix = "request.sh now refuses an unmatched expect key at queue time. The other prediction fields are unchecked -- toolsmith item 4."

[[cut]]
id = "logcat-tag-silenced"
what = "A new logcat tag is invisible unless it is in run_disc.sh's LOGCAT_SPEC, which ends `*:S`."
cost = "#13's line-width log printed under a silenced tag and was invisible in every dispatcher run; the question it was written to settle stayed open."
bit = 1
owner = "unassigned"
fix = "A gate that greps for __android_log_print tags not present in LOGCAT_SPEC."

[[cut]]
id = "index-build-needs-both-flags"
what = "`nv2a_index.py build --tests DIR` alone produces an index that passes a by-hand `check --tests` and then FAILS preflight, which rebuilds with --tests AND --support. The two disagree by 197 lines while reporting identical counts."
cost = "An agent lost a preflight pass and had to rebuild."
bit = 1
owner = "unassigned"
fix = "Make `build` refuse without --support, or default it the way preflight does."

[[cut]]
id = "hedge-gap-false-positive"
what = "nv2a_index.py scores `may not be` as a HEDGE gap, and it fires on precise sentences -- it tripped on `a surface that may not be the current target`, which is a statement of fact."
cost = "A lane reworded correct prose to satisfy it. Right call in the moment, wrong as a pattern: the false-positive rate is paid by whoever reads the gap list next, and the daily DX pass reads it."
bit = 1
owner = "unassigned"
fix = "Either narrow the pattern or report a confidence, so a reader can tell a hedge from a precise `may`."

[[cut]]
id = "usb-dialog-needs-a-human"
what = "A persistent `Use USB for` chooser (com.odin.settings) sits modal over the Thor's display. It occludes the central 61% x 44% and caps everything behind it at ~100/255 -- a measured 0.40 scrim -- so every screen-based measurement on the only live handheld is attenuated and partly blind."
cost = "Cost #77's driver A/B 60% of its signal and forced an instrument correction before any result could be believed. It is identical in all arms so it cannot manufacture a difference, but it can HIDE one."
bit = 1
owner = "unassigned"
fix = "One CANCEL tap by a human; it survives `am force-stop` and is tied to USB state. NOT automatable from here: `adb shell input keyevent` terminates the emulator, and `svc usb setFunctions` or `pm disable-user` on the ONLY live device during a sweep is not a risk worth taking to save a tap. The durable fix is a device setup step -- pin the USB function so the chooser never arms -- recorded once rather than rediscovered per session."

[[cut]]
id = "claim-not-pushed-before-dispatch"
what = "The orchestrator writes a lane's territory row, validates it, dispatches, and commits afterwards. The agent fast-forwards to a tip that predates the commit, so for its whole run the claim exists only in the orchestrator's working tree."
cost = "lane.tcginval opened its board request reporting territory.toml at wave 42 with no [lane.tcginval] row and accel/** still free -- correct from where it stood. THREE OCCURRENCES NOW, each a different variant: lane.padwrite had no row at all, lane.tcginval had one written but not committed before dispatch, and lane.audit-tcg was dispatched with no row because an auditor claims no files and I concluded it therefore needed no row. It needs one: a lane running and unclaimed is invisible to every guard."
bit = 3
owner = "unassigned"
fix = "Order is: write the row, validate, commit, PUSH, then dispatch. A lane verifies its territory by reading the repo, so the claim must be in the repo before the lane starts. An uncommitted claim is not a claim."

[[cut]]
id = "folded-without-an-audit"
what = "The orchestrator folded 2af6def68a -- #73's fix, +107/-14 in accel/tcg, guest-CPU core reaching every title -- on an Android build and a green preflight, with no audit pass. AGENTS.md's own heading is 'preflight is not an audit'."
cost = "Not yet known; an audit is running. The protocol was written the same day, and the first audit had explicitly flagged accel/tcg as glanced-only and deserving its own pass. Both facts were available and neither stopped the fold."
bit = 1
owner = "unassigned"
fix = "The fold path needs the gate, not the orchestrator's memory. lane.toolsmith holds preflight.sh and is already building an audit-record gate; it should refuse a fold whose diff touches compiled code with no audit record covering it. Until then the protocol depends on the person most likely to be in a hurry."

# FIXED AND REMOVED 2026-09-14 by lane.toolsmith, folded in the merge above:
#   skip-ci-typo                  -> preflight's commit-subject gate now fails a
#                                    near-miss, including `[skip ci] [skip ki]`
#                                    which the old grep passed silently. Radius 2
#                                    for transpositions, verified against 390 real
#                                    bracketed tokens.
#   index-gate-punishes-lanes     -> the nv2a index gate scores against the FOLD
#                                    BASE; attribution is structural, SCAN_ROOTS
#                                    read out of nv2a_index.py.
#   expect-gate-refuses-soaks     -> the gate follows judge(); 12 of 12 soak
#                                    predictions were being refused, now 0 of 15,
#                                    with all 32 disc-side true positives kept.
#   lastbrief-needs-remembering   -> derives from deliveries/<lane>.md mtime, with
#                                    the stamp as a FALLBACK rather than a
#                                    tiebreak so it cannot mask a missing entry.
#   minimised-run-reads-as-a-defect -> ab_compare --check-truncation, called by
#                                    request.sh --wait, the one place both disc
#                                    and soak results are read.

[[cut]]
id = "audit-remediation-can-be-wrong"
what = "An audit finding's proposed REMEDIATION is not itself audited. Twice in one chain a proposed fix was wrong and only the remediating lane caught it: pass 2 found the first HIGH's assert unfireable, and M5's proposed eviction-on-insert was refuted because ihash is over guest bytes, so alternating overlays make a superseded entry recyclable."
cost = "Following M5's remediation would have destroyed exactly the recycle hit the cache exists for, on the workload #73 and #68 are about. Caught only because the remediating lane read the code rather than the finding."
bit = 2
owner = "unassigned"
fix = "State in AGENTS.md that a remediation is a CLAIM like a blocker, and a lane that disagrees should decline with a reason rather than implement it. Both lanes did this correctly without being told; the protocol should say so, so the next one does not assume the finding is authoritative."

[[cut]]
id = "soak-results-keep-no-frames"
what = "A soak result dir carries `pulled: []` and holds only a logcat. The FRAMES an analysis rests on survive nowhere durable -- for #77's driver A/B they existed only in the lane's scratchpad, one reap from gone."
cost = "434 frames across four arms, the entire evidential basis of a four-arm driver A/B, were recoverable only by hand-copying out of /tmp before the scratchpad was reaped. Found by lane.scene77 while re-analysing them; nobody had noticed the result dirs were empty."
bit = 1
owner = "unassigned"
fix = "A soak that captures frames should pull them into its result dir like a disc run pulls captures. Until then the orchestrator must copy them at fold time -- done for these four, but that is a step someone has to remember, which is the category this file exists to eliminate."
