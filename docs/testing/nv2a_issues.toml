# MEASURED, and inert at maximum volume, so this is NOT the owner's symptom --
# recorded as a defect on its own terms, and as a negative for that symptom.
#
# apu.c, in the once-per-8-frames output block:
#
#     if (0 <= g_config.audio.volume_limit && g_config.audio.volume_limit < 1) {
#         float f = pow(g_config.audio.volume_limit, M_E);
#
# volume_limit defaults to 1 (config_spec.yml) and to 1.0 on Android
# (xemu_android.cpp), and the guard requires < 1, so the block does not execute
# at max. The coordinator confirmed 1.0 on the owner's device. That is why the
# headroom work could exclude this rather than merely rank it unlikely.
#
# The defect is the curve. ui/xui/main-menu.cc prints volume_limit * 100 as
# "%d%%", labelling the control a percentage, while the gain applied is x^e:
#
#     slider 90% -> 0.744 (-2.6 dB)      slider 50% -> 0.152 (-16.4 dB)
#     slider 75% -> 0.464 (-6.7 dB)      slider 25% -> 0.0231 (-32.7 dB)
#
# A user who nudges the slider to half expecting half loudness gets -16 dB.
#
# There is no principled reason for the exponent to be e. A perceptual taper
# uses a power of 2 to 3 by convention, or dB directly; e looks like a
# placeholder. FALSIFIED IF someone shows the curve is deliberate -- an
# intentional taper matched to a measured listening test, or a label that is not
# a percentage. Either would make this a documentation problem rather than a
# defect. Nothing in the tree argues for it today.
#
# Note for anyone who reproduces the owner's symptom later: if the launcher ever
# writes a volume_limit below 1, this alone produces "unusually low", and the
# check costs one question.
status = "fixed-verified"
status_note = "MEASURED OUT: the APU sink zero-fills a short read and counts nothing, at 0.0000% steady state on BOTH handhelds. Re-measured on the Nova after the Thor."

#
# DECIDED AND HALF-FIXED, 2026-09-13. Write-up:
# docs/investigations/audio-savestate-and-monitor-accumulator.md section 3.
#
# THE REASON ABOVE FOR BLAMING THE CURVE IS FALSIFIED BY ITS OWN ARGUMENT.
# "A perceptual taper uses a power of 2 to 3 by convention ... e looks like a
# placeholder": e is 2.71828, INSIDE that band, and it behaves like the
# textbook x^3 audio taper to within two percent of slider travel -- x^e
# reaches -6 dB at 0.776 of the slider, x^3 at 0.794, linear at 0.501. So the
# curve is what convention would pick for a linear-travel volume control and
# "undocumented" cannot carry a change to it. What is left is that the LABEL
# makes a claim the control never made.
#
# AND THE CURVE CHANGE IS NOT FREE, which settles which half to change.
# volume_limit is persisted, it is the slider POSITION rather than the gain,
# and config_spec.yml has NO version key -- so an old 0.5 and a new 0.5 are
# indistinguishable and no one-time conversion exists. Going linear would
# relouden every saved sub-maximum setting silently and only ever upward:
# +1.57 dB at 0.90, +4.29 at 0.75, +10.35 at 0.50, +20.69 at 0.25, +41.38 at
# 0.0625, unbounded as the setting approaches zero. Fixing the label costs
# nobody a decibel.
#
# CHOSEN: keep the curve, fix the label. MIGRATION CONSEQUENCE for a user with
# a setting already saved: NONE, not one sample changes.
#
# The label should read in dB, not a second percentage, because that is the
# unit the Xbox's own volume control uses -- AC97_Master_Volume_Mute is six
# bits of attenuation at 1.5 dB a step, 94.5 dB of range, get_volume with mask
# 0x3f in hw/audio/ac97.c. The desktop one-liner is in ui/xui/main-menu.cc:841
# and is NOT DONE: that file belongs to another lane. The patch is written out
# in section 3 of the write-up.
#
# THE ANDROID HALF IS DONE, and it is the half that reaches this fork's users:
# there is no label on a handheld to correct at all, because ui/xui/ is
# excluded from the Android build at
# android/app/src/main/cpp/CMakeLists.txt:473 and nothing else states the
# gain. A non-unity volume_limit now prints its applied gain in dB and as a
# percent of full scale under the hakuX-audio tag, on change rather than once.
# That is #70's "the check costs one question" reduced to zero questions.
#
# NOT FIXED, recorded rather than bundled: `0 <= volume_limit` means a
# NEGATIVE volume_limit skips the block and yields FULL volume rather than
# silence. Android clamps to [0,1] on load (xemu_settings_android.cc:346-352);
# the desktop path does not, so a hand-edited toml reaches it. Different bug --
# out-of-range input handling, not the label/effect disagreement.
[issue.apu-volume-taper]
title = "The volume slider applies x^e while the UI labels it a percentage, so 50% is -16.4 dB"
disposition = "defect"
component = "apu"
suites = []

# MEASURED on hardware, both sides. The submix-headroom fix (54a00d28fb,
# verified in audio-headroom-verified.md) raised the monitor path by a measured
# +6.118 dB mean over ten percentile statistics, spread 0.55 dB, against a
# predicted +6.02. It also put the output on the rails:
#
#            pre-fix (8254d88ebc)        post-fix (51aa3f9d0e)
#   peak L/R  17,296 / 22,092             32,767 / 32,767
#   peak dBFS -5.55 / -3.42               -0.00 / -0.00
#   clipped   0                           52  (0.0012% of 4,456,448)
#
# Both captures Galleon on the Nova, 92.843 s, volume_limit 1.0, use_dsp false.
# The pre-fix peaks give the true post-fix peaks: 34,592 and 44,184, i.e. about
# +0.5 and +2.6 dBFS. The mix now exceeds full scale on transients and the only
# thing between it and the DAC is the clamp to +/-1.0 in the float-to-short
# conversion.
#
# Read the peak row with care, because it is the trap that nearly sank the
# headroom result: R's peak appears to shift only +3.42 dB, which looks like the
# prediction failing and is not -- the post-fix peak is pinned at 32,767, so the
# statistic is censored. The percentiles are what carry the gain.
#
# WHAT IS ACTUALLY UNKNOWN, and why this is not simply "add a limiter": nobody
# knows what the hardware does at the rails. No golden PCM from real silicon
# exists; the assessment explains that getting one means recording S/PDIF off an
# actual Xbox. The clipping may be exactly what an Xbox does with this content,
# in which case the emulation is right and there is nothing to fix. It may also
# be that the correct level is lower and the headroom fix overshot for a reason
# not yet found.
#
# FALSIFIED / RESOLVED BY: a hardware capture of the same title at the same
# point, or by a title that clips substantially more than 0.0012%, which would
# make this audible rather than arithmetic. 52 samples in 92.843 s is not
# audible and is not an argument against the fix; it IS the reason a limiter is
# worth considering and the reason this is on the tracker rather than in a
# comment.
#
# TWO CORRECTIONS FROM MEASUREMENT, 2026-09-12, and both narrow this.
#
# 1. THE CLIPPED-SAMPLE COUNT IS NOT A PROPERTY OF THE LEVEL. A second Galleon
#    playthrough on the same device at the same ref (result
#    1789279659-audio-level-galleon-1503189, read by the in-emulator level
#    meter) clips 562 and 714 samples -- 0.0138% and 0.0176% -- against the
#    baseline playthrough's 36 and 16, i.e. 0.0008% and 0.0004%. A 16-45x
#    spread between two runs whose MEDIAN active window agrees to 0.22 dB.
#    Clipping counts transients, and two playthroughs of a title that peaks at
#    the rails do not contain the same transients. So "52 samples in 92.843 s"
#    above is one draw, not a figure; the only stable statement is that the mix
#    REACHES the rails, which it does in both runs on both channels -- and
#    Crimson Skies, a far denser mix, reaches them with only 84 and 73 samples
#    clipped (0.0020%), a TENTH of the quieter title's louder playthrough. A
#    prediction registered as "clipped below 0.01%" failed on exactly this and
#    the prediction was the thing that was wrong.
#
# 2. IT IS NOT THE EMULATOR RUNNING HOT, IT IS GALLEON. Dead or Alive 3, same
#    binary, same hour, Thor (result 1789279792-audio-level-doa3-1542469):
#    peak 12,795 / 12,803 = -8.17 / -8.16 dBFS, and ZERO clipped samples in
#    89.6 s. Its median active window is 5.9 dB HOTTER than Galleon's while its
#    peak is 8 dB below full scale -- loud-half spread (p95-p50) 4.2/5.1 dB
#    against Galleon's 11.6/12.9. One binary, two shapes. So the monitor path
#    is not systematically at the rails; one wide-dynamic title gets there and
#    another leaves 8 dB unused. A third, Crimson Skies (result
#    1789280122-audio-level-crimson-1590751), is 9.4 dB hotter than Galleon in
#    whole-file AC RMS (-14.00/-13.98 dBFS) and 13.4 dB hotter in median active
#    window, on a run that is 95% non-silent -- and clips a tenth as much.
#    Three titles, three shapes, one binary, 13.8 dB of median level between
#    them.
#
# What survives unchanged is the real question: nobody knows what silicon does
# at the rails, and there is still no golden PCM. But a limiter would now be
# solving a problem that one title's transients produce, on a path where
# another title never approaches full scale -- which is an argument for leaving
# it alone until a hardware reference exists.
status = "fixed-part"
status_note = "DECIDED AND HALF-FIXED 2026-09-13: keep the curve, fix the label. The tracker's own reason for blaming the curve is falsified by its own argument -- e is 2.71828, INSIDE the 2-3 band it cites, and behaves like the textbook x^3 taper to within two percentage points of travel (-6 dB at 0.776 vs 0.794). And the curve change is not free: volume_limit is persisted, it is the slider POSITION, and config_spec.yml has no version key, so going linear would relouden every saved sub-max setting silently and only upward (+1.57 dB at 0.90 ... +41.38 dB at 0.0625). MIGRATION CONSEQUENCE of the chosen fix: none, not one sample changes. Android half DONE (a non-unity volume_limit now logs its gain in dB and %FS); the desktop label at ui/xui/main-menu.cc:841 is another lane's file and the patch is written out unapplied. NOT FIXED: 0 <= volume_limit means a NEGATIVE value yields FULL volume; Android clamps on load, desktop does not."

