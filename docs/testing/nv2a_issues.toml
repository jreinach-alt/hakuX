[issue.82]
title = "x87 FSCALE returns +-0 where it must return +-inf, on the Android FPU JIT only"
component = "tcg"
no_suites = "guest-CPU core, not a pgraph defect -- no golden suite scores it. It is also unreachable by the test disc: nothing on the corpus issues FSCALE with a runaway exponent, which is exactly why it needed an audit rather than an arm."
disposition = "defect"
blocker_falsifier = "if 'the two FPU paths now disagree' were false, a guest FSCALE with finite |ST1| >= 2^31 would produce the same result under fp_jit on and off -- and the soft path is the control, because softfloat's partsN(float_to_sint) is what the hard path was written to replace."
blocker_tested = "not run, and it does not need a device: the divergence is readable from the two implementations. floatx80_to_int32_rtz_nds() returns INT32_MIN on BOTH signs of overflow and on NaN; fpu/softfloat-parts.c.inc:1239/1244/1267/1271 returns max for positive overflow and for NaN. helper_fscale is the only one of the ten consumers on that path that reads the value UNGUARDED."
status = "open"
status_note = "FOUND BY AUDIT PASS 1 OVER lane.remote's UNFOLDED COMMITS, HIGH, target/i386/tcg/fpu_helper.c:3154 -- which is the whole argument for auditing before folding rather than after. Introduced by 622183271b, whose #74 fix is RIGHT ABOUT ROUNDING and wrong about saturation. All six FIST/FISTT helpers and FBSTP overwrite the value under a float_flag_invalid guard, so the divergence is INVISIBLE exactly where the fix was aimed and shows up somewhere nobody was looking. The failure: a guest FSCALE with finite |ST1| >= 2^31 -- ldexp with a runaway exponent -- used to get fcvtzs -> INT32_MAX -> +-inf, which is x87-correct and is still what the soft path gives. It now gets scalbn(ST0, INT32_MIN) -> +-0. INFINITY BECOMES ZERO, and the answer depends on the fp_jit setting. Remediation named by the audit: saturate like softfloat -- return r < 0 ? INT32_MIN : INT32_MAX (resp. INT64) on the out-of-range branch and INT32_MAX for NaN, in all four *_nds/_rtz_nds helpers. The FIST/FISTP/FBSTP guards are unaffected by that change, which is what makes it safe."
blocked_on = "NOT BLOCKED, and it gates something: audit protocol says HIGHs are remediated BEFORE the code folds, so lane.remote's 24 commits do not fold until this is fixed. target/** is lane.remote's territory and the finding has been delivered there with its text. FILED AS ITS OWN ROW DELIBERATELY: #74 is the nearest issue but is being CLOSED by the commit that introduced this, and filing it there would close a row and open a defect in the same breath. The block is inside #if defined(__aarch64__), so a desktop build would not compile it even if the desktop build worked -- the known libcurl4-openssl-dev gap. It is read from source and not confirmed against a binary, which the audit states rather than hides."

