# LATENT, measured at zero, and strictly more likely since the headroom fix.
#
# MEASURED, from source: the per-voice conversion saturates, but the monitor mix
# then sums voices with += into an int16_t (vp.c:1887-1888). That accumulator
# WRAPS rather than saturating, and a wrap flips the sign of a loud sample --
# which a band-limited 48 kHz signal does not do. The headroom fix doubled what
# is summed into it, so the margin against overflow halved.
#
# MEASURED on hardware: zero wrap suspects in every capture taken so far --
# both headroom arms (92.843 s each) and one further undated Galleon capture
# (126.976 s). audio_measure.py counts adjacent samples differing by more than
# full scale, which is the signature and not the event; a zero count does not
# prove the accumulator never wrapped, only that it left no full-scale sign flip
# behind. Largest observed adjacent jump was 11,537 of 65,535.
#
# So: a real hazard with no observed instance. Filed rather than fixed because
# the fix is not free -- clamping the accumulation changes the mix arithmetic on
# the hot path for every voice, and doing that to prevent something that has
# never been seen is how a measured chain acquires an unmeasured stage.
#
# FALSIFIED IF a capture shows wrap suspects with no genuinely square content to
# explain them. That is the trigger to clamp, and it is worth re-checking on any
# title denser than Galleon -- the Xbox APU sums up to 256 voices and Galleon is
# not a stress case.
#
# NOW WATCHED CONTINUOUSLY, 2026-09-12. The wrap-suspect count no longer needs a
# capture: the level meter in apu.c counts it on device and prints it every 5 s
# under tag hakuX-audio, so every audio soak from here on is a test of this
# whether it was asked to be or not. Three more runs, zero wrap suspects: a
# second Galleon playthrough on the Nova (largest adjacent jump 13,096 of
# 65,535, up from the captures' 11,537, with 562/714 clipped samples against 36
# /16 -- so a louder-transient run than any previous one and still no wrap),
# Dead or Alive 3 on the Thor (largest jump 10,085, and its peak never exceeds
# 12,803, so it is not even close), and Crimson Skies on the Thor -- which is
# the real test: largest adjacent jump 21,866 and 22,628 of 65,535, nearly
# DOUBLE anything a capture had ever shown, at the rails on both channels, and
# still zero wrap suspects. The hazard is unchanged in the code; the
# evidence against it firing has gone from 312 s to about 490 s, and the cost of
# adding to it is now zero.
status = "unmodellable"
status_note = "MEASURED OUT as a defect: three titles on one binary in one hour span 13.8 dB of median level (Crimson Skies 9.4 dB hotter in AC RMS than Galleon, DOA3 zero clipped samples at peak -8.17 dBFS). A missing gain cannot be missing from one title and not another -- Galleon is simply quiet."

#
# FIXED AND MEASURED, 2026-09-13, and the issue's own premise was wrong.
# Write-up: docs/investigations/audio-savestate-and-monitor-accumulator.md
# section 2.
#
# VOICE COUNT IS THE WRONG AXIS, which is why every measurement above read
# zero. Voices are summed in FLOAT -- vp.c:1582 per voice, vp.c:1706 across the
# worker threads -- and converted ONCE by src_float_to_short_array, which
# clamps to +/-1.0 before scaling (samplerate_stub.c:161; vminq/vmaxq then
# vqmovn_s32 on aarch64, an explicit clamp in the scalar tail). So no number of
# simultaneous voices at any level can overflow the int16 store, and the
# question "how many voices would be needed" has no answer.
#
# WHAT THE += ACCUMULATES IS SLICES, and the schedule normally puts exactly one
# value in each: monitor.frame_buf is int16_t[256][2] = eight 32-sample slices
# (apu_int.h:104); a VP frame writes the slice at (ep_frame_div % 8) * 32;
# apu.c:692 flushes all 256 samples and memsets the buffer when
# (ep_frame_div + 1) % 8 == 0, with apu.c:726 the only increment. Indices run
# 0..7 and the buffer is zeroed after the eighth, so every += lands on a zeroed
# element and is equivalent to =. The other two writers of frame_buf
# (gp_ep.c:469, gp_ep.c:188) are gated on different monitor points and use
# assignment and memcpy.
#
# THE ONE PATH NOT RULED OUT: gp_ep.c:424 sets ep_frame_div = 0 on any guest
# write to NV_PAPU_EPRST -- with `FIXME: Still unsure about frame sync` already
# on it -- without clearing frame_buf. Arriving with ep_frame_div % 8 in 1..7,
# seven of eight phases, it revisits the slices already written this cycle and
# two near-full-scale samples of the same sign then suffice. That needs no
# density, the opposite of what this entry assumed.
#
# FIXED: the accumulation saturates. Two compares and a store per sample, 64
# per 5.333 ms frame. NO AUDIBLE IMPROVEMENT IS CLAIMED and the clamp is
# expected to fire never.
#
# NOW MEASURED AT THE EVENT RATHER THAN THE SIGNATURE. The wrap-suspect count
# is adjacent OUTPUT samples differing by more than full scale, a consequence
# of a wrap and not the wrap. A `mon_acc:` line every 5 s under hakuX-audio now
# counts the precondition at the site: samples that found a non-zero
# accumulator, sums that left int16 range, and the largest magnitude seen.
#
# Crimson Skies, Thor, 87.941 s, ref 62eaa2f7f6, binary 64b0a6b4789e, result
# 1789282799-monacc-crimson-68501, prediction f096815cb5 registered before the
# request was queued:
#
#   18 windows of exactly 480,000 samples (48,000 x 2ch x 5 s -- real time)
#   8,639,936 samples   nonzero 0   saturated 0   maxabs 32,767 peak, never over
#
# M1 instrument alive PASSED. M2 nonzero == 0 PASSED. M3 saturated == 0
# PASSED. M4 level unmoved PASSED far inside its 2.0 dB tolerance -- p50
# +0.10 / 0.00 dB against result 1789280122 on the same device, and clipped
# (84/73) and maxjump (21,866/22,628) IDENTICAL TO THE SAMPLE, so the clamp is
# inert to the sample on this title. M5 starvation PASSED, 0/704 and 0/703
# callbacks, 0 of 11,526,144 bytes zero-filled.
#
# WHAT THE ZERO BOUNDS: occurrences would arrive in bursts of at most
# 7*32*2 = 448 samples per rewind, so it bounds the NUMBER OF EPRST REWINDS in
# 88 s of this title, not a per-sample rate. The counter is permanent, so every
# later audio soak adds to it.
#
# DELIBERATELY NOT FIXED: the frame-sync rewind. Clearing frame_buf on EPRST,
# or making the slice write an assignment, changes what the guest hears on a
# path nothing has measured, and gp_ep.c's own FIXME says the sync is not
# understood. The clamp is the correctness floor; the rewind is a separate
# question that mon_acc's nonzero column now watches continuously.
#
# THE REWIND IS REAL, AND THAT INVERTS THE READING ABOVE, 2026-09-13. After
# two more rounds of instrument (the per-sample counter was replaced by an
# O(1) ep_frame_div watcher, and that watcher's first shape had a startup
# false positive which its own registered consistency leg predicted), results
# 1789284344-monaccfix-galleon (nova) and -crimson (thor) at ref 37e1fabd89:
#
#   Galleon        17 windows x 7500 frames  jumps 2  revisits 1  nonzero 0  saturated 0
#   Crimson Skies  18 windows x 7500 frames  jumps 2  revisits 1  nonzero 0  saturated 0
#
# gp_ep.c:424 is the ONLY writer of ep_frame_div that is not apu.c:726's
# increment -- mcpx_apu_reset does not touch it and a grep over hw/ returns
# nothing else -- so every jump is a guest write to NV_PAPU_EPRST. Two of them,
# deterministically, at APU init, on two titles from two studios on two
# handhelds. And ONE OF THE TWO LANDS WITH SLICES STILL DIRTY, so the += does
# add to a non-empty accumulator about once per run.
#
# It has never overflowed for a reason the columns give directly: nonzero 0
# says the revisited accumulators held zero and saturated 0 says nothing left
# int16 range. The reset happens while the mix is silent.
#
# SO THE CLAMP IS NOT DEAD CODE. It guards a path the guest takes about once
# per run, which would overflow if a title ever resynced the EP mid-cycle while
# the mix was loud. The residual risk is now stateable exactly -- an
# NV_PAPU_EPRST write with ep_frame_div % 8 in 1..7 coinciding with
# near-full-scale content -- rather than as "nobody has seen a wrap".
#
# AND IT VINDICATES DROPPING THE PER-SAMPLE COUNTER. `nonzero` could never have
# found this: it counts accumulators that were non-zero, and the event lands on
# silence, so the old instrument read zero over 16.8M samples while the
# mechanism fired twice a run in front of it.
#
# SIX OF ELEVEN REGISTERED LEGS FAILED across the three rounds (M5, A1, B1, R2,
# R3, F1/F2) and every one moved the answer. R3 is the one worth copying: it
# predicted the disagreement between the two instrument shapes and named the
# suspect line before the bug was found.
#
# RECOMMENDED DISPOSITION: this entry closes on the clamp. The frame-sync
# rewind at gp_ep.c:424 now has a measurement behind it -- two rewinds a run,
# one dirty, two titles, two devices -- and wants its own entry as
# unknown-semantics: whether a revisited slice's samples should be summed,
# overwritten or dropped is not decidable from this tree, which is what that
# line's own FIXME says.
[issue.apu-monitor-accumulator]
title = "The VP monitor mix accumulates voices into an int16_t that wraps instead of saturating"
disposition = "defect"
component = "apu"
suites = []

# MEASURED: NV_PAVS_VOICE_CFG_FMT_HEADROOM (0x7 << 13) is defined at
# apu_regs.h:231 and read NOWHERE. `grep -rn CFG_FMT_HEADROOM hw/` returns only
# the definition. A 3-bit field is parsed out of the voice format register and
# then ignored.
#
# This is the third 3-bit headroom control in the same register file. The other
# two are submix_headroom and hrtf_headroom, both divisions by 1 << value, i.e.
# 6.0206 dB per unit. One of those two turned out to be a live, uncompensated
# -6.02 dB on the default Android path and was the owner's low-volume symptom
# (54a00d28fb). That is the reason this one is worth a tracker entry rather than
# a shrug: the same register file, the same width, the same natural unit, and no
# reader at all.
#
# DIRECTION UNKNOWN, and this is why the disposition is what it is. If the
# hardware attenuates by this field we are currently LOUDER than hardware, and
# this is not a missing gain. If it is a gain we are quieter. Nothing in the
# tree decides it and guessing is how five mechanism claims were retracted on
# this project in two days.
#
# THE EXPERIMENT THAT SETTLES IT, and it is cheap: log the field's value per
# voice on a real title, the way submix_headroom was settled (5e3923a0ed, which
# found all 31 slots at 1). If every title leaves it 0 the question is moot and
# this closes as unreachable. If titles program it non-zero, the next step is a
# hardware capture of one voice with the field set and cleared -- there is no
# way to get the direction from source.
#
# THE EXPERIMENT WAS RUN, 2026-09-12. Census in mcpx_apu_vp_frame over voices
# that are ACTIVE and about to be mixed, so the distribution is weighted by
# what is audible rather than by what is merely configured. Galleon, Nova, 90 s,
# ref 8d96196c71, binary 2413de7c33ad, result
# 1789278817-audio74-galleon-1188071:
#
#   1,288,746 active voice-frames, 18 windows of 5 s
#   headroom = 7 : 1,288,746   (100.00%)
#   headroom = 0..6 : 0        (  0.00%)
#
# FOUR RUNS, THREE TITLES, and not one voice-frame of 3,424,618 at any other
# value -- Galleon twice on the Nova (1,288,746 and 1,237,181), Dead or Alive 3
# on the Thor (174,608) and Crimson Skies on the Thor (724,083). Every run also
# reads submix_headroom[0..30] = 1. Those three titles span 13.8 dB of median
# output level between them, so this is not one studio's convention: 7 and 1 are
# what the runtime programs, in two different registers, with no exceptions.
#
# Every voice, every window, at 7 -- the MAXIMUM the three-bit field holds, x128,
# 42.14 dB. The prediction registered before the run said non-zero (right) with
# a modal value of 1 by analogy with submix_headroom (wrong). The same run
# re-confirms submix_headroom[0..30] = 1, so the two registers hold DIFFERENT
# values on the same title, which is itself the finding: they are two
# quantities, not two names for one reserve.
#
# MEASURED OUT AS THE OWNER'S SYMPTOM, by arithmetic against the level baseline
# rather than by deciding the direction. Suppose the field were a GAIN we fail
# to apply -- the only direction that could make us too quiet. It is 7 on 100%
# of voice-frames, so the whole mix would move by +42.14 dB, and against
# audio-baseline.md section 1 that puts whole-file AC RMS at +18.7 dBFS, the
# median active 50 ms window at +12.8 dBFS and even the FIFTH PERCENTILE of
# active windows at +4.1 dBFS. Every one of those is above full scale. No title
# ships a mix whose fifth percentile is 4 dB into the rails, so the field is not
# an unapplied gain. #74 is not "volume seems unusually low", and with #70's
# starvation measured at 0.0000% and the uniform-gain hypothesis closed by the
# peak, all three candidates the baseline left standing are now measured out.
#
# WHAT IS STILL OPEN, and it moved rather than closing. 7 = 42 dB = seven bits
# is exactly the reserve the arithmetic needs: the GP mixbuf is 24-bit, a voice
# is 16-bit, and shifting each voice down by 7 leaves room to sum on the order of
# 128-256 voices into one bin without overflow. The Xbox APU sums up to 256. So
# the coherent reading is that CFG_FMT_HEADROOM is the voice-into-bin reserve,
# while submix_headroom = 1 is a separate, smaller reserve at the bin OUTPUT --
# the stage the uploaded GP scene reads.
#
# If that is right, vp.c:1521-1523 divides the voice by the WRONG REGISTER: it
# uses 2^submix_headroom[bin[b]] = 2 where hardware would use
# 2^voice_headroom = 128, leaving our mixbins 64x = 36.1 dB hot into a
# saturating 24-bit buffer. INERT on the monitor path (use_dsp=false, the
# handheld default and the owner's configuration): the mixbins are discarded,
# the monitor mix applies no headroom, and the one place headroom reaches the
# audible output -- the multipass read at vp.c:1316 -- divides and multiplies by
# the SAME submix_headroom[mp_bin] and is self-consistent whatever the true
# convention is. A 36 dB error on the DSP path only, which is off by default and
# labelled experimental.
#
# NOT FIXED, deliberately. Changing 2 to 128 moves the DSP path by 36 dB in a
# direction nothing has measured, on a path this harness cannot reach: the PCM
# tap and the level meter both read monitor.frame_buf, and use_dsp is a config
# toggle no soak can set. Doing it on a guess is how a measured chain acquires
# an unmeasured stage.
#
# LEAST CERTAIN, and it bounds what may be acted on: that bits 13-15 ARE this
# field. A three-bit value reading 0b111 on every voice of every title is
# equally consistent with "every voice reserves the maximum" and with "the bit
# assignment is wrong". apu_regs.h leaves bits 10-12 undefined immediately below
# them, and already aliases SAMPLES_PER_BLOCK and MULTIPASS_BIN onto the same
# 0x1F << 16, so that header has not been audited. The loudness verdict above
# does not depend on this -- a 42 dB gain is excluded by arithmetic whatever the
# bits are called -- but the 36 dB DSP-path claim does. DO NOT change the mixbin
# divisor on the strength of the value alone. The cheap partial check is to log
# the whole CFG_FMT word for one voice and decode its OTHER fields (sample size,
# container, stereo, loop) against what the title must be doing: sensible
# neighbours mean the header is trustworthy in that region, nonsense means 7
# means nothing. One log line, one soak.
#
# FALSIFIED / RESOLVED BY: a capture of the DSP path (needs use_dsp reachable
# from a soak), or a hardware capture of one voice with the field set and
# cleared. NOTE FOR WHOEVER IMPLEMENTS IT: the multipass read at vp.c:1316 must
# then earn back BOTH headrooms, not just the submix one, or multipass content
# alone lands 2^voice_headroom below everything else on the monitor path -- the
# same class of defect 54a00d28fb fixed, introduced BY the fix for this.
#
# Write-up: docs/investigations/audio-voice-headroom.md.
status = "fixed-part"
status_note = "The issue's premise was WRONG and measuring it inverted the reading. Voice count cannot overflow the accumulator: voices sum in float (vp.c:1582, :1706) and convert once through a clamping conversion, and the += accumulates SLICES -- eight 32-sample slices, flushed and memset every cycle -- so it normally adds to zero, which is why #74's census found nothing across 3,424,618 voice-frames. Then F1/F2 failed: gp_ep.c:424 is the only writer of ep_frame_div besides the increment, so every discontinuity is a guest NV_PAPU_EPRST write, and jumps=2 revisits=1 measured on Galleon/Nova AND Crimson Skies/Thor -- two rewinds per run at APU init, deterministically, one of them landing with slices still dirty. It has never overflowed only because it coincides with initialisation silence (nonzero 0). Saturating add landed; residual risk now exact: an EPRST write with ep_frame_div % 8 in 1..7 during near-full-scale content. NOT FIXED deliberately: the rewind itself -- whether a revisited slice should be summed, overwritten or dropped is not decidable here and gp_ep.c:424's own FIXME says so. Six of eleven legs failed, each moving the answer; R3 named the bug before it was found."

