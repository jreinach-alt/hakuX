status_note = "The first root cause was real and is fixed -- 2dd232172c carries a vertex RAM upload to every frame of the ring, not just the next, and is in HEAD unreverted -- but a second mechanism survives it: rebuilding 2dd232172c ITSELF measures 3 failures in 15 against ~3 in 10 at HEAD, statistically identical, so there is no regression to bisect and the fix never addressed this. No pre-registered arm exists and none can judge it: the defect is a ~30% coin flip on a single capture, which is what a single-arm A/B cannot see. Eliminated by measurement: contamination, draw reordering, deferred replay, no-op misclassification, inline clear, pipeline rebinding, per-draw state, pipeline/render-pass/framebuffer identity, cross-command-buffer state (0 mismatches in 165 draws), recording/submit overlap (0 of 161). Every intervention is a timing knob and the full validation layer closes the window outright (0 of 7), which is a statement about the instrument. Desktop-lavapipe-lane only so far: 763 repeated Adreno captures across six 2-run arms give band 0 on every one. Its own recommendation has landed as ab_compare's measured --runs N band."

[issue.56]
title = "Vulkan: an LRU-exhausted first texture bind leaves a permanent NULL binding, dereferenced unguarded in three places"
