[issue.79]
title = "Stencil is nondeterministic: 9 of 16 captures change value between runs of the SAME binary, and at least one issue was filed on the noise"
suites = ["Stencil"]
disposition = "defect"
blocker_falsifier = "if 'same fix as #44, not a separate piece of work' were false, the skew bound would NOT remove the Stencil flake -- arm B would still show captures disagreeing between runs of one binary."
blocker_tested = "confirmed, and the observable is ALIVE. stencil_observable_79.py groups every Stencil score set on disk by (ref, apk_sha), because only a same-binary replicate makes a difference mean nondeterminism. ec7f50e859 / apk 24a5f905a794 -- which IS #79 arm B, XEMU_OPT_FIFO_SKEW_BOUND=1 -- is the ONLY group of 8 with >=2 runs and ZERO captures disagreeing. The other seven show 3-8 of 16 disagreeing, including e2b6abde73 / apk 2bf7afdc6877. So the baseline rate is high and the arm-B zero is not luck. pfifo.c is in [free]; no lane holds it. Close as a duplicate of #44 when that decision lands."
status = "fixed-verified"
status_note = "DIAGNOSED AND MEASURED 2026-09-14 by lane.stencil: THIS IS #44, THE GUEST<->PGRAPH SKEW, ON VERTEX DATA. Not a stencil defect and not in vk/surface.c, vk/draw.c or vk/command.c -- all three suspects checked clean from the code: pgraph_vk_clear_surface records vkCmdClearAttachments with VK_IMAGE_ASPECT_STENCIL_BIT on r->command_buffer in guest order on both paths; there is no second command buffer, because pgraph_vk_begin_nondraw_commands returns the MAIN one and the synchronous download submits and waits before its memcpy; and the frame_submitted-guarded early return is unreachable, its only producer being called from one site immediately followed by pgraph_vk_finish(FLIP_STALL) on the same thread. My own shape for the mechanism -- a lost clear, or a previous test writes landing late -- is REFUTED. WHAT IT IS: the wrongly drawn regions are TRIANGLES. Each of the suite three draws is one DefineBiTri, six vertices laid out [ul,ll,lr] then [ul,lr,ur], into a buffer the guest rewrites for the next draw with no fence. Fitting the drawn regions: REPLACE_ST green is the inner quad tri1 alone (IoU 1.0000); REPLACE_ST_DT green is the OUTER quad tri2 alone (0.9980); ZERO_DT shows D2 BLUE vertex colour on inner tri2 alone (0.9960) on a draw whose COLOR_MASK is zero; and REPLACE_DT red is tri1 intact plus a tri2 whose shared ul vertex has X FROM THE 100x100 QUAD AND Y FROM THE 200x200 ONE (0.9943). No stencil state is true for one half of a six-vertex draw and false for the other, and none reaches inside a single vertex -- that last row is a vertex caught mid-rewrite with x updated and y not. It is the byte-level-mixture-inside-one-texel row of #44 guest-pgraph-skew, one level up. ARM: XEMU_OPT_FIFO_SKEW_BOUND 0 vs 1, Stencil x4 per arm on the Thor, PRE-REGISTERED PASS on all 16 checks. Bound off: 7 wrong of 64 observations, 3 of 4 runs flaking. Bound on: 0 of 64, 0 of 4. V0 validity gate holds -- arm A 10.9% matches the 11.2% floor taken from 14 earlier Stencil-disc runs at five other refs BEFORE queueing, so a quiet arm A would have invalidated the arm rather than passing it. V2 on a direct counter: held(n) = kicks (1494/1494, 1388/1387) with bound on, held(n)=0 with it off, drain p90 950,000-22,650,000 ns -> 50,000. V1 and V2 are in tension by construction, so no inert change and no disabled feature passes both. behind/kicks = 100.0% on the Stencil disc is new; S0 had only been measured on Texture border. NOT ESTABLISHED: the bound is NOT free (gfps p90 29 -> 13 on Galleon, already priced in guest-pgraph-skew.md), and both arm refs are 292 commits behind the tip -- EQUALLY, which is what makes them a pair, but it certifies the mechanism rather than mainline. Strength stated both ways: 0.0006 against the published floor, Fisher p = 0.013 within the pair alone. Full derivation in docs/investigations/stencil-is-the-guest-pgraph-skew.md; docs/testing/stencil_outliers.py counts wrong (run, capture) observations and was validated against the 14-run floor before the arm. ORIGINAL FILING FOLLOWS. RECLASSIFIED harness -> defect 2026-09-13 after a byte-level pass over eight runs: FOR EVERY ONE OF THE NINE UNSTABLE CAPTURES THE MAJORITY IMAGE IS THE GOLDEN-EXACT ONE AND THE OUTLIERS ARE WRONG, so the emulator renders these correctly most runs and incorrectly some runs -- a defect intermittently expressed, not an untrustworthy observable. 11 wrong observations in 128 (16 captures x 8 runs), about 8.6% per run, on both binaries. THE FAILURES ARE NOT NOISE-SHAPED: every deviation is a single WHOLE REGION changing from exactly one colour to exactly one other, all inside the same 200x200 quad at x220..419 y140..339 or a concentric part of it -- 40,000 px is the whole quad, 30,000 is 200x150, 5,050/5,100 the 100x100 inner square plus a band, 5,000 a 198x50 strip. Red<->green is a pass/fail indicator flipping, so the COMPARISON RESULT changed rather than the shading. And Stencil_REPLACE_ST_ZB goes (255,255,1) -> (255,255,0): in the _ZB packing z24 is A<<16|R<<8|G and the stencil byte is B, so that is a direct read of the stencil buffer holding 1 in the correct image and 0 in the wrong one, over 5,050 px, with depth identical. Consistent with the stencil buffer contents at test time depending on work not ordered against the draw that reads it; the whole-region granularity and the literal off-by-one both fit, speckle would not. NOT ESTABLISHED: the site (no code read -- the mechanism is a shape the evidence fits, not a diagnosis), any run-order rule (A1 carries five of eleven and A3/A4 none, which invites a cold-start story, but B3 carries three and is a second run), device scope (Thor only, Nova held), renderer scope (Vulkan only), or whether it reaches titles. Full tables in docs/investigations/stencil-is-intermittently-wrong.md. ORIGINAL FILING FOLLOWS. MEASURED 2026-09-13, six runs on the Thor, three per arm, two binaries differing only by target/i386/tcg/fpu_helper.c, disc 4-suites:7254741c identical throughout. Nine of sixteen Stencil captures vary WITHIN an arm. The values do not drift, they snap between 0 and a small set of round numbers -- 5,000 / 5,050 / 5,100 / 30,000 / 40,000 -- and Stencil_REPLACE_DT alone produces 40,000, 0 and 5,100 on three runs of the identical build. NOT the device, harness or scorer: the same six runs hold Blend_tests bit-identical across all three runs of each arm (1,711,362 px in A, 0 in B), Point_size stable, and Viewport at 1,396 px in all six. Three suites in the same process reproduce perfectly and one does not. ALREADY PAID FOR TWICE: #75 was filed as a live ~100,652 px Stencil regression with a suspect commit named and a bisect lane spawned, and was noise -- closed as a duplicate after 13 runs, with sweep_diff.py written so a two-column diff could not be mistaken for a measurement again, but the MECHANISM was never identified and this is it; and a must_not_move = Stencil/* control on the #67 arm failed on six captures, which I first read as the fix reaching further than the control's argument allowed, a wrong conclusion in the flattering direction that only repetition caught. NOT INVESTIGATED: the cause. Adjacent and possibly the same family is the remote lane's finding that Surface_pitch::Swizzle varies by up to 2,341 px between runs while scoring 14,848 every time, because four arms share one texture buffer and Pushbuffer::End() does not wait for the GPU; both renderers read d->vram_ptr + texture_vram_offset at draw time. Whether Stencil has its own version of that race is a guess until someone looks. Also unknown: whether it is device-specific (Thor only; the Nova is held), renderer-specific (Vulkan only here), or whether the goldens are in question. CONSEQUENCE FOR EVERYONE ELSE: no Stencil number from a single run means anything, and Stencil/* must not be used as a must_not_move control."
blocked_on = "UNWALLED 2026-09-14: lane.readfreq retired at wave 35 and released pfifo.c WITHOUT EVER NEEDING IT -- it made no source change, because the counter it was dispatched to build already existed and had been running unread. The claim walled this issue for its whole life and bought nothing. SAME FIX AS #44 -- the skew bound, an existing constant in pfifo.c -- so what is left here is #44 shipping decision and not a separate piece of work. Kept open only until that decision lands; close as a duplicate of #44 when it does."

