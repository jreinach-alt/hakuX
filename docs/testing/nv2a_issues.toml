[issue.51]
title = "Texture cubemap: DOT_STR_3D was undefined behaviour; now deterministic, and the corner rule is still unimplemented"
# FIXED, PARTLY. Until the samplerCube gate landed, DOT_STR_3D declared
# sampler2D against a VK_IMAGE_VIEW_TYPE_CUBE image view --
# VUID-vkCmdDrawIndexed-viewType-07752, eight instances on the cube suite,
# binding 3. get_sampler_type() routed the mode through the PROJECT3D case,
# which never consults tex_cubemap[i] where CUBEMAP, DOT_STR_CUBE and all
# three DOT_RFLCT_* do. The fetch was undefined and the output proved it: on
# ONE binary run twice, 71 of 78 captures byte-identical and the seven
# DotSTR3D_* moving by 13,865-43,976 px, Bad2D byte-exact in one run and
# 19,714 px out in the other.
#
# MEASURED AFTER, against a bar registered before the run: determinism 0 px
# across three runs on all seven; viewType-07752 8 -> 0; Bad2D 19,714 -> 0 and
# stable. The six cubemap captures are UNCHANGED at 48,031-50,526 px and the
# predicted corner counts are NOT met -- the unsigned captures still produce a
# non-zero red where the rule forbids one. So the sampler declaration was not
# the addressing rule, and the mode is now deterministic, spec-clean and still
# wrong. What that bought is instruments: every earlier single-run score on
# these captures was noise, so the rule below has never actually been tested.
#
# PROJECT3D carries the SAME latent violation and was deliberately not folded
# in: it emits textureProj(), which has no cube form, so a cube sampler there
# trades a wrong result for one that does not build. It wants its own fix.
#
# THE RULE, now MEASURED against silicon rather than inferred: the fetched texel
# is a CORNER, picked by sign(dot_{i-2}) and sign(dot_{i-1}), and the third
# component selects nothing. A sign probe encoding the three dot signs as a
# colour, cross-tabulated against the GOLDEN's corner, is 100.0% pure on all
# eight sign classes across all six captures (at most 70 stray px in 56,909, on
# class boundaries), and the two sign(dot_3) rows of each pair agree exactly.
# (<0,<0)->R  (>=0,<0)->B  (<0,>=0)->W  (>=0,>=0)->G.
#
# THIS RESTORES THE ORIGINAL WORDING. An intermediate revision "corrected" it to
# the two PRODUCTS sign(z)*sign(x) and sign(y)*sign(x); that correction was
# WRONG. It assumed the corner arrives through the cube-face projection
# (s,t) = (-z/x,-y/x) and reasoned from the unsigned dotmaps reaching an edge
# pair rather than a diagonal pair -- sound GIVEN the projection, and the
# projection was never measured. Silicon reads two sign bits, not a projection
# of our vector. The arm built on the products reading regressed four captures.
# A separate finding that the residue is exactly sign(dot_3)>=0 is true of OUR
# formula's error surface, not of the rule. On a face, (s,t) = (-z/x, -y/x), so BOTH coordinates carry sign(x) and
# the selectors are the two PRODUCTS sign(z)*sign(x) and sign(y)*sign(x). The
# discriminator is the unsigned dotmaps: they reach exactly two corners, and
# those two are an EDGE pair sharing an s extreme on all three positive faces,
# never a diagonal pair -- and pinning sign(x) alone would flip s and t
# together and so give the diagonal. What is pinned is s, i.e. the product.
# No separate sign rule is needed: it is the ordinary cube-face projection of
# a direction that has lost its magnitude but kept its signs.
# Evidence: the goldens hold NO colour outside the four corners of a POSITIVE
# face, {#0000FF,#FF0000,#00FF00,#FFFFFF} (all three positive faces share that
# set, permuted, and the negatives share {#FF00FF,#000000,#FFFF00,#00FFFF}, so
# colour fixes the sign group and the corner but NOT which face -- an earlier
# revision of this entry said "+X-face corners", right about the set and
# over-specified about the face); the three unsigned dotmaps cannot flip
# sign(dot_{i-2}) and their #FF0000 count is exactly 0 over ~87k cube px; the
# regions are flat with smooth boundaries, a sign field of M_i.f(N) rather than
# a varying fetch; DotSTRCube_*, same coordinate and same texture, is within
# 130 px; and silicon's Bad2D is one flat #FFFF44 over all 56,909 px, one texel
# of 4,096.
# Predicted counts (B/R/G/W) a correct implementation must reproduce, CORRECTED
# -- every W in the earlier revision was inflated by the capture's own white
# title text, which sits in a 16px banner at y<45 and is not a cube texel at
# all. For the three unsigned dotmaps the whole W value was text. Counted over
# y>=45: 0to1 28114/0/28795/0, HiLo_1 28385/0/28524/0, HiLoHemi
# 28958/0/27951/0, -1to1 14446/14562/13723/14178, -1to1D3D
# 13093/13722/14832/15262, -1to1GL 14527/14457/13849/14076. R, B and G were
# never contaminated (white text on black cannot add to them) and are
# unchanged. Anyone scoring the old W targets was chasing glyphs.
#
# DEAD ENDS, so nobody re-derives them. The saturation mechanism is falsified
# by arithmetic: the dots are rows of the INVERSE composite, which carries the
# 640x480 viewport and a 0x00FFFFFF depth scale, so |dot1|,|dot2| <= 0.00299
# and |dot3| <= 9.4e-7 -- nothing saturates a [0,1] address from there. The
# "samplerCube moves zero captures" negative was noise against noise. There is
# no Bad2D regression from ad1caa07; that was variance. Two register facts read
# straight from the test source: tex_cubemap[3] is TRUE and dim_tex[3] is 2.
#
# WHY THE COORDINATE REACHES A CORNER, the question this was left on. One
# condition produces every measured fact: THE MAGNITUDE UNDERFLOWS AND THE SIGN
# SURVIVES. An 8-bit fixed-point fraction has a half-quantum of 0.0039, above
# all three bounds above, so on a dot path of eight or fewer fractional bits the
# triple arrives as exactly zero; #40 measured silicon resolving a degenerate
# cube direction to one face's (0,0) texel (f6609964), which explains a fixed
# positive face; and the two surviving sign bits select exactly the four corners
# the rule already names. That makes #51 and #40 one phenomenon from two
# directions. NOT established: the bit width (consistent with <=8 fractional
# bits, not read off silicon), WHICH positive face (colour cannot say, so a fix
# picking the wrong one would score identically), and whether the underflow hits
# the direction or the face coordinate. Nothing has been run; this is a reading
# of goldens on disk and it constrains a fix rather than being one.
#
# ARM RUN, PREDICTION FAILED. dot-str-3d-underflow-corner.json, registered
# 04:07Z before the arm existed, judged against it: the unsigned dotmaps reach
# FOUR corners where two were predicted, 0to1's counts are 3394/25471/8002/20042
# against 28114/0/28795/0, and the arm is better on 2 captures and worse on 4.
# Two of the four legs were tautologies -- "lands on a positive-face corner"
# and "no interior texel" are forced by the fix itself and could not fail; a
# falsifier your own change guarantees is not one. What the arm bought is a
# sharper defect: the corner confusion matrix is 80% recoverable by a FIXED
# PERMUTATION (chance is 25%), so the mechanism carries real information and
# the mapping is wrong. Each golden corner maps to a pair of ours differing in
# exactly one coordinate, so one bit tracks and one is spurious, and it is
# inverted; the golden pins s and varies t while we vary both. So: one product
# inverted, and the pinned coordinate driven from a sign that is noise here.
# The next attempt needs its own registration; this one is spent.
# docs/investigations/cubemap-is-dot-str-3d.md.
disposition = "defect"
suites = ["Texture cubemap", "Texture 2D as cubemap"]
status = "open"
status_note = "The DOT_STR_3D undefined behaviour was fixed (a8086d8905, a sampler2D declared against a cube image view) and two mechanisms were measured dead and reverted -- returning samplerCube when tex_cubemap[i] is set moved 0 captures, which is what establishes tex_cubemap[3] is false here, and a remapCubeTo2D fallback moved 0 here while breaking the sibling suite's DotSTR3D_Bad2D from exact by +59,142. The coordinate range this issue is titled on is unimplemented and no arm has judged anything on it. The thread carries none of the above: it has zero comments, and the #51 probe build's own measurements are recorded on #40 instead. AUDIT PASS 1 OVER THE UNFOLDED COMMITS, 2026-09-14, TWO MEDIUMS AGAINST THE FIX, both in glsl/psh.c and both to be remediated BEFORE the fold. M1 (psh.c:2376): 4a08abef66's DOT_STR_3D cube expression reads dotSTR%d.x/.y twenty lines AFTER apply_border_adjustment() has rewritten dotSTR%d -- and for a cubemap that call emits remapBorderCube, which reconstructs the direction with the major axis forced to +-1.0 rather than scaling in place. With a border enabled, the signs sampled are NOT the dot signs the measured rule is stated in. Remediation: snapshot the signs from the raw dot products before the call. M2 (psh.c:2381): the coordinate is now a four-valued step function handed to an implicit-LOD texture(). Its screen-space derivative is zero inside a sign region and ~2K across a boundary, so the fetch takes LOD 0 regardless of minification and the coarsest level on the straddling quad. Remediation: textureLod(..., 0.0), available in all three targets pgraph_glsl_append_version emits. M1 is UNREACHABLE by anything on the test disc, which is why an arm could not have found it. ALSO RECORDED, and not the lane's to settle: 45c8adb4f6 edited this issue's entry in nv2a_issues.toml directly, which AGENTS.md:228 bars a lane from doing. The CONTENT is correct -- the entry did assert the rule it retracts, three sentences after retracting it -- so nothing is being reverted; what needed deciding was how it lands, and the answer is that the orchestrator re-applies it. TERRITORY: glsl/psh.c was NEVER IN lane.remote's row. The audit assumed it was. It was lane.lows', then free, and is now lane.depth52z16's at wave 57 -- so the M1/M2 remediation and the psh.c fold both have to sequence behind that lane, not race it."

[issue.52]
title = "Depth buffer: four independent defects on eight cells, one fixed, and the compression axis is inert"
# Compression is provably not a variable: the Cn/Cy depth dumps are bit-identical
# on silicon AND here, 196/196, so the suite's 16 cells are 8. Those hold four
# unrelated defects -- Z16 fixed depth already exact (49/49); Z24 fixed off by
# exactly one unit, partly fixed in 5dac36b2 and still 87.7% one-sided upward;
# float Z structural (not one of F16's 469,927 channels is one-step); and a
# colour error that is NOT downstream of the depth error (the same 69,462
# channels in the same places in both fixed-point formats, even where the depth
# buffer beneath is bit-perfect). 28 captures, 270,650 channels, are scored
# against saturated goldens. Depth_buffer_fixed_function is a different and
# larger defect: same cell, error maxes at 9 units rather than 1.
disposition = "defect"
blocker_falsifier = "if 'the stalling test is NOT named, and any attribution would be the reader's' were false, the run's own artefacts would name it twice, independently -- and the retry cited as carrying 'seven such entries' would turn out to carry a different anomaly entirely."
blocker_tested = "REFUTED, three ways. (a) run1.log says 'The tail of captures1/ pgraph_progress_log.txt names the test it stopped on'; that file's last line is `Starting Depth buffer::DepthFmt_z24_Cy_FZn_Maaaaaf` with no Completed, and the run has 327 Starting against 326 Completed -- exactly ONE unmatched. (b) The capture set corroborates independently: Maaaaaf's two PNGs exist, Cy_FZn_Mc00003 has none, so the stall is bounded on both sides. (c) The retry carries ZERO such entries: depth52-cn has 196 Starting, 196 Completed, and ends 'Testing completed normally, closing log.' The 'seven' are seven NEGATIVE DURATIONS, which have a Completed line. PLUS A MECHANISM THE BLOCKER LACKS: progress_clock_52.py finds 19 negative per-test durations, 12 in depth52-A and 7 in depth52-cn, every one ~ -24.3 s (-24,175 to -24,344 ms) -- a repeating fixed-size BACKWARD JUMP of the guest's clock. WHAT THE INSTRUMENT CANNOT SEE: only 2 of the 773 progress logs on disk record per-test durations at all, and they are these two runs; the other 771 use a [n/m] progress format with no duration and COULD NOT have shown a negative one. So the rate is 2 of 2 logs that could show it, with no negative control -- enough to convict the two runs #52's arithmetic is built from, not yet evidence about the fleet. Medians 869/878 ms reproduce the blocker's 876/888, so the pace claim survives, but 'the Cn half SIDESTEPPED the stall' is refuted: it hit the same event seven times and finished anyway. Also, one run reached 654 of 680 Depth_buffer tests (96.2%) INCLUDING 262 Cy captures -- 26 tests are missing, not 'the Cy half'. The ordering limb (lane.lows holds glsl/psh.c) is TRUE and irrelevant: the blocker itself says psh.c stays untouched."
suites = ["Depth buffer"]
