D -- the subnormal-guard hypothesis was refuted before any edit (0 of 876 differing px has a zero exponent field), so there is no measured mechanism to change. CLOSED 2026-09-14. Every cell now has a disposition and none of them is open work. Cell 1 (z16 fixed) exact and explained rather than lucky. Cell 2 (z24 fixed) fixed and VERIFIED -- PRE-REGISTERED PASS on all 72 checks, 72,138 -> 43,690 px. Cell 3 (z16 float) is an ADVERSE FLOOR: ours is the exact floor on all 1,436 differing pixels and silicon is one ULP below, so exactness would take it to 2,040. Cell 4 (z24 float, 12,816 px) is a measured floor, priced and deliberately left. The 1,479,886 px of colour is #38's Gouraud interpolator and was never depth -- its histograms are byte-identical between the bit-exact z16 cell and the one-unit-out z24 one. The stall was Android minimising the app (ui/xemu.c:798-804) and not a depth defect; the ~-24.3 s clock jump is a guest-side 64-bit overflow at 2^64/1e9/733333333 = 25.1547 s; the 784-golden gap is disc composition, 65 missing tests rather than 26. NOTHING HERE IS WAITING ON A CODE CHANGE, which is the test for closing rather than the absence of residual pixels -- two of the four cells retain residuals and both are floors with the arithmetic to prove it."

