8% at widths >= 6 and 67.5738% -> 99.6563% over all widths (12,056 of those cuts held out at widths <= 5), coverage mismatch over 48 captures 72,181 px -> 908 px, ab_compare 59 better / 0 worse / 2 same, structural 247,934 -> 94,984. geom.c emit_line() now generates the footprint as real geometry -- the intersection of the minor-axis band with the slab between the two butt caps is a PARALLELOGRAM, so four vertices are exact rather than approximate, and the corner offset needs no major-axis branch because E denominator cancels a numerator that is max either way. THE VERDICT IS FAIL AND BOTH REASONS ARE ABOUT THE LEGS, NOT THE FIX. (1) L1 exact missed by two cuts, 8,853 of 8,890 -- and it is not a phase near-miss, because every registered rival sits at 93.8-99.3% while the ROUND-TO-NEAREST rows of the lane own pre-registered rival sweep read 99.5838% and 99.6563%, matching both measured populations to four decimals. The residual is the host rasteriser quantisation MODE, not our phase; the interval had been set from the truncating rows. (2) Eleven must_not_move captures moved, ALL BETTER and none worse: that leg was transcribed as bit-identical when its source criterion was must-not-REGRESS, and at w=1.0 a correct fix must move a non-axis-aligned line. WHAT REMAINS: the GL half (gl/shaders.c, lane.remote -- GL still uses glLineWidth and is untouched), the cap/join phase (~200 of the 908 residual px), and the overlap colour rule. THE REMAINING ORDERING MAY NOT BIND EITHER, read from the code 2026-09-14 and offered as a reading to check rather than a conclusion. Line width today is the API NATIVE line rasterisation on both backends -- gl/draw.c:442 and :448 call glLineWidth((pg->line_width / 8.0f) * surface_scale_factor) clamped to the device range, and vk/draw.c:3779 pgraph_vk_line_width() feeds the has_dynamic_line_width path at :2019. That IS the perpendicular rectangle the phase work measures at 47.8178% against silicon. grep finds no line_width anywhere in glsl/geom.c, so a correct extent is NEW geometry generation rather than an edit to an existing widening. Where that new code goes decides the territory, and for the half the oracle can actually score it is all unheld: glsl/geom.c is FREE, vk/draw.c is FREE (released from lane.stencil), and vk/shaders.c and vk/compile_worker.c are unlisted. gl/shaders.c and gl/draw.c are needed only to keep the GL renderer in step -- and the device lane is VULKAN, so every Line_width golden this issue is judged against is scored on the Vulkan path. AGENTS.md line 49 obliges building both Android and desktop; it does not oblige both renderers to gain a feature in the same commit. NOT ESTABLISHED: whether the widening is better done in the geometry shader or on the CPU before submission, and whether vk/compile_worker.c actually needs touching. If this reading holds, the Vulkan half is dispatchable NOW on unheld files and only the GL half needs lane.remote -- which is the natural owner for it anyway, since it holds the GL renderer as a capability. ORCHESTRATOR RE-RAN THE MEASUREMENT INDEPENDENTLY 2026-09-14 rather than inheriting it, because a 100.0000% is exactly the kind of number that should not be taken on report. Reproduced over the FULL population: 20,946 clean cuts, 100.0000% exact on BOTH endpoints, 0 wrong. Controls hold: 18,965 of 20,946 cuts are phase-discriminating (frac(E) != 0), split 10,534 ceil and 8,431 floor, so the corpus separates the two phases decisively and a zero there would have upheld the blocker; all 1,981 integer-E cuts give length - E = 0.0 exactly; zero impossible rows. Every rival loses on the same population -- tie-break closed 95.4359%, high-open 95.2831%, open 95.4407%, 1/32 truncate 99.4223%, 1/16 round-to-nearest 98.8828%, no sub-pixel truncation 98.5343%, perpendicular rectangle 73.9664%, beta=1 63.1004%, Bresenham 58.5983%. OBSTACLE (2) IS WITHDRAWN AS FALSE, 2026-09-13, offline from the goldens with no device and no build -- so the only thing still blocking