wn. SO THE LEG TO REGISTER IS AN EXACT ONE, NOT AN IN-BAND ABSOLUTE: docs/testing/predictions/line-extent-phase-exact.json, whose E1 is golden-constrained (line_extent_phase.py --vs-goldens compares arm B against SILICON, not against the model, so a patch cannot make it true by construction) and predicts 8,890 of 8,890 against 47.8178% for arm A today; a fix that widens correctly but gets the phase wrong scores 93.8-99.1%, not 100%, so the leg discriminates. STILL OPEN AND NOT SETTLED BY THIS: the CAP and JOIN phase -- 493 of the 495 residual px are ours-only and 98.8% lie within w/2 + 2 of a vertex, concentrated at the widest captures. Instrument docs/testing/line_extent_phase.py; write-up docs/investigations/line-extent-phase.md. ORDERING, UNCHANGED (was obstacle 1): CORRECTED 2026-09-13, lane.signfold RETIRED. geom.c is free, vk/shaders.c is unlisted, and vk/draw.c is free again -- it was briefly claimed for lane.stencil (#79) and released within the hour once check_territory.py showed that holding it walled #13, #43 and #59 at once. The ONLY file still held is gl/shaders.c, which is lane.remote's through gl/*.c, so what remains is one grant from one live lane rather than a four-file impossibility."

