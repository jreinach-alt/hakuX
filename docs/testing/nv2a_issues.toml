[issue.14]
title = "Blend precision (low priority)"
# Most of this was never the blend unit. The 105 #spot_ captures blit a 512x512
# A8R8G8B8 render target to screen through an A8B8G8R8 texture stage, and we
# skipped that decode: 81.8% of the residual on the 75 non-signed captures, and
# every MAX capture, which is byte-exact once the channel order is right.
# 30 of the 105 (SADD/SREVSUB) belong to #43.
# docs/investigations/surface-as-texture-decode.md.
#
# What is left is not a mapping. docs/testing/blend_model.py reproduces silicon
# on 18,000 of 18,000 sampled pixels with the ordinary factor definitions and
# round-to-nearest at each 8 bit store, so both blend tables are correct; the
# residual is one step, led by the ONE_MINUS_* factors, and is float32 against
# their fixed point. docs/investigations/blend-unit-model.md. Measured on
# lavapipe -- an Adreno capture set could move this to host-dependent.
disposition = "precision-floor"
suites = ["Blend tests"]

