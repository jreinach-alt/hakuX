[issue.38]
title = "One-step colour differences from hardware across many suites (rounding, interpolation, blending)"
suites = ["3D primitive", "Alpha func", "Attrib carryover", "Attrib float", "Attrib setter", "Context switch", "Image blit", "Lighting normals", "Point size", "Surface clip", "Texgen with texture matrix"]
disposition = "defect"
blocker_falsifier = "if the two surviving selectors ('immediate // w=1 // width>=512' and 'immediate // w=1 // SET_VERTEX4F') were separable by data already on disk, some existing capture would be either a WIDE 3F class member or a NARROW 4F member with an x gradient."
blocker_tested = "confirmed, re-ran pair_fill_blocks_38.py. 15 block readings over 3 Fill captures, largest |E-O| = 0.0280 against positive controls +0.9766 and +0.7890 and a negative control of +0.0000. Every Fill block is BOTH narrow (<=105 px) AND 3F, so the two survivors are exactly confounded in this evidence. The earlier blocker ('five captures') is already withdrawn as false; what remains is TWO captures."
status = "fixed-part"
status_note = "Mechanism 1 is decided, implemented and confirmed by slope rather than by position: silicon quantises the vertex colour to its byte BEFORE the interpolator (colorPrecision in glsl/vsh.c plus dca3c94b98), and arm ff1604d457 -> dca3c94b98 is PRE-REGISTERED with the green band's slope moving 2.53 -> 3.01 against a hardware 3.00, 169 better 10 worse, -489,757 px. It reads FAIL because three must-not-move captures moved, all three BETTER and two of them to zero. Mechanism 2 is measured and NOT implemented: hardware holds the fragment colour constant across an even-aligned pixel pair and evaluates it at the pair's right edge, s = 2*floor(x/2)+2, 0 wrong of 512 on both Alpha_func bands with two out-of-sample confirmations, but only 3 of 1,162 measurable captures are paired and what selects those draws is unestablished -- the conjunction that fits is fitted to two positives. Mechanism 3 (Image_blit, -0.70 bias over 515,562 one-step px) is untouched and is its own lead; mechanism 4 is #16's. The 201 one-step-symmetric captures are a measured precision floor: two independent hosts agree to a tenth of a percent on the one-step share. MECHANISM 3 IS SOLVED, 2026-09-14 by lane.blit38, WITH ZERO DEVICE TIME -- the answer was on disk, in the goldens. perform_blit's BLEND_AND path forms V = src*beta + dst*(0x7f80 - beta) and must divide by max_beta_mult = 0x7f80 = 32,640. Both paths divide by something else, in the same direction: the NEON aarch64 path -- the DEVICE path -- substituted >> 15 with a comment claiming 'Error is < 1 LSB for typical values', and 32,768 is 0.39% LARGER than 32,640, so it can only ever land LOW; the scalar path (the width tail, and all of desktop) truncates where silicon rounds to nearest. THAT IS WHY IT SURVIVED THE CORRECTION THAT KILLED THE CORPUS-WIDE THEORY: a rounding MODE difference is roughly symmetric, which is what the corpus turned out to be. A SCALE ERROR HAS A SIGN. AND THE -0.70 WAS UNDERSTATED BECAUSE IT WAS STALE: score_cv_blit predates #33's swizzle fix and the clip fix, so its one-step population was diluted by BlitBeyondWidth's structural residual and seven broken clip captures. Re-measured at c866527e03: ours+1 = 0, ours-1 = 234,506, |d|>1 = 0, alpha = 0. Not -0.70. MINUS ONE POINT ZERO ZERO, NO EXCEPTIONS. THE MODEL WAS DERIVED AND NOT FITTED, because the suite hands you its own inputs: the four beta==0 captures are bit-exact and therefore ARE the blit's destination, and the three SRCCOPY captures are a memmove and therefore ARE its source, so every BLEND_AND golden is predictable offline. Against hardware: truncating /0x7f80 = 173,410 px, round-to-nearest /0x7f80 = 1,830, shipped >>15 = 112,389. Against our captures the same three read 175,561 / 112,389 / 1,830. THE TWO 1,830s ARE THE SAME CHANNELS, 100% OVERLAPPING, confined to rows 75-90, which is the guest's own label text -- the one thing the reconstructed source gets wrong. That identity is the control: were either model wrong the two residuals would differ. Replicated independently on Z8R8G8B8 from its own beta==0 and SRCCOPY captures, agreeing TO THE DIGIT in all six cells. THE FIX WAS VERIFIED BEFORE THE DEVICE SAW IT: 0x7f80 == 255 << 7, so the helper shifts the 128 out and divides the sub-2^16 remainder by 255 exactly as (W * 0x8081) >> 23. Compiled for aarch64 with NDK clang and run as REAL INSTRUCTIONS under qemu-aarch64 over all 2^24 (src, dst, beta) triples: 0 mismatches, with the old form re-measured at 8,388,608 low / 0 high -- the exact sign signature the suite shows. WHAT THE INSTRUMENT CANNOT SEE: no triple in the whole 2^24 domain is an exact half-tie, so this data cannot distinguish round-half-up from round-half-even. 'Round to nearest' is all that is established. A NEGATIVE WORTH KEEPING: pgraph.c's beta mask (& 0x7f800000, clamp negatives) is ALREADY CORRECT -- checked golden-against-golden on six parameter pairs that must collapse to the same beta, 0 differing pixels in the blit rect on all six, and NO EDIT WAS MADE. Worth doing BEFORE trusting the divide fix: a wrong mask would have made the blend take the wrong input, and the divide correction would then have been a plausible-looking fix for a different defect. Four of those six pairs read as real disagreements at 220-314 px if read whole-frame, and all of it is the guest's label text."
blocked_on = "THE OLD BLOCKER IS WITHDRAWN AS FALSE, 2026-09-13, offline from the goldens with no device and no build. It said mechanism 2 needs FIVE new captures; THREE of the five are answered by data already on disk and TWO remain. Instruments docs/testing/pair_fill_blocks_38.py and docs/testing/pair_y_group_38.py, both runnable with no arguments and both re-running their controls every time; write-up docs/investigations/issue38-mech2-blocker-audit.md. WHY THE CORPUS LOOKED EMPTY, and it is the #13 shape exactly -- the two instruments that decided membership were each blind in a way that maps onto the conjunct under test. pair_rule_candidates.py decided 'has a per-vertex colour gradient' by counting distinct TEXTUAL SetDiffuse arguments, so a palette walked in a loop reads as one colour; a loop-aware re-scan of all 100 sources finds 14 candidate sources against 7. And interpolator_phase.py judges a row only where >= 50 qualifying positions exist at each parity among pixels whose neighbours differ by <= 4 per channel, which is a WIDTH FLOOR OF ROUGHLY 200 PX -- i.e. the 'one large primitive' conjunct itself -- plus a ban on steep gradients, which small draws necessarily have. A 60-px draw could not be reported as paired by it even if it were. The census was recording a rate over a population it selected with the hypothesis. THE NEW EVIDENCE: Line_width/Fill_0000.0, Fill_0001.0 and Fill_0032.0 are FILLED polygons rather than the wireframe the other 58 captures in that suite draw (line_width_tests.cpp runs its whole shape set a third time with fill = true), and each carries five blocks that are full class members -- PassthroughVertexShader, SetDiffuse per vertex inside one Begin/End, SetVertex(x, y, 1.0f). Widths 60 to 105 px, primitives TRIANGLES, QUAD_STRIP, TRIANGLE_FAN, POLYGON and QUADS, 949-3,836 qualifying even positions per block, and LINE_WIDTH does not affect a filled polygon so the three captures are a built-in replicate. EVERY ONE IS UNPAIRED: largest |E - O| = 0.0280 over the fifteen readings, against positive controls +0.9766 (Alpha_func) and +0.7890 (Context_switch/GRZero) and a negative control of +0.0000 (High_vertex_count). A second statistic sharing nothing but the image agrees -- x-step parity skew 0.500-0.512 on every Fill block, against 1.000 on the Alpha_func band and 0.591 on the known-unpaired control, so the Fill blocks are FLATTER than the negative control. Note the direction, which is what makes it evidence: the earlier lane hunted for a narrow or triangle draw that PAIRS; these are narrow and triangle draws that DO NOT, which is what eliminates the candidates predicting they would. SO THE FOUR-WAY TIE IS NOW TWO-WAY: 'immediate /\\ w=1' and 'immediate /\\ w=1 /\\ (QUADS or POLYGON)' are REFUTED, because the Fill blocks satisfy both and do not pair; 'immediate /\\ w=1 /\\ width >= 512' and 'immediate /\\ w=1 /\\ SET_VERTEX4F' survive. AND CAPTURE 4 IS ANSWERED: THE GROUP IS 2x1, not 2x2. Stated before the number -- 2x2 would put every y step at one parity and read skew 1.000. Measured on Context_switch/GRZero, which both prior lanes accept as paired and which carries a genuine 2-D gradient: y-step skew 0.501-0.511 over 129,299 steps, corroborated at 0.503 over 388,835 steps on Attrib_float, while the x control on Alpha_func reads EXACTLY 1.000 over 50,662 steps (0 even, 50,662 odd) and GRZero's own x steps skew 0.793-0.886 in the same run. The instrument sees a 2-px group in x and does not see one in y on a class member. Attrib_float is the class's missing third member -- PassthroughVertexShader, explicit w=1, PRIMITIVE_QUADS, immediate mode, four vertex colours -- missed only because its colour is set in a loop, and previously discounted as 'an RGB ramp on an unpaired draw'. WHAT REMAINS IS TWO CAPTURES, NOT FIVE: (a) the Alpha_func band at its full 512 px submitted through SET_VERTEX3F, OR equivalently the same band narrowed to 128 px and left on SET_VERTEX4F -- either one alone separates the two survivors, which are exactly confounded today because every narrow class member is 3F, and the only narrow 4F member -- Attrib_float at 51 px, checked empirically -- has a y-ONLY gradient, so x-pairing is not observable on it at all; and (b) a base quad with a second y-gradient, for the period-3 breakdown on GRZero's second fan triangle, which nothing here touches. A FAILED INSTRUMENT IS REPORTED AS FAILED AND NOTHING RESTS ON IT: the plan was a widened whole-corpus census over all 5,608 goldens, and it does not work at whole-frame scope. Three successive filter versions were wrong and every one printed a clean-looking total -- v1 called all 1,673 Blend_tests captures paired because a lone hard edge is monotone and swatch grids share a parity, manufacturing E >> O from geometry containing no interpolant; v2 fixed the edges, silently excluded every between-pair position of a perfectly pair-constant field, dropped Alpha_func to zero measurable captures, and still printed a plausible '0 paired' that only the explicit control line caught; v3 restored the control and produced 1,309 captures at the impossible E == O == 1.000. pair_census_38.py now prints THE CENSUS IS VOID AT THIS SCOPE and refuses its own summary above a 2% impossible-row rate. The Fill discovery came from READING THE SOURCES, not from the census. NOT ESTABLISHED: which of width or register is the selector (perfectly confounded; one capture decides it, none here does); the period-3 breakdown; that a wide 3F draw WOULD pair (the register is un-eliminated, not supported); that Attrib_float's pointer overload actually emits SET_VERTEX4F (TestHost::SetVertex(const float *) lives in an unvendored dependency, so the register is inferred -- nothing above depends on it); anything about our own captures (goldens only, so bc4bebcee0 cannot reach it); and that there is no FOURTH class member -- the widened census was meant to settle that and failed, so the enumeration rests on a regex source scan that decides the shader conjunct at file scope rather than per Begin/End block. Line_width/Fill_* is what assuming otherwise costs. ORIGINAL FOLLOWS. mechanism 2 needs five new captures (one property varied at a time off the Alpha_func band) that do not exist upstream -- behind the test-suite fork"

[issue.39]
title = "Vulkan: a draw's result is intermittently lost, same disc and binary, run to run"
suites = ["Texture render target", "Texture format", "Stencil", "Depth buffer fixed function"]
