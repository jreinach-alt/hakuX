[issue.63]
title = "NV_PGRAPH_CTX_SWITCH1 GRCLASS=0 is never observed: two method fast paths test a stale cached class"
# MEASURED 2026-09-12 at 0f708c8d33, 171,820 px, 2 runs byte-identical, RGBA
# (max delta A is 64, so an RGB comparison reads this as a colour residual).
#
# Split out of #58 and explicitly NOT #19: #19's population is tests rendering a
# SIBLING's image, and this suite has exactly one test, so no substitution is
# available to it.
#
# The test writes NV_PGRAPH_CTX_SWITCH1 GRCLASS=0 mid-POLYGON and restores it.
# Hardware stops accepting methods; we do not. Three independent predictions,
# all confirmed in the one capture: the polygon's lower half is UNDRAWN on
# silicon (golden is checkerboard on 100.00% of 98,304 px = 192x512 exactly,
# ours on 0.00%), and the following triangle takes the last diffuse set BEFORE
# the disable on silicon against the last set overall for us (3,072 px, gold
# modal (73,90,140,198) x1560 and (67,85,135,198) x1512 against ours
# (208,189,93,207) x1560 and (204,184,89,207) x1512 -- identical counts, so the
# same geometry with a different vertex colour).
#
# Located: pgraph_write()'s default case DOES write the register (~line 987).
# But pgraph_method()'s two fast paths -- the XEMU_OPT_METHOD_FAST_TABLE block
# (~1777) and the Kelvin fast entry (~1843) -- both gate on
# pg->cached_graphics_class == NV_KELVIN_PRIMITIVE and return before line ~1895,
# which is the only place that value is refreshed from CTX_SWITCH1. Subchannel
# unchanged means no reload from CTX_CACHE1 either, so the guest's write is
# never seen.
#
# Fix shape: have pgraph_write() update pg->cached_graphics_class when addr ==
# NV_PGRAPH_CTX_SWITCH1; both fast paths then drop through to the slow path,
# which reads GRCLASS 0 and falls to `default: goto unhandled`. Do NOT use
# pg->last_subchannel = UINT_MAX instead -- that reloads from CTX_CACHE1 and
# overwrites the guest's 0 with 0x97, undoing the write being emulated.
# docs/investigations/issue-19-58-at-tip-2026-09-12.md.
disposition = "defect"
suites = ["Context switch"]
status = "fixed-verified"
status_note = "pgraph_write now refreshes pg->cached_graphics_class when the guest writes NV_PGRAPH_CTX_SWITCH1 (2b75e723af, pgraph.c:1016), so both method fast paths fall through to the slow path and GRCLASS 0 lands on default: goto unhandled. Arm 1d4794ac63 -> 2b75e723af is PRE-REGISTERED PASS on all 249 checks: 171,820 -> 70,444 px, the lower-half region (98,304 px, rows 240-431 x cols 64-575) goes 0.00% -> 100.00% bare checkerboard, and the following triangle's modal colours move to the golden's at matching counts. Blend_tests (105 captures) and Depth_buffer (144) were carried as corpus-wide canaries because the cached class is read by every method dispatch, and both are byte-identical. z-after-018-Context_switch reproduces 70,444 independently at ref 2501f35211. The residual is #38 mechanism 2, not this register."

