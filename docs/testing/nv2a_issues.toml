# The first two entries about guest-visible TIMING rather than pixels. Both
# carry `no_suites` for the same reason: nothing in a framebuffer records when
# it was produced, so the whole corpus is bit-identical whatever the refresh
# rate is. Measured with the VBLANK instrument in hw/xbox/nv2a/nv2a.c, read by
# docs/testing/vblank_report.py. Write-up in
# docs/investigations/guest-visible-vblank.md.
# ---------------------------------------------------------------------------

[issue.64]
# nv2a_calc_vblank_period_ns (hw/xbox/nv2a/nv2a.c:234-242) derives nothing: one
# branch on one flat-panel register, two constants, both from 7aae57b77d
# ("fps stabilization") with no source for either.
#
# LARGE: the guard contradicts the comment under it. The comment says the
# 59.94 Hz branch covers 480i, 480p, 720p and 1080i. `vdisplay > 480` sends
# 720p and 1080i to the 50 Hz branch, because a display-end register holds
# height-1 and both 719 and 1079 exceed 480. That is a 19.9% period error.
# 1080i is a live path -- vk/display.c:1723 and gl/display.c:442 both handle
# it. The minimal correct guard is bounded (PAL is 576 lines and never more).
#
# SMALL: 16683750 ns is not 59.94 Hz. NTSC's field rate is 60000/1001, so the
# period is 16683333 ns. +417 ns, +25.0 ppm, 0.09 s of drift per hour of play.
# One character. It also retires a larger worry: the 60.00 Hz this stream was
# opened to check for would have been 40x this.
#
# MEASURED 2026-09-12, Galleon 240 s on the Thor at 19f52510d9 (dispatch
# 1789275041-vblank-timing-4013526): vd=479 res=640x480 in all 129 windows, so
# a 480-line title takes the NTSC branch as intended. The HD half is a source
# reading and not an observation; no title on hand reaches those modes.
#
# LARGE HALF FIXED 2026-09-13, e5e91de344 as dispatched (pre-rebase sha, the
# same convention #65's ed5df55ccc uses). The guard is bounded and scales for
# interlace first: 50 Hz for 481..576 lines and nothing above, with the raster
# doubled when cr[0x39] says interlaced, because the NV2A interlaces only for
# 1080i (vk/display.c:1723 and gl/display.c:442 read that bit for exactly that
# purpose) and the raster is then one field. The scaling is what makes the
# bound safe: a bare bound would send a per-field 1080i raster of 539 lines to
# 50 Hz, re-creating the bug at a different value, and it also fixes the
# mirror-image error on an interlaced PAL raster. 480i/480p/576i/576p are
# unchanged; the measured NTSC path (vd=479 il=ff) returns the same
# 16,683,750 ns by the same arithmetic, which is the control.
#
# THE DERIVATION IS CLOSED 2026-09-13, AND THE ANSWER IS THAT THERE ISN'T ONE.
# Two arms, Galleon, refs cdc3a4b4d8 and 6eddbdbff5, dispatch results
# 1789278960-vblank-period-1231801 and 1789279332-vblank-period-1362112.
# Predictions registered first at docs/testing/predictions/
# vblank-period-fp-raster.json and vblank-period-pll-calibration.json.
#
#  1. THE FLAT-PANEL RASTER, the other timing generator in the chip and the
#     only one that counts in pixels rather than 8-dot characters. FP_VTOTAL
#     (0x804) and FP_HTOTAL (0x824) were never modelled -- the writes fell
#     through pramdac.c's switch -- and are now. The guest DOES program them:
#     fp_vtotal=524 fp_htotal=775, so 525 lines x 776 px, with 480 active and
#     45 blanking lines, which is the NTSC frame raster exactly. The
#     convention is total-1, confirmed in band (hde=hvalid=639 for a 640-wide
#     mode). derived_fp = 13,104,000 ns, -21.5%. Fails too.
#  2. THE PLL DECODE IS NOT THE PROBLEM. NVPLL is the same formula on the same
#     crystal and its right answer comes from outside this tree: nvpll=
#     00011c01 (m=1 n=28 p=1) decodes to 233,333,324 Hz and the NV2A core runs
#     at 233 MHz. Seven digits, on a register nothing in this stream could
#     have tuned. So 31,089,742 Hz is the pixel clock the guest asked for.
#     (MPLL reads 0 -- never programmed -- so it calibrates nothing.)
#  3. AND THE ARITHMETIC WAS ALREADY DECISIVE. At that clock a 59.94 Hz frame
#     of 525 lines needs a horizontal total of 987.96 px = 123.495 characters,
#     which the VGA register cannot hold whatever extension bits we have not
#     decoded, since extension bits add whole characters and halving the clock
#     preserves the fractional part. Repairing the clock instead needs
#     22,909,091 Hz (CRTC raster) or 24,419,600 Hz (FP raster) -- this VCO over
#     10.86 and 10.19, neither a power of two, so neither a PDIV misread.
#
# So both rasters the chip holds run at the wrong rate on the clock the guest
# programmed: 728x525 gives 81.34 Hz and 776x525 gives 76.31 Hz against the
# 59.94 the display runs at. THE NV2A IS NOT THE TIMING MASTER. The Xbox drives
# an external video encoder and the rate is the encoder's; this tree models it
# as hw/xbox/smbus_cx25871.c, 256 bytes of registers the guest writes and
# nothing has ever read. That is where the video standard is, and reaching it
# from nv2a.c is cross-device plumbing rather than a decode.
#
# WHAT THE REGISTER FILE DOES SAY AUTHORITATIVELY is the standard's own name:
# fp_vtotal+1 is 525 for NTSC and would be 625 for PAL, 750 for 720p, 1125 for
# 1080i. The total raster IS the standard, where an active-line count needs a
# bound and an interlace correction to become one. If PAL or HD material ever
# arrives, keying the table on the total is the shape of the fix and it drops
# the interlace scaling with it. It is still a table, which is why it was not
# worth a second unmeasured mechanism in the same function today.
#
# THE COST LEG IS INCONCLUSIVE, AND ITS NOISE FLOOR IS NOW MEASURED AT 8
# POINTS. Median gfps over a Galleon soak read 29 / 16 / 16 / 21 across four
# 240 s runs alternating the two refs (1789278960, 1789279332, 1789279639,
# 1789279912), including 29 -> 21 on the SAME binary 25 minutes apart. The
# median is the wrong statistic: the series is bimodal, a ceiling at 29-31 and
# a floor at 5-20, so the median tracks the occupancy of the two modes. The
# ceiling, which is what a per-frame cost would move, does not move -- p90 is
# 29/29/27/29 and the max 31/29/30/29 on both refs in both orders. What moved
# is how much of each run sat at the ceiling: 80% in the evening's first run
# and 16-32% in the three after it, on a handheld serving a corpus sweep.
#
# STILL OPEN: the +25 ppm. One character, deliberately not changed in the same
# arm as the guard, because it would have made the must-not-move leg (the NTSC
# path returning the same constant) unreadable.
#
# THE ORIGINAL PROPOSAL, MEASURED OUT. Deriving the period as
# vtotal * htotal / pixel clock, the way the NV2A does, was registered as a
# falsifier before the soak -- "within 1% of 16683333 ns" -- and FAILED:
#
#   vblmode want=16683750 derived=12293443
#     (vtotal=525 htotal=728 pixclk=31089742 vpll=0003c20d m=13 n=194 p=3)
#     cr00=56 cr06=0b cr07=3e cr25=10 cr2d=00 msr=e3
#
# -26.3%. vtotal=525 is right and cr25 carries no vertical extension bit, so
# that half is sound. The three candidates it left -- htotal, the VPLL decode,
# and the premise -- are all settled above: it is the premise.
title = "VBLANK period is two constants and a guard that contradicted its own comment: the guard is fixed, the derivation that would have retired both constants is measured out, and 25 ppm is left"
disposition = "defect"
suites = []
no_suites = "A wrong VBLANK period changes when a title steps its simulation and nothing else. Every golden in the corpus is bit-identical either way, so naming a suite would put this on a scoreboard column that can never move -- and the next reader would take a clean column for a fix."

[issue.65]
# MEASURED 2026-09-12. Galleon, 240 s, Thor, ref 19f52510d9, dispatch result
# 1789275041-vblank-timing-4013526. 14,653 VBLANK assertions in 129 two-second
# windows, split by how many went through the adaptive deferral:
#
#   no deferral      36 windows   16,712,711 ns mean   59.844 Hz   p99 16.85 ms
#   1-20 defers      48 windows   17,198,838 ns mean   58.186 Hz   p99 25.05 ms
#   >20 defers       45 windows   19,159,610 ns mean   52.285 Hz   p99 25.50 ms
#   whole soak      129 windows   17,747,165 ns mean   56.587 Hz   max 61.90 ms
#
# against an intended 16,683,750 ns / 59.939 Hz.
#
# THE PERIOD IS GOOD. With deferral off, the mean is 0.17% high and p99 is
# within 1%: correct to about 29 us in the mean and 170 us at p99. That closes
# a class of suspicion that had no evidence either way.
#
# THE DEFERRAL MACHINERY IS NOT. It takes the delivered rate 5.6% below what
# we intend across the soak and 12.8% below it in heavy scenes -- 3.8 seconds
# lost per minute of play for anything counting VBLANKs to measure time, 8.9
# s/min in a heavy scene. One-sided: every path either advances by a period or
# resets to now+period and a QEMU timer never fires early, so it only ever
# loses. And it is gated on d->flip_active, so the rate of the clock a title
# times against is modulated by what that title is drawing.
#
# A MEAN CANNOT SEE ANY OF THIS. The distribution is a very sharp mode at the
# right period plus a long right tail: p50 16.70 ms, p99 25.1 ms, worst window
# 28.7 ms, extreme 61.9 ms. The existing `J` figure is an exponential mean of
# |delta - period| and reads 0.0-2.8 ms; it cannot tell a 0.25 ms symmetric
# jitter from a mode accurate to 0.1% with a 28 ms tail.
#
# MECHANISM, one token: `if (was_deferred || unlocked)` restarts the phase
# grid from where the late VBLANK landed instead of advancing it from where
# the last one was scheduled. The else branch is already self-correcting --
# the 7,090,520 ns intervals in the measurement are the grid catching up after
# a late callback, not a fault -- and that is exactly the correction the
# deferred branch throws away. Fix at ed5df55ccc, prediction registered and
# committed first at bace14275d.
#
# THREE MORE FROM THE SAME READING:
#  1. `unlocked` abandons the grid on EVERY VBLANK, not just deferred ones, so
#     timer lateness compounds. unlock_framerate defaults TRUE and the mode is
#     entered above ~40 fps, so the titles that look healthiest run with no
#     grid. UNMEASURED: Galleon never enters it (Ul:N on all 129 windows).
#     Needs a fast title.
#  2. simple_vblank runs two sources at once -- the period timer and
#     nv2a_vga_gfx_update on every host display refresh (ui/xemu.c:2217), so
#     150-180 assertions a second on a 90-120 Hz handheld. Also:
#     s_last_vblank_fire_ns is written only on the adaptive path, so `J` reads
#     0.0 in simple mode because it was never written. The 0.0 ms in the
#     simple_vblank row of frame-pacing-and-parallelism.md is that artefact.
#  3. PCRTC coalesces (pcrtc.c:58 is the only clear, and it is the guest's own
#     write), so an assertion arriving before the ISR acknowledges the last is
#     a tick the guest never sees. 229 of 14,653, 1.56%, rising to 2.25% in
#     the 1-20 defer windows.
#
# FIX MEASURED AND IT HOLDS, 2026-09-12. Arm B at ed5df55ccc, dispatch result
# 1789275582-vblank-grid-B-4057320, same title/duration/device, binary
# 9fcf8ecc4642 against arm A's 38402524d163. Prediction committed first at
# bace14275d; read with docs/testing/vblank_ab.py.
#
#   regime            A mean / rate            B mean / rate
#   def==0 (control)  16,712,711 / 59.844 Hz   16,718,178 / 59.825 Hz
#   def 1-20          17,198,838 / 58.186 Hz   16,759,454 / 59.681 Hz
#   def>20            19,159,610 / 52.285 Hz   16,701,985 / 59.884 Hz
#   whole soak        17,747,165 / 56.587 Hz   16,721,058 / 59.816 Hz
#
# Five of five legs hold, INCLUDING B4, the cost leg the old comment predicted
# would fail: median gfps 29.0 -> 29.0, unchanged, while deferrals per window
# nearly doubled (15.8 -> 28.2) exactly as B5 predicted. The cascade the
# comment feared does not happen on this title. Against the real NTSC
# standard the guest's VBLANK clock goes from losing 3.83 s per minute of play
# to 0.136 s, and in heavy scenes from 8.91 s/min to 0.067.
#
# p99 is deliberately UNCHANGED (25.10 -> 25.15 ms). Individual VBLANKs are
# still late; the deferral still distorts phase within a frame. It no longer
# steals time, because the short interval after gives it back. Phase and rate
# are different properties and only the second is fixed -- phase stays open,
# and FLIP_STALL firing a deferred VBLANK via timer_mod(now) (pgraph.c:2324)
# inverts the causality outright: on hardware VBLANK is on a grid and the flip
# latches at the next one; here the flip can pull the VBLANK to itself.
#
# Limits: one run per arm, one title, one device (Thor), locked grid only.
#
# NOT A DEFECT HERE: PCRTC_RASTER advances once per READ (pcrtc.c:39) where
# silicon advances it per scanline. Counted, because whether it matters
# depends on whether anything reads it: rast=0/0 across the whole soak.
# Latent, no demonstrated symptom, wants counting on more titles first.
title = "Guest-visible VBLANK: the period is right to 0.17%, the deferral machinery takes the delivered rate 5.6% below it and never gives it back"
disposition = "defect"
suites = []
no_suites = "Nothing in a framebuffer records when it was produced. A title steps its simulation off VBLANK and draws the same pixels at the wrong rate, so the corpus is blind to every part of this."
status = "fixed-part"
status_note = "The rate half landed (0edf4f2f0d, one token at nv2a.c:845) and all five registered legs hold on re-judging: def>20 mean 19,159,610 -> 16,701,985 ns, whole-soak 56.587 -> 59.816 Hz, the def==0 control moved 5,467 ns, gfps median unchanged at 29.0, defers per window 15.8 -> 28.2. This is NOT an ab_compare verdict and cannot be -- a soak writes no captures, result.json records runs: 0, and ab_compare would refuse the arms -- it is vblank_ab.py against a prediction bound by commit date, which catches a prediction written late but not one widened on time, and it is one run per arm against the runs>=2 rule. Four defects remain: phase (p99 25.15 ms, and FLIP_STALL's timer_mod(now) lets the flip pull the VBLANK to itself), unlock_framerate still abandoning the grid and defaulting true so that half is unmeasured, simple_vblank running two VBLANK sources at 150-180 assertions/s, and PCRTC coalescing at 1.35-1.56%. The HD 50 Hz guard split to #64 and is closed."

