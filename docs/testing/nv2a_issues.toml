[issue.59]
title = "Surface pad bits are WRITTEN by the raster, not read by the texture unit: #48's read-side swizzle is exact on rendered pixels and wrong on the rest"
suites = ["Surface clip", "Texture format", "Blend surface", "Surface format"]
disposition = "defect"
blocker_falsifier = "if 'nothing in this tree yet reports whether the Adreno part advertises dualSrcBlend, and adding the query IS the next step' were false, a dualSrcBlend query would already be in the tree AND its line would already be sitting in a logcat on disk."
blocker_tested = "REFUTED -- premise true, conclusion false, which is why it stood. dualSrcBlend genuinely is NOT among the nine desired_features entries; it does not need to be. The query exists at vk/instance.c:870-900 -- a query-only block deliberately outside desired_features, tagged '#59'. And it HAS RUN: four logcats dated 2026-09-13 print 'vk dualSrcBlend: available (query only, #59)' -- results/1789363856-readfreq54-3543065, -3543112, and both logcats of -3543180. dualSrcBlend is AVAILABLE on the Adreno part, so the write side IS reachable on this renderer and the fix is psh.c + draw.c + instance.c. This is the #54-counter shape and the same lane: the instrument existed, ran, and nobody read it. Ordering: lane.lows genuinely holds all three files at wave 40, so the ORDERING limb stands; the lane.remediate1 limb is refuted (no such lane)."
status = "fixed-part"
status_note = "WRITE SIDE MEASURED 2026-09-14, THREE PRE-REGISTERED ARMS, AND THE FOUR-FILE WALL IS REFUTED. The model is confirmed and the SITE was wrong. Arm 1 (23be8223f5 -> 4381fae5f6) stamped the format's pad constant as fragColor.a in glsl/psh.c, forced the alpha blend to ONE/ZERO/ADD in vk/draw.c and deleted #48's readback swizzle from vk/texture.c: PRE-REGISTERED FAIL, 10 of 142 checks. It CONFIRMED the model -- Surface_format/Fmt_X8R8G8B8_O8R8G8B8 59,183 -> 32,766, the whole 26,417 being the outside-quad background the raster never touches, which no read-side scoping can reach -- and it broke every draw that blends on source alpha, because VK_BLEND_FACTOR_SRC_ALPHA and ONE_MINUS_SRC_ALPHA READ THE SAME fragColor.a. The failure set has no exceptions: moved = {format has pad bits} AND {colour blend factor is SRC_ALPHA}. Blend surface has sixteen Add_SrcA_* captures, eight formats by two configs, and exactly the four pad formats moved, four from bit-exact; its sixteen DstAlpha_* captures, which never reference source alpha, all held; Surface_clip, Texture_DXT, Texture_format and Texture_render_target moved 0 of 143. Pixel-level confirmation on Surface format's SRC_ALPHA-blended quads over a memset-zero background: Z stamps As=0 so the black destination survives, golden (255,0,0) against ours (0,0,0); O stamps As=1 so the source is written unblended, golden (127,0,0) against ours (255,0,0). NOT FIXABLE BY REORDERING -- result.a is a linear combination of As and Ad, so a constant 1 is NOT EXPRESSIBLE in the fixed-function blend (a constant 0 is, as ZERO/ZERO). The route is DUAL-SOURCE BLENDING: write the combiner alpha to location 0 index 1 and substitute SRC1_ALPHA/ONE_MINUS_SRC1_ALPHA for the guest's SRC_ALPHA factors. It needs the dualSrcBlend device feature and vk/instance.c's desired_features table does not request or even report it -- one line and one boot to find out, not an arm. THE CLEAR HALF IS SETTLED AND SEPARABLE. The investigation's one open question -- does CLEAR_SURFACE stamp the constant or memset the clear value -- is answered by Clear:: TestSurfaceFmt, which clears a 128x128 surface to six colours, draws only a 4x4 mark and samples it all back with alpha from TEX0. Goldens: the 4-byte O/Z pair differs on 98,342 px with RGB BIT-IDENTICAL and alpha 255 against 0; the 1555 pair on 49,274 px of exactly +128 in the pad-bit byte; the same constant for all six arbitrary clear colours, which refutes the memset reading. Our own baseline said so too: Clear/SFC_X1R5G5B5_Z1R5G5B5 carried 49,152 px decomposing as R 48, G 49,152 at max delta exactly 128, B 48, A 49,104, while its O twin was bit-exact -- because pgraph_get_clear_color hands EVERY pad format alpha 1.0, the O constant by coincidence. Arm 2 (-> 1f9eac66c4) took that capture 49,152 -> 48 with the O twin holding. Arm 3 (-> 55de5edfff) is the clear substitution ALONE, with #48's readback restored and the shader untouched. R5G6B5 EXPANSION REMAINS LANDED AND UNAFFECTED (5e612529b9 -> 0b7e5de8dd, 106 checks, Surface_clip 1,175,741 -> 0; then 00dc9c68c5 -> a3eddc0214, 171 checks). Surface_clip stayed 0 on all 47 in every arm here. ARM 3 SEPARATES THE CLEAR FROM THE READBACK, AND ITS FLAT A/B HID A WORKING FIX. Arm 3 (-> 55de5edfff) is the clear substitution ALONE, with #48's readback restored and the shader untouched: PRE-REGISTERED FAIL on 1 of 193 checks, with ab_compare reading 0 better, 0 worse, 217 same and totals identical to the pixel. IT IS NOT INERT. Diffing arm A's captures against arm B's -- which ab_compare does not do -- 49,104 px moved on Clear/SFC_X1R5G5B5_Z1R5G5B5, and per channel against the golden the GREEN channel went from 49,152 px wrong at max delta 128 to 48, the pre-existing residual. Green is the byte a 1555 word's bit 15 lands in when two words are read as one 8888 texel, so the clear substitution fixed the stored pad bit exactly; the score did not move because the same pixels are still wrong in ALPHA, where the restored readback forces 0 over the golden's stored byte. So: the CLEAR fixes green, the READBACK REMOVAL fixes alpha, and the raster stamp reaches neither on a surface that is cleared rather than drawn. The earlier reading of arm 2, which credited the whole 49,152 -> 48 to the clear, was half right -- the clear-side claim survives, its ownership of the alpha half does not. CONSEQUENCE FOR LANDING: the clear change is correct and provably harmless (0 worse over 217 captures) but its 49,104 px are only realised once the readback swizzle can come out, which needs the raster to stamp, which needs dualSrcBlend. It is kept as the prerequisite, not because it moved a number. Also settled: Clear/SFC_A8R8G8B8 moved by exactly 96 px in both earlier arms on a format with no pad bits, was registered must_not_move in arm 3 to test that attribution rather than assume it, and HELD -- along with all twelve must_not_move globs and 192 of 193 checks. CORRECTION 2026-09-14, FROM ARM 1's OWN scores1.tsv, and the sentence being corrected is this note's own. It read: 'it CONFIRMED the model -- Surface_format/Fmt_X8R8G8B8_O8R8G8B8 59,183 -> 32,766, the whole 26,417 being the outside-quad background the raster never touches, which no read-side scoping can reach.' TWO ERRORS. (1) THE Z TWIN IS OMITTED AND IT REGRESSED FROM BIT-EXACT: Surface_format/Fmt_X8R8G8B8_Z8R8G8B8 went 0 -> 32,767. The pair is +6,350, not -26,417 -- a favourable half was quoted and the unfavourable twin next to it in the same file was not. (2) 'NO READ-SIDE SCOPING CAN EVER REACH IT' IS FALSE: pad_alpha_override in vk/texture.c is a component swizzle on the WHOLE SURFACE VIEW, background included, and is not scoped to drawn pixels. Arm 1 deleted that swizzle AND added the stamp, so the 26,417 is confounded between the two and cannot be attributed to the write side from that arm at all. WHAT SURVIVES: the arm moved 14 of 217 rows, sum +284,964, and the failure rule ({format has pad bits} AND {blend factor is SRC_ALPHA}) covers the eight Add_SrcA_* rows EXACTLY -- but NOT Clear/SCF_X8R8G8B8_Z8R8G8B8 (+16,464) or Clear/SFC_A8R8G8B8 (-96), both on the clear path arm 1 declared untouched. AND NO ARM-1 ABSOLUTE CAN BE CARRIED FORWARD: arm 3's clear fix has landed since, so those baselines have moved. lane.padwrite59 is running its own arm A at its own base ref rather than reusing any of it, which is the correct response and the one the stale-baseline rule asks for. RECORDED AS A PROCESS FAILURE TOO: the wrong figure was in this entry, went into the orchestrator's brief unchecked, and was corrected by the lane reading the scores file. That is the second brief premise a lane has had to refute today."
blocked_on = "ORDERING 2026-09-14: lane.depthstall (#52, wave 42) holds glsl/psh.c. Declared because check_territory.py refuses to let a claim wall a blocker silently. It is claimed only because #52's blocker names the file; the lane is read-only elsewhere and should release it quickly. TRACKER NOTE 2026-09-14: the dualSrcBlend question this issue was waiting on is ANSWERED -- available. The query at vk/instance.c:870-900 has run four times, and lane.falsifiers found the output unread, which is why the blocker stood. So the write side is REACHABLE and the fix is psh.c + draw.c + instance.c. ORDERING 2026-09-14: lane.lows holds vk/draw.c, glsl/psh.c and vk/instance.c, remediating audit pass 1's LOW findings -- L10 first, which is the only one of the twelve whose scenario is a silent wrong picture on real hardware. Declared because check_territory.py refuses to let a claim wall a blocker silently. GAP RECORDED 2026-09-14 at audit pass 2's request (L12, docs/audits/2026-09-14-pass2.json), so it is on the issue rather than only in an audit record. ORDERING 2026-09-14: lane.remediate1 holds vk/draw.c and vk/texture.c, remediating audit pass 1's HIGH -- a push-constant range that is invalid at INIT on any device reporting maxPushConstantsSize == 256. That outranks this issue and is expected to be short. Declared because check_territory.py refuses to let a claim wall a blocker silently. UNWALLED 2026-09-14: lane.readfreq retired at wave 35 and released vk/texture.c WITHOUT EVER NEEDING IT -- it made no source change, because the counter it was dispatched to build already existed and had been running unread. The claim walled this issue for its whole life and bought nothing. NOT A TERRITORY PROBLEM AT ALL, MEASURED 2026-09-14. The four-file atomicity claim this issue carried since it was filed is REFUTED: the arm needed glsl/psh.c, vk/draw.c and vk/texture.c and never touched vk/surface.c, and the clear -- the reason vk/surface.c was on the list -- turned out to live in vk/draw.c. THE REAL BLOCKER IS A DEVICE FEATURE IN A FILE NOBODY HAD NAMED: the raster half of the write side needs DUAL-SOURCE BLENDING, because forcing fragColor.a also changes the source alpha the colour blend consumes and a constant 1 is not expressible in result.a = As*Fs + Ad*Fd. hw/xbox/nv2a/pgraph/vk/instance.c's desired_features table lists nine features and dualSrcBlend is not among them, so nothing in this tree yet reports whether the Adreno part advertises it. THAT IS THE NEXT STEP AND IT IS CHEAP: add F(dualSrcBlend, false) to that table and read the boot log -- one line, one boot, no device arm. If it is available the fix is psh.c plus draw.c plus instance.c; if it is not, the write side is unreachable on this renderer and the read-side approximation is the best available, which is itself a result worth recording. The clear half needs none of this and is separable (arm 3, 55de5edfff)."

