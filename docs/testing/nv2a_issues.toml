status_note = "Both arms are PRE-REGISTERED PASS. 5e612529b9 -> 0b7e5de8dd, all 106 checks: Surface_clip 1,175,741 -> 0 with every rt_* capture bit-exact, Texture_format 309,333 -> 139,389, all fifteen predicted captures byte-exact, 27 better 4 worse, -1,542,162 px. 00dc9c68c5 -> a3eddc0214, all 171 checks, closes the two X_O1RGB5 regressions the first arm cost by scoping #48's pad readback on the guest texel stride rather than on the fill path, 4 better 0 worse. The rule was decided mapping-free by level set, not by fit: 21 channels across 7 gradient goldens hold every replicate-only 8-bit level and not one ratio-only level, and 4-bit and 1-bit fields differ nowhere so A4R4G4B4 needed nothing and was already exact -- a check on the derivation rather than a lucky control. Throughput is the owed item, not accuracy: a 565 surface sampled as a texture loses its GPU-side view bind, and nobody has counted a real title's 565 working set."

