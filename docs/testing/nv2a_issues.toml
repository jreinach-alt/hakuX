no_suites = "not wrong in any one suite: one stale GL error aborts the run, so it costs captures across the whole disc. Measured on iso_surf1 under renderer = 'OPENGL': 44 captures and exit 134 as shipped, 236 captures and exit 0 with the error drained -- 192 of 236, 81% of the disc."
disposition = "defect"
status = "open"
status_note = "The assert at gl/shaders.c:413 is on the GL error state ON ENTRY, so it reports an error raised by some earlier call and never names it. Probed rather than asserted, exactly one error is pending in a whole run and it is 0x0506 GL_INVALID_FRAMEBUFFER_OPERATION. The __ANDROID__ arm of the same ifdef drains unconditionally instead of asserting, which is why Android never aborted -- and which also disables the check for every future error on that path. NOT LOCATED: the raising call is not bisected to, and guessing between an incomplete FBO at a bind and one at a blit would be a guess. NOT ESTABLISHED as ours rather than a lavapipe limitation; this is a software GL stack and an FBO legal elsewhere may be rejected here, so it wants a second GL implementation before it is called a renderer defect. Draining on desktop too is the one fix that must not be taken: it converts a reported defect into an unreported one. android_log_and_drain_gl_errors() already exists in gl/surface.c, unused, and looks written for catching it where it is raised."
blocked_on = "measurement here, not the fix: lane.remote's fada1d89d4 is now an ancestor of HEAD via the 2026-09-13 merge of that branch. It binds a surface that is ABSENT as well as one that is stale, and makes colour rather than zeta win a shared offset, on the evidence of ColorIntoZeta_ZB's golden giving the colour write 120,729 of the quad's 131,495 px. UNMEASURED ON THIS BRANCH: the 44 -> 236 capture recovery was read on the desktop GL renderer on their branch, and this branch's device lane is Vulkan, so nothing here has re-run it. The assert-versus-drain asymmetry the entry describes is a separate question and this merge does not answer it."

