[issue.41]
title = "nv2a: RADIAL fog gen mode with a vertex program fully fogs every quad on hardware"
# VALUE MEASURED 2026-09-12; the FUNCTION is what is unknown, which is not the
# same thing and was previously recorded as the same thing.
#
# The earlier entry here said the six VS radial goldens are saturated, so every
# model that clears the threshold scores alike and the corpus cannot determine
# the value. WRONG, and it hid a measurement. Four of the six are clipped; two
# are not. FogGen_VS-exp-radial and FogGen_VS-exp_abs-radial hold (254, 0, 1)
# on all 181,016 drawn px -- f8 = 1, one step short of the fog colour. The
# suite's combiner is f*(0,0,1) + (1-f)*(1,0,0) and clips at neither end, so
# that is a partial mix and it inverts.
#
# Inverted against silicon's own exp response -- measured from the Fog param
# sweeps at multipliers -2, -1 and -0.5, which agree, rather than assuming
# truncation or rounding (psh.c's 2^x caveat bites exactly in this region) --
# f8 = 1 means fogX in (-0.5000, -0.4600), so:
#
#     the program-mode RADIAL coordinate is in (204.06, 221.81),
#     identical on all 374 quads.
#
# Which settles more than a bound. NOT 200 (kFogEnd and the projection far
# plane both are; at 200 silicon reads f8 = 2). Not geometry-derived: it
# varies by under 17.74 where the fixed-function radial distance over the same
# vertices runs ~19 to ~222, under 8.7% of it. And a saturating "just fully fog
# it" fix does NOT score the same as a correct one -- it leaves 724,064 of the
# cell's 2,172,192 channels.
#
# #41's stale-intermediate mechanism now has a measurement rather than
# plausibility behind it: in FogGen_FF-exp-radial only 5 of 374 quads lie in
# that same 17.74-wide window -- the corners of the final row -- and the last
# quad drawn is one of them. All 30 FF tests run before all 30 VS tests over an
# identical grid, so one stale value explains one constant across all six.
#
# STILL NOT IMPLEMENTED, for a sharper reason than "unknowable": if that is the
# mechanism, the constant is a property of the TEST SCENE. Writing 212.0 into
# vsh.c zeroes the cell and is arbitrary for every other guest -- a110957a with
# a better-measured constant. The faithful version is #42's carried value one
# level harder (|modelview . v| of the last FF vertex, which the CPU cannot
# read back) and is refused at a smaller payoff.
#
# THE EXPERIMENT: one capture, a second VS RADIAL scene after a DIFFERENT
# fixed-function scene, fog params kept interior. Coordinate moves -> scene
# state, permanently unmodellable. Coordinate stays -> hardware constant, and
# the fix is one line. Nothing in the corpus can run it: RADIAL under a program
# appears in fog_gen_tests.cpp and nowhere else, and fog_tests.cpp:27 /
# fog_exceptional_value_tests.cpp:98 both comment it out citing
# abaire/nxdk_pgraph_tests#214.
#
# Ranking unchanged: exclude this cell. It is 2,172,192 of Fog gen's 2,186,760
# structural channels and the suite's real residue is 14,568.
# docs/investigations/fog-vs-radial-band.md, docs/testing/fog_radial_band.py.
suites = ["Fog gen"]
disposition = "unknown-semantics"
status = "unmodellable"
status_note = "The program-mode RADIAL coordinate is measured into (204.06, 221.81) and is identical on all 374 quads: not 200 (where silicon reads f8=2, killing the obvious guess) and not geometry (it varies by under 17.74 where the fixed-function radial distance over the same vertices runs 19 to 222). The recovery chain was pre-registered (predictions/vs-radial-fog-band.json, sha 720edadfa63c) and landed at 0.00 deviation on all six captures against a stated tolerance of 3.0, so the bound is sound. What would separate scene state from a hardware constant is a VS RADIAL scene drawn after a different fixed-function scene, and that capture does not exist: FOG_GEN_MODE_V_RADIAL under a vertex program appears only in fog_gen_tests.cpp, and the two suites that would give a second observation comment it out citing abaire/nxdk_pgraph_tests#214."

# MEASURED 2026-09-12, so this is no longer unknown-semantics. Hardware's
# oFog is an output register that is never cleared: a vertex program that does
# not write it renders with the last value the PREVIOUS program left there. We
# initialise `vec4 oFog = vec4(0.0,0.0,0.0,1.0)` per invocation in
# glsl/vsh.c:213 and then read fogDistance = oFog.x, so a fog-silent program
# fogs with coordinate 0 and the draw renders unfogged. The differing line is
# that initialiser, and the value that belongs there is not a constant.
#
# Pinned two independent ways:
#   Fog_coord_vec4 CoordNotSet -- combiner f*C0 + (1-f)*diffuse with
#     C0 = (0.5,0,0.75) on white diffuse clips at neither end, so the 8-bit
#     factor inverts out of the colour, and EXACTLY ONE factor in 0..255
#     reproduces the golden (223,192,239) on all three channels: 63 =
#     trunc(0.25 x 255), the oFog.x the two priming draws wrote from c[120].
#     diffuse was taken from the suite's own X-0.00 golden so the inversion
#     does not lean on our renderer.
#   Fog_carryover FogCarryover -- in all six fog modes the no-coordinate
#     triangle is BIT-IDENTICAL to the explicit-coordinate one in the same
#     frame, 4,032 px per mode pair, at coordinates 0.6/0.1/0.2 whose biases
#     keep the factor interior. Our explicit-coordinate triangles match gold
#     in all six, which is what isolates the defect to the carried value.
#
# Ruled out: a fixed fallback coordinate (killed by monotonicity alone -- no
# constant is 0.6, 0.1 and 0.2 at once); reading the FOG_COORD attribute when
# the program is fog-silent (fits all eleven Fog_carryover captures, because
# there the previous program copied that attribute into oFog, so the two
# suites are DEGENERATE for that pair -- CoordNotSet separates them, since
# fog_tests.cpp never calls SetFogCoord at all); honouring FOGGEN under a
# program (already dead at +7,449,481 channels, and dead again here because
# an unset program leaves oD1 as unwritten as oFog).
#
# The naive saturating fix is PRICED AND REFUSED: the 10 Carryover<Primitive>
# captures are genuinely clipped so they bound rather than choose the value,
# and such a fix sends them to zero while FogCarryover keeps 8,064 of 12,096 px
# and CoordNotSet keeps all 30,568 with its error TRIPLED from (32,63,16) to
# (96,192,48). The one capture that discriminates is the one it makes worse.
#
# No functional diff yet because the needed value is GPU-resident -- the last
# oFog.x the previous draw's last vertex wrote, surviving a pipeline change --
# which is descriptor-set work in vk/renderer.c, shaders.c and vsh.h. The
# CONDITION is free: whether a program writes oFog is decidable from its text.
[issue.42]
title = "nv2a: the fog output register keeps its last value when a vertex program does not write it"
# Mechanism known, value not obtainable from this corpus. Every failing pixel is
# the draw that omits the fog coordinate -- seven tests fail on exactly 16,384
# px, the quad the test draws without setting one -- and vsh.c:213 starts every
# invocation at vec4(0,0,0,1) where the hardware vertex engine's output register
# keeps its last contents. Whether a program writes oFog is decidable from its
# text; the carried value lives on the GPU, so this is a design decision about
# cross-draw state. FOGGEN_SPEC_ALPHA is NOT the explanation: honouring it in
# the programmable path costs 7,449,481 channels across the fog suites, with
# Fog_coord_vec4 going from nine differing pixels per capture to 61,143. NOTE
# the goldens here are saturated (one to three colours where we differ), so a
# differing-pixel reduction proves nothing about the carried value.
#
# FIXED AND VERIFIED ON DEVICE 2026-09-12, eac0f39b15. CPU-side shadow of the
# last fog coordinate a program wrote, handed to fog-silent programs as a
# `carriedFogCoord` uniform, classified from the program tokens as
# constant-sourced or attribute-sourced -- which is what spans both priming
# styles, and why the attribute-only shortcut could not work. Vulkan only.
#
# A/B over 68 captures, same disc, Alpha_func as the non-fog control:
