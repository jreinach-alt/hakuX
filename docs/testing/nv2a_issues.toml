# Tracker issue -> pgraph test suites.
#
# This is the ONE hand-maintained table in the index. Everything else in
# nv2a_index.json is derived from the emulator tree and the nxdk_pgraph_tests
# source, and regenerates.
#
# It is hand-written because only a human decided which suites a given issue is
# about. It is still checked: `nv2a_index.py check` fails if any suite named
# here is not a real derived suite name, so a rename upstream or a typo here is
# caught rather than silently dropping a suite from every query.
#
# Suite names must match the DERIVED spelling exactly (spaces, not underscores
# -- the underscored form is the results directory name, and the index carries
# that separately as results_name).

[issue.4]
title = "Render-to-texture diverges from silicon"
suites = ["Texture render target"]

[issue.6]
title = "DXT1 decode rounding differs from silicon (minor; the large failures were #19)"
suites = ["Texture DXT"]

[issue.8]
title = "Fog"
suites = ["Fog", "Fog gen", "Fog param", "Fog carryover", "Fog vsh",
          "Fog exceptional value", "Fog coord vec4"]

[issue.10]
title = "Bump mapping"
suites = ["Bump map", "Bump env lum"]

[issue.12]
title = "Vertex attributes and primitive assembly"
suites = ["Attrib carryover", "Attrib setter", "Attrib float", "3D primitive"]

[issue.13]
title = "Line and point rasterisation"
suites = ["Line width", "Point size", "Point params", "Swath width",
          "2D Lines", "Smoothing control", "Stipple tests"]

# Confirmed independently on Adreno before the fix landed: of 18,000 sampled
# #spot_ pixels, zero were off by one or two steps, and 6,353 of the 7,974
# misses were R and B the wrong way round. docs/testing/blend_channel_order.py
# is the check.
[issue.14]
title = "Blend precision (low priority)"
# Most of this was never the blend unit. The 105 #spot_ captures blit a 512x512
# A8R8G8B8 render target to screen through an A8B8G8R8 texture stage, and we
# skipped that decode: 81.8% of the residual on the 75 non-signed captures, and
# every MAX capture, which is byte-exact once the channel order is right.
# 30 of the 105 (SADD/SREVSUB) belong to #43.
# docs/investigations/surface-as-texture-decode.md.
disposition = "defect"
suites = ["Blend tests"]

[issue.48]
title = "Blend surface: two draws land on the region and the wrong one survives; only the O format needs a forced alpha"
suites = ["Blend surface", "Surface format"]

