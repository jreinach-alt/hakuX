[issue.48]
# Retitled 2026-09-12: three premises in the old title and body are measured
# FALSE. S is 255, not 108 (kSwatchColor = 0x22FFFFFF) -- 108 is DERIVED, from
# 255*(34/255) + 85*(221/255) where hardware gets 255*1. "The wrong draw
# survives" is not the mechanism: with dfactor = ZERO the blended draw wins
# unconditionally, on hardware and for us. And "only the O format needs it" is
# false -- Z needs Ad = 1.0 just as much; what is O-only is the texture pad
# readback.
#
# BLEND HALF FIXED AND VERIFIED ON DEVICE. The blend unit now reads Ad = 1.0 on
# a colour surface with no alpha bits (2f23dd9ce5, repaired in f4e029b1d3),
# taking the format from NV097_SET_SURFACE_FORMAT rather than from a surface
# binding whose shape is never refreshed (c6dd6fcdfb -- see #55).
#
# Cumulative A/B against the pre-fix baseline, 137 captures per arm:
#   10 better, 0 worse, exact 4 -> 7, 6,511,182 -> 6,136,728 px.
#   Three captures to exactly 0, five to exactly 65,536, and the two
#   _Add_SrcA_DstA captures the oracle could not model improved rather than
#   regressed. The predicted total was 6,136,728 -- hit to the pixel.
#
# The intermediate regression is kept on the record because the diagnosis was
# wrong first: reading the format from the binding sent DstAlpha_ARGB8 from
# exact to 98,304 px while its complement stayed exact. I read that as a
# cache-key collision; it was killed four ways, most cleanly by RUN ORDER --
# 1-DstAlpha_ARGB8 runs 1st with a fresh binding, DstAlpha_ARGB8 runs 11th and
# inherits a stale X8R8G8B8_Z8 shape. A key collision has no notion of position
# in a run.
#
# TEXTURE HALF ALSO FIXED AND VERIFIED, 4946433d87, once #55 unblocked it.
# A/B on the same disc, both arms progress-log proven, one commit apart:
#   5 better, 0 WORSE, 30 same.  exact 7 -> 12.  1,823,732 -> 1,496,052 px
#   (-327,680).  FIVE captures to exactly 0: DstAlpha_X_ORGB8 and 1-,
#   DstAlpha_X_O1RGB5 and 1-, and DstAlpha_X_ZRGB8.
#
# THE TWO HALVES COMPOSE. The blend fix took those captures to 65,536 (the
# opaque half correct, the alpha half still wrong); the texture fix clears the
# remainder. Neither alone makes any of them exact. That is also why the
# predicted -196,608 undershot: it assumed each capture would retain its alpha
# half, when in fact the opaque half was already fixed and the second change
# cleared what was left.
#
# Every pre-registered falsifier HELD, which is what makes this landable
# rather than merely positive: both X_Z1RGB5 at 0, all four XA_* at
# 81,920/65,536, both X_Z1RGB5_Add_* and both XA_*_Add_* byte-identical. The
# X_Z1RGB5 pair was the deliberate tripwire -- it moves to the copy path, so
# two things changed at once on a capture already exact on its alpha half, and
# it held at 0.
#
# Blend_surface is now 12 of 35 exact, from 4.
#
# WHAT REMAINS, and it is a separate item rather than this issue's tail:
# X1A7R8G8B8's pad readback is (X<<7) | (stored>>1), TRUNCATING -- 2,097 of
# 32,755 invertible px at max|delta| 1, against 20,362 for round-to-nearest and
# 32,570 for bit-replication. So it needs 7-bit REQUANTISATION on the way in as
# well as out, which is the surface write path, not the texture read. Worth up
# to roughly -147,000 px (the XA_* residual is 294,912 today and the readback is
# recorded as about half of it). INFERRED at capture level; the -44,697 px on
# the measured region is measured.
#
# (superseded) The texture-unit half was BLOCKED ON #55: the rule is measured
# pixel-exact (sampled alpha 0 for Z and 255 for O at every stored alpha, sd
# 0.00 over 16,371 px per quad; 0 of 65,536 per capture against 65,536 of
# 65,536 for the opposite constant) and cannot be implemented because no
# binding reports the format the surface was rendered as. Predicted when
# unblocked: -229,376 px over six captures.
title = "Blend surface: destination alpha on alpha-less surfaces (blend half fixed; texture pad readback blocked on #55)"
suites = ["Blend surface", "Surface format"]

# Added 2026-09-12 by auditing this file against the GitHub issue list, which
# had drifted: six closed issues were still listed and eighteen open ones were
# absent. Only issues that name a suite are mapped here -- #15, #17, #18, #34,
# #38 and #39 are deliberately absent because they are cross-cutting or
# process issues with no single suite, and inventing a mapping for them would
# make `query` and `blast` answer confidently with a guess.
#
# #38 STAYS UNMAPPED, and the 2026-09-12 measurement is why rather than an
# omission. Its mechanism 1 ("vertex colour quantisation") is DECIDED AND
# CLOSED -- docs/investigations/vertex-colour-quantiser.md, reproducible with
# docs/testing/vertex_colour_quantiser.py. Nineteen distinct float components
# read off flat golden regions in six suites kill all five candidate rules the
# issue named: hardware gives 0.5 -> 128 (not 127, so neither truncation nor
# round-half-down), 0.25f -> 64 (not truncation), 0.1f -> 25 and the
# accumulated 0.3/0.7/0.9 -> 76/178/229 (not round-half-up, -down or -even),
# 0.75f -> 191 and 0.95f -> 242 (not the x256 family). What reproduces all
# nineteen is truncating the float's low mantissa bits and THEN rounding
# 255*x to nearest, which is what glsl/vsh.c colorPrecision() has done since
# 5c2b26db2f. There is no patch to write and no suite left carrying it: every
# flat float-specified vertex colour in the 1,915-capture sweep is exact.
#
# The rest of #38 belongs to three different causes with three different
# signs (24 one-step-hi captures against 70 one-step-lo and 201 one-step-sym),
# so a mapping would point at suites whose residue is #16, the interpolator,
# or the blender. Two corrections to the issue body, both measured:
#   * Surface_clip's remaining 7 captures (2,351,482 ch, the largest
#     one-step-hi residue in the corpus) are the R5G6B5 texel expansion, not
#     the vertex colour -- silicon expands a 5-bit component by bit
#     replication (v=3 -> 24), the Vulkan-native format by exact ratio (25).
#     Its A8R8G8B8/B8/G8B8 variants, which ARE the vertex-colour instrument,
#     are 27 of 27 exact.
#   * W_buffering cannot exhibit mechanism 1 at all: wbuf_tests.cpp submits
#     only 0.0 and 1.0 components. Its 66 one-step captures are every one of
#     them a *_ZB depth capture, i.e. #16, and 0 of its colour captures are
#     one-step.
disposition = "unclassified"

[issue.49]
title = "Viewport: two fractional offsets (-7/16 and +9/16) differ by 698 px each, none of it one-step"
# MEASURED DEAD in the vertex-shader generators: no snap rule can fix this, and
# that is proved rather than suspected. Both offsets are congruent to 9/16
# mod 1, so the post-offset coordinate lands exactly ON a 1/16 grid line where
# roundScreenCoords is the identity, and coverage is decided by the last bit of
# the transform above it. Every rule expressible there -- truncate, floor,
# round, any grid size, any pre- or post-snap bias, any sample point -- is
# invariant under integer translation of its input, and hardware resolves
# x = 120 + 9/16 and x = 320 + 9/16 in OPPOSITE directions, in the same quad at
# identical y and w. Read as full 99-100 px edge runs, never point samples.
#
# Convention is otherwise identical to hardware everywhere visible, pinned by
# the ten passing captures: truncate to 1/16, sample at pixel + 0.5, left/top
# edge inclusive, VPOFF added in the fixed-function path and not the
# programmable one.
#
# INFERRED cause, named but not modelled: vsh-ff.c:677 does `oPos.xy /= oPos.w`,
# a correctly-rounded fp32 divide that returns the exact integer whenever the
# true quotient is within half an ULP -- which is why we land at-or-above at
# all five x. The NV2A vertex ALU has no divide, only a limited-precision
# reciprocal followed by a multiply, whose ~2^-22 error is a few ULP of a
# coordinate near 320.
#
# The best rule-shaped change was computed and DELIBERATELY NOT SHIPPED: a
# pre-snap bias under 1/32, invisible in the ten passing captures, takes
# 1,396 px -> 888 px by fixing three x vertices and breaking two. A 36%
# reduction of the wrong shape is the wrong-mechanism signature.
#
# Also ruled out: a missing half-pixel term in either path; VPSCL (inert on
# both sides -- the five scale-2.0 captures equal their scale-0 twins); a host
# split (#11 has both lanes failing the same two); stale inputs (captures
# 2026-09-12, goldens Sep 9, both newer than the last vertex-path change);
# cross-test contamination (the two failures are the two offsets congruent to
# 9/16 wherever they sit in disc order).
#
# The experiment that would restart it: a disc sweeping a fixed-function vertex
# across n + 9/16 +/- 2^-k, to characterise the NV2A transform's rounding
# instead of guessing it. The per-vertex table such a disc must reproduce is in
# the write-up. docs/investigations/viewport-9-16-boundary.md,
# docs/testing/probe_viewport_ff_extents.py.
suites = ["Viewport"]

