#
# AND THE MAGNITUDES ARE FAR WIDER THAN THIS ISSUE WAS FILED WITH. Over those
# ten runs the capture reads 0 0 0 0 0 146 181 1847 2352 2430 5640. The
# recorded 136 px is not representative of anything, and a 5,640 px failure is
# unlikely to be the same event as a 146 px one. A defect that either fires or
# does not should not produce a 40x range in severity.
#
# That spread is now the most concrete open thread here -- more so than the
# frontier geometry, which is well characterised but consistent with several
# mechanisms. It suggests either a second variable or a mechanism whose
# severity depends on timing.
#
# The barrier hypothesis this issue's desktop comparison was built to settle is
