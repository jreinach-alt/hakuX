disposition = "defect"
status = "open"
status_note = "One arm, nine captures, 9 better and 0 worse: making pgraph_gl_check_surface_to_texture_compatibility() return false always -- so a texture backed by a live render surface is read from guest memory instead of sampled directly -- moves every capture on the disc where GL still trailed Vulkan. GL's bit-exact count goes 102 -> 108, which is Vulkan's exactly, and its differing-pixel total to 4,293,810 against Vulkan's 4,443,147. Three suites, three formats, one cause, so it is NOT the A8R8G8B8 finding it was filed as. The obvious explanation is ruled out: the GL R5G6B5 surface really is 565 -- asked for GL_RGB565, got GL_RGB565, glGetTexLevelParameteriv reports 5/6/5/0 -- and yet the capture holds 156 distinct reds, 242 greens, 156 blues, of which 124/178/124 are not valid 5- or 6-bit expansions, against 33/64/33 in both Vulkan and the golden. A 565 texture cannot hold 156 distinct reds, so the precision enters AFTER the surface, in the sampling path this arm refuses. NOT MEASURED: which part of that path. Candidates visible in the code are the sampler state set at creation in update_surface_part() (MIN_FILTER forced to GL_LINEAR, MAG_FILTER never set), the scaling factor, and the format the sampling shader believes it reads -- none named without an arm, because three hypotheses on this issue have already died that way. THE FIX IS NOT 'turn it off': refusing the fast path forces a guest-memory round trip for every render-to-texture, a throughput cost on exactly the workload the path exists for, and declining a path to make pixels better is a curve fit with a bill attached. What the arm buys is a mechanism instead of a correlation, plus nine captures to measure any candidate against."
blocked_on = "still #60's blocker, but lane.remote's answer is now HERE: f75a4aad1a is an ancestor of HEAD via the 2026-09-13 merge, and it is NOT the 'turn the fast path off' this entry warned against. It names one of the three candidates listed above -- the sampler state set at creation -- and the mechanism is the CACHE rather than the filter: pgraph_gl_render_surface_to_texture() forces GL_LINEAR to make a single-level texture complete, and apply_texture_parameters() then skips reapplying the guest filter on a REUSED binding whose cached min_filter already equals what the guest asked for, so the forced value survives. The fix drops the cached value. Their later docs go further and say the residual after it is a CPU/GPU race on one texture buffer, the blit copying faithfully from a stale source -- read docs/investigations/ on that branch before re-deriving any of it. UNMEASURED ON THIS BRANCH: none of the nine captures has been re-run here since the merge."

