status_note = "Two of the four cells are done. Cell 1 (z16 fixed) was already exact and is now explained rather than lucky -- worst normalisation error 0.0059 units against a 0.00625 margin on the same code path. Cell 2 (z24 fixed) is finished by arm 5e612529b9 -> 91b0897e01, PRE-REGISTERED PASS on all 72 checks, 72,138 -> 43,690 px, with ours - floor(exact) collapsing to {0: 85192} on the big quad and oracle - ours = 0 on all 18 captures. Remaining: z16 float 1,436 px -- packing now ESTABLISHED as RGB565 (R5<<11|G6<<5|B5; ARGB8888 is z24 only, and the float flag selects neither), verified on 199,065,600 channel samples with 0 lattice violations and modal decoded word == the name mask on 432 of 432 depth _ZB goldens, so score_sweep.py's decode is right and the cell is real rather than an artefact -- but it is NOT a float-encoding defect and not structural: all 1,436 px are one ULP, 0 px differ in the 63,488-px grid that covers every F16 exponent 0-15, and the whole residual is the bottom quad's sub-ULP interpolation shortfall, i.e. cell 2's barycentric-normalisation +-1 family at 1/30th the size. z24 float 12,816 px (a measured floor -- the +-12,584/12,585 quad-split family, priced and deliberately left), and 1,479,886 px of colour whose histograms are byte-identical between the bit-exact z16 cell and the one-unit-out z24 one, so it is #38's Gouraud interpolator and not depth at all. The \"float Z structural -- not one of F16's 469,927 channels is one-step\" line in the comment above is RETRACTED as a channel-counting artefact of the RGB565 packing; classify_residuals.py still has no _ZB branch and so calls every one-ULP depth pixel structural. docs/investigations/zb-packing-float-depth.md. LAST CELL CLOSED 2026-09-14 BY lane.depth52z16, WITH ZERO DEVICE TIME, AND THE ANSWER IS THAT IT IS ADVERSE: none of the z16 float cell's 1,436 px is ours. depth_exact_floor_float.py builds the exact-rational floor onto the F16 lattice from the test's own geometry, touching neither capture. On 1789379943-orchestrator-3500483 (ref af1e028fa9, disc 2-suites:93b0fb71, psh.c BYTE-IDENTICAL between that ref and HEAD): ours-gold 1,436, ours-oracle 604, gold-oracle 2,040, and 2040-604 = 1436 verified PER PIXEL rather than inferred from equal totals. Our 604 off-floor px are a STRICT SUBSET of silicon's 2,040 -- 0 px where we are off and silicon is on -- and on all 604 we already hold silicon's identical word, so they are invisible to the score. On all 1,436 differing px OURS IS THE EXACT FLOOR AND SILICON IS ONE ULP BELOW: 1,436 below, 0 above. So driving ours-oracle to 0 takes the cell 1,436 -> 2,040, a 42% REGRESSION, and reaching 0 means deliberately introducing error -- while z16 FIXED is bit-exact on all 18 captures through the same interpolation, so cell 1 pays for any precision surrendered. THE FALSIFIER COULD HAVE FAILED: nothing in the oracle forces either the subset relation or the one-sidedness; both are properties of the goldens. Negative control -- the same oracle on the pre-a1fe59400e capture (907869b4c1) reports 4,002 px off the floor at max 4,094, the subnormal-grid defect. The instrument answers a real defect in this exact cell by three orders of magnitude, so 604 at max 1 is ABSENCE AND NOT BLINDNESS. Replication was free: 23 of 24 runs on disk are byte-identical on this capture across ~17 refs and 7 disc compositions, the 24th being the pre-fix outlier, and the cell-2 chain sits inside that set at 0 px differing on all 18, checked pixelwise. TWO STALENESS TRAPS CAUGHT IN PASSING, both live: the cell-2 fix 91b0897e01 is NOT an ancestor of HEAD -- rebased to 775b87412d with an identical patch-id, which is the ancestry-asks-about-shas trap exactly -- and the 1,436 figure was itself a stale baseline measured four hours before the Dekker fix, which happens to reproduce exactly post-fix, so the value stands but did not deserve to. WHAT IS NOT SETTLED and does not need to be: whether silicon's missing ULP is a narrower interpolator or a narrower encode -- the suite has no constant-depth primitive, and the classification does not depend on it. NOTE ALSO Depth_buffer_fixed_function's z16 5,840 px: 100% one-ULP, max |d| = 1, the same +-1 family and not structural. That suite has no exact oracle, so the lane could bound it and not adjudicate it. WITH THIS, #52 HAS NO CELL A CODE CHANGE CAN IMPROVE."

# Added 2026-09-12. Cross-cutting root cause rather than a pgraph defect, and
# filed separately because it is not about a suite: tcg/tcg-op.c's
# tcg_gen_mb() has an `#elif defined(XBOX)` branch (1d8a51aff9) setting
# parallel = cflags & CF_PARALLEL where upstream sets it unconditionally true
# for system emulation. CF_PARALLEL is never set here -- rr passes false
# outright, mttcg passes smp.max_cpus > 1 -- so every guest memory barrier is
# elided, including the TCG_MO_LD_ST | TCG_MO_ST_ST each store requests to hold
# x86 TSO on a weak host. Upstream's own comment in the bypassed branch warns
# about exactly this hazard.
#
# Provable rather than statistical: on x86-64 TCG_TARGET_DEFAULT_MO already
# contains store-store so the patch never fires, on aarch64 it is required and
# dropped. That single fact predicts #44's measured 20/20 desktop
# byte-identical against ~46% Nova failures.
#
# Suites are listed because these are the ones whose intermittency it would
# explain, NOT because the defect is in them. The falsifier for the general
# claim: if #44 goes green and #39's lost-draw symptom stays equally noisy,
# the specific fix worked and the publication account is wrong.
#
# The cost is the decision -- about one dmb ish per guest memory operation,
# plausibly tens of percent on memory-heavy code -- so it needs a measured
# number before it lands. A store-store-only variant is recorded in the
# write-up and deliberately not implemented.
# docs/investigations/tcg-barriers-elided.md.
blocked_on = "ORDERING 2026-09-14: lane.tcgcount (#68, wave 51) holds profile.c, where this issue's ~-24.3 s guest-clock finding would be instrumented if anyone pursued it. Declared because check_territory.py refuses to let a claim wall a blocker silently. The clock jump is GUEST-SIDE and not ours, so nothing here is waiting on that file. CY HALF RECOVERED 2026-09-14. The matching-disc rerun (2-suites:93b0fb71) captured 224, including 56 Cy_FZy where the minimised run had ZERO. So the missing captures were the minimise, exactly as diagnosed, and a plain rerun recovers them. NOTE THE DISC AGAIN: depth52-A used a6eb9b49 and this used 93b0fb71 -- there are TWO 2-suite discs, so even 'the same suites' is not the same disc. AND THE 784-GOLDEN GAP IS NOT THE STALL: Depth_buffer still scores 144 of 784 on a run that completed normally, while Depth_buffer_fixed_function scores 80 of 80. The gap is disc composition -- goldens carrying tests this disc does not contain -- and it is now separated from the stall rather than conflated with it. RERUN ATTEMPTED AND MISQUEUED 2026-09-14, recorded because the mistake is the issue's own lesson. I queued --suites 'Depth buffer' alone, which builds a SINGLE-SUITE disc: 72 Starting, 72 Completed, 'Testing completed normally', NOT minimised and NOT truncated -- but disc_id 'Depth buffer' against the stalled run's '2-suites:a6eb9b49:Depth buffer,Depth buffer fixed function'. Different disc, not comparable, exactly the narrowing-changes-what-it-measures rule. Requeued on the matching 2-suite composition. AND IT SURFACED SOMETHING SEPARATE: on that single-suite disc the scorer reports PARTIAL COVERAGE, 144 of 784 goldens at 18.4%, with the run log's own note that a gap that large usually means the tests were retired upstream and need the 2025-03-14 disc. So part of '784-golden oracle unreachable' is a DISC COMPOSITION fact and not only the stall -- the goldens carry tests this disc does not contain. That is the reverse of #27's trap and is not yet quantified. SOLVED 2026-09-14 by lane.depthstall, with zero device time -- every anomaly was already on disk. THE STALL IS NOT A DEPTH DEFECT: depth52-A renders at 59.947 Hz until 10:30:06.045, then logs `window minimized` and `app entering background` at 10:30:06.813 with NO restore for the remaining ~1,500 s of its 1,800 s budget, and ui/xemu.c:798-804 pauses the display path on SDL_WINDOWEVENT_MINIMIZED. DepthFmt_z24_Cy_FZn_Maaaaaf is simply whichever test was running when Android took the window away -- so the --only-tests arm this blocker proposed would have answered nothing. Control: TWELVE runs on disk ran longer (1147, 977, 956, 697, 471 s) and none was minimised, so it is not a screen timeout and not a run ceiling. THE CY HALF NEEDS A PLAIN RERUN. THE BACKWARD CLOCK JUMP IS GUEST-SIDE AND NOT OURS: on Xbox the performance counter IS the TSC, the disc holds 733333333 and not 3375000, so the guest computes ns = tsc * 1e9 / 733333333 and the 64-bit numerator overflows every 2^64/1e9 ticks, dropping the clock by exactly 2^64 / 1e9 / 733333333 = 25.1547 s. Derived, not fitted, and falsifiable: adding it back must reconstruct an ordinary duration, and 19 of 19 land inside the positive distribution of their own file. The negative durations are the same event, not a second finding. AND THE MISSING-TEST COUNT WAS WRONG BOTH WAYS: 654 and 680 are PNG FILES, two per test, so 680 is 2 x 340 where 340 is the union of what every run has captured -- a denominator that cannot show what the corpus never reached. Against the goldens' 392 tests the run captured 327: 65 missing, not 26. NOT BLOCKED. All three of the open anomalies were answered 2026-09-14 by lane.depthstall, entirely from artefacts already on disk, with zero device time -- docs/investigations/depth52-stall-and-guest-clock.md. (1) THE STALL IS ANDROID MINIMISING THE APP. depth52-A's logcat does not trail off: it renders normally at 59.947 Hz until 10:30:06.045 and then ends 'android: window minimized' / 'app entering background' at 10:30:06.813, with no 'window restored' for the remaining ~1,500 s to the 1,800 s timeout. ui/xemu.c:798-804 sets g_android_paused on SDL_WINDOWEVENT_MINIMIZED, which gates the display path at 1582/1593/1848. The reconstructed guest timeline ends at 285.6 s and the minimise lands at 293.5 s, so they coincide within the boot slack: DepthFmt_z24_Cy_FZn_Maaaaaf is merely the test that was running, not a bad test. CONTROL, so 1-of-885 is not read as a rate: 12 runs on disk ran LONGER than this one (1147, 977, 956, 697, 471 s) and none was minimised, so this is not a 5-minute screen timeout and not a fleet run ceiling -- it is a one-off lifecycle event. CONSEQUENCE: the Cy half needs a plain RERUN, not a diagnosis, not a larger timeout, and not the --only-tests arm the old blocker proposed. Why Android minimised it is NOT recoverable -- the logcat capture is filtered to the app, so it carries no ActivityManager lines and its silence is not evidence. (2) THE BACKWARD CLOCK JUMP IS A GUEST-SIDE 64-BIT OVERFLOW, and does NOT explain the stall. It is the same event as the negative durations, not a separate one. 733333333 (the Xbox CPU frequency; on Xbox the performance counter IS the TSC) appears in the disc image and 3375000 does not, so the guest converts ns = tsc * 1e9 / 733333333 and the 64-bit numerator overflows every 2^64/1e9 ticks, dropping the reported clock by exactly 2^64 / 1e9 / 733333333 = 25.1547 s. That constant is DERIVED, not fitted, and it predicts: adding it back to each negative row must reconstruct an ordinary duration inside the positive distribution of the same file. 19 of 19 do, medians 860 vs 869 ms and 886 vs 878 ms. Cross-checked against the host: reconstructing depth52-A gives 285.6 s against a 293.5 s logcat window with frames from 2.4 s, leaving ~8 s of boot -- while 25.8 s overruns the window and 18.4 s (a 1 GHz TSC) demands 84 s of boot in one run and 57 s in the other. The host clock itself never moves backwards: vblphase reports neg= every 2 s and across all 885 logcats on disk that is 13,398 windows, every one neg=0. POINTS AT THE GUEST, NOT THIS REPO -- not nv2a.c, pfifo.c, profile.c or accel/, and explicitly not hw/acpi/core.c (its XBOX periods are 1272.8 s and 636.4 s) nor nv2a/ptimer.c (27-bit TIME_0 would need a 5.35 MHz tick). NOT PROVEN: third_party/nxdk is not checked out here, so the conversion is inferred from the disc's constants and confirmed against the logs rather than read in source. (3) THERE ARE 65 MISSING TESTS, NOT 26. 654 and 680 are PNG FILE counts, two per test; 680 is not the suite size but 2 x 340, and 340 is the number of distinct Depth_buffer tests captured by every run on disk UNIONED -- a denominator that cannot show what the corpus has never reached. The goldens settle it: 784 files = 392 tests, and every one of the 340 ever captured has a golden, so the golden set is the right denominator. depth52-A captured 327 of 392, missing 65: the 16 of 49 in z24_Cy_FZn after Maaaaaf, and all 49 of z24_Cy_FZy. Both are contiguous run-order suffixes, which corroborates the minimise independently of the logcat. The old 26 is 680-654 = 26 files = 13 tests, the 13 other runs happen to hold; the other 52 are missing from the denominator too and no run on disk has ever captured them. WHAT THE INSTRUMENT CANNOT SEE: capture counts cannot separate never-reached from not-on-the-disc, so those 52 rest on run-order inference, not measurement. ALSO RE-VERIFIED: only 2 of 792 progress logs on disk record per-test durations at all; the other 790 use the [n/m] format and COULD NOT have shown a negative one, so there is still no negative control for the clock jump across the fleet. PRIOR TEXT, KEPT: UNWALLED: lane.lows RETIRED at wave 41 and released glsl/psh.c along with its other four files. Its LOW remediations are folded and its claim is gone. SEPARATELY, THIS BLOCKER IS FALSE -- lane.falsifiers refuted it 2026-09-14: it says the stalling test is NOT named, and it is