[issue.73]
title = "tcg: CF_INVALID is an input to tb_hash_func so qht_remove misses and the block is stranded on the page list -- and tb_lookup_cmp masks it off, so the stranded block is still found and EXECUTED"
component = "tcg"
no_suites = "not a pgraph suite defect: this is TCG/FPU behaviour, so no golden suite scores it"
disposition = "defect"
blocker_falsifier = "if 'belongs to the tier-1 owner / long-standing upstream behaviour' were true, the v10.2.0 merge commit would show upstream and fork AGREEING on the tb_lookup_cmp cflags line -- it fails in the world where the merge's upstream side reads `tb_cflags(tb) == desc->s.cflags` and conflict resolution deliberately kept a fork-side `& ~CF_INVALID`."
blocker_tested = "REFUTED. `git show 704ece9ac66 -- accel/tcg/cpu-exec.c` (Matt Borgerson, 2026-01-18, 'Merge QEMU v10.2.0') shows exactly that hunk, resolved against upstream. Origin of the mask: c1e4e87f5f, Matt Borgerson, 2021-10-24, 'tcg: Cache invalidated TBs' -- xemu-local, never upstream. The half that strands blocks is newer: c174c8bde8, rfandango, 2026-03-30 (5.5 months), the tier-1 soft invalidation, which sets CF_INVALID with no unlink and no rehash (cpu-exec.c:226-228). Upstream is self-consistent -- do_tb_phys_invalidate captures orig_cflags BEFORE setting the bit, so remove-hash == insert-hash; the miss happens only because the fork set the bit first, which the fork's own comment at tb-maint.c:74-77 states. BLAST RADIUS: weak reading only. The narrow fix is one sub-expression at tb-maint.c:1097 (`orig_cflags & ~CF_INVALID`), a pattern already in-tree at translate-all.c:429; it changes no generated code and affects only TBs already carrying CF_INVALID, a population empty except for tier-1. CAVEAT THAT SURVIVES: the mask at cpu-exec.c:506 is load-bearing for the invalid-TB recycle cache (inv_tb_lookup_cmp), so DELETING the mask is the wrong fix; fixing the stranding at source is not."
status = "open"
status_note = "Tier-1 promotion sets CF_INVALID in place without unlinking; do_tb_phys_invalidate reads orig_cflags including that bit and hashes with it, so qht_remove looks in the wrong bucket and the early return fires before tb_remove. 85-93% of invalidation-loop visits are already-invalid blocks: ~112 futile hash lookups plus spinlock acquisitions per frame. The correctness half is now established by reading three sites rather than inferred: tb_lookup misses on exact cflags, tb_htable_lookup_common hashes the insertion bucket, tb_lookup_cmp masks CF_INVALID off, and cpu_exec_loop suppresses only chaining."
blocked_on = "belongs to the tier-1 owner; blast radius is every guest instruction"

[issue.77]
title = "Galleon: deck and ground textures intermittently stipple and cycle hatching direction (10-14 frames per 100)"
disposition = "unknown-semantics"
blocker_falsifier = "REGISTERED FORM FAILED AND THE BLOCKER IS STILL REFUTED -- two different findings. Registered: a sustained single-scene segment of 40 frames would show the bar can be set by the deck. Superseded by the real one: parked deck through this chain has HF median 1.95-3.53 while the soak ground band is 0.54-0.70, so the demo puts 3-5x less texture detail under the bar -- the question was never scene identity."
blocker_tested = "RUN 2026-09-14, offline, four 180 s soaks already on disk. (a) NO arm holds one scene for 40 frames: longest 35/32/25/23, and 35 is an UPPER BOUND since those segments still contain 6-7 transitions at half the cut bar or more. The bar is not chosen -- it is each run own median colour-histogram distance between randomly paired frames, and sub-bar transitions are NOT called cuts, so segments come out too long, biased toward the falsifier. It flips to YES only at a bar 30% looser than the unrelated-frame level. (b) THE MECHANISM IS FALSE: a 67-frame window spanning NINE CUTS reaches bar/median 1.448, inside the 1.22-1.47 bracket a PARKED camera produces through the same chain, while single-scene segments in the same run reach 5.45. Scene identity and bar tightness are near-uncorrelated because MAD is a median of deviations. (c) V0 COULD NOT HAVE WORKED: detection efficiency 25-75%, so a true 10-14 per 100 reads as 2.5-10.5 and the 7.5 gate sits INSIDE the band a firing artifact would produce -- it could not separate absent from attenuated. (d) THE FOUNDING CAPTURE IS A 2x NEAREST UPSCALE (1280x960, two-order spectral spike at exactly 0.5, 38% of horizontal neighbours equal), so the registered baselines 4.655 and 3.340 are not native figures."
suites = []
no_suites = "A VISIBLE ARTIFACT IN A COMMERCIAL TITLE, so no pgraph suite can see it and none should be named. Galleon is not on any disc the campaign scores: there is no golden framebuffer for it, so the usual method -- compare a capture against silicon -- does not apply at all. The evidence is instead a measured per-run rate (galleon_flash_rate.py), cross-field invariants over diagnostic captures (check_diag_invariants.py), and a driver A/B. Naming a suite here would get a false one written down, which is what this field exists to prevent."
status = "open"
status_note = "A VISIBLE ARTIFACT IN A COMMERCIAL TITLE, so there is no golden and the campaign's usual method does not apply -- the evidence is captures, invariants and a driver A/B. Long-standing, visible in third-party video, NOT a regression. THE RATE IS NOW MEASURED and the investigation's founding measurement was of the wrong event: stipple frames run 10.0 per 100 on the deck and 14.0 per 100 on the town ground, while the brightness event that the original 92.2 -> 112.9 mean / 24.2 -> 29.4 contrast table came from runs at 2.5 and 0.0 per 100. That founding frame (38) is the brightest in its set and its high-frequency energy is DEAD AVERAGE, 4.94 against 4.65 -- it is not hatched at all. So any candidate must fire at ~10-14 per 100. Direction reversal is also quantified now: diagonal anisotropy 0.50-0.92 on hatched frames against 1.68 on frame 14. RULED OUT BY MEASUREMENT: texture format, dimensions, level count, pitch and swizzled flag (115 addresses, 22,493 binds, zero changes); texture-matrix enable and texgen mode per stage (431 frames, zero variation, artifact present); wrong mip level (gives one appearance, not a rotating sequence); wrong row stride; a dropped detail layer (would lower contrast, both rose); lighting. AND THE DETAIL-SCALE CANDIDATE IS REFUTED, not merely unsupported: the exception-free rule is scale * stage1_w / stage0_w = 8.000 on 167/167 including the outlier, where the fitted 2048 rule holds on 166 -- and that outlier is the only draw whose base texture is 128 wide, so it is the single observation that separates the rules and it separates them against the gated one. A TOOL LIMITATION THAT MATTERS MORE THAN ANY NEGATIVE: a diag capture runs FULLY SERIALISED -- a merged draw is never logged, and the per-draw surface dump calls pgraph_vk_finish before every draw -- so it is blind to merging, deferred submission, stale binding and missing barriers. And it reads the matrix from the same array the uniform update reads, so state and pushed uniform agree BY CONSTRUCTION. A REAL LATENT BUG FOUND ON THE WAY, explicitly not this defect: SET_TEXTURE_MATRIX never calls pgraph_reg_w so never bumps any_reg_gen, the only thing the draw queue's uniforms_changed test reads -- latent only because g_xemu_draw_merge defaults false in all three places, so fix it BEFORE that default changes."
blocked_on = "SHARPENED 2026-09-14 by lane.scene77, now RETIRED having answered the question it was dispatched for -- no lane holds this issue and none needs to, because what remains is a capability gap and not work anyone is doing. The blocker's stated mechanism -- that scene cuts set the bar -- is FALSE, and the real obstacle is SIGNAL, not scene identity. The attract demo puts 3-5x less texture detail under the bar than a parked deck (HF median 0.54-0.70 against 1.95-3.53). The frame dump remains the route; only the justification changes, and it is now a measured one. THE WORKLOAD, not the device -- corrected 2026-09-14 after the driver A/B ran. My previous text declared this unblocked because Galleon is on the Thor. Right about the device, wrong about the issue: a REAL blocker was hiding behind the false one. The A/B needs the stipple rate on a PARKED view of the deck. The founding capture got one by being driven by hand to the scene and held still. A soak cannot park a camera, so what it renders is Galleon ATTRACT DEMO -- a scripted loop cutting between cliffs, caves, sky and Loading cards -- and galleon_flash_rate.py sets its bar from the median/MAD of the frames it is handed, which assumes one scene with a parked camera. Over a loop the bar is set by the cuts. MEASURED ANYWAY, and the registration did its job: four arms at c866527e03, 180 s each, drivers verified by on-device payload size (18,869,912 vs 18,138,081, since T30 and T26 ship the same vulkan.purple.so filename) and by counting Loading custom Vulkan driver lines -- zero for stock, exactly one per Turnip arm. THE ARTIFACT DID NOT APPEAR IN ANY ARM. V0 failed on both T30 runs, 7.5 gate against a 10-14 baseline, so those arms are VOID BY THE REGISTRATION rather than by later judgement. T26 0.0 is exactly the trap V1 was registered against: 0-2 events in ~90 frames, and the T30 replicate ALONE spans 2 and 1, so T26 zero sits inside one driver measured twice and on single runs would have read as T26 fixes it. A SECOND OBSERVABLE was used because the rate had no power -- matching the same scene across arms with two runs of one driver as the floor, which works because this issue own premise that Galleon cannot be driven identically twice is FALSE for the attract demo, which is scripted and repeats. Floor T30a-T30b -0.0%; T30-T26 -0.1%/-0.0%, indistinguishable from it; Turnip-stock +0.3%/+0.3%/+0.5%, the same sign in all three pairings involving stock and zero in the two that do not. That sign is structure and is what another vendor filtering would produce, but it is NOT the artifact by ~100x, since a stipple frame is a +45-90% HF excursion. SO THE DRIVER IS NEITHER EXONERATED NOR IMPLICATED. The A/B never ran on the artifact. WHAT WOULD UNBLOCK IT: a marker-file-armed frame dump, the way apu.c arms the PCM capture. There is none today -- nv2a_dbg_trigger_diag_frames is reachable only from the Debug Capture button and LauncherActivity reads only rom_path. It must dump WITHOUT the per-draw pgraph_vk_finish or it inherits the diag capture blindness to merging and barriers. Needs a source grant; no lane holds it. TWO INSTRUMENT ERRORS were found and corrected before any of the above, on the principle that a rate far below baseline is first a suspicion about the instrument: the capture is a 2.25x UPSCALE, so measuring HF measured the compositor and resampling to native moved HF median 0.256 -> 0.614; and a modal dialog dims every frame by a measured 0.40. THE OWNER SHOULD PRESS CANCEL on the Thor Use USB for dialog: it respawns through am force-stop, is tied to USB state, occludes the central 61%x44% and costs 60% of the signal on EVERY screen-based measurement on that device."

[issue.78]
title = "Blend tests: 24x24 swatch quads rasterise 25x25 -- a 1,276 px/cell seam that is now the ENTIRE #spot_ residual"
disposition = "defect"
suites = ["Blend tests"]
status = "fixed-verified"
status_note = "FIXED BY #67 AND CLOSED 2026-09-13. This issue and #67 are the same defect found from opposite ends: this one from the captures (24x24 swatch quads rasterise 25x25), #67 from the guest arithmetic (color_swatch_size = floorf(24.75) is 24 on silicon and 25 for us, because floatx80_round_to_int discarded the float_status carrying the guest RC field and nxdk floorf became rint). Same 24-vs-25; the rasterised extent moves because the guest computed it wrong before any rasterisation happened. MEASURED, arms 1789347057-2287889 -> 2288027, PRE-REGISTERED: Blend_tests 105 captures 1,711,362 px -> 0, every #spot_* byte-exact, all 15 SADD 17,024 -> 0 and all 15 SREVSUB 19,140 -> 0 -- and 19,140 is exactly this issue own predicted full seam-mask cardinality of 1,276 x 15. AN ATTRIBUTION CLAIM MADE HERE WAS WRONG AND IS WITHDRAWN: I wrote that the entire #spot_* residual went to zero with no fold fix present, therefore no #spot_* pixel needs the sign fold. Both halves were wrong. 8d2bf50075 is not the fold fix but the pass-2 counter-logging commit, cited in #43 as the arm-B REF of a pair; and the real fold fix 322adc3a01 IS on this branch as c2d57ba21a66 (identical patch-id and diffstat) and IS an ancestor of arm A. Both arms had the fold, so the 1,711,362 px is the residual AFTER it and this measurement settles nothing about the fold. Cause: git merge-base --is-ancestor answers a question about shas, and after a rebase the question is about patches -- the #60 entry in this file documents that exact trap and I walked into it. ORIGINAL FILING FOLLOWS. Split out of #43 once the signed blend fold was exact, which is what made it separable. Measured on arm 1789341358-signfold-3558418 (ref 86a1c53195), all 15 #spot_*_SADD: differ 17,024 = ink 9,674 + seam 7,350 with fold alone 0 and UNEXPLAINED 0, and #spot_*_SREVSUB lands on exactly 19,140 -- the seam mask's full cardinality. So no pixel is wrong for the fold any more and none for a reason outside the seam class. GEOMETRY, NOT ARITHMETIC: the 24x24 swatch quads rasterise 25x25, so boundaries land at 25/50/75/100 instead of 24/48/72/96, and DrawAlphaStack's nested quads keep their top and right edges but lose 2 px on left and bottom. The mask is 1,276 px per cell, byte-identical in all 15 cells, independent of equation AND factor -- MIN/MAX carry it too, and they ignore factors by specification, which is what identifies it as rasterisation. 1,276 x 15 = 19,140 px per capture. Scope: the whole residual of all 75 unsigned #spot_ captures and, now, of the 30 signed ones. NOT Texture_signed_component_tests, whose three captures are bit-exact, so that suite does not exercise it. REGISTER A BOUND, NEVER A VALUE: 19,140 is the cardinality of the UNION of the 75 unsigned masks and an individual capture realises a subset (MIN 16,304 on all 15; MAX 19,126; ADD 12,636..19,140 with only 8 of 75 at the top; REVSUB 8,505..11,589; SUB 6,154..17,145), because whether a mis-rasterised pixel differs from the golden depends on whether our colour there happens to match. A #43 leg registered 7,350 as an exact figure and was wrong in both directions."

[issue.76]
title = "score_sweep.py runs the colour-buffer label check on _ZB captures, voiding real depth defects"
disposition = "harness"
suites = ["Depth buffer fixed function", "ZPass pixel count", "Stencil"]
status = "fixed-verified"
status_note = "Found by the #75 investigation while measuring the Stencil noise floor, and it discards REAL defects. The label check reads rows 0-63 as the test's printed name, which is right for a COLOUR buffer and wrong for a _ZB one: a depth capture has no label, because the guest prints into the colour buffer, so on Z24S8 'white' means depth near maximum -- the CLEARED value. Measured on disk: two Depth_buffer_fixed_function z16 rows at 2,840 px each flagged label-differs in FOURTEEN runs each and therefore void per AGENTS.md, five ZPass_pixel_count _ZB rows, and Stencil_ZERO_ST_ZB at 10,000 px -- which is an instance of #39 ITSELF, thrown away by the instrument. The lane caught it only because it recomputed diffs instead of reading the status column. This is the mirror of the false positive fixed earlier today by scoping the check to LABEL_ROWS = 64 with a white-content status: that fix made the check narrower but left it running on the wrong capture class entirely. A latent second bug is filed with it -- an 8-vs-9-tuple writing an 11-field TSV row against a 12-field header. ALSO RECORDED HERE, because it is the gap that produced #75: the corpus sweep runs ONE run per suite and therefore cannot distinguish a lost draw from a regression. #39 predicted exactly this in writing on 2026-09-12 -- 'a change measured by one run before and one after can show a difference it did not cause' -- and recommended a two-run disagreement guard that was never built. MEASURED AND PARTLY REMEDIATED 2026-09-13. The 0026f00534 sweep column was scored by TWO scorers, not one stale one: the sweep ran 100 suites over five hours and the label-band fix landed in score_sweep.py mid-run, so the 21 suites scored before 06:20 carry label-differs with ZERO white-content while every later suite carries both. Re-scoring those 21 with one scorer moved 138 of their 141 label-differs rows to white-content -- only THREE were genuine label mismatches. So 138 captures were being voided as 'the goldens and the disc are different builds of the suite' when they are scorable content disagreements. Originals preserved beside each as scores1.prescorer.tsv.bak, which does not match collect_sweep.sh's scores*.tsv glob. The column's cells did not move, because scoreboard.py counts label-differs and white-content alike as scored -- the distinction governs only whether a READER discards the row, which is why this was invisible. classifier_rev/scorer_rev now make a mixed column detectable: c03802fa1e records both."
blocked_on = "BOTH HALVES ARE NOW FIXED. The _ZB label check landed as 2aa701028d (verified: exactly 2 rows move, white-content -> ok, differing unchanged, zero non-_ZB rows). The sweep's two-run disagreement guard landed as e0e2d1f29a: docs/testing/sweep_diff.py pools every same-ref repeat on disk, requires MIN_RUNS = 5 before it believes a band, and EXITS NON-ZERO rather than reporting a caveat -- because a caveat was available when #75 was filed and was read past. Its own first version reproduced #75's conclusion from inside the guard by taking two runs at one ref that both read 0 and calling the spread [0,0]; pooling plus the run floor turns the same three movers into INSIDE [0, 40000] over 6 runs. WHAT REMAINS, and it is not this issue's: every result scored before 2aa701028d classifies _ZB rows by the white heuristic, so a column spanning that commit is mixed -- now DETECTABLE rather than invisible, since scorer_rev is recorded (c03802fa1e), ab_compare warns when two arms disagree on it (724d03ee38), and sweep_diff reports a column that is internally mixed."

