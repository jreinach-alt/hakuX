blocked_on = "ORDERING 2026-09-14: lane.lows holds vk/draw.c, remediating audit pass 1's LOW findings -- L10 first, which is the only one of the twelve whose scenario is a silent wrong picture on real hardware. Declared because check_territory.py refuses to let a claim wall a blocker silently. RETIREMENT CONDITION for this issue's instrument, recorded 2026-09-14 at lane.remediate1's request: reading staged_high off an arm RETIRES the [signfold] counters. They are deliberately left UNFLAGGED against AGENTS.md's flag rule, because this blocker registers them as the deciding instrument with the prediction VOID ON SILENCE -- a default-off flag produces exactly that silence and converts a live measurement into a void one. The reason is in a comment at the site. ORDERING 2026-09-14: lane.remediate1 holds vk/draw.c, remediating audit pass 1's HIGH -- a push-constant range that is invalid at INIT on any device reporting maxPushConstantsSize == 256. That outranks this issue and is expected to be short. Declared because check_territory.py refuses to let a claim wall a blocker silently. THE ORDERING IS DISCHARGED, 2026-09-14: lane.lineext retired at wave 32 and vk/draw.c is FREE. I wrote here an hour earlier that it could not be released because the wide-line fix needed it substantially -- true of the lane needing to EDIT it, and false the moment that edit landed. A claim exists to stop two agents editing one file at once, not to reserve a file whose change is already in. No lane now holds anything this issue names. Declared here because check_territory.py refuses to let a claim wall a blocker silently -- I walled three issues earlier today by claiming the same file without looking. lane.lineext releases vk/draw.c as soon as its fix does not need it. A CORRECTION I POSTED HERE ON 2026-09-13 IS WITHDRAWN, and the attribution is exactly where it was. I claimed the #spot_* half was refuted because 8d2bf50075 was not an ancestor of the #67 arms. Two errors: 8d2bf50075 is not the fold fix at all (it is the pass-2 counter-logging commit, cited above as the arm-B REF of 322adc3a01 -> 8d2bf50075, and I read a pair of A/B refs as a fix commit); and the real fold fix, 322adc3a01, IS on this branch as c2d57ba21a66 -- identical patch-id, identical diffstat, 5 files +953/-617 -- and IS an ancestor of arm A. So both #67 arms contained the fold, the 1,711,362 px FRNDINT removed is the residual remaining AFTER it, and that measurement says nothing either way about whether the fold was needed. THE METHOD ERROR IS THE REUSABLE PART: git merge-base --is-ancestor answers a question about SHAS, and after a rebase the question worth asking is about PATCHES. #60 entry in this very file documents the same failure -- its cited 8ab35a6167 and f7261e616d are not ancestors of HEAD but were rebased in as a105a51a00 and 082bc0ac4d -- and I walked into it anyway. ORIGINAL: THE FOLD IS FIXED AND PROVEN, AND THIS MUST NOT LAND YET -- the lane passed its own arm and then recommended against merging, which is the right call. PROVEN: PRE-REGISTERED PASS on all 126 checks, 322adc3a01 -> 8d2bf50075, both signed texture captures BIT-EXACT (txt_A8R8G8B8_SADD 186,724 -> 0 and SREVSUB 64,475 -> 0) with the plain-ADD control still exact on the same path, 32 better / 0 worse / 124 same, and a DIRECT counter rather than an inference: folds=5376 emitted=10752 empty=0, exactly 2x. Factor sensitivity now matches silicon on all seven equations with MIN/MAX as the built-in control. The earlier failed arm's root cause was vk/draw.c:6862 clearing inline_buffer_populated per consumed attribute, which is the same flag pgraph_vk_bind_vertex_attributes_inline builds its list from -- so pass 2 bound no vertices and the fold had been emitting ONE pass since it landed. BLOCKING, AND NO CAPTURE TOTAL IN THAT PAIR CAN SEE IT: DrawAlphaStack's outer ring carries alpha source 0x7F = 127, BELOW the sign bit and this issue's own control, and it goes 0 differing -> 124,200 on SADD and 0 -> 62,070 on SREVSUB, exactly half. Every capture total improved, nothing regressed from exact, all 124 guards held -- only a region instrument reveals it. At S=127 pass 2 is arithmetically an exact identity (f2 = 0, verified over all 65,536 cells), so the MODEL is not wrong and an implementation detail in pass 2 is. First thing to check: DrawQuad's two-draw structure, RGB-masked then ALPHA-masked with blending off for one -- DrawAlphaStack is the only place in the corpus where the BLENDED draw is the alpha one. ALSO OPEN AND NOT THE FOLD: a second defect in the #spot_ ink block -- fold-alone 54,015 px plus 8,280 px in neither class. AND F6's REGISTERED BOUND WAS WRONG BY 4x for an instructive reason: [7,350, 19,140] against a measured 80,007/76,897, because its floor came from a PRE-FIX attribution that assigned every ink pixel to the fold. With the fold exact elsewhere, 32,478 px that the old model REQUIRED to be wrong are now exact -- a stale attribution model reporting a correct fix as a failure. Blend_tests scored 105 of 1,673 in both arms, so quote no suite total from this pair. RING 0 IS MEASURED PER CHANNEL and one hypothesis is already dead: both arms log 'draw reorder: OFF' and 'draw merge: OFF', so reordering cannot be the cause and that class is empty. A CONSEQUENCE THE LANE RAISED AGAINST ITSELF, and which the orchestrator had repeated approvingly: two of the three gating changes (classify_draw_safe refusing to reorder a signed draw, check_draw_mergeable refusing to merge one) are INERT on this disc because both prefs default off, so no arm has ever exercised them. They are correct in principle and UNMEASURED in fact -- the 'the merge rejection is load-bearing because DrawAlphaStack is four nested overlapping quads' argument is sound reasoning inside a model nothing has tested. THE CHANNEL DATA: A 226 -> 255 against a golden of 226 on 34,560 px is the largest class and is exactly clamp(D + 127 + 127) saturating -- the LOW HALF APPLIED TWICE, i.e. pass 2 carrying pass 1's mask. 16,560 px go the other way and are an improvement, and mixed directions inside one capture is the signature of a state fault rather than a uniform arithmetic error. THE DECIDING INSTRUMENT counts uniform STAGINGS rather than pass requests -- different events that no pixel measurement separates -- with three registered outcomes: staged_high == 0 means pass 2's uniform never reaches the GPU and runs LOW, which predicts ring 0 AND the 54,015 still-wrong high channels from ONE cause; staged_high == folds means ring 0 is something else; and 0 < staged_high < folds is what 'bit-exact on one suite, broken on another' looks like. Registered VOID on silence. The #spot_ residual is deliberately NOT filed separately yet: if staged_high == 0 it is the same mechanism as ring 0, and splitting one cause into two issues is the mirror of merging two into one."

[issue.44]
title = "2D_BorderTex_SZ flakes: a band of padding texels inside the B32x32 swatch on some runs"
