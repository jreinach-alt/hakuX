# Also measured: stack A (DrawColorStack, cols 16-79) is a CLEAN ORACLE for the
# signed equations -- 0/224 differing on each of ADD/MAX/MIN/REVSUB/SUB and
# 224/224 on both SADD and SREVSUB -- so #43 belongs there rather than on a
# whole frame that also carries this defect. And a test-revision mismatch is
# ruled out from source: upstream blend_tests.cpp is byte-identical in draw
