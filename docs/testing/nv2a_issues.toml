# Tracker issue -> pgraph test suites.
#
# This is the ONE hand-maintained table in the index. Everything else in
# nv2a_index.json is derived from the emulator tree and the nxdk_pgraph_tests
# source, and regenerates.
#
# It is hand-written because only a human decided which suites a given issue is
# about. It is still checked: `nv2a_index.py check` fails if any suite named
# here is not a real derived suite name, so a rename upstream or a typo here is
# caught rather than silently dropping a suite from every query.
#
# Suite names must match the DERIVED spelling exactly (spaces, not underscores
# -- the underscored form is the results directory name, and the index carries
# that separately as results_name).

# Each entry also carries a `disposition`: what blocks the REMAINING work, which
# is not the same question as how bad the defect is. An issue keeps `defect` for
# as long as any part of it is actionable; the other values mean stop writing
# code, and say what would let it restart. `nv2a_index.py check` rejects a value
# outside the set, the same way it rejects an unknown suite name.
#
#   defect               a rule is known or derivable; work it
#   precision-floor      our float pipeline against their fixed point; no rule exists
#   unmodelled-hardware  real and understood, but reproducing it is disproportionate
#   unknown-semantics    we do not know what the hardware does; needs an experiment
#   host-dependent       differs between host GPUs, so not a stable target to fit
#   harness              about measurement rather than accuracy
#   unclassified         not yet triaged against the goldens
#
# Only set something other than `unclassified` where there is a measurement
# behind it. A guess here is worse than an admission of ignorance, because the
# whole point of the field is to stop someone re-deriving what was already ruled
# out.

# Each entry also carries a `status`, which is a different question from
# `disposition`: disposition says what blocks the remaining work, status says
# what the LOG has established about the fix. They drifted apart because this
# table had no status field at all, so an issue whose fix had landed and been
# judged read exactly like one nobody had touched. The audit of 2026-09-13
# found that on six of twenty-six open issues.
#
#   fixed-verified  the fix is on the branch AND an arm judged it with its
#                   prediction bound before the device ran -- ab_compare
#                   reported PRE-REGISTERED. Closable.
#   fixed-part      the issue names several defects and only some landed.
#                   `status_note` says what scope remains, and whether the
#                   remainder is a defect or a measured precision floor.
#   unmodellable    the mechanism was tested and refuted, or it is hardware we
#                   cannot reach. Closable, with the measurement.
#   open            no fix, or a fix with no bound prediction judging it.
#   fixed-unlanded  a fix EXISTS and is not on this branch. Added 2026-09-13
#                   for #72, which was closed on GitHub by a lane that fixed it
#                   on its own branch; `open` was wrong (a fix exists and
#                   nobody should write another) and every `fixed-*` value was
#                   wrong too (nothing here is fixed). The entry must carry
#                   `fixed_by`, and check_coverage.py VERIFIES that every sha
#                   in it is a real commit that is NOT an ancestor of HEAD --
#                   so this value cannot be used to silence the drift gate,
#                   because the moment the work is merged the check fails and
#                   demands a real status.
#
# `fixed-verified` is deliberately hard: a commit message naming an issue is
# not evidence, and neither is a passing arm whose prediction was written
# afterwards. Most `#N` matches in `git log` here are a prediction
# registration, a docs note, or a commit that touched the same file. An arm
# that measured a mechanism and landed on it still leaves `fixed-part` if the
# issue named other defects, and `open` if nothing judged it.
#
# The arm ids, the pre-registration verdicts and the deltas live in
# `status_note` itself rather than in a separate write-up, so that the field a
# reader lands on is the field carrying the evidence. Every arm cited there was
# re-judged with `ab_compare.py --expect <the registered prediction>` during the
# audit rather than quoted from an issue comment; the shas are as-DISPATCHED and
# several were rebased, so match a commit by its subject and not by its sha.

# An entry may also carry `component`, which defaults to `pgraph` and may be
# `apu`. It exists because audio arrived on this tracker with no entries at all
# and cannot name a suite: the pgraph test discs play no sound, so no suite
# exercises the APU, and writing a plausible-looking suite name for an audio
# issue would put a false entry in the one hand-maintained table in this index.
#
# `nv2a_index.py check` rejects an unknown component, and still requires suites
# for everything that does not declare one -- so the "no suites" rule, which
# exists to catch a parser that silently dropped them, keeps its full force on
# every pgraph issue. An entry whose suites were dropped by a bug has no
# component either, and is still caught.

[issue.4]
title = "Render-to-texture diverges from silicon"
# MEASURED OUT 2026-09-12: there is no residual specific to rendering INTO a
# texture, and the number that ranked this issue first on the structural board
# was test contamination rather than a measurement.
#
# The 9,034,555-channel / 1-of-41 figure came from a capture set with
# RenderTextureLoop INCLUDED. That test runs first alphabetically and disables
# the texture stage, so the 40 format tests that never set it up render with no
# stage: each differs by exactly 81,225 px -- the whole quad -- while the loop
# test itself is pixel-exact. That is #27 verbatim. Reproduced to all seven
# digits from such a set; a no-loop set of the same suite on the same build
# gives 752,908 channels, 5 exact. The "2.8x disagreement between the lanes"
# was not a disagreement either: 3,209,634 px against 9,034,555 channels on the
# same captures, ratio 2.815.
#
# The YUV half is ALREADY FIXED by 52defa5b ("hardware rounds each YUV term
# separately"): Texture_format's UYVY_L and YUY2_L are 0 of 388,150 --
# pixel-exact. The 563,668 figure in the corpus TSV predates it.
#
# What remains is the SOURCE texture's decode surfaced through a render target
# that is itself exact: ~102,758 channels, 97.1% of it DXT1 (99,769 channels,
# which is #6) plus a 2,989-channel precision floor. That floor is one row:
# row 240 only, band height exactly 1, ours equal to gold[row+1] on 285 of 285
# columns and to gold[row-1] on none. It is the v-tie at v = 128.0 that
# edge-defect.md left open deliberately, against a measured 2.2x ceiling for
# the bias method.
#
# Predicted on a no-loop disc: ~102,758 channels, 13 of 40 exact. UYVY_L and
# YUY2_L must go 230,455 -> 0, DXT1 must stay at 99,769, and the 26
# boundary-shift captures must not move. A fresh isolated sweep is queued.
#
# Ruled out, all measured: the d42a8d79bc tile hazard cannot reach a 3D render
# (nothing outside blit.c consults a tile); the render-then-sample dependency
# is present and correct (bind_surface_as_texture hand-rolls the
# GENERAL->GENERAL barrier that the equal-layout early return skips); the
# swizzle compute shader's hardcoded 4-byte element is unreachable (both
# callers gate on bytes_per_pixel == 4); no capture aligns to any block size;
# and the bump suites are not a second YUV instrument (all four have
# golden_colours = 2, so they score every model identically).
# docs/investigations/render-to-texture-residual.md.
# Column 320 in every capture is a texel tie at u = 128 (boundary-shift class,
# 26 of 29 failing captures are otherwise exact); the rest is format decoding.
# docs/investigations/edge-defect.md.
disposition = "precision-floor"
suites = ["Texture render target"]

# The rounding half is ALREADY FIXED, in cd81648f5e ("decode the DXT colour
# blocks the way the hardware does"), and that fix is now independently
# confirmed: an agent re-derived it from the goldens without knowing it existed,
# scored 450 candidate colour rules and 16 alpha rules, and landed on exactly
# what the tree does -- (v<<3)|(v>>2) and (v<<2)|(v>>4) for the endpoints,
# (2a+b+1)/3 for the interpolants, (k*a0+(7-k)*a1+3)/7 for DXT5 alpha. On the
# four comparable captures that takes 4,828/12,288 colour channels to
# 12,288/12,288 and 3,977/4,096 alpha to 4,096/4,096. Harness kept at
# docs/testing/dxt_fit_rounding.py; one rival, (a*171+b*85+128)>>8, is NOT
# separable -- it disagrees on 8.5% of endpoint pairs and no block in any
# comparable capture reaches one of them.
#
# WHAT REMAINS IS NOT A ROUNDING BUG, and this issue's own diagnosis is wrong.
# plasma_dxt1.dds and plasma_dxt3.dds have BYTE-IDENTICAL colour blocks.
# Decoding those bytes with the fitted rule matches the DXT3 capture to the
# channel, while the DXT1 capture of the same bytes holds SIXTEEN DISTINCT
# COLOURS IN EVERY 4x4 BLOCK -- and a DXT block encodes four. So no decode rule
# of any kind can produce the DXT1 captures.
#
# Ruled out individually, each measured: mis-indexing (every golden texel is
# nearest its own index's palette entry, 1024/1024); 2x2 and 4x4 ordered dither
# (cell means below 1.0, no separation); an A1R5G5B5 16-bit output path (only
# 121 of 1024 R values sit on the 5-bit lattice); texture filtering (the
# best-fit 5x5 kernel is the identity, centre 1.0072, residual 7.67 against
# 8.00 for no filter); and all 450 rounding rules (best 542/3072 against
# 3072/3072 on DXT3's identical bytes).
#
# Two scope notes. The software decoder is only reached when
# textureCompressionBC is unavailable, and unconditionally for 3D textures --
# so on the device today these rules are live only for Volume_texture/DXT1,
# which compresses its texture on-console at runtime and could not be scored
# offline. And the software rule now BEATS native BC for DXT3/DXT5 (0 px,
# max 0, against native BC's 1,536 px / max 1 on DXT3_plasma), which inverts
# this issue's "native BC is the better path" conclusion for those formats.
status = "fixed-part"
status_note = "closed: contamination removed, 3,209,634 -> 4,235 px; the residual is #38's floor"

