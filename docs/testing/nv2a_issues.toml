[issue.84]
title = "vk/blit.c: BLEND_AND hard-codes 32bpp, so a 16bpp or Y8 blend writes past the destination object"
component = "pgraph"
suites = ["Image blit"]
disposition = "defect"
blocker_falsifier = "if 'no test on this fleet can surface it' were false, some ImgBlt_BLENDAND capture would name a format narrower than 32bpp -- and the enumeration is complete, because the capture list is fixed by the disc."
blocker_tested = "confirmed by enumeration: all 20 ImgBlt_BLENDAND_* captures are XRGB or ZRGB, both 32bpp. The commented-out assert is confirmed by reading nv2a.c:96 directly."
status = "open"
status_note = "FOUND BY AUDIT PASS 1 OVER THE HELD BLIT FIX, HIGH, vk/blit.c:128, and PRE-EXISTING rather than introduced by it -- which the auditor established and acted on, recommending it NOT hold that fold. perform_blit's BLEND_AND branch hard-codes 32 bits per pixel: it indexes s[x*4+ch] and loads 16 bytes per 4 pixels, while the caller admits LE_Y8 (1 byte) and LE_R5G6B5 (2). SRCCOPY is format-correct because it memmoves width_bytes; BLEND_AND takes width IN PIXELS and multiplies by a hard 4. bytes_per_pixel is threaded into perform_blit_tiled() and NEVER INTO perform_blit(). A 16bpp blend therefore walks 2x the intended extent per row, 4x on Y8, spilling into the next row and on the last row PAST dest_offset + dest_size. THE OVERRUN IS UNBOUNDED, and two things compound to make it so: nv_dma_map()'s end-of-object assert is COMMENTED OUT at nv2a.c:96, and the caller asserts only dest_offset < dest_dma_len rather than dest_offset + extent. The surplus is also outside the download range and outside the invalidate, so nothing downstream corrects it or notices. NO ARM ON THIS FLEET COULD SURFACE IT -- all 20 BLENDAND captures are XRGB/ZRGB -- which is the whole argument for auditing code rather than only measuring it. THE FIX IS ALREADY WRITTEN 550 LINES LOWER IN THE SAME FILE: pgraph_vk_solid_line() at blit.c:637 meets the identical question and answers it at :689-700 with a warn-once early return, under a comment refusing to invent an answer for narrow formats. It predates 71c7bd1d7d unchanged. Either gate BLEND_AND the same way, or thread bytes_per_pixel into perform_blit() as it already is into perform_blit_tiled()."
blocked_on = "NOT BLOCKED as a question; ORDERED as a file. vk/blit.c is lane.blit38's until its BLEND_AND arm is judged. DECISION LOGGED, because the protocol requires one: THE BLIT FOLD DOES NOT WAIT ON THIS. 24a75d6e3c is held pending its arm and pending nothing else -- this defect is older than that commit and orthogonal to it, and holding a correct fix behind an unrelated pre-existing bug would be the wrong call. The auditor recommended exactly that and was right to separate them."
