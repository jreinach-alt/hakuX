blocker_tested = "REFUTED on both. Ordering: check_territory.py reports 'territory ok (wave 40, 3 lanes, 20 files claimed)'; the lanes are remote, toolsmith, lows. lane.remediate1 DOES NOT EXIST; vk/texture.c and pfifo.c are in [free]. No lane holds anything #44 names. Validity: stencil_observable_79.py -- 7 of 8 (ref, apk) groups with >=2 runs show 3-8 of 16 captures DISAGREEING between runs of ONE binary; the flake is live at refs as recent as e2b6abde73 / apk 2bf7afdc6877. The single zero-instability group is ec7f50e859 / apk 24a5f905a794, which IS #79 arm B (SKEW_BOUND=1). So the accuracy half of the shipping decision rests on a LIVE observable with a high baseline rate. The V1 'stale floor turned the bar into a coin flip' failure does NOT apply here -- which is the doubt that was blocking the decision."
