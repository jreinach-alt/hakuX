status_note = "CLOSED AS A DUPLICATE OF #39 -- THERE IS NO REGRESSION, AND THE ERROR WAS THE ORCHESTRATOR'S. I diffed two SINGLE-RUN sweep columns and filed the difference as a regression. Thirteen runs of the Stencil suite at matched disc composition (disc_id=Stencil, 16 captures, same order), one device (thor), four refs, refute it twice over and neither fact needs the other column: (1) 0026f00534 ALONE spans 0 to 180,000 px on one binary and one disc, so the +100,652 px I reported sits strictly inside that binary's own run-to-run spread; (2) 2501f35211 -- the column I called CLEAN -- reaches 140,000 px, and does it on ZERO_ST_DT and ZERO_ST_DT_ZB at exactly 30,000 each, TWO OF THE THREE captures I attributed to the regression. Its 0 was one lucky run. The tip reads 0 to 60,000 over four runs. Rate 7 of 13, reproducing #39's measured 5-in-10 for the full Stencil suite. No commit was bisected because there is no delta to attribute: d406aca77a and d00e9b22d1 are EXONERATED without either diff being read, and the vk/surface.c grant was released unchanged. WHAT I CHECKED AND WHAT I SKIPPED: I did rule out the scorer by re-scoring both capture sets with the same code -- but that established only that the PIXELS differed between those two runs, never that a change caused them to. The control I skipped is the cheap one, a repeat run at the same ref. A two-column sweep diff is TWO SINGLE RUNS, and one run cannot see run-to-run spread. memory/device-run-flakes.md already said to rerun twice before debugging a lone score change; I had the rule and failed to apply it to a sweep column. What caught it was the brief's own ordering: putting the first build at the TIP rather than in the window returned all three ZERO captures exact and a DIFFERENT capture broken at the same total, and a failure that relocates at constant total is nondeterminism, not a fix."
