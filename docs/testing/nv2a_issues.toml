[issue.41]
title = "nv2a: RADIAL fog gen mode with a vertex program fully fogs every quad on hardware"
# VALUE MEASURED 2026-09-12; the FUNCTION is what is unknown, which is not the
# same thing and was previously recorded as the same thing.
#
# The earlier entry here said the six VS radial goldens are saturated, so every
# model that clears the threshold scores alike and the corpus cannot determine
# the value. WRONG, and it hid a measurement. Four of the six are clipped; two
# are not. FogGen_VS-exp-radial and FogGen_VS-exp_abs-radial hold (254, 0, 1)
# on all 181,016 drawn px -- f8 = 1, one step short of the fog colour. The
# suite's combiner is f*(0,0,1) + (1-f)*(1,0,0) and clips at neither end, so
# that is a partial mix and it inverts.
#
# Inverted against silicon's own exp response -- measured from the Fog param
# sweeps at multipliers -2, -1 and -0.5, which agree, rather than assuming
# truncation or rounding (psh.c's 2^x caveat bites exactly in this region) --
# f8 = 1 means fogX in (-0.5000, -0.4600), so:
#
#     the program-mode RADIAL coordinate is in (204.06, 221.81),
#     identical on all 374 quads.
#
# Which settles more than a bound. NOT 200 (kFogEnd and the projection far
# plane both are; at 200 silicon reads f8 = 2). Not geometry-derived: it
# varies by under 17.74 where the fixed-function radial distance over the same
# vertices runs ~19 to ~222, under 8.7% of it. And a saturating "just fully fog
# it" fix does NOT score the same as a correct one -- it leaves 724,064 of the
# cell's 2,172,192 channels.
#
# #41's stale-intermediate mechanism now has a measurement rather than
# plausibility behind it: in FogGen_FF-exp-radial only 5 of 374 quads lie in
# that same 17.74-wide window -- the corners of the final row -- and the last
# quad drawn is one of them. All 30 FF tests run before all 30 VS tests over an
# identical grid, so one stale value explains one constant across all six.
#
# STILL NOT IMPLEMENTED, for a sharper reason than "unknowable": if that is the
# mechanism, the constant is a property of the TEST SCENE. Writing 212.0 into
# vsh.c zeroes the cell and is arbitrary for every other guest -- a110957a with
# a better-measured constant. The faithful version is #42's carried value one
# level harder (|modelview . v| of the last FF vertex, which the CPU cannot
# read back) and is refused at a smaller payoff.
#
# THE EXPERIMENT: one capture, a second VS RADIAL scene after a DIFFERENT
# fixed-function scene, fog params kept interior. Coordinate moves -> scene
# state, permanently unmodellable. Coordinate stays -> hardware constant, and
# the fix is one line. Nothing in the corpus can run it: RADIAL under a program
# appears in fog_gen_tests.cpp and nowhere else, and fog_tests.cpp:27 /
# fog_exceptional_value_tests.cpp:98 both comment it out citing
# abaire/nxdk_pgraph_tests#214.
#
# Ranking unchanged: exclude this cell. It is 2,172,192 of Fog gen's 2,186,760
# structural channels and the suite's real residue is 14,568.
# docs/investigations/fog-vs-radial-band.md, docs/testing/fog_radial_band.py.
suites = ["Fog gen"]
disposition = "unknown-semantics"
status = "unmodellable"
status_note = "The program-mode RADIAL coordinate is measured into (204.06, 221.81) and is identical on all 374 quads: not 200 (where silicon reads f8=2, killing the obvious guess) and not geometry (it varies by under 17.74 where the fixed-function radial distance over the same vertices runs 19 to 222). The recovery chain was pre-registered (predictions/vs-radial-fog-band.json, sha 720edadfa63c) and landed at 0.00 deviation on all six captures against a stated tolerance of 3.0, so the bound is sound. What would separate scene state from a hardware constant is a VS RADIAL scene drawn after a different fixed-function scene, and that capture does not exist: FOG_GEN_MODE_V_RADIAL under a vertex program appears only in fog_gen_tests.cpp, and the two suites that would give a second observation comment it out citing abaire/nxdk_pgraph_tests#214."

# MEASURED 2026-09-12, so this is no longer unknown-semantics. Hardware's
# oFog is an output register that is never cleared: a vertex program that does
# not write it renders with the last value the PREVIOUS program left there. We
# initialise `vec4 oFog = vec4(0.0,0.0,0.0,1.0)` per invocation in
# glsl/vsh.c:213 and then read fogDistance = oFog.x, so a fog-silent program
# fogs with coordinate 0 and the draw renders unfogged. The differing line is
# that initialiser, and the value that belongs there is not a constant.
#
# Pinned two independent ways:
#   Fog_coord_vec4 CoordNotSet -- combiner f*C0 + (1-f)*diffuse with
#     C0 = (0.5,0,0.75) on white diffuse clips at neither end, so the 8-bit
#     factor inverts out of the colour, and EXACTLY ONE factor in 0..255
#     reproduces the golden (223,192,239) on all three channels: 63 =
#     trunc(0.25 x 255), the oFog.x the two priming draws wrote from c[120].
#     diffuse was taken from the suite's own X-0.00 golden so the inversion
#     does not lean on our renderer.
#   Fog_carryover FogCarryover -- in all six fog modes the no-coordinate
#     triangle is BIT-IDENTICAL to the explicit-coordinate one in the same
#     frame, 4,032 px per mode pair, at coordinates 0.6/0.1/0.2 whose biases
#     keep the factor interior. Our explicit-coordinate triangles match gold
#     in all six, which is what isolates the defect to the carried value.
#
# Ruled out: a fixed fallback coordinate (killed by monotonicity alone -- no
# constant is 0.6, 0.1 and 0.2 at once); reading the FOG_COORD attribute when
# the program is fog-silent (fits all eleven Fog_carryover captures, because
# there the previous program copied that attribute into oFog, so the two
# suites are DEGENERATE for that pair -- CoordNotSet separates them, since
# fog_tests.cpp never calls SetFogCoord at all); honouring FOGGEN under a
# program (already dead at +7,449,481 channels, and dead again here because
# an unset program leaves oD1 as unwritten as oFog).
#
# The naive saturating fix is PRICED AND REFUSED: the 10 Carryover<Primitive>
# captures are genuinely clipped so they bound rather than choose the value,
# and such a fix sends them to zero while FogCarryover keeps 8,064 of 12,096 px
# and CoordNotSet keeps all 30,568 with its error TRIPLED from (32,63,16) to
# (96,192,48). The one capture that discriminates is the one it makes worse.
#
# No functional diff yet because the needed value is GPU-resident -- the last
# oFog.x the previous draw's last vertex wrote, surviving a pipeline change --
# which is descriptor-set work in vk/renderer.c, shaders.c and vsh.h. The
# CONDITION is free: whether a program writes oFog is decidable from its text.
[issue.42]
title = "nv2a: the fog output register keeps its last value when a vertex program does not write it"
# Mechanism known, value not obtainable from this corpus. Every failing pixel is
# the draw that omits the fog coordinate -- seven tests fail on exactly 16,384
# px, the quad the test draws without setting one -- and vsh.c:213 starts every
# invocation at vec4(0,0,0,1) where the hardware vertex engine's output register
# keeps its last contents. Whether a program writes oFog is decidable from its
# text; the carried value lives on the GPU, so this is a design decision about
# cross-draw state. FOGGEN_SPEC_ALPHA is NOT the explanation: honouring it in
# the programmable path costs 7,449,481 channels across the fog suites, with
# Fog_coord_vec4 going from nine differing pixels per capture to 61,143. NOTE
# the goldens here are saturated (one to three colours where we differ), so a
# differing-pixel reduction proves nothing about the carried value.
#
# FIXED AND VERIFIED ON DEVICE 2026-09-12, eac0f39b15. CPU-side shadow of the
# last fog coordinate a program wrote, handed to fog-silent programs as a
# `carriedFogCoord` uniform, classified from the program tokens as
# constant-sourced or attribute-sourced -- which is what spans both priming
# styles, and why the attribute-only shortcut could not work. Vulkan only.
#
# A/B over 68 captures, same disc, Alpha_func as the non-fog control:
#   12 better, 0 WORSE, 56 same.  exact 1 -> 9.  643,378 -> 436,875 px.
#   CoordNotSet   30,570 -> 3
#   FogCarryover  12,096 -> 0
#   all ten Carryover<Primitive> captures improved, SEVEN to exactly 0
#   (Points, Poly, QuadStrip, Quads, TriFan, TriStrip, Tris).
#
# NOTE the saturated-goldens caveat above is now partly retracted by
# measurement. Those captures were predicted NOT to improve, on the reasoning
# that a saturated golden bounds the carried value rather than choosing it, and
# that a single carried scalar cannot reproduce a per-vertex-slot register
# file. Seven went to zero. The prediction undershot, and the reason it
# undershot is the useful part: the single-scalar simplification is safe on
# far more of this suite than was claimed for it.
#
# The classifier declines to classify eight encodings rather than guessing,
# leaving the register alone: a masked-off write, a write muxed from a NOP
# unit, a move from a temporary, c[A0+n] relative addressing, two oFog writes
# in one program, a compressed or D3D-swizzled source attribute, tokens past
# the FINAL flag, and fixed function.
suites = ["Fog carryover", "Fog vsh", "Fog coord vec4"]
disposition = "defect"

[issue.43]
title = "Signed blend equations (FUNC_ADD_SIGNED, FUNC_REVERSE_SUBTRACT_SIGNED) are treated as plain add and reverse-subtract"
# SOLVED, not yet implemented. The source is read as a signed byte:
# signed(S) = S - 256 if S >= 128; SADD = clamp(signed(S) + D, 0, 255),
# SREVSUB = clamp(D - signed(S), 0, 255), both factors ignored. Fits 7,849 of
# 7,849 across Blend tests and Texture signed component, four destination
# values. Vulkan cannot express it -- a fixed-point attachment clamps the
# source to [0,1] before blending, killing the negative half -- so it needs a
# float intermediate or shader-side blending.
# docs/investigations/signed-blend-equations.md.
#
# VALIDATED 2026-09-12 on 15x the data, against the full 1,568-test oracle
# rather than the 105 #spot_ grids the rule was fitted on: 448/448 signed
# captures and 176,160,768 of 176,160,768 channels exact, with 0 of 224 factor
# pairs deviating on either equation. There is no residual to characterise.
# The control passed first -- 1,120/1,120 unsigned captures, 440,401,920
# channels -- and seven rival rules were scored on the same goldens and
# rejected (sign threshold 127 and 129, wrap rather than saturate, signed
# destination, factors honoured, 0.5 bias, destination-only signing), nearest
# at 135,697,408/176,160,768. The rule also holds on ALPHA, which the #spot_
# fit could not reach, so it survives being composed with itself.
#
# Two things for whoever implements it. Fixing this will NOT make these
# captures exact -- stack C stays wrong until #50 lands, so whole-capture
# exactness will read as no progress; score stacks A and B, where the prize is
# 91,557,488 channels. And the cost is entirely in the implementation shape,
# not the rule: Vulkan cannot express it, so it needs a float intermediate or
# shader-side blending, and the three candidate shapes are in
# signed-blend-equations.md.
# docs/investigations/blend-signed-full-oracle.md.
disposition = "defect"
suites = ["Blend tests", "Texture signed component tests"]
status = "fixed-part"
status_note = "The factor half landed (ab4a829316, through pgraph_vk_effective_blend_reg so the static pipeline, the eds3 path, the reorder snapshot and the cache key all agree) and arm 7cbd8dd029 -> ec0560d28b is PRE-REGISTERED PASS on all 124 checks: every one of the 856,098 channels whose source byte is below 128 is now exact in both captures, against 594,738 and 592,409 wrong before, 28 better 4 worse, -179,872 px. The sign fold remains -- 365,491 channels per capture, a defect with a known rule that provably cannot be blend state, since silicon's output steps 254 -> 0 between adjacent source bytes at D=127 and every Vulkan blend op is a continuous map of the source."

# MEASURED 2026-09-12: real, reproducible at ~46% of runs, and DISTINCT from
# #39. The fix is not in the texture path.
#
# Run-to-run on an identical binary and disc, same goldens: 136 px, then 0 px,
# then 0 px -- the two passes byte-identical to the golden. Across 24
# border-suite runs, 11 fail and 13 pass byte-identically, all 11 failing
# images distinct, failures interleaving with passes with no relation to any
# commit. Far too frequent to be the single-run band MEMORY.md warns about, and
# it straddles ad1caa07 unchanged (3 fails in the 9 runs before, 8 in the 15
# after), so the staleness trap does not apply.
#
# Five things that together identify it as a mid-write UPLOAD race rather than
# anything else:
#   - the stale pixels hold only this texture's OWN pass-1 checker values,
#     each correct for its own position, so not contamination (consistent
#     with #19)
#   - all 12 failure masks form a total order under set inclusion, 0
#     violations of 39 unordered pairs, with no differing pixel beyond each
#     capture's own frontier -- predicted before being measured
#   - differencing consecutive nested masks shows the frontier advancing
#     bottom-to-top and right-to-left in increments of 2-50 px
#   - the stale set is a prefix/suffix in NONE of row-major, column-major or
#     either Morton order, so it is not a missed page: a missed 4 KB page of a
#     swizzled 64x64 A8R8G8B8 would be an aligned 32x32 Morton block, and five
#     simultaneously-partial rows is not that. Rules out the dirty-bitmap class
#     that 91742b407b / 3bb7628694 / 91e3da1d6e addressed.
#   - TWO swatches are affected, not the one this issue records: band A at
#     y 272-335 and band B at y 80-143, both in the rightmost column
#     (x 512-575), and they occur INDEPENDENTLY at the rate independence
#     predicts (1.1 expected "both", 1 observed). A deterministic defect in the
#     bordered-texture path would hit both together; each upload racing
#     separately explains it.
#
# Why not #39: same class (host/guest timing nondeterminism), different defect.
# #39's symptom is a draw's result being LOST -- whole quads holding previous
# content -- with the command stream provably identical between passing and
# failing runs and no partial-content signature. Here the draw lands correctly
# and a sub-region of the texture it sampled is stale, with a monotone frontier.
# Merging them would discard the cleanest run-to-run fingerprint in the project.
#
# INFERRED, not measured: the frontier always lands in interior rows 6-10 of 64
# and cols 6-50, a fixed-phase race with small jitter, and since the write runs
# bottom-up the stale rows are the LAST written -- which reads as the guest's
# most recent stores not yet visible to pfifo_thread on a weakly-ordered
# aarch64 host. That puts the fix in the pfifo/DMA path, not in texture.c,
# which cannot know the guest intends more writes.
#
# CONFIRMED 2026-09-12 on the desktop x86 lane: 20 runs of the Texture_border
# isolation disc, same binary, same ISO, fresh pristine HDD each run, cold
# shader cache. All 20 captures BYTE-IDENTICAL TO ONE ANOTHER -- not "20
# passes", zero variance. Intermittency 0% on desktop against ~46% on the
# Nova. The prediction was 0 failures and it held.
#
# So the store-visibility reading survives and the Vulkan renderer is
# excluded, as is the dirty-bitmap class (already dead on the Morton-order
# check). The fix is a barrier in the pfifo/DMA path: the guest's most recent
# stores are not yet visible to pfifo_thread on a weakly-ordered aarch64 host.
# Not in texture.c, which cannot know the guest intends more writes.
#
# A CAVEAT THAT APPLIES BEYOND THIS ISSUE, and it nearly inverted the result.
# Each of those 20 desktop runs differs from the GOLDEN by exactly 2,782 px,
# with a uniform per-channel delta of (0, -1, -1) and max |delta| 1 -- red
# exact, green and blue one step low, everywhere, every run, scattered over a
# 188x171 region. Deterministic, nothing to do with #44: lavapipe rounds those
# two channels down where Adreno does not.
#
# Under a pass/fail metric desktop therefore scores 0/20 while the Nova scores
# 13/24, which reads as desktop being WORSE and is exactly the wrong
# conclusion. A cross-host test needs TWO numbers -- intermittency and
# residue-against-golden -- and collapsing them is how #51 spent two sessions
# being inferred around. The desktop lane cannot be used as a byte-exact
# oracle for this suite without first accounting for that one step on G and B.
