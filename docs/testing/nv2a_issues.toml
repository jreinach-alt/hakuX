# Tracker issue -> pgraph test suites.
#
# This is the ONE hand-maintained table in the index. Everything else in
# nv2a_index.json is derived from the emulator tree and the nxdk_pgraph_tests
# source, and regenerates.
#
# It is hand-written because only a human decided which suites a given issue is
# about. It is still checked: `nv2a_index.py check` fails if any suite named
# here is not a real derived suite name, so a rename upstream or a typo here is
# caught rather than silently dropping a suite from every query.
#
# Suite names must match the DERIVED spelling exactly (spaces, not underscores
# -- the underscored form is the results directory name, and the index carries
# that separately as results_name).

[issue.3]
title = "Texture addressing: borders, wrap modes, cubemaps and perspective"
suites = ["Texture border", "Texture border color", "TextureWrapMode",
          "Texture cubemap", "Texture 2D as cubemap", "Texture perspective",
          "Texture perspective enable", "Texture anisotropy", "Texture 3D as 2D"]

[issue.4]
