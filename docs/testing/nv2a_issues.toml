[issue.50]
title = "Blend tests: DrawColorAndAlphaStack's stack is wrong on 1,567 of 1,568 captures; mechanism unknown, not a reversal"
# The largest structural entry on the board, 6,500,124 channels, and NOT a blend
# defect. 1_ADD_0 is src=ONE dst=ZERO -- the blend unit contributes nothing --
# and the stack still comes out with its four swatch colours in exact reverse
# vertical order. 443 of the 1,568 oracle captures differ on exactly 16,384 px
# in the identical box (rows 112-367, cols 560-623), one full stack of four
# 64px swatches. Cols 16-76 are asymmetric too and match hardware exactly, so it
# is not a global flip hidden by symmetry. Five mechanisms measured dead,
# including draw-queue merging (check_draw_mergeable forced false over all 1,568
# captures moved zero pixels) and the arithmetic itself (4,480/4,480 quads exact
# at centres). Two readings remain, reversed placement or reversed colour
# assignment, and this capture cannot separate them -- a variant with unequal
# swatch heights would.
#
# Retitled 2026-09-12: the reversal is NOT the mechanism, and two more are dead.
# Render-target aliasing -- that stack C shows stack A's content, which would
# explain the apparent order, since the two functions draw the same four
# colours in OPPOSITE order -- matches neither our own stack A nor the
# golden's, 0 of 1,568. Exact band reversal is false too: on 1,567 of 1,568
# captures NO band matches ANY golden band bit-exactly in any position, so the
# bands differ in value and not only in order. As a tendency reversal is mixed
