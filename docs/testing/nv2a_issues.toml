[issue.61]
title = "Vulkan: frame_submitted is read non-atomically at two sites that gate surface reuse and descriptor-ring reset"
no_suites = "a non-atomic read of cross-thread state is not observable by pixel count; the arm that would judge a fix is an inertness arm, and any capture moving would mean the reads were not previously benign"
disposition = "defect"
status = "fixed-verified"
status_note = "CLOSED as a code-quality finding, reported as one rather than dressed up. frame_submitted[] is written with qatomic_set from two threads and was read plainly at the two sites where being wrong costs most: surface_in_flight() answers both get_any_compatible_invalid_surface(), which hands an invalidated surface's image to a new draw, and prune_invalid_surfaces(), which destroys it -- same predicate, opposite actions. Both now qatomic_read; the two remaining plain reads are each preceded by render_thread_wait_idle so both writers are quiesced. Scope stated honestly: relaxed atomics close the compiler half only, the ARM ordering half needs release/acquire and is explicitly not done. Arm PRE-REGISTERED PASS on 263 checks, and every capture BYTE-DIFFED between arms rather than counted: 255 of 255 byte-identical."

[issue.62]
title = "GL renderer: five findings from a second pass over gl/surface.c (an R5G6B5 abort, an over-read, and three nits)"
no_suites = "gl/surface.c and the Android GL path only; the device lane is Vulkan, so no suite on any scorable disc reaches these sites"
