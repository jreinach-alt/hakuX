[issue.49]
title = "Viewport: two fractional offsets (-7/16 and +9/16) differ by 698 px each, none of it one-step"
# MEASURED DEAD in the vertex-shader generators: no snap rule can fix this, and
# that is proved rather than suspected. Both offsets are congruent to 9/16
# mod 1, so the post-offset coordinate lands exactly ON a 1/16 grid line where
# roundScreenCoords is the identity, and coverage is decided by the last bit of
# the transform above it. Every rule expressible there -- truncate, floor,
# round, any grid size, any pre- or post-snap bias, any sample point -- is
# invariant under integer translation of its input, and hardware resolves
# x = 120 + 9/16 and x = 320 + 9/16 in OPPOSITE directions, in the same quad at
# identical y and w. Read as full 99-100 px edge runs, never point samples.
#
# Convention is otherwise identical to hardware everywhere visible, pinned by
# the ten passing captures: truncate to 1/16, sample at pixel + 0.5, left/top
# edge inclusive, VPOFF added in the fixed-function path and not the
# programmable one.
#
# INFERRED cause, named but not modelled: vsh-ff.c:677 does `oPos.xy /= oPos.w`,
# a correctly-rounded fp32 divide that returns the exact integer whenever the
# true quotient is within half an ULP -- which is why we land at-or-above at
# all five x. The NV2A vertex ALU has no divide, only a limited-precision
# reciprocal followed by a multiply, whose ~2^-22 error is a few ULP of a
# coordinate near 320.
#
# The best rule-shaped change was computed and DELIBERATELY NOT SHIPPED: a
# pre-snap bias under 1/32, invisible in the ten passing captures, takes
# 1,396 px -> 888 px by fixing three x vertices and breaking two. A 36%
# reduction of the wrong shape is the wrong-mechanism signature.
#
# Also ruled out: a missing half-pixel term in either path; VPSCL (inert on
# both sides -- the five scale-2.0 captures equal their scale-0 twins); a host
# split (#11 has both lanes failing the same two); stale inputs (captures
# 2026-09-12, goldens Sep 9, both newer than the last vertex-path change);
# cross-test contamination (the two failures are the two offsets congruent to
# 9/16 wherever they sit in disc order).
#
# The experiment that would restart it: a disc sweeping a fixed-function vertex
# across n + 9/16 +/- 2^-k, to characterise the NV2A transform's rounding
# instead of guessing it. The per-vertex table such a disc must reproduce is in
# the write-up. docs/investigations/viewport-9-16-boundary.md,
# docs/testing/probe_viewport_ff_extents.py.
suites = ["Viewport"]

