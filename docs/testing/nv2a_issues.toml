he validity gate on arm A ALONE, needing >=2 wrong of 64 -- HOLDS at 6, so THE DEFECT IS LIVE AT MAINLINE and this is not a decision about a historical bug. That gate existed because this issue's OTHER observable (Texture border stale_px) died at the tip and would have passed by luck. V1 holds; P under arm A's own tip rate of 9.375% is 0.18%. V2 is on the direct counter, not a proxy. Floor scoped to its disc and carried nowhere: 40 wrong of 416 observations over 26 runs whose disc_id is exactly 'Stencil'. AGAINST THE 2026-09-13 BASELINE: #79 measured 7 of 64 -> 0 and 3 of 4 flaking -> 0 at refs 535 commits back; the tip reproduces 6 of 64 -> 0 and 2 of 4 -> 0. Pooled, 13 wrong of 128 at mode 0 against 0 of 128 at mode 1. The mechanism certified at 535-behind IS the mechanism at mainline. STILL OPEN, and the lane is right not to call the recommendation yet: MODE 2 HAS NEVER BEEN RUN ON THE VERTEX OBSERVABLE. That cell decides whether the owner's real choice is off-versus-mode-1 or off-versus-mode-2, and it is queued now, at cc8fb579c4. Also queued: the three-mode Galleon cost sweep and six Crimson soaks for the Tr row, the latter with a T0 validity gate on the mode-0 control (Tr >= 0.40 of uploads or the sweep is void) for exactly the reason the border observable died, an impossible row at T3 with a known value, and T5 on the BAIL RATE rather than held/kicks -- which read 0.7026 on Crimson for a mode 2 that was working perfectly. No gfps leg, because probe-on runs are not comparable with stock ones. CORRECTIONS LANDED IN THE SOURCE by the same lane under its vk/draw.c grant (fede09c691): pfifo.c's 148,704:180 sizing is wrong TWICE -- the 180 is the measured TEST's draw count against 5,286 draw-publishing submissions on that disc, so 27:1 and not 826:1, corrected in guest-pgraph-skew.md and never propagated, AND it is a property of the disc rather than of any workload. That comment is where the audit's M4 prior was read from, so it now says so and points at scan(nodraw=), which measures it live for nothing. THE PUBLISHED COST DOES NOT REPRODUCE AT THE TIP, measured 2026-09-14 on the thor, Galleon, 240 s, stock builds, and it points the OPPOSITE WAY from everything written here. Mode 0: gfps p50/p90/max 29/29/32 and 29/29/30, kicks 115,890 and 110,860, held/kicks 0.0000. Mode 1: 17/28/31, held/kicks 1.0000, held_mean 1,132,681 ns. Mode 2: 17/27/29, held/kicks 0.9677, held_mean 1,148,723 ns. THE PUBLISHED FIGURE IS p90 29 -> 13, max 30 -> 15, guest blocked 40.7% of wall clock at a hold mean of 2,245,410 ns. At the tip the p90 falls by ONE, the max by 1-3, and the hold mean is HALF what the nova measured. The lane's registered G2 leg -- p90(mode 0) - p90(mode 1) >= 8 -- will FAIL, and it fails with G0 HOLDING at 29, so this is NOT the unsatisfiable-fall shape: the baseline had all 16 points to give and the fall simply did not happen. NOT OVERCLAIMED, in two directions, and the lane stated both: the CEILING is the registered statistic because #64 establishes that the median tracks run occupancy and the ceiling is the robust one, and on that statistic the bound now costs about ONE FRAME -- but the p50 does move 29 -> 17 in both bounded arms, so the cost has not vanished, it has moved out of the ceiling and into the lower half of the distribution. 'No longer halves the frame-rate ceiling of a real title' is defensible; 'free' is not. WHAT CANNOT BE SEPARATED: 535 commits of performance work landed between ec7f50e859 and this tip, and thor-vs-nova is confounded with it -- devices.sh's equivalence check covers capture bytes on two colour-buffer suites and says NOTHING about frame pacing. The lane refused to guess, which is right. AND THE CELL THAT DECIDES WHICH BOUND IS IN: mode 2's Stencil arm, PRE-REGISTERED PASS 16 of 16. Mode 0 tip 6 wrong of 64 over 2 of 4 runs; mode 1 0 of 64, held/kicks 1.0000; MODE 2 0 of 64, held/kicks 0.0235-0.0240. Read the last column against the second: MODE 2 BUYS MODE 1'S ENTIRE ACCURACY WHILE HOLDING THE