status = "fixed-part"
status_note = "All eight findings measure zero on the desktop lane, and the null result carries a positive control: rebuilding 2337519c, the binary this was filed against, reproduces this issue's own numbers -- 24,126 Validation Errors and exactly the 17 SYNC-HAZARD-READ-AFTER-WRITE it tabulates. The fixes are e7998e7fdd (descriptor set recycled while still bound, 22,613 -> 0), 83a47188f7 (push template against an incompatible pipeline layout, 2,666 -> 0, with its 228-message echo), 0a428d5b62, 8f49518936, 9e39ca431a, 136b15a40d and 4b42532466, all ancestors of HEAD and none reverted. No ab_compare arm exists or can: a VUID count is not a capture. What remains is a measurement gap rather than a defect -- the Adreno confirmation this closes on has never run because nothing in android/ packages libVkLayer_khronos_validation.so, so instance.c:111 finds no available layer and all 266 device logcats under dispatch/results carry no VUID at all. The device nondeterminism it was ranked on measures zero: 763 repeated captures across six 2-run arms, band 0 on every one."

[issue.38]
title = "One-step colour differences from hardware across many suites (rounding, interpolation, blending)"
suites = ["3D primitive", "Alpha func", "Attrib carryover", "Attrib float", "Attrib setter", "Context switch", "Image blit", "Lighting normals", "Point size", "Surface clip", "Texgen with texture matrix"]
disposition = "defect"
status = "fixed-part"
status_note = "Mechanism 1 is decided, implemented and confirmed by slope rather than by position: silicon quantises the vertex colour to its byte BEFORE the interpolator (colorPrecision in glsl/vsh.c plus dca3c94b98), and arm ff1604d457 -> dca3c94b98 is PRE-REGISTERED with the green band's slope moving 2.53 -> 3.01 against a hardware 3.00, 169 better 10 worse, -489,757 px. It reads FAIL because three must-not-move captures moved, all three BETTER and two of them to zero. Mechanism 2 is measured and NOT implemented: hardware holds the fragment colour constant across an even-aligned pixel pair and evaluates it at the pair's right edge, s = 2*floor(x/2)+2, 0 wrong of 512 on both Alpha_func bands with two out-of-sample confirmations, but only 3 of 1,162 measurable captures are paired and what selects those draws is unestablished -- the conjunction that fits is fitted to two positives. Mechanism 3 (Image_blit, -0.70 bias over 515,562 one-step px) is untouched and is its own lead; mechanism 4 is #16's. The 201 one-step-symmetric captures are a measured precision floor: two independent hosts agree to a tenth of a percent on the one-step share."

[issue.39]
title = "Vulkan: a draw's result is intermittently lost, same disc and binary, run to run"
suites = ["Texture render target", "Texture format", "Stencil", "Depth buffer fixed function"]
disposition = "defect"
status = "open"
status_note = "The first root cause was real and is fixed -- 2dd232172c carries a vertex RAM upload to every frame of the ring, not just the next, and is in HEAD unreverted -- but a second mechanism survives it: rebuilding 2dd232172c ITSELF measures 3 failures in 15 against ~3 in 10 at HEAD, statistically identical, so there is no regression to bisect and the fix never addressed this. No pre-registered arm exists and none can judge it: the defect is a ~30% coin flip on a single capture, which is what a single-arm A/B cannot see. Eliminated by measurement: contamination, draw reordering, deferred replay, no-op misclassification, inline clear, pipeline rebinding, per-draw state, pipeline/render-pass/framebuffer identity, cross-command-buffer state (0 mismatches in 165 draws), recording/submit overlap (0 of 161). Every intervention is a timing knob and the full validation layer closes the window outright (0 of 7), which is a statement about the instrument. Desktop-lavapipe-lane only so far: 763 repeated Adreno captures across six 2-run arms give band 0 on every one. Its own recommendation has landed as ab_compare's measured --runs N band."

