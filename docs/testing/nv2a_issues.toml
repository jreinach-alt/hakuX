# DXT1's residual is a correct block decode plus a per-texel perturbation
# with 5-6-5 truncation statistics (mean -0.5, std 2.33/1.13/2.27, green
# exactly half of red and blue). Not positional, not a function of the
# palette value, not on a replication grid. Needs a dump of what the
# texture unit emits, not more fitting. See #4's DXT1 comments.
[issue.6]
title = "DXT1 decode rounding differs from silicon"
disposition = "unknown-semantics"
suites = ["Texture DXT"]

