status_note = "CLOSED ON GITHUB, NOT FIXED ON THIS BRANCH -- recorded as open here deliberately, because the tracker's job is to say what is true of HEAD. The suite splits perfectly on one bit: every capture where the renderers disagree is a pers_n case (SET_CONTROL0 texture perspective off) and every pers_y case is byte-identical between them, e.g. TexPerspective_Textured 9,014 under GL against Vulkan's 1. Cause is one line in glsl/common.c: the gate is `noperspective && location` and location is Vulkan-only, so the GL renderer never emits the qualifier. Worth 159,574 px measured. THE FOLD-IN HAS NOW HAPPENED and that reading is history: the whole 53-commit remote lane was merged into this branch on 2026-09-13, so 0092dd53 and 2c25f7195e are both ancestors of HEAD and the `fixed-unlanded` gate in check_coverage.py fired exactly as it was designed to. WHAT IS AND IS NOT ESTABLISHED HERE: the code is on the branch and the Android build compiles it, GRADLE_EXIT=0. The 159,574 px was measured by lane.remote on ITS branch under the desktop GL renderer, and NOTHING ON THIS BRANCH HAS RE-MEASURED IT. So this is `fixed-part` on the strength of another lane's arm rather than of ours; the pers_n/pers_y split is the falsifier that would upgrade it, because the suite divides perfectly on that one bit. Condition attached to the glsl/common.c grant, and it still applies to whatever lands: the fix must distinguish DESKTOP GL from GLES, because noperspective is core in desktop GLSL 1.30+ but needs GL_NV_shader_noperspective_interpolation on GLES, where the failure mode is a shader that does not compile."
