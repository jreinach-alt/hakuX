status_note = "CORRECTED 2026-09-14 BY READING THE TREE: findings 1 and 3 ARE FIXED HERE, and the paragraph below saying they are still live is wrong. It reasoned from a763b1d4fc not being an ancestor of HEAD, which on this repo is the NORMAL state for work that shipped -- lane work is rebased in under a different sha. Verified in the live file instead of from ancestry: FINDING 1, gl/surface.c:561 now carries `case NV097_SET_SURFACE_FORMAT_COLOR_LE_R5G6B5:` with a full conversion body and a comment naming exactly why the old default: was reachable (both gates in front admit R5G6B5, and what hid it was the render_surface_to() blit returning only for GL_TEXTURE_2D and only on success). FINDING 3, gl/surface.c:1368-1390 now computes texsize from the TEXTURE shape after pgraph_apply_scaling_factor, takes bufsize = max(bufsize, texsize), and only then g_mallocs -- so the over-read is gone, and the comment is explicit that the row stride is still the texture width so a genuine mismatch shears the image, which is a separate unanswered question. It landed as 013181dfef, which is NOT byte-identical to a763b1d4fc -- it carries one extra comment line because it landed on a tree where android_expand_6_to_8 already existed from f009555537 (#59) -- so check_cited_commits.py reports the cited sha ABSENT and is right by its own definition: ABSENT means no byte-identical patch, not that the work is missing. The remaining findings of the six have NOT been re-checked this way and the paragraph below still stands for them. ORIGINAL FOLLOWS. The comment on this issue records a fix that does not exist here. a763b1d4fc is NOT an ancestor of HEAD -- git branch --contains puts it only on remotes/origin/claude/docs-tooling-agentic-coding-u152m1 -- so findings 1 and 3, reported as fixed, are both still live: android_surface_guest_to_rgba8 handles exactly X1R5G5B5_Z1R5G5B5, X8R8G8B8_Z8R8G8B8 and A8R8G8B8 with g_assert_not_reached in default and no R5G6B5 case, while both gates in front of it admit R5G6B5; and render_surface_to_texture_slow at gl/surface.c:1335 still sizes bufsize from the surface dimensions and then reassigns width/height to the texture shape's before buf is consumed. Of the six listed findings, zero landed on this branch. The only thing that did land is the NEON 565 body disagreeing with its own scalar tail, as c234c1cc3f, and it landed under #59. This is the remote-lane fold-in gap docs/orchestration.md warns about."

[issue.67]
title = "Blend tests swatch over-extent is the guest's floorf: x87 FRNDINT ignores the guest rounding-control field on the Android FP JIT path"
suites = ["Blend tests", "Point size"]
disposition = "defect"
status = "fixed-verified"
status_note = "FIXED AND MEASURED ON A DEVICE 2026-09-13. Fix is 55551aef95 by lane.remote, cherry-picked here as bc4bebcee0: floatx80_round_to_int was ((void)(s), rint(a)) and the discarded argument carries the guest RC field, so nxdk floorf became rint; it now switches on float_rounding_mode to floor/ceil/trunc. Judged by arms 1789347057-2287889/2288027, PRE-REGISTERED against issue67-frndint-device-legs-v2.json, bound sha256 a5f596cf5742. 121 OF 122 CHECKS PASS: all 105 Blend_tests/#spot_* to 0 as separate legs, all four Point_size legs to 0, and Viewport/* unmoved. The single violation is expect_counts worse=0 against a measured 1, and that 1 is Stencil/Stencil_ZERO_ST_DT -- #79, which this campaign measured at nine of sixteen Stencil captures varying WITHIN an arm. It tripped on a DIFFERENT Stencil capture than the first pair did, which is itself the confirmation. FOURTH LESSON FROM THIS ARM, recorded because it cost a clean PASS: excluding a suite from must_not_move does NOT exclude it from the global expect_counts, so a worse=0 leg is unsatisfiable on any disc carrying a known-noisy suite. REPRODUCIBILITY, nine runs total: Blend_tests reads 1,711,362 px in every arm-A run and 0 in every arm-B run, bit-identical, zero captures unstable; Point_size stable, its 2,167 px delta exactly 1,099 + 1,040 + 14 + 14; Viewport 1,396 px in all six of the first campaign runs. The first attempt (issue67-frndint-device-legs.json, arms 1789345024/1789345036) is kept and FAILED, 17 of 29, for three reasons written up in docs/investigations/issue67-frndint-device-arm.md: ten expect legs in the wrong spelling that matched no capture and so could not fail, absolutes re-derived from a stale sweep where #43 ink still existed, and Stencil registered as a control it cannot be. ORIGINAL ANALYSIS FOLLOWS. Not a rasterisation defect and not in the graphics pipeline at all. blend_tests.cpp computes its whole TestSpot layout from three floorf calls, and exactly one of them moves: color_swatch_size = floorf(test_width / 4) = floorf(24.75) is 24 on silicon and 25 in our render, while test_width = floorf(99.2) = 99 and test_height = floorf(136.0) = 136 are unchanged in both -- the two calls where floor and round-to-nearest agree, which is what makes it a rule and not a fitted constant. Building one cell's primitive-ownership map from blend_tests.cpp alone under swatch 24 and swatch 25 gives an ownership-change set of exactly 1,276 px, which is the per-cell seam count the #43 lane measured from the captures before anyone knew what it was; over all 75 unsigned #spot_* captures the union of every differing pixel EQUALS that set as a set (union 1,276, intersection 1,276) with 1,168,902 px inside and 0 outside. Re-decided on a suite sharing no code: Point_size's increment = floorf(85.714) is 85 on silicon and 86 in ours -- and the 14 px that displaces is the entire residual of SmallestPointSize_FF and _VS -- while cy = floorf(138.667) is 138 against our 139, read off LargestPointSize's green rows at (102,307) against our (103,309). Three arguments, three fractional parts, three suites, no free parameter. Cause is target/i386/tcg/fpu_helper.c:266, `#define floatx80_round_to_int(a, s) ((void)(s), rint(a))` in the #if XBOX && __aarch64__ USE_HARD_FPU block: helper_frndint passes env->fp_status and the macro discards it, so FRNDINT rounds per the HOST environment (nearest-even) and nxdk's floorf -- save CW, RC=down, FRNDINT, restore -- becomes rint. The mode itself is fine; update_fp_status is compiled once outside the hard block and env->fp_status.float_rounding_mode is correct when FRNDINT runs. Android FP JIT only (g_config.perf.fp_jit, default on); the x86_64 hard path leaves the macro as softfloat, so this class is invisible on the desktop lane and with fp_jit off. NOTHING EDITED: target/** is lane.remote's in territory.toml wave 10. Diff, legs and a same-disc Viewport/Stencil guard are in docs/investigations/guest-frndint-ignores-rounding-mode.md; docs/testing/guest_frndint_rounding.py reproduces both legs offline with no device. Two corrections to the filing: 1.44M px is the union bound (19,140 = 1,276 x 15) and the measured total over the 75 unsigned captures is 1,168,902, range 6,154 to 19,140; and the thirty signed captures are not all 104,205 -- #spot_1-cA_SREVSUB is 103,440. Adjacent and deliberately not bundled: the same block's floatx80_to_int32/int64 are C casts, so FIST/FISTP truncate where x86 rounds per RC."

[issue.68]
title = "tcg: whole-page invalidation discards ~40,000 live blocks per run of which essentially none were written (ov median 0, max 3); the block-extent lever is dead on feasibility"
component = "tcg"
no_suites = "not a pgraph suite defect: this is TCG/FPU behaviour, so no golden suite scores it"
disposition = "defect"
blocker_falsifier = "if 'a five-year-old SMC correctness decision' were false, git log -S on the `#ifndef XBOX` that disables the range test would date it inside the fork's recent perf work; and if 'correctness decision' were false, that commit would carry no SMC rationale while the predicate and its inputs would still be sitting in the file."
blocker_tested = "date CONFIRMED, justification REFUTED. 703566ce33 'tcg: Invalidate all TBs on target page', Matt Borgerson, 2021-10-04 -- 4y11m, so 'five-year-old' is fair. But the commit body is EMPTY: no rationale, no SMC reference, no comment added; the diff just wraps the range test in `#ifndef XBOX`. The range data was never dropped (translation-block.h:111 `uint16_t size`, :129 `page_addr[2]`); the predicate is still in the file, merely compiled out (tb-maint.c:1384-1398); and it has ALREADY been re-extracted as a live helper `tb_overlaps_written_range()` at tb-maint.c:1313-1329, called for counting at :1414. 'Restoring the range test' is swapping `{` for `if (tb_overlaps_written_range(...))`. And it is NOT 'on every guest instruction': the site is tb_invalidate_phys_page_range__locked, reached only via a guest store to a RAM page holding translated code, gated at cputlb.c:1403 on DIRTY_MEMORY_CODE. It changes zero TCG output. THE DEFENSIBLE BLOCKER THE TEXT DOES NOT STATE: tb_gen_superblock sets tb->size = a_size and links B's page as page_addr1, so the n==1 arithmetic at tb-maint.c:1394 would be ARBITRARY rather than conservative for a superblock. Currently inert (XBOX_SUPERBLOCK_ENABLED 0, cpu-exec.c:313), but it is the real precondition for restoring the test."
status = "fixed-part"
status_note = "Measured over six Crimson Skies soaks. sp_share over LIVE blocks is 1.000 with four independent checks on what a systematic error would do, the last not using the predicate at all: the notdirty tracker puts the stores in 1,168- and 540-byte windows of 4,096-byte pages -- two hot data structures sharing a page with code. New cost symbol tcg_flush_jmp_cache 8.77% self, scaling with discards not visits. The block-extent lever is dead separately: blk is already 5.97-6.49 guest instructions, below the 8 the clamp was written at, so it could never bind."
blocked_on = "ANSWERED 2026-09-14 BY THE THREE-ARM RE-RUN, and the answer is that the counters BOUND the trade without SETTLING it. Nine 90 s Crimson Skies soaks, three per ref, prediction committed before queueing, chain verified by rev-parse of each ref's PARENT. EVERY REGISTERED LEG HOLDS. THE MIDDLE ARM MOVES BOTH HALVES IN OPPOSITE DIRECTIONS, which is why two arms could not answer it: #73 alone removes the stranded population (ai/visited 0.93 -> 0.000) and 85% of events and visits, but with nothing stranded to block it EVERY event now empties its page (em/ev -> 1.000) and pr == em, so #73 ALONE RAISES the arming walk 930-1868 -> 2160-2199. So two figures from the two-arm run were wrong in OPPOSITE directions: #68's prize is BIGGER (pr 2162 -> 0, not 1846 -> 0) and its visited cost is 6x BIGGER (3,605x attributable to #68 alone, not the ~560x that spanned both commits, splitting as ev 46.8x times page-list length 79.1x -- and only the first factor appears in `stores`, confirming leg 68-4's blind spot). NONE OF THE THREE STOP-THE-FOLD THRESHOLDS FIRED: the list plateaus (0.995/0.901/0.968 against 1.25), sits at ~a third of a 4 KiB page's capacity, and stores rose 4.44x against a 10x stop. AND IT STILL DOES NOT LICENSE THE FOLD. R = 3,627 visits added per arming walk removed; in like units #68 removes >=12.6M TLB entry touches per window and adds 7.84M page-list visits plus 99,055 extra slow stores, i.e. >=1.6 touches removed per visit added -- A LOWER BOUND. A contiguous array scan and a linked-list pointer chase are not equivalent per touch, and the difference is enough to invert 1.6:1, and the extra slow stores are on neither side. THE NEXT STEP IS A DIRECT TIMING INSTRUMENT, NOT ANOTHER SOAK. Full record in docs/investigations/tcg-invalidation-three-arm.md. RE-DISPATCHED 2026-09-14 to lane.tcgarm, wave 53: three arms this time -- 117203fe9b (neither), a94386a3c8 (#73 ALONE, the arm the first attempt never ran) and 937848c9e7 (#73 + #68) -- plus the leg nobody had, bounding `visited`. AND M5 IS ORDERED BEHIND THIS, deliberately rather than deferred: the same soaks show tb_gen_code calls falling 34x and the recycle rate going 35.0 -> 1.000 under 937848c9e7, so #68 removes most of the traffic M5 is about. Sizing an MRU-N bound now would size it against a population about to change by 34x. RETRACTED AND REPLACED 2026-09-14. I recorded here that the arm was VOID by its own instrument. IT WAS NOT -- the instrument was wrong. tcg_pages.py hard-coded sp + ov == di, which holds only while the loop discards every live block it visits, i.e. under whole-page invalidation, which is exactly what 937848c9e7 stops doing: a spared block is a VISIT, not a discard. The held commit's own message said so before any soak ran -- 'visits = discards + already no longer holds, deliberately' -- and I read the instrument's complaint rather than the commit. WHAT HOLDS, off the same six logcats: xx == 0 in both arms; di == ov + sp holds 22/22x3 on arm A and fails on arm B; di == ov + ai does the reverse; and visited == ov + sp + ai holds in BOTH, which is the population identity and is invariant across this change. The 160,836,959 residual is the SPARED COUNT and the 573x visited rise is leg 68-3 happening. RE-JUDGED: G, 68-1 (em 42,456 -> 12), 68-3 and 68-4 PASS. 68-2's pr_per_em FAILS because leg 68-1 OF THE SAME PREDICTION drives its denominator to zero -- it should have been pr per generation. 73-1/73-2 are NOT ATTRIBUTABLE: the prediction specified THREE arms and two ran, so arm B on disk is #68 stacked on #73. IT STILL MUST NOT FOLD, for a reason nobody had before: visits rose ~560x, 13,270 to 7.5M per window, each a page-list traversal plus a range test, and leg 68-4 counts STORES and cannot see it. It plateaus at 70-95 visits/event from window 5 in all three runs -- steady state, not a leak -- but bounded by translation-buffer flush, which #68 does not control. THE RE-DISPATCH NEEDS THE MISSING MIDDLE ARM (three soaks at #73 alone) AND A LEG BOUNDING visited. THE ARM RAN AND IS VOID BY ITS OWN INSTRUMENT, 2026-09-14. Six soaks, three per ref, judged with tcg_pages.py against the prediction lane.tcginval -- since RETIRED -- registered before any of them ran. No lane holds this; what it needs next is a lane on the INSTRUMENT. ARM A IS COHERENT: xx = 0 over 21 windows, sp + ov == di in EVERY window, visits 280,384 = discards 40,880 + already-invalid 239,504 with residual 0, waste 11.69 discards per generation. ARM B DISAGREES WITH ITSELF: sp + ov != di in 21 of 21 windows -- two separate counts of the same live population on ONE log line, which must agree exactly -- and visited is up 573x to 160,838,266 with a residual of 160,836,959. em does fall from 38,177 to ~0, which is the shape the prediction expected, and it CANNOT BE READ off an instrument whose own consistency check fails in every window. SO 937848c9e7 MUST NOT FOLD, and the recommendation to hold it is now vindicated by measurement rather than by caution. THE NEXT STEP IS THE INSTRUMENT, NOT THE DEVICE: more soaks cannot fix a counter that disagrees with itself. This is audit pass 1's M1 from the other direction -- the #73 fix silently altered what ws counts because the identity it relied on was true only by accident, and something in 937848c9e7 does the same to sp/ov/di. Full record in docs/investigations/issue68-arm-void.md. ranked and costed; restoring the range test is a five-year-old SMC correctness decision on every guest instruction, not a lane call"

