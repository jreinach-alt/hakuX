status_note = "Two arms landed, both PRE-REGISTERED and both FAIL on overshoots rather than on mechanism. The light-loop mux (63be3ebf75) took Specular/ControlFlagsNoLight_VS 18,658 -> 10,510 against a predicted 10,510, exactly, with all seven must-not-move lighting and material suites byte-identical; the back-specular source (7a650a98a9, oB1 = v8 rather than v4) took both Specular_back captures down by exactly 7,730, overshooting its prediction by 3,075 in the favourable direction. What remains is a defect with no model: silicon assigns the light term's two values to the four quad corners differently under a program than under fixed function, and in four of the eight lit quads the assignment is not a permutation of the vertex stream at all, so no skew of the normal queue produces it. Specular_back/ControlFlags_VS at 88,059 px is dominated by it. The v8-versus-last-written-oB1 ambiguity cannot be settled from the corpus: no capture writes anything but the vertex specular to oB1."
blocked_on = "ORCHESTRATOR SPOT-CHECKED THE TWO LOAD-BEARING SOURCE FACTS 2026-09-14 rather than taking them on report, because this verdict turns a wall into a two-line change and a wrong premise would be expensive. Both hold, read from nxdk_pgraph_tests: specular_tests.cpp:41 is `kDirectionalLightDir{1.f, 0.f, 1.f, 1.f}` -- y is EXACTLY ZERO -- and the four normals at :458-479 are (-+,-+, -0.990147542976674) with nx and ny each taking only +/-0.099014754297667 and nz IDENTICAL in all four. So N.L = nx*1 + ny*0 + nz*1 = nx + nz, which takes exactly TWO values over the corner order [A,B,B,A]. That is the 16-fold ambiguity, by arithmetic rather than by measurement. And it is why the fix is two constants: with the direction y at 0.5 instead of 0, N.L = nx + 0.5*ny + nz separates all four sign pairs. AUDITED AND UPHELD 2026-09-13, offline from the goldens and the test sources with no device and no build -- a blocker is a claim, and two of this exact shape have been refuted in this campaign, so it was tested rather than inherited. Instrument docs/testing/specular53_four_value_probe.py; write-up docs/investigations/specular-53-blocker-audit.md. THE PREMISE IS MEASURED, NOT INHERITED: the light term recovered model-free as (ControlFlags_VS - ControlFlagsNoLight_VS)/0.75 and plane-fitted per triangle, so the four corner values come out without assuming which vertex feeds which corner, gives exactly TWO distinct levels over the 32 corner values of the 8 lit quads -- Specular 56.79/69.16 with residual 1.10, Specular_back 169.25/211.07 with residual 1.14, against a quantisation floor of 1.1 byte (one byte over 0.75). AND THE AMBIGUITY IS 16-FOLD BY ARITHMETIC, not by difficulty: two source values over four vertices [A,B,B,A] means 256 source maps collapse to 16 distinct images, each produced by exactly 16 maps. THE CLASS IS EMPTY CORPUS-WIDE AND THE ENUMERATION IS COMPLETE, because TestSuite resets SET_LIGHTING_ENABLE false before every test, so a test that does not enable it cannot qualify: 14 of 200 sources enable lighting and exactly TWO do so under a vertex program -- Specular::ControlFlags_VS and Specular back::ControlFlags_VS -- both drawing the same four normals under kDirectionalLightDir{1,0,1}, whose y is EXACTLY zero, which is what collapses N.L onto nx. Rich-normal geometry with hardware lighting does exist (Lighting_control's five models, NonUnitNormal's 65-vertex spherical fan) and is fixed-function every time; Lighting_control's VS variants push LIGHTING_ENABLE false and light in the shader. THE ESCAPE ROUTE WAS READ AND IS CLOSED, which is the real result: a four-distinct-valued per-vertex probe DOES exist (per-vertex diffuse 0.25/0.50/0.75/1.00), and with the lighting unit OFF it reads at all four corners in submission order, 8 of 8 quads in both suites, max error 0.95 and 0.37 byte -- so the vertex stream is correct and the anomaly is inside the lighting unit. With lighting ON, the only state in which the anomaly exists, 0 of 128 quad-by-channel slots carry those four values, the closest off by 77.5 bytes. The probe and the defect cannot coexist in this corpus. THE ACTIONABLE HALF IS NOT A NEW TEST CASE: TestControlFlags already submits four normals differing in the signs of BOTH nx and ny (+/-0.099015, +/-0.099015, -0.990148, specular_tests.cpp:458-479) and only the light's y=0 collapses them. Changing kDirectionalLightDir to {1, 0.5, 1} -- two constants at specular_tests.cpp:41 -- gives four distinct N.L in even steps of 0.0660, which at the measured 88.3 byte per unit N.L is 5.83 byte of separation against a 1.1 byte floor: a 5.3x margin, with no new geometry and no new draw. SETTLING OBSERVATION 1 IS WEAKENED, NOT ANSWERED: no second silicon capture exists (the goldens repo has one commit), but q10/q13 and q30/q33 are separate draws of identical geometry agreeing to 0.0000 L-units, 4 pairs of 4 in both suites, so the assignment is deterministic WITHIN a frame -- which is not what observation 1 tests. CORRECTION TO THE STATUS NOTE ABOVE: 'no capture writes anything but the vertex specular to oB1' is right in substance and loose in wording. Two shaders do write oB1 with something else (mov oBackSpecular, #invalid_color; and a multiply), but neither is observable -- 0 magenta px across all 32 Lighting_control goldens -- and Specular_back's own program is mov oBackSpecular, iBackSpecular. It should read 'no capture in which oB1 is OBSERVABLE'. NOT ESTABLISHED: the mechanism (nothing here says what the lighting unit does differently under a program); observation 1 (run-to-run determinism on silicon) and observation 3 (sub-pixel phase, still 6 cells against 6 points); anything about our own captures (goldens and sources only, no emulator capture scored); whether {1,0.5,1} is optimal, as against minimal with a calculable separation; and the sign convention mapping N.L to byte, since only |slope| was used. ORIGINAL FOLLOWS. the corpus supplies only two distinct N.L values per lit quad, so no 3-1 code can name its source vertex; the three settling observations all need captures we cannot produce"

