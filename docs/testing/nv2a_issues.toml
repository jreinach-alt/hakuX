[issue.31]
title = "Slope-scaled polygon offset is wrong under W buffering"
suites = ["W buffering"]
disposition = "unknown-semantics"
blocker_falsifier = "if 'the corpus does not contain the geometry' were false, kVertSampleCoords would hold a clip_top that is not 0 mod 4, and that capture alone would separate `clip_top+2` from the absolute 4-grid at phase 2."
blocker_tested = "confirmed, re-ran wbuf31_blocker_audit.py. kVertSampleCoords[3+6i] is 0,32,...,448 -- every entry 0 mod 4. ClipW's clip_left is 159,261,363 (step 34), never 0 or 2 mod 4. The (t0, clip_top>0) cell has exactly one observation, checked rather than inferred from instrument silence. Cost to refute: ONE INTEGER in wbuf_tests.cpp -- a test-suite fork plus a disc build plus one device run, not a new test case."
status = "fixed-part"
status_note = "JUDGED 2026-09-13: the anchor ROW is fixed with the first pre-registered arm this issue has ever had -- PRE-REGISTERED PASS on all 693 checks, 8 better / 0 worse / 562 same over 570 captures, re-judged by the orchestrator rather than taken from the lane's report. TriH structural 52,800 -> 0; suite structural 2,525,369 -> 2,468,241. The rule is that the anchor row snaps to 4*floor(r/4)+2 when the window clip did not cut the triangle. THE OLD BLOCKER IS WITHDRAWN AS FALSE: 619,349 px were recorded as sitting under a '4-pixel anchoring regime the available goldens cannot select between', and all 64 discriminating anchors were in fact already determined to +/-0.002 px by data on disk -- the offset is one constant per triangle and the stored depth is floor(w + offset), so it lies in an EXACT interval ~0.002 wide on a value of 1e5 while one pixel of anchor is worth 0.5-5%. The previous reading used the FRACTION of pixels on the higher of two adjacent integers, biased by up to 0.1 of a unit because frac(w) is not uniform over a triangle. THE 619,349 RE-SPLITS INTO THREE MECHANISMS, not one: TriH 52,800 (FIXED, verdict PASS), TriV 105,600 (a THIRD mechanism, mis-filed here -- its recorded 4-grid column is REFUTED, not unselected: column 164 misses hardware's intervals by -122/+658/+1,547/+2,555 units where the same model lands inside them on 37 other anchors, and no integer column is closer, so shipping it would replace a wrong answer with a wrong answer while moving no pixel), and ClipF 460,949 (genuinely unselectable from this corpus, now measured rather than asserted: ClipF-150-032 t0/t1 share plane, clip, top vertex and first covered row -- hardware's coverage byte-identical to prediction on all 206,290 px -- yet anchor at rows 32 and 34, so no function of (plane, clip, first covered pixel, top vertex) can reproduce the table; and FloorQuad t1 vs ClipF t1 is the SAME TRIANGLE differing only in clip_top, so it is not a function of the triangle either. Four cells, one interaction term, one data point). SEPARATE FLOOR, LARGER THAN THE RESIDUAL: the off-by-one class is 941,308 px and is silicon's per-triangle PLANE SOLVE, not our anchor -- FloorQuad's two triangles share a plane and an anchor row and hardware's offsets differ by 0.52 with 0.002-wide intervals. No anchor rule can remove it, and no device was needed to establish it. LEAST CERTAIN: the gate is 'the clip did not cut the triangle' and the corpus cannot separate it from 'the top vertex is inside the clip' -- no triangle here is partially clipped with its top vertex inside, and LargeZ, which would discriminate, has a flat offset. For a guest that sets no window clip this changes the offset for most on-screen triangles and nothing in the corpus tests that. The refuting measurement needs NEW GEOMETRY, not more fitting: one triangle translated in y across the 4-grid phase with the clip fixed, or a quad at clip_top>0 with BOTH triangles top-truncated. The issue's own '66k px (TriH/TriV)' is wrong by 2.4x, most likely scored RGB-only where _ZB packs depth as A<<16|R<<8|G. Instrument: docs/testing/wbuf_anchor_recover.py; write-up docs/investigations/wbuffer-slope-offset.md."
blocked_on = "AUDITED AND UPHELD 2026-09-13, offline from the goldens and the test sources with no device and no build -- a blocker is a claim, and this campaign has refuted two of this exact shape (#13, and #31's own earlier one), so it was tested rather than inherited. BOTH LIMBS HOLD, and the audit makes the request an order of magnitude cheaper than the sentence below asks for. Instrument docs/testing/wbuf31_blocker_audit.py; write-up docs/investigations/wbuffer-31-blocker-audit.md. CLASS CHECK FIRST: NV097_SET_POLYGON_OFFSET_SCALE_FACTOR is pushed non-zero in exactly one file of nxdk_pgraph_tests (wbuf_tests.cpp:464) -- depth_clamp_tests pushes only the constant BIAS -- so the class that can carry an anchor is this suite and nothing else, and within it only WBuf24D has a 1-unit quantisation (WBuf16D resolves 7-10 distinct depths, and the clip variants exist only at depthf==6 so no 16-bit capture carries a ClipF or ClipW at all). CLIPF, 460,949 px: TWO degeneracies, and the first is NEW -- clip_top comes from kVertSampleCoords[3+6*i] and that array holds only multiples of 32, so NO clip_top the suite can generate is anything but 0 mod 4, and 'clip_top+2' and 'the absolute 4-grid at phase 2' are THE SAME PREDICTION on every capture that exists; the rule recorded as measured is one of two that fit. Second, the (t0, clip_top>0) cell has exactly ONE observation, at clip_top=32, because t0 has no covered pixel at 128 or 224 -- checked, not inferred from the instrument printing no row. ClipW's clip_left is never 0 or 2 mod 4 either. SO THE MISSING CAPTURE IS ONE INTEGER, NOT A NEW TEST CASE: a ClipF variant at a clip_top that is not 0 mod 4 (33, 34 or 35). And the blocker's own prescription is half redundant -- 'a triangle translated in y across the 4-grid phase at fixed clip' is TriH, already in the corpus and already pinning phase 2 on 24 of 24 triangles. TRIV, 105,600 px: stronger than 'no candidate rule'. wbuf_anchor_recover.py compares the recovered anchor against one rule's prediction at a 0.01 px tolerance -- 30x wider than the 2.7e-4 px the interval supports -- and reports a miss as 'not an integer pixel under any rule', which is a per-rule verdict and reads as an unfound fit. Scored instead against the goldens' EXACT intervals, 0 of 32 anchoring rules fit, the best missing by 5.6e-3 where the same model form on TriH misses by 1.1e-7 -- a 50,000x separation, which is what keeps TriV out of the known per-triangle plane-solve floor. A three-free-parameter absolute model fitted on three residues misses the fourth by 418 interval widths at a fitted step count of 1.090, so the model FAMILY ('an anchor pixel plus a finite difference along the gradient axis') is refuted, not one phase of it -- record it that way, because it decides whether the next person fits harder or changes the form. Also measured: TriH's and TriV's offsets are EXACTLY 4-periodic in the translation index (six triangles per residue, identical intervals to six decimals, 80 px apart on the cross axis), which kills every 'plane-solve error accumulating across the screen' story before anyone spends a day on it; and TriV's sample position is pinned to +/-0.0003 px yet DRIFTS -0.0438 px per pixel of translation, which no fixed grid can produce. NEW CORPUS GAP, previously unrecorded: TriH holds x = 0 mod 4 on all 24 and TriV holds y_top = 0.5 mod 4 on all 24, so each family sweeps its GRADIENT axis through four phases and freezes the CROSS axis at one. A 2-D anchor -- which the ClipF t0/t1 split is evidence for -- is structurally invisible to this corpus, and a third capture is wanted: a TriH/TriV variant stepping the cross axis by a non-multiple of 4. CORRECTS A SUB-CLAIM OF THE WRITE-UP'S OWN: 'the fixed-function _V0_ ZS1 captures are empty' is true on WBuf24D and FALSE on WBuf24F (137,170 and 142,560 px); it changes no verdict, since every _V0_ capture is the same FloorQuad geometry, but 'empty' was asserted of a class that is not uniformly empty. NOT ESTABLISHED by the audit: any mechanism for TriV (the result is negative); that no rule whatsoever exists (a model reading the vertex w values directly, or computing in a fixed-point format, is untouched -- though with four distinct numbers to fit it would be a curve fit from this corpus); anything from our own captures (goldens and sources only, so bc4bebcee0 cannot reach it); and WBuf24F as a second oracle (the only unused population with usable resolution, ~6-unit quantisation at these offsets, and it draws no geometry WBuf24D does not). ORIGINAL FOLLOWS. The remaining 566,549 px need geometry the corpus does not contain -- a triangle translated in y across the 4-grid phase at fixed clip, or a quad at clip_top>0 with both triangles top-truncated. That is a new nxdk_pgraph_tests case, not an arm. TriV's 105,600 is a third mechanism with no candidate rule and its recorded column refuted."

[issue.33]
title = "Image blit: BlitBeyondWidth diverges by 284k px (not an overlap case)"
# ROOT CAUSED and fixed in d42a8d79bc, awaiting its A/B on device.
#
# A GPU tile does not only bound a blit, it decides where the bytes land:
# addresses inside a tiled region are remapped so a rectangle of the surface
# is contiguous. Scanout, texture fetch and the CPU aperture all go through
# the same remap, so the shuffle cancels and treating tiled memory as linear
# -- what we do everywhere -- is correct. It stops cancelling in this test,
# which blits a 1024x512 ramp into a tile of pitch 2560, DROPS the tile, then
# blits the result out linearly from target_buffer + 4096.
#
# Measured, not argued: a linear model matches OUR capture at 0 differing px
# across the whole frame bar the text overlay, and 284,958 of 307,200 golden
# pixels satisfy the ramp's R + B == 255 invariant -- same bytes, permuted.
# The layout was solved out of the golden by unique 64-word signature
# matching. The line that differs is perform_blit's `dest += dest_pitch`, a
# linear walk where hardware walks the tile.
#
# Ruled out: the row-width clamp (the obvious read of "BlitBeyondWidth" --
# hardware writing 1024 pixels into a 640 pitch and overrunning -- is not it;
# each overrun is overwritten by the next row and the last is clipped at the
# tile limit, and modelling at 1024 and at 640 gives byte-identical results).
# Also tile clipping being absent: #33's comment has it backwards,
# nv_clip_gpu_tile_blit has clipped since 24087af22a and it is the ADDRESS MAP
# that was missing. The matching colour-edge x positions cited in the comment
# are degenerate -- they hold for any permutation preserving 16-pixel runs.
#
# Assumed and not testable from this corpus: that NV_PFB_TILE_PITCH holds
# bytes, the `^ 1` constant in the unit column (could be a base-address bit;
# only one test registers a valid tile), and generalisation to other pitches.
#
# WATCH: only the blit DESTINATION is remapped. 3D renders and scanout still
# treat tiled memory as linear, so a title that blits into a tile it
# registered as VALID and then scans it out would now scramble where before it
# did not. Making that consistent means a remap at the memory controller on
# every access. A blit READING out of a live tile is deliberately left
# un-swizzled -- no capture exercises it, and an unverified inverse is a
# second bug. Needs a game smoke test.
# docs/investigations/gpu-tile-blit-swizzle.md.
#
# FIXED AND VERIFIED ON DEVICE 2026-09-12, f1a7703876. Per-capture A/B against
# baseline b5ed87489c, 97 captures each, progress_log_proof true on both, same
# disc, only the commit differing:
#   BlitBeyondWidth  284,628 -> 0   BIT-IDENTICAL
#   96 captures unchanged, 0 worse.  Image_blit 15/41 -> 16/41 exact.
#
# The first attempt (d42a8d79bc) swizzled every blit into a tiled region and
# regressed Texture_Framebuffer_Blit::FBToZetaAsTex 14,383 -> 34,382 -- the
# hazard the investigation had itself flagged, since that test blits the
# framebuffer over the depth buffer and then SAMPLES it, so the write was
# swizzled while the texture fetch stayed linear. Note the correction: the
# framebuffer's COLOUR tile is registered VALID-clear, but the DEPTH tile is
# valid.
#
# f1a7703876 gates the swizzle on a blit the tile actually clipped
# (clipped_dest_size < dest_size), which separates the four blits by arithmetic
# alone with no dependence on renderer state -- deliberately NOT gated on
# whether a binding exists at the destination, because a stale binding left by
# an earlier test would silently veto the swizzle and restore the 284,628 with
# nothing in the code to explain it. The gate is a RESTRICTION, not a mechanism
# claim: hardware remaps every write into a tiled region whether it clips or
# not.
#
# FOLLOW-UP, specced and not implemented: swizzle on tile creation/teardown in
# pfb.c instead, since that is the only moment the remap becomes observable.
# It removes the gate heuristic and the standing hazard for real titles, which
# set tiles up properly and currently depend on the clip gate never firing on
# them. Two things to settle first: the inverse permutation on tile CREATION
# (pre-existing bytes are reinterpreted, not moved), and a surface still live
# in a VkImage and not yet downloaded when the tile is torn down. Needs
# pfb.c + nv2a.c + nv2a_int.h.
suites = ["Image blit"]
disposition = "defect"
status = "fixed-part"
status_note = "closed: stippledBresenhamLines=0 on this driver so the line-mode route gains nothing; the blit divergence moved to #62 finding 2"

[issue.35]
title = "Texture shadow comparator: a texel tie on one scanline (fixed), plus a 24-bit floor"
suites = ["Texture shadow comparator"]
disposition = "precision-floor"

# RE-MEASURED 2026-09-12 and RE-FRAMED. The commentary that used to sit here
# was about 3D_primitive line and polygon smoothing -- it belongs to #36 and
# has been moved there. Nothing in it was ever about this suite.
#
# #35 is TWO defects, and the title names neither correctly.
#
#   (a) A TEXTURE-COORDINATE TEXEL TIE. 100 of the 112 failing captures differ
#       on a SINGLE SCANLINE, 6,066 px, at the row where a box edge in the
#       depth texture lands on integral v. The R families upload the depth
#       texture from the CPU, so their texels are exact by construction and no
#       reference quantisation is involved, and they carry the same residual --
#       which is what rules out a precision story. Only ONE edge of each box
#       moves, so it is a tie at one v rather than a coordinate offset, and the
#       arithmetic closes on GetExplicitBoxLayout's own geometry: seven boxes
#       at rows 230..293, 21 texels wide at columns 141, 204, ... 519, which is
#       where the residual runs are to the pixel. Fixed at 19c74e95da by
#       biasing the fetch with texelTieBias, exactly as the non-shadow
#       PROJECT2D fetch already does. NOT unmodelled hardware.
#
#   (b) A 24-BIT FLOOR. The remaining 12 captures, 11,322 px, all 24 bit
#       (2F24 -6.00-193.00, 3F24 10.00-20.00, 3P24 10.00-20.00), differ over a
#       whole box rather than a band. It is a comparison between our
#       rasterised depth and the test's own CPU projection of the same z,
#       required to agree to ~2^-24 relative; the test author records silicon
#       missing it by the same margin between its own two pipelines, which is
#       why F24 and P24 are given different reference values (11.47 and 11.45)
#       in the 10.00-20.00 pair. THIS half is the unmodelled-hardware part.
#
# Also FALSIFIED here: 27b583e17c's note pointing at "comparing as integers
# rather than scaling to float". The float round trip is exact --
# float(n)/16777215.0*16777215.0 reproduces n for all 2^24 values of n, and
# floor() of it likewise -- so comparing as integers would buy nothing. The
# 24-bit ULP that matters is in the interpolated reference and the rasterised
# depth, not in that arithmetic.
#
# Lane split, which must not be mixed when scoring: this suite is 260/288
# exact and 8,776 px on desktop, and 176/288 and 17,388 px on every device set
# here, at the same code state.
status = "fixed-verified"
status_note = "closed: shadow texel tie fixed, 176/288 -> 256/288 exact"

[issue.36]
title = "Line and polygon smoothing are not applied; every -ls/-ps 3D_primitive test differs on its edges"
suites = ["3D primitive"]
disposition = "unmodelled-hardware"

# MEASURED NEGATIVE 2026-09-12, and the framing on this issue is wrong. One
# table settles it before any per-pixel work: 883,336 px of 3D_primitive differ
# with BOTH smoothing bits clear, and setting them adds only ~110k each. Per
# pixel on the 40 `arrays` captures, scaled x4 (the four submission paths are
# identical but for label text):
#   |delta| <= 2 interpolation wash (#12's floor)   ~3,670,576 px   94.93%
#   structural, on a golden edge                      ~172,812      4.47%
#   structural, interior                               ~23,188      0.60%
# Of the structural interior 88.5% is TriFan + TriStrip alone -- the split
# seam, a different defect. So the smoothing bits are responsible for about
# 175,704 px, 4.5%, and that is the CEILING on any fix here.
#
# Root cause measured, not guessed: fitting one scalar coverage per pixel from
# the strongest channel and predicting the other two leaves mean error
# 0.28-0.92 of 255 against a null of 22-28, so
# golden = cov*unsmoothed + (1-cov)*dst and nothing else. Coverage is
# quantised to EIGHTHS (snap to 1/8 gives err 0.0040 with 93% within 0.01;
# 1/16 and 1/32 buy nothing), levels 4/8 to 8/8, so there is a floor at half
# coverage. LINESMOOTH doubles the line footprint (+89-95%) into a ~1px fringe
# and is a no-op on filled primitives; POLYSMOOTH is silhouette-only (98% of
# the interior at coverage exactly 1.0) and a no-op on lines.
#
# BLOCKED on capability, not on code: lines need VK_EXT_line_rasterization,
# which hakuX never requests in vk/instance.c, so its six feature booleans are
# UNMEASURED on this device; polygons have no Vulkan analog and there is no
# multisampling in either backend. Both routes must force SRC_ALPHA blending
# on, which lands directly on pgraph_vk_effective_blend_reg()'s #48
# substitution -- sequence them, do not merge. Unmasking the bits from the
# pipeline key alone is provably 0 better and 0 worse.
#
# RETRACTED from this issue: the 2x AA_CENTER_CORNER_2 supersample story is
# falsified -- a 2-tap horizontal box of the unsmoothed golden is a WORSE model
# of the smoothed one than no filter at all. POLYSMOOTH also cannot be the
# TriFan/TriStrip seam.
#
# TRAP, and it would have cost someone a day: a `-ls` golden against its plain
# golden differs by EXACTLY 150 px for every filled primitive, and `-ps` by
# exactly 168 for every line primitive, always at y[27..40]. That is the test's
# on-screen name label gaining the suffix. Fitting to it is fitting to a string.
#
# Neither neighbour suite is this issue. Antialiasing_tests is 99.8% three
# captures at exactly 78,496 px, mode-independent and 70% interior. And
# 2D_Lines is the 2D line SIMPLY NOT DRAWN -- differing count equals the line
# length every time, background in every column within +/-5, and rolling
# sideways only worsens it -- which corrects the discrimination index, where
# ten of its thirteen are classed boundary-shift.
# docs/investigations/line-polygon-smoothing.md.
#
# (Moved here from #35 on 2026-09-12, where it had been appended under the
# wrong header. It is entirely about 3D_primitive smoothing and says nothing
# about the shadow comparator.)
status = "unmodellable"
status_note = "closed on a capability line: smoothLines=0 on this driver, measured not assumed -- see the 29-line probe comment in vk/instance.c"

