[issue.74]
title = "Android FP JIT: FIST/FISTP truncate where x86 rounds per the control word"
component = "tcg"
no_suites = "not a pgraph suite defect: this is TCG/FPU behaviour, so no golden suite scores it"
disposition = "defect"
blocker_falsifier = "if 'no oracle exists in the corpus' were false, disassembling the shipped test XBE would show at least one FIST/FISTP reached with the FPU control word's RC field set to something other than 11 (round-to-zero) -- a control-word write of RC=00/01/10 followed by a FIST rather than an FRNDINT."
blocker_tested = "confirmed, exhaustively, and the instrument has a positive control. All 61 FIST/FISTP sites in the 3,404,800-byte .text of the test XBE (extracted from nxdk_pgraph_tests_xiso.iso, linearly disassembled) are immediately preceded by fnstcw / or <cw>,0xc00 / fldcw -- RC = round-to-zero, which is clang's lowering of a plain (int) cast and is exactly what the current truncating macro already implements. Classifying ALL 140 fldcw sites: 128 set RC=11 and feed a FIST; the 12 that set a NON-truncating RC every one feed `frndint`, never a FIST. fisttp count = 0, cvttss2si = 892, fbstp = 0. Identical on all four ISOs on disk (same XBE). Source searches empty: no lrint/rint/nearbyint/ round, no fnstcw/_controlfp/inline-asm fist anywhere in /home/justin/nxdk_pgraph_tests/, and no FIST reference in hw/xbox/. THE POSITIVE CONTROL, which is what makes this a measurement rather than a failed search: #67's oracle IS visible to the same instrument -- 5 frndint sites with RC=down (floorf) and 5 with RC=up (ceilf). The corpus contains non-truncating RC manipulation AND contains 61 FISTs; it simply never joins the two. So the blocker holds for a stronger reason than it states: not 'no capture has been attributed yet' but 'the corpus structurally cannot produce one', and a fix would have to be argued from the ISA. TWO THINGS TO CARRY FORWARD. (a) Lines 1785 and 2160 -- the two call sites that looked most promising, since both set float_round_nearest_even before calling floatx80_to_int32 -- are DEAD on Android: 1785 is inside the #else of the USE_NATIVE_DOUBLE_STORAGE #if at fpu_helper.c:1727, and 2160 inside the #else at :1966. The live set is 896/910/923 plus 1461. (b) helper_fbst_ST0 (fpu_helper.c:1461, FBSTP) is a live compiled truncation bug on Android that a fix should cover, and fbstp count = 0 in the corpus, so no test here can ever guard it. File that separately rather than losing it inside #74."
status = "open"
status_note = "floatx80_to_int32/int64 are plain C casts under USE_HARD_FPU, so they truncate. Unmeasured and labelled so -- filed alongside #67 rather than bundled into it."
blocked_on = "UNBLOCKED 2026-09-13: #67 landed (cherry-picked as bc4bebcee0, PRE-REGISTERED, 121 of 122, Blend_tests 1,711,362 px -> 0), so the predecessor this was waiting on is gone and floatx80_round_to_int_nds() now exists in the same file to model the fix on. ROUTED TO lane.remote -- target/** is theirs, the same routing #67 took. SITE, read from the file rather than from the filing: lines 248-249 define floatx80_to_int32/int64 as ((void)(s), (int32_t)(a)), plain C casts that truncate, while x86 FIST/FISTP round per the control word RC field. Six call sites, none of them the ones that matter most obviously: helper_fist_ST0 (896), helper_fistl_ST0 (910), helper_fistll_ST0 (923), one at 1461, and two inside other helpers at 1785 and 2160. AND A REASON TO EXPECT THIS IS SMALLER THAN #67, stated so nobody sizes it by analogy: lines 250-251 define the _round_to_zero variants the same truncating way, and for THOSE truncation is CORRECT -- that is FISTTP. A C (int) cast of a float requires truncation, so a compiler emits the round-to-zero form or sets RC itself; the plain FIST path is reached when the guest has already set RC or calls something like lrint(). #67 was reachable from nxdk floorf, which is a specific save-CW/RC=down/FRNDINT/restore sequence in the headers every test links. No equivalent has been identified here. SO IT NEEDS AN ORACLE BEFORE IT NEEDS A FIX: the issue says itself that it is unmeasured, and no capture has been attributed to it. The first job is to find a golden that moves, or to establish that none does -- and the second outcome is a real result, not a failure. AUDIT PASS 1 OVER THE UNFOLDED COMMITS, 2026-09-14: this issue's fix (622183271b) is RIGHT ABOUT ROUNDING -- pass 2's P2 caveat is closed as specified, and fpu_set_exception() was re-verified to have exactly one caller inside the #ifndef -- but it INTRODUCES A HIGH, now filed as #82. The saturation is wrong: the new conversions return INT32_MIN for both signs of overflow and for NaN where softfloat returns max. It is invisible here because every FIST/FISTT/FBSTP consumer overwrites the value under a float_flag_invalid guard. THIS ISSUE THEREFORE DOES NOT CLOSE ON THE FOLD: the commit that closes it opens #82, and closing a row while opening a defect in the same breath is what the audit loop exists to stop."

[issue.66]
title = "GL renderer: one stale GL_INVALID_FRAMEBUFFER_OPERATION aborts the desktop run and costs 81% of a disc's captures; Android drains the same error silently"
# UNTRACKED UNTIL 2026-09-13. This issue, #71 and #72 were claimed by
# [lane.remote] in territory.toml and had no row here at all, so
# check_coverage.py reported them covered -- a lane claim satisfies it -- while
# nothing on the board said what they were. Writing the row is the fix for the
