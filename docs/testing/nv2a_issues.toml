# Comparator scope resolved in 97ac9161 (236/288 -> 260/288). Everything left is
# something other than the comparison: PROJECT2D's missing reference (its own
# issue), the documented fixed-function vs programmable 24-bit depth offset that
# the test itself works around with two reference values, and 420 px of genuine
# depth-value crossings. Kept open rather than closed because the residual is
# real; kept off the work queue by the disposition.
[issue.35]
title = "Projective shadow comparison: residual after the reference quantisation"
suites = ["Texture shadow comparator"]
disposition = "unmodelled-hardware"

# Split from #35. PROJECT2D emits `t_depth.x <op> 0.0` with no reference at all.
# 116 of the suite's 128 2* captures pass through that, so it is right for
# something; the 12 that fail do so only on tie-sensitive operators, which is
# what a missing reference would also look like. The goldens are consistent with
# both readings, so this needs a test that varies r under PROJECT2D on hardware.
[issue.46]
title = "PROJECT2D shadow maps compare against a literal 0.0, with no depth reference"
suites = ["Texture shadow comparator"]
disposition = "unknown-semantics"
