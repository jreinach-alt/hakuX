# unknown-semantics because the one-line fix is PRICED AND REFUSED, not
# unwritten. Switching to the 4-grid everywhere recovers 620,349 px (TriH,
# TriV, three ClipF) and regresses 4,172,280 px (all 19 WBuf* captures now
