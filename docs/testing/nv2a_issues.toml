#
# This closes the last explanation for the owner's symptom that the audio
# harness can reach. Of the three candidates standing after the level baseline
# -- a uniform missing gain, a per-voice missing gain, something downstream of
# the tap -- the first and third are now both measured out. #74 is what remains.
#
# What it does NOT establish, and the counter is permanent so each costs a soak:
# it is the Thor, not the Nova, and devices.sh says the pairing is unproven; it
# is Galleon, which is not a stress case, and starvation is load-dependent by
# construction; and a zero does not vindicate the 5 ms wait ceiling, which is
# still less than one 5.333 ms frame period and simply was not tested.
#
# The prediction this was judged against had two clauses and ONE FAILED: "no 5 s
# interval over 5%" is false, because the startup window reads 17.5% and I did
# not exclude startup when writing it. The prediction was wrong, not the
# emulator. Recorded rather than restated, and the corrected predicate is in
# docs/investigations/audio-baseline.md section 4a.
#
# Disposition is `harness`: what remains of this entry is the instrument, which
# is now permanent and reports on every run, not a defect in the audio path.
#
# ---- as filed, before the measurement ----
#
# The only mechanism that survives the measured baseline and can still explain
# the owner's report of "unusually low, even at max".
#
# MEASURED, from source. monitor_sink_cb (apu.c) waits at most 10 x 0.5 ms = 5 ms
# for the FIFO to reach the requested byte count -- less than one 5.333 ms frame
# period -- and then fills the remainder with silence:
#
#     if (copied < free_b) {
#         memset(stream + copied, 0, free_b - copied);
#     }
#
# Nothing counted it. With the Android defaults the sink asks for 8192 bytes
# while the APU produces 1024 bytes per 5.333 ms, so a callback needs eight
# production units to have completed; if the APU thread is behind, the tail of
# every buffer is silence.
#
# WHY IT IS THE AWKWARD ONE. The PCM tap is at monitor.frame_buf, on the
# PRODUCING side of the FIFO. A chronic partial fill reduces loudness at the
# speaker by its duty cycle while leaving every number in a capture exactly as
# it was -- audible, and invisible to the instrument built to measure audio.
# The measured baseline (peak at full scale, AC RMS -23.43/-23.50 dBFS, median
# active 50 ms window -29.4 dBFS, Galleon on the Nova, 92.843 s) therefore
# cannot rule it out, and the existing g_dbg.utilization does not either: that
# measures how long the APU thread SLEEPS, and a thread can sleep plenty while
# missing deadlines in bursts.
#
# INSTRUMENTED 2026-09-12: counters on the callback thread, reported from the
# APU thread every 5 s as the delta since the last line, under tag
# hakuX-audiocap. The line names the fraction of output replaced by silence, and
# says whether the PCM capture was armed -- the capture writes to FUSE-backed
# storage from the audio thread and can cause the starvation it would then be
# blamed for.
#
# PREDICTED before the measuring soak (audio-baseline.md section 4): under 1.0%
# of output bytes zero-filled overall, and no 5 s interval over 5%. FALSIFIED by
# a larger figure, which reopens the owner's symptom with a mechanism no capture
# can see. Not forced true by the counter, which observes and touches nothing.
#
# Disposition stays unclassified until that number exists. There is a
# measurement pending, not a rule.
#
# RE-MEASURED ON THE OTHER HANDHELD, 2026-09-12. The 0.0000% figure was taken on
# the Thor; Galleon 90 s on the NOVA at ref 8d96196c71 (result
# 1789278817-audio74-galleon-1188071) reads 33/121 callbacks short in the first
# 5 s window, all 33 empty, 27.2727% of that window -- and then 0/703 short,
# 0.0000%, in every steady-state window after it. Same shape as the Thor, same
# conclusion, and the startup burst is again entirely EMPTY callbacks, i.e. the
# guest has not produced a sample yet rather than the producer falling behind.
# The corrected predicate from audio-baseline.md 4a -- no STEADY-STATE 5 s
# interval over 5% -- passes on both devices.
status = "fixed-part"
status_note = "closed as the tracker twin of #60; the port landed but check_surface_compatibility is UPSTREAM of it and still compares a lossy view -- 110 permitted reuses measured on one disc, 66 of them O->Z pad-bit swaps"

