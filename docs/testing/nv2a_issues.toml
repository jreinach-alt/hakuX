status_note = "No fix attempted; what landed is containment. Re-measured from the arm rather than from the comment: dispatch/results/1789255594-exp54-stst-correct, 10 runs of one unchanged binary over Texture border, 2D_BorderTex_SZ band 5,640 with 4 runs bit-exact and 6 not, and 17 of 18 captures at band 0. ab_compare names it in KNOWN_UNSTABLE and the measured per-capture band classes it NOISE. The 40x magnitude spread across the non-zero runs is unexplained and a single upload racing a two-pass generator cannot produce it. (The issue's comment says five exact and five not, and lists eleven values for ten runs; the arm holds four and six.)"
blocked_on = "ORDERING 2026-09-14: lane.remediate1 holds vk/texture.c, remediating audit pass 1's HIGH -- a push-constant range that is invalid at INIT on any device reporting maxPushConstantsSize == 256. That outranks this issue and is expected to be short. Declared because check_territory.py refuses to let a claim wall a blocker silently. UNWALLED 2026-09-14: lane.readfreq retired at wave 35 and released vk/texture.c WITHOUT EVER NEEDING IT -- it made no source change, because the counter it was dispatched to build already existed and had been running unread. The claim walled this issue for its whole life and bought nothing. A SECOND, INDEPENDENT ACCURACY ARGUMENT ARRIVED 2026-09-14 AND IT CHANGES WHAT THE SHIPPING DECISION IS ABOUT. Until now the bound was justified by a RATE on one title (Crimson Tr 0.617 -> 0, no capture evidence) and cost gfps p90 on another, so the trade read as throughput against a number nobody could see. #79 supplies the visible half: the intermittent Stencil defect -- 9 of 16 captures varying between runs of one binary, majority image golden-exact and outliers WRONG -- is this skew on vertex data, and the bound fixes it. Arm XEMU_OPT_FIFO_SKEW_BOUND 0 vs 1, Stencil x4 per arm, PRE-REGISTERED PASS on 16 checks: 7 wrong of 64 observations -> 0 of 64, 3 of 4 runs flaking -> 0 of 4. The diagnosis is vertex-level and is what ties it to this issue rather than resembling it: the wrong regions are individual TRIANGLES of a six-vertex DefineBiTri (IoU 1.0000, 0.9980, 0.9960), one of them a tri2 whose shared ul vertex carries X FROM ONE QUAD AND Y FROM ANOTHER, and one showing a draw vertex colour through a COLOR_MASK of zero. That is this issue byte-level-mixture-inside-one-texel row one level up, on the vertex array instead of a texture. So the decision is no longer rate-versus-framerate. It is: 7 of 64 Stencil captures rendered wrong on the test disc, against gfps p90 29 -> 13 on Galleon and 0 on Crimson. CAVEAT CARRIED FORWARD, not buried: both #79 arm refs are 292 commits behind the tip -- equally, which is what makes them a pair, but that certifies the mechanism and not mainline, and a tip-ref repeat is the honest precondition for shipping. ORIGINAL: CLOSABLE ON THE CRIMSON EVIDENCE; what is left is a SHIPPING DECISION, not a measurement. THE BOUND CLOSES THE RACE ON A REAL TITLE: Crimson Skies Tr goes 0.6172/0.6188 (11,829/19,167 and 11,866/19,176, reproducible to 0.26%) to EXACTLY 0 over 13,751 uploads, Xd=0, on a title that flips every frame. The bar was registered as exact zero rather than 'smaller' for precisely this reason -- against a baseline reproducible to 0.26% a timing perturbation would have MOVED the rate, not annihilated it. The disc pair could never have shown this: see below. AND THE COST IS TITLE-DEPENDENT, WHICH CORRECTS AN OVER-GENERALISATION OF MINE -- I recorded 'mode 2 costs what mode 1 costs' from Galleon alone. Crimson: gfps p90 falls by 0 and max by 3, against Galleon's 16 and 14 in the SAME mode, while the guest is blocked 30.7% of wall clock at a hold mean 74% larger than Galleon's. So the cost is not a property of the bound, it is a property of WHETHER THE GUEST CPU THREAD IS THE TITLE'S CRITICAL PATH -- Galleon's is (83% busy), Crimson's is not. 94.2% draw density still makes the selective bound no cheaper than the unselective one, and that part stands. GAVE OVER-COUNTS THE HOLE AND Tr PROVES IT: gave/held(n) = 0.4144 here with gaveby NOP at 93.9% WHILE Tr IS ZERO, which is compatible only one way -- gave counts 'released with PUSHBUFFER outstanding', not 'released with a DRAW outstanding'. The pusher parks on waiting_for_nop at a NOP method that comes AFTER the draw it follows, so the draw is already consumed and its texture already read when gave fires. Every leg built on gave (V4, W5, X4) measures a proxy that over-reads, and all three 'held' in the direction of more hole than exists. THE DISC OBSERVABLE IS DEAD, measured with its own control (docs/investigations/border-stale-observable-is-dead.md): stale_px non-zero runs are 6 of 10 at the 128-commit-old floor, 2 of 10 at a fresh arm, and 0 OF 10 AT THE TIP, while the race is live at 61.7% on Crimson at that same tip. Re-scoring the old result through today's pipeline reproduces its 6-of-10 exactly, so the zero is real and not a reader finding nothing. V1 is therefore not merely void but DEAD: a no-fix binary passes 'stale_px == 0 on 10 of 10' with probability ~1 at the tip. The mode-1 closure stands on its own paired control (5 of 10 in the same pair), never on the stale floor. THE SUCCESSOR LEVERS, and neither needs page protection: (a) release the guest when the draw's READS are done rather than when DMA_GET reaches DMA_PUT -- hold mean 2,316,996 ns against a PFIFO service time of ~160 us, so most of the hold is queueing behind work the guarantee does not care about; (b) re-upload on detection, where the DETECTION ALREADY EXISTS (DIRTY_MEMORY_NV2A_TEX is logged and pgraph_vk_poll_bound_textures already test-and-clears those bits at begin_pre_draw, so Tr IS that bit being set again) and only the RESPONSE is missing. Both live in the texture path, which lane.writetrack held. CORRECTED 2026-09-13: lane.writetrack IS RETIRED and texture.c went back to free, so that sentence names a wall that is gone -- there is NO live predecessor for either lever and this is dispatchable on the ordering question. AND LEVER (a) RESTS ON A NUMBER I GOT WRONG. The ~160 us PFIFO service time above was computed as 48%% / 3,000 per s, mixing GALLEON's busy fraction with the DISC's submission rate -- two different workloads, from the same table. Galleon submits at 257/s, so the service time is ~1,868 us, and the premise that most of a 2,316,996 ns hold is queueing behind work the guarantee does not care about DOES NOT FOLLOW from it. Lever (a) may still be right; it is no longer sized, and sizing it is the first job rather than building it. Lever (b) is untouched by this, because it rests on DIRTY_MEMORY_NV2A_TEX already being logged and test-and-cleared, which is a code fact and not a rate. AUDIT PASS 1 OVER lane.remote's UNFOLDED COMMITS, 2026-09-14, TWO MEDIUMS AGAINST THE WRITE-UP THIS DECISION RESTS ON -- and neither touches the parts that carry the decision. M4 (skew-bound doc:60): the conclusion that mode 2 costs the same as mode 1 because 'essentially every published segment carries a draw' has a FALL-THROUGH IT CANNOT DISTINGUISH FROM A RESULT. Mode 2 skips the hold only on FSK_SEG_NO_DRAW; hitting FIFO_SKEW_SCAN_MAX_WORDS falls through to mode 1's path, so 'the scan kept giving up' produces the measured number exactly. The counter that separates them rides the fifoskew line, which the doc itself says prints nothing on desktop. And pfifo.c:86-87 records 148,704 submissions for 180 draws, which is the OPPOSITE of the premise. M5 (doc:47): 'it also bounds the noise floor's cause completely' generalises a TWO-TEST DISC to a full-disc band whose recorded signature DIFFERS -- pixels moving at a constant score there, a varying score here. Restrict the claim to the disc it was measured on and carry the full-disc observation as open. WHAT SURVIVES UNTOUCHED, which is most of it: the 6x cost figures and 'the bound closes the instability' are sound and well-controlled. Both findings were DELIVERED to lane.skew44 in flight, with the text rather than a pointer, because it is pricing mode 2 right now and would otherwise have read a bail-out as a cost. MODE 2 WAS ALREADY PRICED, and the orchestrator's brief to lane.skew44 said otherwise -- corrected here 2026-09-14 by that lane, from data on disk. Crimson Skies Tr = 0/13,751 and 0/13,901 at mode 2 with Xd=0, against mode 0's 11,829/19,167; Galleon gfps p90 29/29 -> 13/14. Result ids 1789312621-draw-only-cost-* and 1789312621/2-draw-only-crimson-*, recorded 2026-09-13. So mode 2 costs what mode 1 costs ON GALLEON, and the remaining gap is a TIP-REF REPEAT on the thor, not a first measurement. THE AUDIT'S M4 IS REFUTED BY