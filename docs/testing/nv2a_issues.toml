[issue.16]
title = "Depth surface: float Z (F16/F24) and the fixed-point half are both exact or one ULP"
# Half of this is done and the framing needs revising. The *_ZB captures are the
# raw zeta word as ARGB8888 (depth = A<<16|R<<8|G, stencil = B); decoded that way
# the readback round-trips against known geometry, so the conversion is not the
# defect -- comparing PNG channels reports a one-unit error carrying across a
# byte boundary as a 255. Z16 fixed depth is 49/49 bit-identical (98/98 on
# Adreno independently). Z24 fixed is off by exactly one unit and never more,
# partly fixed in 5dac36b2 (309,710 px -> 233,112). What remains is the FLOAT
# formats, which are a real encoding defect: not one of F16's 469,927 channels
# is one-step. 28 of those captures are scored against saturated goldens. The
# "exclude depth captures from any accuracy figure" note now understates
# accuracy rather than protecting it. See #52.
#
# 2026-09-13: the "float formats are a real encoding defect" half of the above
# is RETRACTED, and it was the instrument. The z16 *_ZB captures are NOT the
# ARGB word -- SaveZBuffer picks SDL_PIXELFORMAT_RGB565 for a Z16 zeta and
# ARGB8888 for Z24S8, on surface width alone, so the float flag selects no
# packing of its own. Decoded as R5<<11|G6<<5|B5, all 1,436 px of the z16
# float cell are exactly ONE ULP out and not one of the 1,484 differing
# channels is one-step -- one unit in a 5/6/5 word moves B by 8 or 9 and
# carries +4/-255 into G, so a channel delta of 1 is unreachable. Same shape
# as the z24 "+1 reads as -255", one packing further in. The encoding itself
# is refuted as the cause: the 992-quad grid writes 63,488 px covering every
# F16 exponent 0-15 and is bit-identical on all 18 captures, as are the big
# and right quads; every differing pixel is in the bottom quad, where ours is
# trunc(exact) and silicon is one ULP under it. This issue stays closed.
# docs/investigations/zb-packing-float-depth.md.
disposition = "defect"
suites = ["W buffering", "Depth buffer", "Depth buffer fixed function"]
status = "fixed-verified"
status_note = "The conversion is measured exact: z16 fixed is 49 of 49 bit-identical on lavapipe and 98 of 98 on Adreno, the float-Z encoding landed in 23a8962df2 and a33fa42bc3, and the z24 fixed-point one-unit-high readback this was REOPENED for is gone -- the #52 barycentric arm 5e612529b9 -> 91b0897e01 is PRE-REGISTERED PASS on all 72 checks, 72,138 -> 43,690 px, and 43,690 equals depth_exact_floor.py's integer floor on all 18 captures with ours - floor collapsing to {0: 85192} on the big quad. The remaining float-Z cells and the colour residual are #52's and #38's respectively, not this issue's conversion. TITLE CORRECTED 2026-09-14. It asserted 'float Z is structurally wrong' -- the sentence #52 RETRACTED as a channel-counting artefact of the RGB565 packing -- while carrying status fixed-verified. A retracted claim in a verified row's title is the worst place for it, because the title is what gets read. lane.depth52z16 flagged it from outside its own scope, which is the behaviour the board wants. The correct statement: 0 px differ in the 63,488-px grid covering every F16 exponent 0-15, and the float residual is the same one-ULP family as the fixed-point one."

[issue.19]
title = "Tests that render another test's image: 2 contamination, 82 missing-state (measured 2026-09-12)"
# harness, not defect, and that is the measurement rather than a guess. The
# premise -- that a large number of tests render another test's image -- was
# tested by running each accused test BOTH in company and solo across 1,540
# captures. It came out 2 contamination against 82 missing-state: in 82 cases
# the test renders differently alone because it DEPENDS on state an earlier
# test left set, which is a property of the test suite and not of the emulator.
# Same class as #15. The two real contamination cases are the actionable part
# and are small. docs/investigations/issue-19-isolation-2026-09-12.md.
#
# RE-MEASURED 2026-09-12 (late) once a disc could isolate a test (8da779610b):
# CONTAMINATION IS NOW ZERO. The two cases were Texture_render_target::TexFmt_A8
# and TexFmt_A8_L, and both are RenderTextureLoop poisoning the suite, so both
# are resolved by ONE skip_tests line and by no code. crossmatch on the same
# goldens: loop-included accuses 2 of 41; loop-skipped at tip accuses 0 of 40,
# with 0 captures failing worse than mean 2.0. The suite itself is 4,235 px at
# tip against the 3,209,634 px headline -- 99.87% of that was the disc.
#
# The other 82 cannot be touched by a skip list, and that is definitional rather
# than unmeasured: contamination means exact ALONE, so removing the company
# fixes it; missing-state means as wrong alone, so no disc composition changes
# what the test renders. skip_tests can only ever resolve contamination.
#
# Scanned for a SECOND poisoning test two independent ways and found none:
# poison_scan.py over 88 suites / 2,071 captures (nothing else matches the
# shared-mask + flat-content + exact-suspect signature), and an audit of all 100
# suite .cpp files for a test mutating state only Initialize() establishes (the
# two other single-mutator candidates, ZPass's TestPointSizeProgrammable and
# vertex_shader_independence's TestMultiOutput, both restore it).
# docs/investigations/issue-19-58-at-tip-2026-09-12.md.
disposition = "harness"
suites = ["Texture DXT", "Texture render target", "Attrib carryover",
          "Blend surface", "Blend tests", "Depth buffer",
          "Fog exceptional value", "Fog gen", "Fog param", "Lighting spotlight",
          "Line width", "Specular", "Stipple tests", "Surface format",
          "Texture perspective", "Texture shadow comparator",
          "Texture signed component tests", "W param", "Window clip",
          "ZMinMaxControl", "ZPass pixel count", "Bump map", "Image blit",
          "Texture cubemap"]

# Largely fixed in bdc26fa5c8. What remains is MEASURED and is two lines of
# wbufSlopeStep() in glsl/psh.c: we anchor the reference pair on a 2-pixel grid
# (c = 2*floor(c*0.5), r likewise), and hardware anchors on a 2-pixel grid for
