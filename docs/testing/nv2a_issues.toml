[issue.53]
title = "Vertex program with LIGHTING_ENABLE: the programmable path emits the constant term but no light loop (6 captures)"
# Re-measured on the merged head with both f0829404 and fb9cf8c7 in: Specular
# ControlFlags_VS is 102,240 px, so the figure this issue was filed with is the
# POST-fix number and fb9cf8c7 does not close it. The missing light term is
# real -- 220,892 channels on the front, 144,810 on the back.
#
# unknown-semantics rather than defect because the obvious fix is measured
# dead, not unwritten. A light loop was built and deliberately held back:
# -55,030 channels, no regressions, only the two lit captures moved, and 12%
# of what the lights should account for is the wrong number for a correct
# model. Cause: TestControlFlags drives the PROGRAM's model matrix per draw
# while modelViewMat0 sits at the XDK default, so a normal built from the
# fixed-function register cannot follow the rotation that hardware's lighting
# follows.
#
# The experiment that would restart this: determine where the lighting unit
# takes its geometry from when a vertex program owns the transform. That needs
# hardware evidence -- a fourth candidate derived from here is what the held
# negative already rules out.
suites = ["Specular", "Specular back", "Lighting control"]
disposition = "unknown-semantics"

[issue.50]
title = "Blend tests: DrawColorAndAlphaStack renders its four swatches in reverse vertical order (not a blend defect)"
# The largest structural entry on the board, 6,500,124 channels, and NOT a blend
# defect. 1_ADD_0 is src=ONE dst=ZERO -- the blend unit contributes nothing --
# and the stack still comes out with its four swatch colours in exact reverse
# vertical order. 443 of the 1,568 oracle captures differ on exactly 16,384 px
# in the identical box (rows 112-367, cols 560-623), one full stack of four
# 64px swatches. Cols 16-76 are asymmetric too and match hardware exactly, so it
# is not a global flip hidden by symmetry. Five mechanisms measured dead,
# including draw-queue merging (check_draw_mergeable forced false over all 1,568
# captures moved zero pixels) and the arithmetic itself (4,480/4,480 quads exact
# at centres). Two readings remain, reversed placement or reversed colour
# assignment, and this capture cannot separate them -- a variant with unequal
# swatch heights would.
disposition = "defect"
suites = ["Blend tests"]

[issue.51]
title = "Texture cubemap: 98% of the suite is PS_TEXTUREMODES_DOT_STR_3D, and its coordinate range is wrong"
# 494,852 of 504,163 structural channels in six DotSTR3D_* captures, every
# dotmap variant, each 0% one-step at a worst error of 255. Not the dot mapping:
# DotReflect* uses the same dotmap_funcs entries at 300-500 channels. The 3D
# texture is the eight corners of the colour cube, so the colours name the
# texels sampled -- on -1to1 we reach 8 and silicon reaches 4; on 0to1 we reach
# 8 and silicon reaches 2, so its coordinate varies along one axis where ours
# varies along three. Two negatives recorded: returning samplerCube when
# tex_cubemap[i] moves zero captures (that flag is false here), and mirroring
# DOT_STR_CUBE's remapCubeTo2D fallback also moves zero AND breaks
# DotSTR3D_Bad2D, which was exact. dim_tex[3] is 3 -- a genuine volume lookup.
disposition = "defect"
suites = ["Texture cubemap"]

[issue.52]
title = "Depth buffer: four independent defects on eight cells, one fixed, and the compression axis is inert"
# Compression is provably not a variable: the Cn/Cy depth dumps are bit-identical
# on silicon AND here, 196/196, so the suite's 16 cells are 8. Those hold four
# unrelated defects -- Z16 fixed depth already exact (49/49); Z24 fixed off by
# exactly one unit, partly fixed in 5dac36b2 and still 87.7% one-sided upward;
# float Z structural (not one of F16's 469,927 channels is one-step); and a
# colour error that is NOT downstream of the depth error (the same 69,462
# channels in the same places in both fixed-point formats, even where the depth
# buffer beneath is bit-perfect). 28 captures, 270,650 channels, are scored
# against saturated goldens. Depth_buffer_fixed_function is a different and
# larger defect: same cell, error maxes at 9 units rather than 1.
disposition = "defect"
suites = ["Depth buffer"]
