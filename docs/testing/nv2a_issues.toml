# NOT A BUMP-ARITHMETIC DEFECT. Measured 2026-09-12: the bump matrix, scale and
# offset are already correct, and the 818,008 px decomposes into six disjoint
# classes that sum exactly:
#   YUV bump source (UYVY/YUY2)    4 captures   445,984 px   54.5%
#   R16B16                         4            169,184      20.7%
#   sub-pixel filter jitter       30             91,204      11.1%
#   #38 coordinate floor, SOLE    40             63,040       7.7%
#   Y16 in Bump_map                2             44,748       5.5%
#   DXT1                           2              3,848       0.5%
#
# Two measurements carry it. 40 of the 82 captures sit at exactly 1,576
# structural px and ALL 40 MASKS ARE BYTE-IDENTICAL -- checked elementwise, 11
# horizontal rows on a 21-row period, format-independent. Those captures have
# ZERO bump error; they are #38. And the red/grey boundary position is a direct
# readout of the applied displacement: we place 89.7-99.5% of the goldens'
# boundaries exactly, mean absolute error 0.006-0.224 px on a 5.25 px cell,
# where a wrong matrix entry would move boundaries by whole cells.
#
# So the remaining work is TEXTURE INPUT, not bump: R16B16 through
# BUMPENVMAP_LUM at psh.c:2065 (101,330 px, and the only discriminating
# goldens), dotmap_hilo_1 at psh.c:1507 (67,854 px), Y16 decode (44,748 px),
# and YUV at pgraph/texture.c:475 plus the cache key -- NOT psh.c (445,984 px).
#
# Rivals scored: dS=B dT=G (what psh.c does) 80.41% against dS=R dT=G, the
# formula documented in pixel_shader_tests.h, at 25.21%; dS=G dT=B 53.00%;
# dS=G dT=R 39.49%; /127 78.32% and unrounded 80.06%, both below the current
# rule. The dot_map nibble decode is measured CORRECT (psh.c:2551-2553 gives
# 4,4,0, exactly the test's intent), so that hypothesis is dead not open.
#
# DISCRIMINATION IS THE TRAP HERE: only 2 of 82 captures can confirm a rule
# (BumpEnvLum_R16B16 and _L, 115 golden colours over 50,665 px), 4 weakly, and
# 76 cannot -- 1 to 2 golden colours in the structural mask. The corpus sheet's
# 85-118 colours are counted over the whole differing mask, which is 97%
# off-by-one. Prior attempts were scored against BumpMap_R16B16, whose golden
# holds TWO colours: the #41 trap again.
#
# The 6.46M alpha signal is a separate, already-closed defect: zero
# alpha-differing px in all 42 Bump_env_lum captures and alpha_only = 0 in all
# 82. Bump_map's delta-64 alpha is the checker cell identity swapping behind a
# displaced boundary (255 vs 191), arithmetically downstream of the colour
# error.
#
# Two corrections to this issue's record: `_L` means LINEAR, not luminance, so
# "R16B16_L works, therefore the swizzle is correct" does not follow -- and
# linear and swizzled R16B16 fail identically (50,665 each) in Bump_env_lum,
# which points at the luminance channel of a two-component 16-bit format.
#
# Caveats: both suites ran on a shared disc, single-run, so contamination is
# not ruled out; and the offline oracle has 19.6% self-error (46.4% on _R90),
# so it ranks rivals but is not a reference renderer.
# docs/investigations/bump-rule-2026-09-12.md,
# docs/testing/run-2026-09-12-bump-decomposition.tsv.
#
# ALL THREE texture-input classes are now measured NOT to be in the decode --
# they are in psh.c, so this issue belongs with whoever holds that file. All
# six relevant Texture_format captures are bit-exact, 0 differing px of
# 307,200 each.
#
#   YUV (445,984 px): there is only ONE YUV decode in the tree and
#     convert_ycbcr_to_rgb() already rounds each term separately (52defa5b),
#     so the "apply the same rounding here" hypothesis is dead by inspection --
#     it is the same function. The goldens settle it independently: they hold
#     greens (16,84,16)/(72,255,18) where TEX1, the only thing the final
#     combiner selects, is a checkerboard of (255,0,0)/(127,32,33). No decode
#     can produce that.
#   R16B16 (169,184 px): the sharpest disproof on the board. SZ_R8B8 carries
#     the IDENTICAL degenerate {G,R,R,G} swizzle shape and PASSES at the
#     1,576 px floor where R16B16 fails at 50,665 -- on bit-equal component
#     values (0x4545/65535 is exactly 0x45/255). A permutation of identical
#     values cannot produce different pixels, so hardware separates them by
#     CHANNEL BIT WIDTH, which no VkComponentMapping expresses. All four
#     swizzle slots are pinned (157/64/64/50 distinct golden values).
#   Y16 (44,748 px): pinned twice -- 188 G/B values against 2 in R, and
#     BumpEnvLum_Y16 passes at the floor.
#
# Corrections to this entry's own record: BumpMap_R16B16 is NOT a BUMPENVMAP
# test (it is Test16bit, DOT_PRODUCT/DOT_ST, different bump colours);
# Bump_env_lum uses different colours again; the psh.c sites are 2217/2218/2254
# and 1629, not 2065/1507; and the swizzle resolves to .r = R16 with
# .g = .b = B16 -- luminance from R16 and both offsets from B16, the reverse of
# a first reading.
#
# Retracted before it shipped: the swizzled/linear pairs' byte-identical
# failure masks do NOT exonerate the decode. Those captures are the same image
# apart from the printed test name (68 px, none inside the mask), so they are
# not a probe of anything.
#
# SOLVED 2026-09-13, the R16B16 dot-product class (BumpMap_R16B16 32,748 px and
# _B 35,106 px). "Hardware separates them by channel bit width" was right, and
# the separation is in the HILO dot mapping, not the format table. Two
# mechanisms, both derived offline against the goldens with
# docs/testing/bump16_oracle.py (a full Test16bit oracle, validated by
# reproducing OUR shader on our captures to 2,616 and 1,616 px of 111,496):
#
#   1. The mapping must read each 16-bit field WHOLE. dotmap_hilo_1 rebuilds
#      each half of the texel from two bytes, which is right for a four-byte
#      texel and discards the low byte of both fields here. The endpoints are
#      unaffected -- the test's converter byte-replicates, which is exactly why
#      the flat corners were already exact and why this never looked like a
#      decode error -- so all of it is the tent ramp: at fx = 0.25 across the
#      B16 ramp lo must be 385.5/65535, the byte reading gives 257/65535, and
#      the DOT_ST stage's 15x multiplier turns that into 0.94 of a
#      checkerboard cell. 6,525 and 7,316 px per quad -> 560 and 341, the #38
#      floor. psh.c now has dotmap_hilo_1_16 for it.
#   2. A TEXFILTER sign flag signs the FILTER, not the value. The four quads
#      differ in nothing but ASIGNED/GSIGNED and are byte-identical wherever
#      the input texels are flat -- including where the flagged field holds
#      0xffff, which as a signed value would be -1/32767 -- and differ across
#      exactly the flagged field's ramp rows 42..125 (or columns, on _B) and
#      nowhere else. So each texel is sign-extended before interpolation and
#      the filtered result read back unsigned; sign extension is a no-op
#      modulo 2^16, which is why flat texels cannot see it. Reading the field
#      as signed scores 12,519 px on that quad, clamping negatives to zero
#      3,830, this 144. ASIGNED signs the texel's high half, GSIGNED its low
#      half, following the byte positions of each field's high byte.
#
# Both gated on the two R16B16 formats: 8,192 generated shaders across every
# dot-mapping and dot texture mode differ from the baseline only by the new
# preflight function definitions, no emitted statement. The Y16 and YUV
# classes in this issue are untouched and still open.
status = "fixed-part"
status_note = "closed: the measurable fog defects landed; #41/#42 split out and both now closed"

[issue.10]
title = "Bump mapping"
disposition = "defect"
blocker_falsifier = "if 'no mechanism in hand' were false for any of the three classes, the post-fix per-sign-quad decomposition would show that class concentrated in the FLAGGED quads -- the signature the luminance literal had (310/14,241/ 422/14,187) -- rather than spread evenly across all four while hardware's own flag sensitivity stays near zero."
blocker_tested = "confirmed, bump_sign_quads.py on POST-FIX captures (ref c866527e03, z-repeat-c866527e03-010-Bump_env_lum). All three classes reproduce and none has the fixed class's shape. YUY2_L 27,864/27,874/27,874/27,884 per quad, one-step 0 in every quad -- wrong with ALL sign flags clear, so no sign or rounding model reaches it. Y8/AY8/A8Y8 7,139/7,441/7,301/7,501, one-step 6,829-7,079: evenly spread and one-step dominated. R16B16 20,758/21,154/ 20,828/21,164 with only ~8,100-8,500 one-step: a third shape. Control: the already-fixed A8 and Y16 read 1,576 with 0 one-step. WARNING FOR THE NEXT READER -- the 'z-tip' sweep (ref 0026f00534, 09-13 04:32) PREDATES the fix 93196d2d05 (09-13 08:18) and still reads Y16 at 28,132; any class number taken from z-tip is pre-fix."
suites = ["Bump map", "Bump env lum"]
status = "fixed-part"
blocked_on = "NO MECHANISM IN HAND for any of the three remaining classes, which is a different state from being ready to measure -- do not read this as queued work. (1) YUV: NOT CONCLUDED and deliberately not patched. Decode is bit-exact (TexFmt_UYVY_L at 0 differing px), masks byte-identical across suites and layouts, zero one-step error. There is nothing to predict yet, so the next MEASUREMENT is named instead of a fix proposed. (2) Y8/AY8/A8Y8: real stored data in component 0, all four sign quads wrong with one-step spread evenly across them, so it is a rounding-phase question and provably not the literal that was just fixed. (3) BumpEnvLum_R16B16: component 0 is the G swizzle, ~20,800 wrong in all four quads, separate from the HILO path already fixed and verified."
status_note = "TWO PRE-REGISTERED PASSES TODAY, 176,134 px, both re-judged by the orchestrator rather than taken from the lane. (1) HILO R16B16: PASS on all 161 checks, BumpMap_R16B16 32,748 -> 668 and _B 35,106 -> 711. This entry had recorded that arm as never run -- 'nothing under dispatch/results names that prediction' -- and two results named it. Drift that UNDERSTATES progress is the expensive direction: it sends the next lane to redo finished work. (2) THE LUMINANCE LITERAL: PASS on all 139 checks, 4 better / 0 worse / 137 same. BumpEnvLum_A8 and _A8_L 29,160 -> 1,576, _Y16 and _Y16_L 28,132 -> 1,576; suite differing 1,954,369 -> 1,846,089. Mechanism: component 0 for SZ_A8 and SZ_Y16 comes from the literal ONE, not from stored data, and RSIGNED turned 1.0 into 0.496 -- a sign flag on a swizzle literal has nothing to sign. The fix ENUMERATES the four formats whose view swizzle drives component 0 from ONE (the whole set in both vk/ and gl/ constants, and the two tables agree) rather than matching Y-ish names, which is exactly what leg L2 was written to catch. L1, the mechanism leg, is a WITHIN-FRAME identity and was checked with docs/testing/bump_sign_quads.py rather than left as prose: arm B reads Gu Bs=422, Gs Bu=422, Gs Bs=422 -- the two BSIGNED quads equal the GSIGNED-only quad -- with ZERO one-step px in all four quads, against arm A's 13,755/13,645 vs 422. Registered baseline-independent on purpose: the captures it was derived from are 19 hw/ commits behind arm A, so absolutes could not be registered. L2's guards hold byte-identically: Y8/AY8/A8Y8 stay at 29,382 with one-step spread EVENLY over all four quads (6,829/7,019/6,879/7,079, not concentrated in the flagged pair) because component 0 for SZ_Y8 is {R,R,R,ONE} and for SZ_AY8 {R,R,R,R} -- real data, where RSIGNED is meaningful -- and BumpEnvLum_R16B16 stays ~20,800 wrong in all four quads because its component 0 is the G swizzle. Their total 29,382 sits 222 px from A8's 29,160, the kind of coincidence of size that invites the wrong rule. THE BRIEFED PREMISE FOR WHAT REMAINS WAS WRONG: 'Y16/YUV go through HILO' is false, they go through BUMPENVMAP. Test16bit, the only dot-product path and the only writer of DOT_RGBMAPPING 0x044, is instantiated ONLY for SZ_R16B16; tex_hilo16 is never set for Y16 or YUV, so nothing in dotmap_* can address them. Corpus-wide: every DOT_RGBMAPPING write is 0x044/0x111/0x222/0x333/0x444/0x777, both cubemap suites bind SZ_A8B8G8R8, 0x555/0x666 are commented out because hardware rejects them."


# MEASURED 2026-09-12: 98.05% of this is sub-perceptual gradient rounding, not
# an attribute or primitive-assembly defect. Across 111 captures in four
# suites, 29,334 of 1,502,150 px are structural -- 1.95%.
#
# Attrib_carryover's 0/96 is neither our defect NOR the suite's order
# dependence. Maximum per-channel RGB delta over all 96 captures is 2/255 and
# alpha is bit-exact everywhere (96.70% of channels exact, 2.77% off by one,
# 0.54% off by two). Missing state renders a structurally wrong image and a
# 2/255 ceiling leaves no room for one -- and stronger: every differing pixel
# falls inside the bleed primitive, while the test primitive whose colour IS
# the carried-over value is bit-exact, present and correctly sized in all 96.
# The carryover semantics are correct. Corroborating: 11 of the 12 attributes
# under test have BYTE-IDENTICAL differing-pixel sums (104,194) and identical
# medians, which an attribute-specific defect cannot look like -- and the test
# source says why ("the bleed buffer should always render its diffuse color,
# regardless of the attribute under test").
#
# The quad-split lead was checked and INVERTED. On Attrib_float::0_1 the
# gradient is purely vertical, so a v1-v3 seam would show as x-variation
# within a row: ours is constant across x in 284 of 284 rows and the GOLDEN
# varies in 258 of them. The seam is hardware's, and changing prim_rewrite.c's
# diagonal cannot manufacture it. On a genuine 2D gradient our roughness
# matches hardware to 0.4% (mean |dx| 1.7989 against 1.7922; 188 row
# sign-reversals against 189), leaving a rounding phase offset.
#
# The only structural work is 2 NaN tests and it is NOT in the attribute path:
# hardware's -NaNq_NaNq renders a 0->255 ramp under the passthrough shader but
# flat 255 once the value passes through a mul by 1.0, so the clamp is in the
# vertex ALU, not where the attribute value is captured. A clamp in
# pgraph_update_inline_value would force both columns equal; hardware's are 255
# apart. -INF_INF is the control -- there the two columns DO agree, so the
# divergence is NaN-specific. Note nxdk's own source calls -NaNs_NaNs
# nondeterministic on hardware, so that golden is not a trustworthy target.
#
# Free-standing: Degenerate_begin_end needs no owner -- 8,422 px, zero pixels
# beyond 2/255. And run-2026-09-12-golden-discrimination.tsv has NO Attrib_*
# rows, so it could not gate any of this.
# docs/testing/run-2026-09-12-issue12-attribute-magnitude.tsv.
