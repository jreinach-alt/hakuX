status_note = "CLOSED as (c): the guard tested the one case that CANNOT happen. !texture_bindings[i] is unreachable by construction -- that NULL is written only by finalize_textures, after which the whole PGRAPHVkState is freed -- while the REACHABLE case has a non-NULL binding, fell straight through, and stamped tex_reg_cache[i] with registers the bind had just FAILED to honour while clearing texture_dirty[i]. That is the permanent in the title and the committed guard never touched it. create_texture now returns whether it bound; vk/buffer.c floors a texture_cache_size override where there was no clamp at all. lru_exhausted = 0 over both runs, so it closes on the code being right rather than on the path being measured -- stated plainly."

