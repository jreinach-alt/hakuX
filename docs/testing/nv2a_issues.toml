[issue.50]
title = "Blend tests: DrawColorAndAlphaStack's stack is wrong on 1,567 of 1,568 captures; mechanism unknown, not a reversal"
# The largest structural entry on the board, 6,500,124 channels, and NOT a blend
# defect. 1_ADD_0 is src=ONE dst=ZERO -- the blend unit contributes nothing --
# and the stack still comes out with its four swatch colours in exact reverse
# vertical order. 443 of the 1,568 oracle captures differ on exactly 16,384 px
# in the identical box (rows 112-367, cols 560-623), one full stack of four
# 64px swatches. Cols 16-76 are asymmetric too and match hardware exactly, so it
# is not a global flip hidden by symmetry. Five mechanisms measured dead,
# including draw-queue merging (check_draw_mergeable forced false over all 1,568
# captures moved zero pixels) and the arithmetic itself (4,480/4,480 quads exact
# at centres). Two readings remain, reversed placement or reversed colour
# assignment, and this capture cannot separate them -- a variant with unequal
# swatch heights would.
#
# Retitled 2026-09-12: the reversal is NOT the mechanism, and two more are dead.
# Render-target aliasing -- that stack C shows stack A's content, which would
# explain the apparent order, since the two functions draw the same four
# colours in OPPOSITE order -- matches neither our own stack A nor the
# golden's, 0 of 1,568. Exact band reversal is false too: on 1,567 of 1,568
# captures NO band matches ANY golden band bit-exactly in any position, so the
# bands differ in value and not only in order. As a tendency reversal is mixed
# rather than clean -- better on 949, tied on 376, WORSE on 243, median
# band-mean L1 121.1 reversed against 194.4 in order, where a pure reversal
# would sit near zero. The 376 ties are degenerate and support neither reading.
#
# Also measured: stack A (DrawColorStack, cols 16-79) is a CLEAN ORACLE for the
# signed equations -- 0/224 differing on each of ADD/MAX/MIN/REVSUB/SUB and
# 224/224 on both SADD and SREVSUB -- so #43 belongs there rather than on a
# whole frame that also carries this defect. And a test-revision mismatch is
# ruled out from source: upstream blend_tests.cpp is byte-identical in draw
# order and all four colours from 283e2971 (the last revision before the
# 2025-03-14 oracle release) through 2cfe6073.
# docs/investigations/blend-stacks-are-two-defects.md.
disposition = "defect"
suites = ["Blend tests"]

[issue.51]
title = "Texture cubemap: DOT_STR_3D fetches a corner texel on silicon, picked by two dot-product signs"
# The rule, at the level of the observable and no further: under DOT_STR_3D the
# fetched texel is a CORNER of the texture, picked by sign(dot_{i-2}) and
# sign(dot_{i-1}); the third component selects nothing. WHY it saturates is
# open. The first answer -- the dots run far outside [0,1] and clamp -- is
# FALSIFIED: reconstructing the exact matrix chain gives |dot1|,|dot2| <=
# 0.00299 and |dot3| <= 9.4e-7, because the composite includes the 640x480
# viewport and a 0x00FFFFFF depth scale and it is the INVERSE that is used.
# That also leaves our own output unexplained, which matters more: at 0.003
# with box filtering every fragment should land on texel (0,0) and be flat,
# and ours is texel-frequency noise, so the coordinate reaching our sampler is
# not dotSTR3.xy either. Untested candidate, written up in the doc and
# deliberately not asserted here: the test sets texcoord w = 0 on all three
# stages and the dot modes never divide by w, so a projective divide in the
# hardware address unit would send every component to +-inf with the sign of
# the numerator. One instrumented run settles it.
# Evidence for the observable rule: the goldens hold NO colour outside the
# four +X-face corners
# {#0000FF,#FF0000,#00FF00,#FFFFFF}; the three unsigned dotmaps cannot flip
# sign(dot_{i-2}) and their #FF0000 count is exactly 0 over ~87k cube px; the
# regions are flat with smooth boundaries, which is a sign field of M_i.f(N)
# and not a varying fetch; and DotSTRCube_*, same coordinate and same texture,
# is within 130 px. Bad2D confirms it on a plain 2D texture: silicon is one
# flat #FFFF44 over all 56,909 px, one texel of 4,096, where we dither both
# checker colours at texel frequency.
# Predicted counts (B/R/G/W) the fix must reproduce: 0to1 28114/0/28795/1042,
# HiLo_1 28385/0/28524/1170, HiLoHemi 28958/0/27951/1376, -1to1
# 14446/14562/13723/15220, -1to1D3D 13093/13722/14832/16594, -1to1GL
# 14527/14457/13849/15282.
#
# Two register facts this entry used to carry the wrong way round, both
# readable in the test source and neither needing a run: tex_cubemap[3] is
# TRUE (texture_cubemap_tests.cpp calls SetCubemapEnable), and dim_tex[3] is
# 2, not 3 (GetDimensionality returns 3 only for depth > 1 and the test sets
# 64x64). So the stage is a cubemap-flagged 2D texture, not a volume, and we
# already emit texture(texSamp3, dotSTR3.xy) -- structurally the same fetch
# the rule attributes to hardware, so the defect is NARROWER than "wrong
# mode". The two probes recorded against those readings stand as measured, but
# the remapCubeTo2D row's +59,142 on Texture_2D_as_cubemap equals
# DotSTR3D_Bad2D's residue on the current build with no probe applied, so it
# cannot be told apart from a baseline change.
# docs/investigations/cubemap-is-dot-str-3d.md.
#
# ad1caa07's own effect, measured separately because it is nearby and easy to
# confuse with the above: 2,565,441 differing px -> 320,535 across both
# cubemap suites, with the "other 71" going 2,223,987 -> 4,644.
#
# RETRACTED: there is no DotSTR3D_Bad2D regression from ad1caa07. This entry
# carried one on my authority and it was wrong twice over -- first with a
# mechanism ("sampled a stale texture and happened to agree"), then as a
# "measured regression with no mechanism". Bad2D came back BYTE-EXACT on a
# later run of the same binary. It is run-to-run variance, and the reason is
# the undefined behaviour recorded below: every single-run score on the seven
# DotSTR3D_* captures is meaningless, including the one I filed this row from.
#
# What Bad2D actually shows, from the image rather than the histogram: we do
# not land on a wrong corner, we DITHER BOTH CHECKER COLOURS at texel
# frequency where silicon is one flat #FFFF44 across all 56,909 px. Same shape
# as the cubemap captures. Note stage 3 is written once in Initialize() in that
# suite, so a "sampled the wrong texture" reading does not follow; which part
# of ad1caa07's window changed it is NOT established.
#
# THE SATURATION MECHANISM IS FALSIFIED, by arithmetic and before any run. The
# claim was that the dot products run far outside [0,1] and saturate at
# CLAMP_TO_EDGE. They do not: pT1..3 are rows of the INVERSE fixed-function
# composite matrix (model_view x perspective x viewport, so the forward matrix
# carries the 640x480 and 0x00FFFFFF scales and the inverse carries their
# reciprocals), bounding |dot| at 0.00299, 0.00299 and 9.37e-7. dotSTR3 never
# leaves a box of side 0.003 about the origin, and rotations are orthonormal so
# no convention changes the lengths.
#
# That also leaves OUR output unexplained, which is the more useful half: at
# (0.003, 0.003) with box filtering every fragment should land on texel (0,0)
# and the cube should be flat, and ours is texel-frequency noise across all
# eight corners. So the coordinate reaching our sampler is not dotSTR3.xy as
# computed, and one of the texcoord / filter / binding assumptions is wrong.
#
# The observable rule and the predicted counts above are UNAFFECTED -- they
# rest on the goldens, not on the explanation: the fetched texel is a corner
# picked by sign(dot1), sign(dot2).
#
# Untested candidate, deliberately recorded as a candidate: the test sets
# SetTexCoord1/2/3(..., 0.f), so w is ZERO, and the dot modes take pT.xyz raw
# where every other pT consumer divides by pT.w. A projective divide in the
# hardware address unit would send every component to +/-inf with the sign of
# the numerator -- making magnitudes irrelevant by construction and producing
# exactly the structure the goldens show. Settling it needs one instrumented
# run emitting vec4(clamp(abs(dotSTR3),0,1),1) in place of the fetch.
#
# That probe ran on Adreno (ec13c70e60). MEASURED: every cube pixel has |dot|
# in [0.001, 0.01), confirming the 0.003 bound on device and killing the
# saturation mechanism for good; no pixel is non-finite, so the projective
# divide does not describe OUR shader (it may still describe silicon); and on
# the unsigned captures only two sign pairs occur, confirming #FF0000 = 0 at
# the mechanism level. Also MEASURED: the (sign1, sign2) field is FLAT --
# 92.4% to 99.9% of interior cube pixels agree with all four neighbours,
# within a couple of points of the golden's own output flatness -- while our
# OUTPUT is dithered at 7.2% to 78.8%. So the dither enters between dotSTR3
# and the sampled texel, not in the signs.
#
# RETRACTED from that same run: a claim that only the sign-to-corner
# assignment remained. It rested on comparing four sign-pair populations to
# four golden corner populations SORTED, and those four goldens are all within
# 17% of each other, so any roughly-equal four-way partition matches. Tested
# spatially it is at chance (24.2/25.9/26.5% against marginals 24.9/25.4/
# 25.3%), there is no dominant permutation, and half our cube lands on the four
# texels the corner rule FORBIDS (20,770 of 41,647 on -1to1D3D) -- which an
# assignment error among four corners cannot do.
#
# The live candidate: |dot3| is bounded at 9.37e-7 against 0.00299 for the
# other two, so its sign is numerical noise per pixel while theirs are stable.
# If our fetch consumes three components where hardware consumes two, that
# gives eight reachable corners instead of four, a flat field on the first two
# axes and dither contributed entirely by the third -- which fits every
# measured fact. The probe cannot settle it: R and G carried sign(dot1) and
# sign(dot2) and nothing carried sign(dot3). Next probe puts the third sign in
# B. docs/investigations/dot-str-3d-probe.md.
#
# Also note the goldens pin the face to A POSITIVE ONE AT ITS CORNERS, not to
# +X specifically -- +X, +Y and +Z share the corner set and {#0000FF, #00FF00}
# is an edge pair on all three. +X comes from the addressing argument and
# GenerateCubemap's write order, not from the pixels, so a fix that picks a
# different positive face is not thereby wrong.
#
# THE FETCH IS UNDEFINED BEHAVIOUR, and that explains every observation we
# could not account for. The validation layer names it, eight instances on the
# cube suite:
#   VUID-vkCmdDrawIndexed-viewType-07752 -- descriptor (binding 3, index 0)
#   ImageView type is VK_IMAGE_VIEW_TYPE_CUBE but the OpTypeImage has
#   (Dim = 2D) and (Arrayed = 0)
# Binding 3 is texture stage 3. get_sampler_type() routes
# PS_TEXTUREMODES_DOT_STR_3D through the PROJECT3D case, which ends
# `return dim == 2 ? sampler2D : sampler3D` and NEVER consults
# tex_cubemap[i] -- unlike CUBEMAP, DOT_STR_CUBE and all three DOT_RFLCT_*,
# which all check it. The texture is cubemap-flagged so its view is TYPE_CUBE;
# the shader declares 2D. Spec violation, result undefined.
#
# Consequence for measurement, and it invalidates a lot: running the suite
# twice on the SAME BINARY leaves 71 of 78 captures byte-identical and moves
# exactly the seven DotSTR3D_* captures -- Bad2D 0 px on one run and 19,714 on
# the next, 0to1 differing from ITSELF by 42,554 px across runs. So no
# single-run score of ours on those seven means anything, and a candidate fix
# must be scored over repeat runs until the variance is gone. It also voids the
# recorded negative "samplerCube when tex_cubemap[i] moves zero captures":
# that was noise against noise, and it was probably testing the right fix.
#
# What survives: the probe results (it replaced the fetch with an arithmetic
# readout, so it never went through the UB -- the 0.003 magnitude and the flat
# sign field are measurements of dotSTR3 itself, which is computed correctly),
# and the hardware rule with its predicted counts, which come from the goldens
# rather than from our renderer.
disposition = "defect"
suites = ["Texture cubemap", "Texture 2D as cubemap"]

[issue.52]
title = "Depth buffer: four independent defects on eight cells, one fixed, and the compression axis is inert"
# Compression is provably not a variable: the Cn/Cy depth dumps are bit-identical
# on silicon AND here, 196/196, so the suite's 16 cells are 8. Those hold four
# unrelated defects -- Z16 fixed depth already exact (49/49); Z24 fixed off by
# exactly one unit, partly fixed in 5dac36b2 and still 87.7% one-sided upward;
# float Z structural (not one of F16's 469,927 channels is one-step); and a
# colour error that is NOT downstream of the depth error (the same 69,462
# channels in the same places in both fixed-point formats, even where the depth
# buffer beneath is bit-perfect). 28 captures, 270,650 channels, are scored
# against saturated goldens. Depth_buffer_fixed_function is a different and
# larger defect: same cell, error maxes at 9 units rather than 1.
disposition = "defect"
suites = ["Depth buffer"]

# Added 2026-09-12. Cross-cutting root cause rather than a pgraph defect, and
# filed separately because it is not about a suite: tcg/tcg-op.c's
# tcg_gen_mb() has an `#elif defined(XBOX)` branch (1d8a51aff9) setting
# parallel = cflags & CF_PARALLEL where upstream sets it unconditionally true
# for system emulation. CF_PARALLEL is never set here -- rr passes false
# outright, mttcg passes smp.max_cpus > 1 -- so every guest memory barrier is
# elided, including the TCG_MO_LD_ST | TCG_MO_ST_ST each store requests to hold
# x86 TSO on a weak host. Upstream's own comment in the bypassed branch warns
# about exactly this hazard.
#
# Provable rather than statistical: on x86-64 TCG_TARGET_DEFAULT_MO already
# contains store-store so the patch never fires, on aarch64 it is required and
# dropped. That single fact predicts #44's measured 20/20 desktop
# byte-identical against ~46% Nova failures.
#
# Suites are listed because these are the ones whose intermittency it would
# explain, NOT because the defect is in them. The falsifier for the general
# claim: if #44 goes green and #39's lost-draw symptom stays equally noisy,
# the specific fix worked and the publication account is wrong.
#
# The cost is the decision -- about one dmb ish per guest memory operation,
# plausibly tens of percent on memory-heavy code -- so it needs a measured
# number before it lands. A store-store-only variant is recorded in the
# write-up and deliberately not implemented.
# docs/investigations/tcg-barriers-elided.md.
[issue.54]
title = "tcg: all guest memory barriers are elided under XBOX, and device threads read guest RAM with bare loads"
disposition = "defect"
suites = ["Texture border", "W buffering"]

# Added 2026-09-12. Blocks the other half of #48 and is read from ~15 sites, so
# it is tracked rather than folded into any one issue.
#
# check_surface_compatibility matches on host_fmt.vk_format, and A8R8G8B8,
# X8R8G8B8_Z/O and X1A7R8G8B8_Z/O all map to VK_FORMAT_B8G8R8A8_UNORM. With
# address, pitch and size unchanged across a colour-format change,
# vk/surface.c:3197-3208 takes the is_compatible branch, sets
# should_create = false and NEVER reassigns shape -- target.shape is consumed
# only on creation. The binding reports whichever format created it.
#
# Found by run order, not by reading: #48's blend fix read
# r->color_binding->shape.color_format and regressed DstAlpha_ARGB8 from exact
# to 98,304 px while its complement 1-DstAlpha_ARGB8, which runs FIRST with a
# fresh binding, stayed exact. A cache-key collision -- the first hypothesis --
# has no notion of position in a run and was killed four ways.
#
# NOT one fix. The blend half is fixed by reading pg->surface_shape.color_format
# (c6dd6fcdfb) because the surface the blend unit asks about IS the current one.
# The texture unit consults one that is NOT: both suites render to a scratch
# surface and restore the framebuffer format before sampling it, so by
# texture-bind time the register says A8R8G8B8 and reading it would make the
# override dead code. Same register, different question.
#
# What it blocks, with the rule already measured pixel-exact: X8R8G8B8_Z8/_O8
# sampled alpha is 0 and 255 at every stored alpha 0-255, sd 0.00 over 16,371
# invertible px per quad, and predicting the alpha half from the opaque half
# gives 0 of 65,536 per capture against 65,536 of 65,536 for the opposite
# constant across 524,288 px. Predicted when unblocked: -229,376 px on six
# captures, with both X_Z1RGB5, all four XA_*, and the four exact
# ARGB8/R5G6B5 captures required not to move.
#
# Other consumers of the same stale field, none audited: vk/texture.c via
# pgraph_vk_surface_get(), vk/renderer.c:1144 (a state-block KEY), and about a
# dozen gl/surface.c pack/unpack sites.
[issue.55]
title = "Surface bindings never refresh their colour format on compatible reuse, and fifteen sites read it"
disposition = "defect"
suites = ["Blend surface", "Texture Framebuffer Blit"]
