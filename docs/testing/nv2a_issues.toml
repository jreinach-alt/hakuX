# NOT A BUMP-ARITHMETIC DEFECT. Measured 2026-09-12: the bump matrix, scale and
# offset are already correct, and the 818,008 px decomposes into six disjoint
# classes that sum exactly:
#   YUV bump source (UYVY/YUY2)    4 captures   445,984 px   54.5%
#   R16B16                         4            169,184      20.7%
#   sub-pixel filter jitter       30             91,204      11.1%
#   #38 coordinate floor, SOLE    40             63,040       7.7%
#   Y16 in Bump_map                2             44,748       5.5%
#   DXT1                           2              3,848       0.5%
#
# Two measurements carry it. 40 of the 82 captures sit at exactly 1,576
# structural px and ALL 40 MASKS ARE BYTE-IDENTICAL -- checked elementwise, 11
# horizontal rows on a 21-row period, format-independent. Those captures have
# ZERO bump error; they are #38. And the red/grey boundary position is a direct
# readout of the applied displacement: we place 89.7-99.5% of the goldens'
# boundaries exactly, mean absolute error 0.006-0.224 px on a 5.25 px cell,
# where a wrong matrix entry would move boundaries by whole cells.
#
# So the remaining work is TEXTURE INPUT, not bump: R16B16 through
# BUMPENVMAP_LUM at psh.c:2065 (101,330 px, and the only discriminating
# goldens), dotmap_hilo_1 at psh.c:1507 (67,854 px), Y16 decode (44,748 px),
# and YUV at pgraph/texture.c:475 plus the cache key -- NOT psh.c (445,984 px).
#
# Rivals scored: dS=B dT=G (what psh.c does) 80.41% against dS=R dT=G, the
# formula documented in pixel_shader_tests.h, at 25.21%; dS=G dT=B 53.00%;
# dS=G dT=R 39.49%; /127 78.32% and unrounded 80.06%, both below the current
# rule. The dot_map nibble decode is measured CORRECT (psh.c:2551-2553 gives
# 4,4,0, exactly the test's intent), so that hypothesis is dead not open.
#
# DISCRIMINATION IS THE TRAP HERE: only 2 of 82 captures can confirm a rule
# (BumpEnvLum_R16B16 and _L, 115 golden colours over 50,665 px), 4 weakly, and
# 76 cannot -- 1 to 2 golden colours in the structural mask. The corpus sheet's
# 85-118 colours are counted over the whole differing mask, which is 97%
# off-by-one. Prior attempts were scored against BumpMap_R16B16, whose golden
# holds TWO colours: the #41 trap again.
#
# The 6.46M alpha signal is a separate, already-closed defect: zero
# alpha-differing px in all 42 Bump_env_lum captures and alpha_only = 0 in all
# 82. Bump_map's delta-64 alpha is the checker cell identity swapping behind a
# displaced boundary (255 vs 191), arithmetically downstream of the colour
# error.
#
# Two corrections to this issue's record: `_L` means LINEAR, not luminance, so
# "R16B16_L works, therefore the swizzle is correct" does not follow -- and
# linear and swizzled R16B16 fail identically (50,665 each) in Bump_env_lum,
# which points at the luminance channel of a two-component 16-bit format.
#
# Caveats: both suites ran on a shared disc, single-run, so contamination is
# not ruled out; and the offline oracle has 19.6% self-error (46.4% on _R90),
# so it ranks rivals but is not a reference renderer.
# docs/investigations/bump-rule-2026-09-12.md,
# docs/testing/run-2026-09-12-bump-decomposition.tsv.
#
# ALL THREE texture-input classes are now measured NOT to be in the decode --
# they are in psh.c, so this issue belongs with whoever holds that file. All
# six relevant Texture_format captures are bit-exact, 0 differing px of
# 307,200 each.
#
#   YUV (445,984 px): there is only ONE YUV decode in the tree and
#     convert_ycbcr_to_rgb() already rounds each term separately (52defa5b),
#     so the "apply the same rounding here" hypothesis is dead by inspection --
#     it is the same function. The goldens settle it independently: they hold
#     greens (16,84,16)/(72,255,18) where TEX1, the only thing the final
#     combiner selects, is a checkerboard of (255,0,0)/(127,32,33). No decode
#     can produce that.
#   R16B16 (169,184 px): the sharpest disproof on the board. SZ_R8B8 carries
#     the IDENTICAL degenerate {G,R,R,G} swizzle shape and PASSES at the
#     1,576 px floor where R16B16 fails at 50,665 -- on bit-equal component
#     values (0x4545/65535 is exactly 0x45/255). A permutation of identical
#     values cannot produce different pixels, so hardware separates them by
#     CHANNEL BIT WIDTH, which no VkComponentMapping expresses. All four
#     swizzle slots are pinned (157/64/64/50 distinct golden values).
#   Y16 (44,748 px): pinned twice -- 188 G/B values against 2 in R, and
#     BumpEnvLum_Y16 passes at the floor.
#
# Corrections to this entry's own record: BumpMap_R16B16 is NOT a BUMPENVMAP
# test (it is Test16bit, DOT_PRODUCT/DOT_ST, different bump colours);
# Bump_env_lum uses different colours again; the psh.c sites are 2217/2218/2254
# and 1629, not 2065/1507; and the swizzle resolves to .r = R16 with
# .g = .b = B16 -- luminance from R16 and both offsets from B16, the reverse of
# a first reading.
#
# Retracted before it shipped: the swizzled/linear pairs' byte-identical
# failure masks do NOT exonerate the decode. Those captures are the same image
# apart from the printed test name (68 px, none inside the mask), so they are
# not a probe of anything.
#
# SOLVED 2026-09-13, the R16B16 dot-product class (BumpMap_R16B16 32,748 px and
# _B 35,106 px). "Hardware separates them by channel bit width" was right, and
# the separation is in the HILO dot mapping, not the format table. Two
# mechanisms, both derived offline against the goldens with
# docs/testing/bump16_oracle.py (a full Test16bit oracle, validated by
# reproducing OUR shader on our captures to 2,616 and 1,616 px of 111,496):
#
#   1. The mapping must read each 16-bit field WHOLE. dotmap_hilo_1 rebuilds
#      each half of the texel from two bytes, which is right for a four-byte
#      texel and discards the low byte of both fields here. The endpoints are
#      unaffected -- the test's converter byte-replicates, which is exactly why
#      the flat corners were already exact and why this never looked like a
#      decode error -- so all of it is the tent ramp: at fx = 0.25 across the
#      B16 ramp lo must be 385.5/65535, the byte reading gives 257/65535, and
#      the DOT_ST stage's 15x multiplier turns that into 0.94 of a
#      checkerboard cell. 6,525 and 7,316 px per quad -> 560 and 341, the #38
#      floor. psh.c now has dotmap_hilo_1_16 for it.
#   2. A TEXFILTER sign flag signs the FILTER, not the value. The four quads
#      differ in nothing but ASIGNED/GSIGNED and are byte-identical wherever
#      the input texels are flat -- including where the flagged field holds
#      0xffff, which as a signed value would be -1/32767 -- and differ across
#      exactly the flagged field's ramp rows 42..125 (or columns, on _B) and
#      nowhere else. So each texel is sign-extended before interpolation and
#      the filtered result read back unsigned; sign extension is a no-op
#      modulo 2^16, which is why flat texels cannot see it. Reading the field
#      as signed scores 12,519 px on that quad, clamping negatives to zero
#      3,830, this 144. ASIGNED signs the texel's high half, GSIGNED its low
#      half, following the byte positions of each field's high byte.
#
# Both gated on the two R16B16 formats: 8,192 generated shaders across every
# dot-mapping and dot texture mode differ from the baseline only by the new
# preflight function definitions, no emitted statement. The Y16 and YUV
# classes in this issue are untouched and still open.
[issue.10]
title = "Bump mapping"
disposition = "defect"
suites = ["Bump map", "Bump env lum"]
status = "open"
status_note = "The HILO R16B16 fix is in the tree (1e527b74d7 plus 60b185afa8; state->tex_hilo16 at glsl/psh.c:338) and its prediction is registered (predictions/issue10-hilo-r16b16.json), but no arm has run it -- nothing under dispatch/results names that prediction -- so the 68,014 px on BumpMap_R16B16 and _B are unjudged."

# MEASURED 2026-09-12: 98.05% of this is sub-perceptual gradient rounding, not
# an attribute or primitive-assembly defect. Across 111 captures in four
# suites, 29,334 of 1,502,150 px are structural -- 1.95%.
#
# Attrib_carryover's 0/96 is neither our defect NOR the suite's order
# dependence. Maximum per-channel RGB delta over all 96 captures is 2/255 and
# alpha is bit-exact everywhere (96.70% of channels exact, 2.77% off by one,
# 0.54% off by two). Missing state renders a structurally wrong image and a
# 2/255 ceiling leaves no room for one -- and stronger: every differing pixel
# falls inside the bleed primitive, while the test primitive whose colour IS
# the carried-over value is bit-exact, present and correctly sized in all 96.
# The carryover semantics are correct. Corroborating: 11 of the 12 attributes
# under test have BYTE-IDENTICAL differing-pixel sums (104,194) and identical
# medians, which an attribute-specific defect cannot look like -- and the test
# source says why ("the bleed buffer should always render its diffuse color,
# regardless of the attribute under test").
#
# The quad-split lead was checked and INVERTED. On Attrib_float::0_1 the
# gradient is purely vertical, so a v1-v3 seam would show as x-variation
# within a row: ours is constant across x in 284 of 284 rows and the GOLDEN
# varies in 258 of them. The seam is hardware's, and changing prim_rewrite.c's
# diagonal cannot manufacture it. On a genuine 2D gradient our roughness
# matches hardware to 0.4% (mean |dx| 1.7989 against 1.7922; 188 row
# sign-reversals against 189), leaving a rounding phase offset.
#
# The only structural work is 2 NaN tests and it is NOT in the attribute path:
# hardware's -NaNq_NaNq renders a 0->255 ramp under the passthrough shader but
# flat 255 once the value passes through a mul by 1.0, so the clamp is in the
# vertex ALU, not where the attribute value is captured. A clamp in
# pgraph_update_inline_value would force both columns equal; hardware's are 255
# apart. -INF_INF is the control -- there the two columns DO agree, so the
# divergence is NaN-specific. Note nxdk's own source calls -NaNs_NaNs
# nondeterministic on hardware, so that golden is not a trustworthy target.
#
# Free-standing: Degenerate_begin_end needs no owner -- 8,422 px, zero pixels
# beyond 2/255. And run-2026-09-12-golden-discrimination.tsv has NO Attrib_*
# rows, so it could not gate any of this.
# docs/testing/run-2026-09-12-issue12-attribute-magnitude.tsv.
[issue.12]
title = "Vertex attributes and primitive assembly"
disposition = "precision-floor"
suites = ["Attrib carryover", "Attrib setter", "Attrib float", "3D primitive",
          "Degenerate begin end"]

# `Degenerate begin end` joins this 2026-09-12 (#58 triage), and the point is
# that its SEMANTICS ARE ALREADY RIGHT. The test omits NV097_SET_BEGIN_END_OP_END
# on two triangles so the final quad must be drawn as a triangle; getting that
# wrong would gain or lose a whole primitive. Instead all 17,502 differing
# channels are within TWO counts, 95.1% within one, alpha exact, and our modal
# colours track the golden one-for-one ((0,10,245,255) x61 against
# (0,9,246,255) x61). What is left is the shading interpolation band, which is
# this issue. docs/investigations/issue-19-58-at-tip-2026-09-12.md.

# MEASURED 2026-09-12: the 2D_Lines half is an UNIMPLEMENTED GRAPHICS CLASS,
# not a rasterisation defect, and the point half is already clean.
#
# The suite drives NV04_SOLID_LINE (class 0x5C) and NV04_CONTEXT_SURFACES_2D
# (class 0x42). Neither is defined in nv2a_regs.h, so pgraph_method drops every
# line at `default: goto unhandled`. Confirmed three independent ways: from the
# test source (two_d_line_tests.cpp calls pb_create_gr_ctx for both, then
# SetVertexShaderProgram(nullptr) -- there is no NV097_SET_BEGIN_END, no
# vertices and no SET_LINE_WIDTH, the whole draw is six pushbuffer writes and
# writing END performs it); from the logcat, where hakuX-unhandled reports
# class 0x0042 and class 0x005c; and from the captures, where all 3,257
# differing px are MISSING rather than displaced -- background present in every
# column within +/-5, and rolling the image sideways only worsens the match.
#
# Method offsets, measured from the logcat then confirmed against the source
# order: 0x02FC OPERATION, 0x0304 COLOR_VALUE, 0x0198 SURFACE, 0x0300
# COLOR_FORMAT, 0x0400 START, 0x0404 END.
#
# Two semantics, each corroborated twice: the LAST VERTEX IS EXCLUSIVE (from
# golden pixel counts, then from the test's own doxygen -- 222_222-222_222
# "should display nothing", and 400_300-401_300 is a single dot); and
# COLOR_FORMAT selects how to EXPAND COLOR_VALUE, not the surface depth. The
# destination surface is always A8R8G8B8 at back-buffer pitch, and expansion is
# bit replication -- 0x3E0 (555 green) and 0x7E0 (565 green) must both land on
# exactly [0,255,0], which is what the goldens hold. An earlier reading of that
# field as the surface bit depth was corrected.
#
# The boundary-shift label on ten of the thirteen captures is VACUOUSLY FALSE
# -- nothing is shifted because nothing is drawn -- and should be a `missing`
# class. And the label-differs status on some rows is a harness naming quirk in
# the test itself (the registry key uses MakeTestName(test, false) while the
# saved artifact uses MakeTestName(test, true)), not golden drift.
#
# The source table has 14 entries and the suite runs 13: one row is listed
# twice and dedups by name.
[issue.13]
title = "Line and point rasterisation"
# Three separate causes and it refuses to collapse: 80% of the structural error
# is spread across nineteen of sixty-one captures, every one about 55% one-step
# at a worst error of 223, ordered monotonically by the register value. Wants
# generated line geometry rather than a point fix. Test names encode the width
# in EIGHTHS -- Line_0063.7 is 63.875, not 63.7; fitting the decimal produces
# plausible nonsense. Scope warning: the fix runs through roundScreenCoords in
# glsl/vsh.c, which is rasteriser-wide.
#
# MEASURED 2026-09-12 evening on sweep column z-sweep-044-Line_width, APK
# fb4dfafc6d38. THE SCOPE WARNING ABOVE IS WRONG, and so is the framing.
#
# NOT blocked like #36. The device reports lineWidthRange [1.000, 127.500],
# lineWidthGranularity 0.5, wideLines=1 (logged by 0a97b8f48e). 63.875 is less
# than half the limit; nothing wide is clamped, and every width from 3 px up is
# delivered exactly (63.875 snaps to 64.0). The clamp story for the six widest
# captures is dead by measurement: a clamp predicts a residual that stops
# changing above the limit, and the rendered width in pixels instead tracks the
# register all the way to 63.875.
#
# What silicon draws, fitted on the isolated QUADS primitive: a PERPENDICULAR
# BUTT-CAPPED RECTANGLE of exactly the requested width. Butt scores 1.7-5.9% of
# its ink; bevel, miter and round joins and square caps are all strictly worse
# and none removes a single missing pixel. Our own output fits the same model at
# 0.03-0.20%. Line width is not the defect.
#
# The one exact rule difference is the line CENTRE. Read off the vertical
# quad-strip edge over the eighteen widths 3.0-48.0: golden matches a centre at
# the nearest PIXEL CENTRE (cx=160.5) 18/18, we match a centre at the VERTEX
# (cx=160.0) 18/18. Both light exactly W columns. They coincide at even widths
# and sit one pixel apart at odd ones -- worth ~1,000 structural channels on
# every odd capture. It is LINE-SPECIFIC, not roundScreenCoords: Fill_0000.0 in
# this same suite is coverage exact, 0 golden-only and 0 ours-only pixels. And
# it is a snap, not an offset (160.3 -> +0.2, 160.7 -> -0.2), so no constant
# translate reproduces it; it needs generated line geometry.
#
# The residual, all 57 Line_* captures, RGBA:
#   structural channels 1,000,125 over 342,679 structural pixels
#     golden-only ink (we under-cover)    63,983   18.7%
#     ours-only ink   (we over-cover)     17,062    5.0%
#     colour on ink both agree about     261,634   76.3%
# and 82.5% of that colour class is a delta larger than a third of the range.
# The palette is built from 0x33 and 0xFF, so a 204-step delta is one palette
# entry swapped for another: both renderers put ink down and disagree about
# WHICH OF SEVERAL OVERLAPPING WIDE EDGES IS ON TOP. Three quarters of this
# issue is edge priority, not width. 342,679 independently reproduces the ~342k
# in line-width.md, reached there by a different split on a different capture
# set.
#
# Two mechanisms make the wireframe edges and both show it: QUAD_STRIP, QUADS
# and POLYGON are rewritten to explicit LINES by prim_rewrite.c, so we choose
# the order (rewrite_quad_strip_line emits v0-v1, v1-v3, v3-v2, v2-v0, making
# v2-v0 the winner; silicon shows v0-v1 winning at the one pixel checked by
# hand); TRIANGLES/STRIP/FAN keep VK_POLYGON_MODE_LINE at vk/draw.c:1593, so
# Turnip chooses and we cannot.
#
# UNRESOLVED, and the capture to attack first: LINE_LOOP has an unambiguous
# order we already match and still carries 9,696 structural channels at width
# 63. A full painter model of it reproduces neither capture, so the loop has
# some other cause. Least certain point in the whole reading; Line_0016.0's
# LineLoop cluster exposes it (2,259 structural channels, no polygon-mode
# question, no rewrite choice).
#
# TRIPWIRES for any future change here: Line_0000.0 is the only pixel-exact
# capture in the suite (a zero-width line covers no pixel centre, so the draw is
# dropped); Fill_0000.0 is coverage exact and a line change must not touch it;
# and every EVEN width from 4 to 48 is coverage exact on the vertical edge, so a
# centre-snap fix must move only the odd ones.
#
# SUPERSEDED 2026-09-13 on the centre, twice, and both corrections matter more
# than the text above. Read them before writing any code here.
#
# (1) IT IS NOT A SNAP. The snap was fitted on the quad-strip edge at x = 160.0,
# an integer, where a snap and a constant +0.5 agree at every width. The fan's
# hub-to-v4 edge is vertical at x = 318.5 -- already a pixel centre, so a snap
# would leave it alone -- and the goldens move it anyway, fitting (318.500,
# 319.000] 7/7 against our (318.000, 318.500] 7/7. The y half gets NOTHING: the
# polygon's near-horizontal closing edge reads 16/16 identical in the goldens
# and in our output.
#
# (2) AND IT IS NOT A TRANSLATE EITHER. A +0.5 * surface_scale_factor bias on
# VkViewport.x, on line pipelines only, was DELIVERED EXACTLY -- fitted centre
# into the golden's interval 18/18 on one edge and 7/7 on the other, y untouched
# 16/16, all 112 fill-mode captures at zero -- and scored +394,027 px. Reverted.
# What survives: +0.5 in x holds on a steep edge, nothing holds in y on a
# shallow one, and NO GLOBAL TRANSLATE IS BOTH.
#
# (3) AND IT IS NOT A RASTERISATION MODE. The obvious candidate for "both" was a
# minor-axis bias whose sign depends on the major axis -- the GL wide-line rule,
# VK_LINE_RASTERIZATION_MODE_BRESENHAM_EXT. The device offers it (ext=1
# bresenham=1) and it has now been measured: +793,470 px, 0 better and 41 worse
# at w >= 3, structural 1,000,125 -> 3,671,805. Reverted. NOT a plumbing
# failure: 118 of 118 must-not-move entries at exactly zero delta, and the mode
# confirmed at the mechanism -- the isolated QUADS diagonal's column height
# became exactly ceil(w), 8/12/16/24 at widths 8/12/16/24.
#
# The fitted centre DID NOT MOVE on any of the three probe edges, because
# Bresenham replicates along the minor axis and on an axis-aligned line that is
# where the rectangle already put it. What it changed was diagonals, the wrong
# way: golden 10/14/19/28, perpendicular rectangle 8.6/12.9/17.2/25.8,
# Bresenham exactly 8/12/16/24. SILICON IS WIDER THAN A PERPENDICULAR
# RECTANGLE; BRESENHAM IS NARROWER; the rectangle we already draw is the
# closest of the three.
#
# THE MODE KNOB IS EXHAUSTED. smoothLines=0 (so #36 stays closed on a
# capability line), stippledBresenhamLines=0 (so #33 gains nothing here),
# rectangular is what we draw, bresenham is measured wrong. There is no fourth
# value; do not spend another arm on lineRasterizationMode.
#
# The disagreement this file recorded as open is RESOLVED, against Bresenham.
# The width-1 IoU 0.958 reading is not an instrument for it: the 48
# line-primitive captures in 3D primitive moved -1,024 in total, 12 better and
# 12 worse, because at width 1 the two modes barely differ.
#
# NEXT HYPOTHESIS, and it is a hypothesis. Silicon lights about one pixel more
# on each minor-axis boundary of a DIAGONAL wide line than a
# centre-in-rectangle rule does, and nothing extra on an axis-aligned one --
# vertical edge exactly w columns 18/18, near-horizontal exactly w rows 16/16,
# the 21-degree edge w/cos + 1 to + 2. That is a COVERAGE rule, not a centre
# and not a mode, it is invisible on every axis-aligned edge in the corpus, and
# it is the 18.7% golden-only-ink class. It needs generated line geometry.
#
# DO NOT ATTACK IT FIRST. 76.3% of the residual sits on top of it and is edge
# priority. Arm 0499184e2d reproduces the split to the digit on a fresh binary:
# 1,000,125 channels over 342,679 structural pixels, 18.7 / 5.0 / 76.3.
#
# Tool: docs/testing/line_footprint.py (--edge / --footprint / --classify).
# Full derivation in docs/investigations/line-width-residual.md.
disposition = "defect"
suites = ["Line width", "Point size", "Point params", "Swath width",
          "2D Lines", "Smoothing control", "Stipple tests"]
status = "fixed-part"
status_note = "The mode knob is exhausted and that half is finished: bresenhamLines=1 was enabled and measured, arm 0499184e2d -> 8f84f5a8ab PRE-REGISTERED PASS on all 200 checks at +793,470 px and 41 of 41 Line_width captures worse, so it was reverted (64b1e2a054); smoothLines=0 and stippledBresenhamLines=0 close the other two values, and rectangularLines is what we already draw. What remains is not the mode: Line_width still carries 1,000,125 structural channels over 342,679 px, 76.3% of it edge priority with both renderers inking the pixel and disagreeing about which overlapping wide edge is on top, and the offline derivation of the quad-strip order (24 permutations, no device) has not been attempted."

