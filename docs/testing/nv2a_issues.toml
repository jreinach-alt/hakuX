disposition = "defect"
suites = ["Depth buffer"]

# Added 2026-09-12. Cross-cutting root cause rather than a pgraph defect, and
# filed separately because it is not about a suite: tcg/tcg-op.c's
# tcg_gen_mb() has an `#elif defined(XBOX)` branch (1d8a51aff9) setting
# parallel = cflags & CF_PARALLEL where upstream sets it unconditionally true
# for system emulation. CF_PARALLEL is never set here -- rr passes false
# outright, mttcg passes smp.max_cpus > 1 -- so every guest memory barrier is
# elided, including the TCG_MO_LD_ST | TCG_MO_ST_ST each store requests to hold
# x86 TSO on a weak host. Upstream's own comment in the bypassed branch warns
# about exactly this hazard.
#
# Provable rather than statistical: on x86-64 TCG_TARGET_DEFAULT_MO already
# contains store-store so the patch never fires, on aarch64 it is required and
# dropped. That single fact predicts #44's measured 20/20 desktop
# byte-identical against ~46% Nova failures.
#
# Suites are listed because these are the ones whose intermittency it would
# explain, NOT because the defect is in them. The falsifier for the general
# claim: if #44 goes green and #39's lost-draw symptom stays equally noisy,
# the specific fix worked and the publication account is wrong.
#
# The cost is the decision -- about one dmb ish per guest memory operation,
# plausibly tens of percent on memory-heavy code -- so it needs a measured
# number before it lands. A store-store-only variant is recorded in the
# write-up and deliberately not implemented.
# docs/investigations/tcg-barriers-elided.md.
[issue.54]
# RETRACTED 2026-09-12: this does NOT cause #44. With every barrier restored,
# 2D_BorderTex_SZ still fails 6 of 10 runs -- indistinguishable from the ~46%
# base rate and identical to the store-store variant (which cost only +4.6%).
# The x86-equivalent arm was cancelled unrun, being a strict subset. What
# stands is the source reading -- the branch exists, CF_PARALLEL is never set,
# upstream warns about this hazard, the BQL justification is false for the
# NV2A -- so it is a latent issue with NO demonstrated symptom, at a measured
# cost of +34.1% to fix.
#
# What it breaks: the desktop/Nova asymmetry never controlled for the RENDERER.
# Desktop is lavapipe, the Nova is Turnip on Adreno, and those arms differ in
# host memory model AND renderer AND driver AND timing. The evidence was in the
# same measurement -- every desktop run carries a uniform 2,782 px (0,-1,-1)
# residual because lavapipe rounds G and B down where Adreno does not.
#
# Suites are kept only because they are where the intermittency shows; the
# defect is not in them and is no longer believed to explain them.
title = "tcg: all guest memory barriers are elided under XBOX (latent; does NOT cause #44)"
disposition = "unknown-semantics"
suites = ["Texture border", "W buffering"]

# Added 2026-09-12. Blocks the other half of #48 and is read from ~15 sites, so
# it is tracked rather than folded into any one issue.
#
# check_surface_compatibility matches on host_fmt.vk_format, and A8R8G8B8,
# X8R8G8B8_Z/O and X1A7R8G8B8_Z/O all map to VK_FORMAT_B8G8R8A8_UNORM. With
# address, pitch and size unchanged across a colour-format change,
# vk/surface.c:3197-3208 takes the is_compatible branch, sets
# should_create = false and NEVER reassigns shape -- target.shape is consumed
# only on creation. The binding reports whichever format created it.
#
# Found by run order, not by reading: #48's blend fix read
# r->color_binding->shape.color_format and regressed DstAlpha_ARGB8 from exact
# to 98,304 px while its complement 1-DstAlpha_ARGB8, which runs FIRST with a
# fresh binding, stayed exact. A cache-key collision -- the first hypothesis --
# has no notion of position in a run and was killed four ways.
#
# NOT one fix. The blend half is fixed by reading pg->surface_shape.color_format
# (c6dd6fcdfb) because the surface the blend unit asks about IS the current one.
# The texture unit consults one that is NOT: both suites render to a scratch
# surface and restore the framebuffer format before sampling it, so by
# texture-bind time the register says A8R8G8B8 and reading it would make the
# override dead code. Same register, different question.
#
# What it blocks, with the rule already measured pixel-exact: X8R8G8B8_Z8/_O8
# sampled alpha is 0 and 255 at every stored alpha 0-255, sd 0.00 over 16,371
# invertible px per quad, and predicting the alpha half from the opaque half
# gives 0 of 65,536 per capture against 65,536 of 65,536 for the opposite
# constant across 524,288 px. Predicted when unblocked: -229,376 px on six
# captures, with both X_Z1RGB5, all four XA_*, and the four exact
# ARGB8/R5G6B5 captures required not to move.
#
# Other consumers of the same stale field, none audited: vk/texture.c via
# pgraph_vk_surface_get(), vk/renderer.c:1144 (a state-block KEY), and about a
# dozen gl/surface.c pack/unpack sites.
# FIXED 2026-09-12 in b6239ccb87, and the audit refuted two things I wrote when
# filing it.
#
# The compatible-reuse path now refreshes host_fmt, fmt and a new drawn_format,
# with pgraph_vk_surface_drawn_format() as the accessor. Eleven lines of
# behaviour. The field that mattered is NOT the one the issue named:
# host_fmt.sampled_pad_alpha already carries the measured pad readback and is
# precisely the field check_surface_compatibility does not compare. The
# assignment is provably a one-field change -- within each collision group every
# other host_fmt member is a function of vk_format, and vk_format equality is
# the gate just passed -- and it keeps existing VkImageViews valid, since those
# are built from vk_format and aspect.
#
# CORRECTION 1: renderer.c:1144 is NOT a render cache key. I called it one. It
# is the diagnostic state fingerprint hashed into diag_cur_fingerprints for
# frame-diff detection, so a stale format there makes two draws hash alike and
# the tooling under-report. Cosmetic.
#
# CORRECTION 2: the "fifteen coupled consumers" are not coupled. TWELVE read a
# DIFFERENT STRUCT -- GL has its own SurfaceBinding at gl/renderer.h:42 with no
# drawn_format, so a Vulkan change cannot reach them. Of the Vulkan-side reads,
# all eight are diagnostics: JSON text, the diag hash, a debug object name
# whose only caller is on the create path, and a trace. None renders anything.
# So the blast radius I priced does not exist, and refreshing shape wholesale
# would have been pixel-inert on Vulkan too -- and bought nothing.
#
# shape is deliberately NOT refreshed, for two reasons found in code: its other
# six fields are geometry and a non-strict match reuses a surface LARGER than
# asked for (which is why surface_binding_dim is filled from surface-> and not
# target), so a wholesale refresh would have the binding claim a size its image
# lacks; and refreshing only its format fields has no single right source,
# because populate_surface_binding_target_sized hands a zeta target
# r->color_binding->shape entire, geometry and formats together.
#
# Predicted PIXEL-INERT -- not "no regressions", no movement: sampled_pad_alpha
# is the only field it can change and has zero readers outside constants.h.
# Verification arm queued.
#
# GL HAS THE IDENTICAL DEFECT independently at gl/surface.c:2827-2840, not
# fixed by this. Smaller exposure -- every row within a GL collision group is
# byte-identical, so only shape goes stale there and fmt never does.
#
# HAZARD for #48's implementer, verified: do NOT put the swizzle on
# surface->image_view. draw.c:900-902 binds that view as the colour/zeta
# ATTACHMENT while texture.c:1705/1720 puts the SAME view into
# tex_surface_direct_views[] as a SAMPLED texture; it is created once per image
# and migrated across reuse, so a swizzle there would alter what rendering
# writes and go stale exactly the way host_fmt just did. It needs its own
# sampled view.
[issue.55]
title = "Surface bindings never refresh their colour format on compatible reuse, and fifteen sites read it"
disposition = "defect"
suites = ["Blend surface", "Texture Framebuffer Blit"]

# ---------------------------------------------------------------------------
# APU / audio. Added 2026-09-12, the first non-pgraph entries in this table.
#
# Numbered from 70 deliberately, leaving a gap. The pgraph streams allocate
# sequentially and several ids above 55 are already in flight on unmerged
# branches; taking the next free number here would collide with one of them on
# merge, and an issue number that means two different things is worse than an
# untidy sequence.
#
# These carry `component = "apu"` and no suites. That is not an omission: the
# pgraph test discs play no audio at all, so no suite exercises the APU, and
# naming one would put a false entry in the one hand-maintained table in this
# index. `nv2a_index.py check` knows about the field and still enforces the
# no-suites rule for everything that does not declare it.
#
# Background, in reading order: docs/investigations/audio-assessment.md (the
# signal path and ten negatives), audio-harness.md (the PCM tap and
# audio_measure.py), audio-headroom-verified.md (the one verified fix), and
# audio-baseline.md (the measured level these issues are stated against).

# The only mechanism that survives the measured baseline and can still explain
# the owner's report of "unusually low, even at max".
#
# MEASURED, from source. monitor_sink_cb (apu.c) waits at most 10 x 0.5 ms = 5 ms
# for the FIFO to reach the requested byte count -- less than one 5.333 ms frame
# period -- and then fills the remainder with silence:
#
#     if (copied < free_b) {
#         memset(stream + copied, 0, free_b - copied);
#     }
#
# Nothing counted it. With the Android defaults the sink asks for 8192 bytes
# while the APU produces 1024 bytes per 5.333 ms, so a callback needs eight
# production units to have completed; if the APU thread is behind, the tail of
# every buffer is silence.
#
# WHY IT IS THE AWKWARD ONE. The PCM tap is at monitor.frame_buf, on the
# PRODUCING side of the FIFO. A chronic partial fill reduces loudness at the
# speaker by its duty cycle while leaving every number in a capture exactly as
# it was -- audible, and invisible to the instrument built to measure audio.
# The measured baseline (peak at full scale, AC RMS -23.43/-23.50 dBFS, median
# active 50 ms window -29.4 dBFS, Galleon on the Nova, 92.843 s) therefore
# cannot rule it out, and the existing g_dbg.utilization does not either: that
# measures how long the APU thread SLEEPS, and a thread can sleep plenty while
# missing deadlines in bursts.
#
# INSTRUMENTED 2026-09-12: counters on the callback thread, reported from the
# APU thread every 5 s as the delta since the last line, under tag
# hakuX-audiocap. The line names the fraction of output replaced by silence, and
# says whether the PCM capture was armed -- the capture writes to FUSE-backed
# storage from the audio thread and can cause the starvation it would then be
# blamed for.
#
# PREDICTED before the measuring soak (audio-baseline.md section 4): under 1.0%
# of output bytes zero-filled overall, and no 5 s interval over 5%. FALSIFIED by
# a larger figure, which reopens the owner's symptom with a mechanism no capture
# can see. Not forced true by the counter, which observes and touches nothing.
#
# Disposition stays unclassified until that number exists. There is a
# measurement pending, not a rule.
[issue.70]
title = "APU sink zero-fills a short read and counts nothing, so output starvation is invisible to the PCM tap"
disposition = "unclassified"
component = "apu"
suites = []

# MEASURED, and inert at maximum volume, so this is NOT the owner's symptom --
# recorded as a defect on its own terms, and as a negative for that symptom.
#
# apu.c, in the once-per-8-frames output block:
#
#     if (0 <= g_config.audio.volume_limit && g_config.audio.volume_limit < 1) {
#         float f = pow(g_config.audio.volume_limit, M_E);
#
# volume_limit defaults to 1 (config_spec.yml) and to 1.0 on Android
# (xemu_android.cpp), and the guard requires < 1, so the block does not execute
# at max. The coordinator confirmed 1.0 on the owner's device. That is why the
# headroom work could exclude this rather than merely rank it unlikely.
#
# The defect is the curve. ui/xui/main-menu.cc prints volume_limit * 100 as
# "%d%%", labelling the control a percentage, while the gain applied is x^e:
#
#     slider 90% -> 0.744 (-2.6 dB)      slider 50% -> 0.152 (-16.4 dB)
#     slider 75% -> 0.464 (-6.7 dB)      slider 25% -> 0.0231 (-32.7 dB)
#
# A user who nudges the slider to half expecting half loudness gets -16 dB.
#
# There is no principled reason for the exponent to be e. A perceptual taper
# uses a power of 2 to 3 by convention, or dB directly; e looks like a
# placeholder. FALSIFIED IF someone shows the curve is deliberate -- an
# intentional taper matched to a measured listening test, or a label that is not
# a percentage. Either would make this a documentation problem rather than a
# defect. Nothing in the tree argues for it today.
#
# Note for anyone who reproduces the owner's symptom later: if the launcher ever
# writes a volume_limit below 1, this alone produces "unusually low", and the
# check costs one question.
[issue.71]
title = "The volume slider applies x^e while the UI labels it a percentage, so 50% is -16.4 dB"
disposition = "defect"
component = "apu"
suites = []

# MEASURED on hardware, both sides. The submix-headroom fix (54a00d28fb,
# verified in audio-headroom-verified.md) raised the monitor path by a measured
# +6.118 dB mean over ten percentile statistics, spread 0.55 dB, against a
# predicted +6.02. It also put the output on the rails:
#
#            pre-fix (8254d88ebc)        post-fix (51aa3f9d0e)
#   peak L/R  17,296 / 22,092             32,767 / 32,767
#   peak dBFS -5.55 / -3.42               -0.00 / -0.00
#   clipped   0                           52  (0.0012% of 4,456,448)
#
# Both captures Galleon on the Nova, 92.843 s, volume_limit 1.0, use_dsp false.
# The pre-fix peaks give the true post-fix peaks: 34,592 and 44,184, i.e. about
# +0.5 and +2.6 dBFS. The mix now exceeds full scale on transients and the only
# thing between it and the DAC is the clamp to +/-1.0 in the float-to-short
# conversion.
#
# Read the peak row with care, because it is the trap that nearly sank the
# headroom result: R's peak appears to shift only +3.42 dB, which looks like the
# prediction failing and is not -- the post-fix peak is pinned at 32,767, so the
# statistic is censored. The percentiles are what carry the gain.
#
# WHAT IS ACTUALLY UNKNOWN, and why this is not simply "add a limiter": nobody
# knows what the hardware does at the rails. No golden PCM from real silicon
# exists; the assessment explains that getting one means recording S/PDIF off an
# actual Xbox. The clipping may be exactly what an Xbox does with this content,
# in which case the emulation is right and there is nothing to fix. It may also
# be that the correct level is lower and the headroom fix overshot for a reason
# not yet found.
#
# FALSIFIED / RESOLVED BY: a hardware capture of the same title at the same
# point, or by a title that clips substantially more than 0.0012%, which would
# make this audible rather than arithmetic. 52 samples in 92.843 s is not
# audible and is not an argument against the fix; it IS the reason a limiter is
# worth considering and the reason this is on the tracker rather than in a
# comment.
[issue.72]
title = "The monitor path now runs at the rails with no limiter, and whether that matches hardware is unknown"
disposition = "unknown-semantics"
component = "apu"
suites = []

# LATENT, measured at zero, and strictly more likely since the headroom fix.
#
# MEASURED, from source: the per-voice conversion saturates, but the monitor mix
# then sums voices with += into an int16_t (vp.c:1887-1888). That accumulator
# WRAPS rather than saturating, and a wrap flips the sign of a loud sample --
# which a band-limited 48 kHz signal does not do. The headroom fix doubled what
# is summed into it, so the margin against overflow halved.
#
# MEASURED on hardware: zero wrap suspects in every capture taken so far --
# both headroom arms (92.843 s each) and one further undated Galleon capture
# (126.976 s). audio_measure.py counts adjacent samples differing by more than
# full scale, which is the signature and not the event; a zero count does not
# prove the accumulator never wrapped, only that it left no full-scale sign flip
# behind. Largest observed adjacent jump was 11,537 of 65,535.
#
# So: a real hazard with no observed instance. Filed rather than fixed because
# the fix is not free -- clamping the accumulation changes the mix arithmetic on
# the hot path for every voice, and doing that to prevent something that has
# never been seen is how a measured chain acquires an unmeasured stage.
#
# FALSIFIED IF a capture shows wrap suspects with no genuinely square content to
# explain them. That is the trigger to clamp, and it is worth re-checking on any
# title denser than Galleon -- the Xbox APU sums up to 256 voices and Galleon is
# not a stress case.
[issue.73]
title = "The VP monitor mix accumulates voices into an int16_t that wraps instead of saturating"
disposition = "defect"
component = "apu"
suites = []

# MEASURED: NV_PAVS_VOICE_CFG_FMT_HEADROOM (0x7 << 13) is defined at
# apu_regs.h:231 and read NOWHERE. `grep -rn CFG_FMT_HEADROOM hw/` returns only
# the definition. A 3-bit field is parsed out of the voice format register and
# then ignored.
#
# This is the third 3-bit headroom control in the same register file. The other
# two are submix_headroom and hrtf_headroom, both divisions by 1 << value, i.e.
# 6.0206 dB per unit. One of those two turned out to be a live, uncompensated
# -6.02 dB on the default Android path and was the owner's low-volume symptom
# (54a00d28fb). That is the reason this one is worth a tracker entry rather than
# a shrug: the same register file, the same width, the same natural unit, and no
# reader at all.
#
# DIRECTION UNKNOWN, and this is why the disposition is what it is. If the
# hardware attenuates by this field we are currently LOUDER than hardware, and
# this is not a missing gain. If it is a gain we are quieter. Nothing in the
# tree decides it and guessing is how five mechanism claims were retracted on
# this project in two days.
#
# THE EXPERIMENT THAT SETTLES IT, and it is cheap: log the field's value per
# voice on a real title, the way submix_headroom was settled (5e3923a0ed, which
# found all 31 slots at 1). If every title leaves it 0 the question is moot and
# this closes as unreachable. If titles program it non-zero, the next step is a
# hardware capture of one voice with the field set and cleared -- there is no
# way to get the direction from source.
[issue.74]
title = "A third 3-bit voice headroom field is decoded and never read, direction unknown"
disposition = "unknown-semantics"
component = "apu"
suites = []

# MEASURED, and unambiguous. hw/xbox/mcpx/aci.c:
#
#     static const VMStateDescription vmstate_mcpx_aci = {
#         ... VMSTATE_PCI_DEVICE(dev, MCPXACIState), ...   // FIXME
#
# The field list is VMSTATE_PCI_DEVICE and nothing else, with a bare `// FIXME`
# already sitting on it. The embedded AC97LinkState -- the codec's mixer
# registers, its BM descriptors, its running state -- is NOT migrated, so a
# save/load pair silently restores an AC'97 in whatever state the fresh device
# happened to be in.
#
# Scope, stated so this is not over-sold: the assessment established that ACI is
# not in the audible path at all on this platform. ep_sink_samples returns false
# for MCPX_APU_DEBUG_MON_AC97 (gp_ep.c) and the APU opens its own SDL device, so
# a corrupted AC'97 cannot explain the owner's symptom and this is not a
# loudness issue. It is a savestate-correctness issue, and it is filed because
# "silently restores wrong state" is the class of defect that is discovered
# months later as something else entirely.
#
# FALSIFIED IF AC97LinkState turns out to be fully reconstructible from the
# guest's own reprogramming after a load -- i.e. if every field is rewritten
# before it is next read. That is checkable by reading ac97_common_init and the
# NAM/NABM handlers in hw/audio/ac97_int.c, and it has not been checked.
[issue.75]
title = "ACI migrates only its PCI device, so save/load silently drops all AC'97 codec state"
disposition = "defect"
component = "apu"
suites = []
