status_note = "The factor half landed (ab4a829316, through pgraph_vk_effective_blend_reg so the static pipeline, the eds3 path, the reorder snapshot and the cache key all agree) and arm 7cbd8dd029 -> ec0560d28b is PRE-REGISTERED PASS on all 124 checks: every one of the 856,098 channels whose source byte is below 128 is now exact in both captures, against 594,738 and 592,409 wrong before, 28 better 4 worse, -179,872 px. The sign fold remains -- 365,491 channels per capture, a defect with a known rule that provably cannot be blend state, since silicon's output steps 254 -> 0 between adjacent source bytes at D=127 and every Vulkan blend op is a continuous map of the source."

# MEASURED 2026-09-12: real, reproducible at ~46% of runs, and DISTINCT from
# #39. The fix is not in the texture path.
#
# Run-to-run on an identical binary and disc, same goldens: 136 px, then 0 px,
# then 0 px -- the two passes byte-identical to the golden. Across 24
# border-suite runs, 11 fail and 13 pass byte-identically, all 11 failing
# images distinct, failures interleaving with passes with no relation to any
# commit. Far too frequent to be the single-run band MEMORY.md warns about, and
# it straddles ad1caa07 unchanged (3 fails in the 9 runs before, 8 in the 15
# after), so the staleness trap does not apply.
#
# Five things that together identify it as a mid-write UPLOAD race rather than
# anything else:
#   - the stale pixels hold only this texture's OWN pass-1 checker values,
#     each correct for its own position, so not contamination (consistent
#     with #19)
#   - all 12 failure masks form a total order under set inclusion, 0
#     violations of 39 unordered pairs, with no differing pixel beyond each
#     capture's own frontier -- predicted before being measured
#   - differencing consecutive nested masks shows the frontier advancing
#     bottom-to-top and right-to-left in increments of 2-50 px
#   - the stale set is a prefix/suffix in NONE of row-major, column-major or
#     either Morton order, so it is not a missed page: a missed 4 KB page of a
#     swizzled 64x64 A8R8G8B8 would be an aligned 32x32 Morton block, and five
#     simultaneously-partial rows is not that. Rules out the dirty-bitmap class
#     that 91742b407b / 3bb7628694 / 91e3da1d6e addressed.
#   - TWO swatches are affected, not the one this issue records: band A at
#     y 272-335 and band B at y 80-143, both in the rightmost column
#     (x 512-575), and they occur INDEPENDENTLY at the rate independence
#     predicts (1.1 expected "both", 1 observed). A deterministic defect in the
#     bordered-texture path would hit both together; each upload racing
#     separately explains it.
#
# Why not #39: same class (host/guest timing nondeterminism), different defect.
# #39's symptom is a draw's result being LOST -- whole quads holding previous
# content -- with the command stream provably identical between passing and
# failing runs and no partial-content signature. Here the draw lands correctly
# and a sub-region of the texture it sampled is stale, with a monotone frontier.
# Merging them would discard the cleanest run-to-run fingerprint in the project.
#
# INFERRED, not measured: the frontier always lands in interior rows 6-10 of 64
# and cols 6-50, a fixed-phase race with small jitter, and since the write runs
# bottom-up the stale rows are the LAST written -- which reads as the guest's
# most recent stores not yet visible to pfifo_thread on a weakly-ordered
# aarch64 host. That puts the fix in the pfifo/DMA path, not in texture.c,
# which cannot know the guest intends more writes.
#
# CONFIRMED 2026-09-12 on the desktop x86 lane: 20 runs of the Texture_border
# isolation disc, same binary, same ISO, fresh pristine HDD each run, cold
# shader cache. All 20 captures BYTE-IDENTICAL TO ONE ANOTHER -- not "20
# passes", zero variance. Intermittency 0% on desktop against ~46% on the
# Nova. The prediction was 0 failures and it held.
#
# So the store-visibility reading survives and the Vulkan renderer is
# excluded, as is the dirty-bitmap class (already dead on the Morton-order
# check). The fix is a barrier in the pfifo/DMA path: the guest's most recent
# stores are not yet visible to pfifo_thread on a weakly-ordered aarch64 host.
# Not in texture.c, which cannot know the guest intends more writes.
#
# A CAVEAT THAT APPLIES BEYOND THIS ISSUE, and it nearly inverted the result.
# Each of those 20 desktop runs differs from the GOLDEN by exactly 2,782 px,
# with a uniform per-channel delta of (0, -1, -1) and max |delta| 1 -- red
# exact, green and blue one step low, everywhere, every run, scattered over a
# 188x171 region. Deterministic, nothing to do with #44: lavapipe rounds those
# two channels down where Adreno does not.
#
# Under a pass/fail metric desktop therefore scores 0/20 while the Nova scores
# 13/24, which reads as desktop being WORSE and is exactly the wrong
# conclusion. A cross-host test needs TWO numbers -- intermittency and
# residue-against-golden -- and collapsing them is how #51 spent two sessions
# being inferred around. The desktop lane cannot be used as a byte-exact
# oracle for this suite without first accounting for that one step on G and B.
