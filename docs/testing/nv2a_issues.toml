[issue.33]
title = "Image blit: BlitBeyondWidth diverges by 284k px (not an overlap case)"
# ROOT CAUSED and fixed in d42a8d79bc, awaiting its A/B on device.
#
# A GPU tile does not only bound a blit, it decides where the bytes land:
# addresses inside a tiled region are remapped so a rectangle of the surface
# is contiguous. Scanout, texture fetch and the CPU aperture all go through
# the same remap, so the shuffle cancels and treating tiled memory as linear
# -- what we do everywhere -- is correct. It stops cancelling in this test,
# which blits a 1024x512 ramp into a tile of pitch 2560, DROPS the tile, then
# blits the result out linearly from target_buffer + 4096.
#
# Measured, not argued: a linear model matches OUR capture at 0 differing px
# across the whole frame bar the text overlay, and 284,958 of 307,200 golden
# pixels satisfy the ramp's R + B == 255 invariant -- same bytes, permuted.
# The layout was solved out of the golden by unique 64-word signature
# matching. The line that differs is perform_blit's `dest += dest_pitch`, a
# linear walk where hardware walks the tile.
#
# Ruled out: the row-width clamp (the obvious read of "BlitBeyondWidth" --
# hardware writing 1024 pixels into a 640 pitch and overrunning -- is not it;
# each overrun is overwritten by the next row and the last is clipped at the
# tile limit, and modelling at 1024 and at 640 gives byte-identical results).
# Also tile clipping being absent: #33's comment has it backwards,
# nv_clip_gpu_tile_blit has clipped since 24087af22a and it is the ADDRESS MAP
# that was missing. The matching colour-edge x positions cited in the comment
# are degenerate -- they hold for any permutation preserving 16-pixel runs.
#
# Assumed and not testable from this corpus: that NV_PFB_TILE_PITCH holds
# bytes, the `^ 1` constant in the unit column (could be a base-address bit;
# only one test registers a valid tile), and generalisation to other pitches.
#
# WATCH: only the blit DESTINATION is remapped. 3D renders and scanout still
# treat tiled memory as linear, so a title that blits into a tile it
# registered as VALID and then scans it out would now scramble where before it
# did not. Making that consistent means a remap at the memory controller on
# every access. A blit READING out of a live tile is deliberately left
# un-swizzled -- no capture exercises it, and an unverified inverse is a
# second bug. Needs a game smoke test.
# docs/investigations/gpu-tile-blit-swizzle.md.
#
# FIXED AND VERIFIED ON DEVICE 2026-09-12, f1a7703876. Per-capture A/B against
# baseline b5ed87489c, 97 captures each, progress_log_proof true on both, same
# disc, only the commit differing:
#   BlitBeyondWidth  284,628 -> 0   BIT-IDENTICAL
#   96 captures unchanged, 0 worse.  Image_blit 15/41 -> 16/41 exact.
#
# The first attempt (d42a8d79bc) swizzled every blit into a tiled region and
# regressed Texture_Framebuffer_Blit::FBToZetaAsTex 14,383 -> 34,382 -- the
# hazard the investigation had itself flagged, since that test blits the
# framebuffer over the depth buffer and then SAMPLES it, so the write was
# swizzled while the texture fetch stayed linear. Note the correction: the
# framebuffer's COLOUR tile is registered VALID-clear, but the DEPTH tile is
# valid.
#
# f1a7703876 gates the swizzle on a blit the tile actually clipped
# (clipped_dest_size < dest_size), which separates the four blits by arithmetic
# alone with no dependence on renderer state -- deliberately NOT gated on
# whether a binding exists at the destination, because a stale binding left by
# an earlier test would silently veto the swizzle and restore the 284,628 with
# nothing in the code to explain it. The gate is a RESTRICTION, not a mechanism
# claim: hardware remaps every write into a tiled region whether it clips or
# not.
#
# FOLLOW-UP, specced and not implemented: swizzle on tile creation/teardown in
# pfb.c instead, since that is the only moment the remap becomes observable.
# It removes the gate heuristic and the standing hazard for real titles, which
# set tiles up properly and currently depend on the clip gate never firing on
# them. Two things to settle first: the inverse permutation on tile CREATION
# (pre-existing bytes are reinterpreted, not moved), and a surface still live
# in a VkImage and not yet downloaded when the tile is torn down. Needs
# pfb.c + nv2a.c + nv2a_int.h.
suites = ["Image blit"]
disposition = "defect"

