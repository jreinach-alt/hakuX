files = ["hw/xbox/nv2a/pgraph/texture.c", "hw/xbox/nv2a/pgraph/vk/texture.c"]
note = "HANDED OVER FROM lane.pacing, which measured #54 to a dead end on its own side and named the successor. What is established, with numbers, and must not be re-derived: 57% of texture uploads race on Crimson Skies and 0 on DOA3/JSRF over 2.8 M draws; re-measured at this tip the rate is 61.7% and reproduces to 0.26% across two runs (0.6172/0.6188 on 19,167/19,176 uploads), so Tr is a well-behaved instrument; AND #56's FIX INCREASED #44's EXPOSURE BY 53% -- cdd8dc4c89 stopped create_texture stamping the register cache after a FAILED bind while clearing texture_dirty[i], so textures previously left wrongly clean now get re-uploaded: uploads +53%, races +67% absolute, a 9% higher RATE on 53% more uploads against the e353735028 baseline. Fixing the missed-re-upload half of #44 does not hide the skew half, it EXPOSES more of it, because the skew can only lose a race on an upload that actually happens (held as a hypothesis: direction and magnitudes fit, but two refs 128 commits apart is not a bisection) with the vertex site clean at Vr=0/3040 and the impossible row Xd=0, so the race is LIVE and the vertex path is NOT the mechanism. NO READ-SIDE FIX EXISTS STRUCTURALLY: the bytes the upload should read are those the guest had written when it PUBLISHED the draw, and the only observable of that is DMA_PUT in pfifo.c, so a read-side change narrows the window and never orders the read. AND THE SUBMISSION-SIDE BOUND IS REFUTED ON COST, not on correctness: it works, and it costs the whole ceiling (gfps p90 29 -> 13) because 94.2% of a real title's submissions carry a draw against the test disc's 3.6%. THE LEVER (a) IS BOUNDED, AND ITS ORIGINAL PREMISE IS REFUTED -- corrected at the source rather than downstream, because the wrong version sent one lane down it already. WHAT WAS WRONG: I ranked (a) first on 'hold mean 2,316,996 ns against a PFIFO service time of ~160 us, so MOST OF THE HOLD IS QUEUEING'. That 160 us is 48% / 3,000 per s, and it MIXES TWO WORKLOADS -- the 48% busy fraction is Galleon's, the 3,000/s submission rate is the Texture border DISC's. Galleon submits at 257/s and 181/s, from the same table the hold mean came from. This is the 826:1 error in a THIRD place. Redone on Galleon throughout, service is 1,868 us (arm A rate) or 2,652 us (arm B rate), so the hold is 1.24x or 0.87x ONE submission's service, not 14.5x: THERE IS NO QUEUEING TERM TO REMOVE. Two confirmations already sat in the doc -- its own pre-registered arithmetic predicted the guest would be blocked about the busy fraction and measured 40.7% against 48% (14.5 service times cannot fit under 100%), and at held(n)/kicks = 1.0000 the bound never lets a backlog form. WHAT (a) CAN STILL BUY, measured from NV2A_PERF_LOG hakuX-phase data already on disk for Crimson Skies, 46 samples over two runs, identity closing to 0.20 ms: BUSY 19.62 ms/frame, of which READ (irreducible) 10.40 ms = 53.0% and POST-READ = (a)'s whole ceiling 7.36 ms = 37.5%, per-run [34.6, 44.4] and [40.3, 48.7]. Treat 37.5% as an UPPER BOUND, not an estimate: Syn covers only 4 of 9 sync_vertex_ram_buffer call sites so READ under-counts, and Tot double-counts nested phases (profile.c:97 adds texture_upload and shader_compile while both nest inside draw_dispatch). AND THAT CEILING IS MEASURED ON THE WRONG TITLE FOR THE PURPOSE: Crimson is where (a) has nothing to buy (p90 falls by 0 there); the cost is on Galleon, whose post-read share is UNMEASURED -- 'one title cannot establish a cost' applies to this number exactly as to the one it corrects. THE READ SIDE IS THE DECISION, NOT THE UPLOAD: Tx (pipe_bind_tex) is 5.85 ms/frame, 29.8% of all PFIFO busy, while the texture UPLOAD is 0.01 ms/frame -- create_texture decides by hashing guest VRAM, and the hash's share of Tx is not yet measured though one timer pair settles it. TERRITORY, ALSO REFUTED: (a) is NOT 'entirely inside this lane's files' as waves 19 and 20 claimed -- the wait is pfifo_bound_skew in pfifo.c and sync_vertex_ram_buffer plus all nine begin_pre_draw call sites are in vk/draw.c, so it spans three territories and cannot be done by this lane alone. THE MEASUREMENT THAT DECIDES (a): one Galleon soak on a -Pperflog=true APK, read with docs/testing/phase_read_split.py, registered as an ABSOLUTE (Galleon's post-read share of BUSY is at most X%). NO REQUEST CAN ASK FOR IT TODAY: HAKUX_PERF_LOG is only a Gradle property (build.gradle.kts:52) and dispatcher.sh builds a bare assembleDebug -- that plumbing is the blocker, and it is dispatcher infra this lane does not own. (b) SECOND: re-upload on detection, and THE DETECTION ALREADY EXISTS -- DIRTY_MEMORY_NV2A/_NV2A_TEX logging is enabled at nv2a.c:1283-1284 and pgraph_vk_poll_bound_textures already test-and-clears the TEX bits at the top of begin_pre_draw, so Tr IS that bit being set again: the emulator already knows, 61.7% of the time, that it read a texture the guest was writing. No page protection, no store trapping; what is missing is a RESPONSE, not detection. Caveat held as unmeasured: a bounded retry REDUCES rather than eliminates and converges slowly at a 61.7% per-window rate unless the re-read window is much tighter -- the per-retry rate is the deciding number. READ AGENTS.md 'The test disc's ratios are properties of the disc, not of a workload' BEFORE SIZING ANYTHING: the orchestrator sized the last attempt at 826x off a test disc and it was a property of the disc. Measure any density on a real title. Related: #68/#69/#73 measured invalidation as whole-page under #ifndef XBOX, which is the machinery this would build on."

