         "hw/xbox/nv2a/pfifo.c", "hw/xbox/nv2a/pramdac.c", "hw/xbox/nv2a/pgraph/pgraph.c"]
note = "#54 SUBSUMED INTO THIS LANE: its own lane verified that mode 2's hold covers the texture upload site (RCMD_DRAW never enqueued, both draw queues false, the reorder window reads at enqueue on the PFIFO thread) and that NO read-side fix exists -- the bytes the upload should read are those the guest had written when it PUBLISHED the draw, and the only observable of that is DMA_PUT in pfifo.c, so a read-side change narrows the window and never orders the read. Its Tr probe is a BETTER falsifier for mode 2 than stale_px: the Texture border disc is structurally blind to the gave hole (18 draws, one frame, no FLIP_STALL) while Crimson Skies flips every frame and Galleon measured gave at 5.603%. The two single-change follow-ons whose mechanism is already measured. #44's SELECTIVE draw-only bound: JUDGED, arm B in. The guarantee needs no unprocessed DRAW in the FIFO; holding at every submission is 27x stronger than required (NOT the 826x I briefed -- 5,286 submissions publish a draw, not 180, because the run boots and executes seventeen other tests, so any per-draw arithmetic from '180 draws' is thirty times out). Scan costs 0.0303% of wall clock, mean 306 ns over 252 words, against mode 1's 40.7% blocked -- the cost was removed, not moved. V2/V3/V4/V5/V6a hold; V6b fails per-window on two ADJACENT windows off by -1 then +1 that cancel exactly when pooled (fsk_note_scan runs before pfifo_bound_skew, so a window dump between them splits one submission), one-line repair deliberately NOT applied while arms are queued against the refs it would invalidate. WATCH: the 16,384-word budget ran to 16,038 (97.9%) and big fired 20 times, thinner than the 2x it was sized for. #65's defer_cap 15 -> 12: JUDGED AND IT LANDS. D9 -- the leg this change exists to fix -- HOLDS: worst-window clamps 6,7 -> 0,1 over four thor runs, guest time lost +1.544/+1.864 -> -0.062/+0.085 s/min (~20x, no overlap) at no measurable frame-rate cost (gfps p90 59 both arms). 6 of 8 legs hold and BOTH failures convict instruments, not the value: E1's exceedance proxy over-predicts clamps 2-3x (def_max can come from a remaining-bound deferral whose true lateness never exceeded a period), and E4 failed on the hold's own occupancy. Consequence to carry forward: EVERY exceedance figure quoted anywhere, including the nova's 12-29 at cap 12, is an over-estimate -- read it as perhaps 4-15 actually clamping. Still one to two orders above the thor's 0-1, so the nova conclusion survives WEAKENED, not withdrawn, and it rests on rt_p90 (~2x) and the clamp counter, never on the maximum: rt_max grew with n three times today, 3.08 ms at ~32 windows to 42.5 ms at ~660, so every 'observed maximum' here is a floor."


[lane.writetrack]
issues = ["54"]
files = ["hw/xbox/nv2a/pgraph/texture.c", "hw/xbox/nv2a/pgraph/vk/texture.c"]
note = "HANDED OVER FROM lane.pacing, which measured #54 to a dead end on its own side and named the successor. What is established, with numbers, and must not be re-derived: 57% of texture uploads race on Crimson Skies and 0 on DOA3/JSRF over 2.8 M draws; re-measured at this tip the rate is 61.7% and reproduces to 0.26% across two runs (0.6172/0.6188 on 19,167/19,176 uploads), so Tr is a well-behaved instrument; AND #56's FIX INCREASED #44's EXPOSURE BY 53% -- cdd8dc4c89 stopped create_texture stamping the register cache after a FAILED bind while clearing texture_dirty[i], so textures previously left wrongly clean now get re-uploaded: uploads +53%, races +67% absolute, a 9% higher RATE on 53% more uploads against the e353735028 baseline. Fixing the missed-re-upload half of #44 does not hide the skew half, it EXPOSES more of it, because the skew can only lose a race on an upload that actually happens (held as a hypothesis: direction and magnitudes fit, but two refs 128 commits apart is not a bisection) with the vertex site clean at Vr=0/3040 and the impossible row Xd=0, so the race is LIVE and the vertex path is NOT the mechanism. NO READ-SIDE FIX EXISTS STRUCTURALLY: the bytes the upload should read are those the guest had written when it PUBLISHED the draw, and the only observable of that is DMA_PUT in pfifo.c, so a read-side change narrows the window and never orders the read. AND THE SUBMISSION-SIDE BOUND IS REFUTED ON COST, not on correctness: it works, and it costs the whole ceiling (gfps p90 29 -> 13) because 94.2% of a real title's submissions carry a draw against the test disc's 3.6%. THE LEVER, CORRECTED -- reading the source moved it, and store-trapping is NOT what is needed. (a) FIRST: release the guest when the draw's READS are done, not when DMA_GET reaches DMA_PUT. The guarantee is about the reads and DMA_GET==DMA_PUT is a far stronger proxy than required; measured hold mean 2,316,996 ns against a PFIFO service time of ~160 us, so MOST OF THE HOLD IS QUEUEING behind work the guarantee does not care about. A signal raised once get_texture_layout and sync_vertex_ram_buffer have run releases the guest far earlier for the SAME invariant, entirely inside this lane's files -- a cost reduction on a guarantee that already holds. (b) SECOND: re-upload on detection, and THE DETECTION ALREADY EXISTS -- DIRTY_MEMORY_NV2A/_NV2A_TEX logging is enabled at nv2a.c:1283-1284 and pgraph_vk_poll_bound_textures already test-and-clears the TEX bits at the top of begin_pre_draw, so Tr IS that bit being set again: the emulator already knows, 61.7% of the time, that it read a texture the guest was writing. No page protection, no store trapping; what is missing is a RESPONSE, not detection. Caveat held as unmeasured: a bounded retry REDUCES rather than eliminates and converges slowly at a 61.7% per-window rate unless the re-read window is much tighter -- the per-retry rate is the deciding number. READ AGENTS.md 'The test disc's ratios are properties of the disc, not of a workload' BEFORE SIZING ANYTHING: the orchestrator sized the last attempt at 826x off a test disc and it was a property of the disc. Measure any density on a real title. Related: #68/#69/#73 measured invalidation as whole-page under #ifndef XBOX, which is the machinery this would build on."

