# WHO HOLDS WHICH FILES. The live allocation, machine-checked.
#
# This used to be a table in docs/orchestration.md and it was SILENTLY
# REVERTED by folding a lane branch: a lane branches from the tip, works for an
# hour, and carries whatever that file said when it started, so cherry-picking
# its commits restores the older table with no conflict. That happened on
# 2026-09-13 -- the fifth-wave allocation was written, two lane branches were
# folded, and the file went back to the fourth wave. The #43 lane read the
# reverted row, saw `glsl/psh.c` listed as another lane's, and correctly
# reported its brief as wrong.
#
# A prose paragraph cannot notice that. This file can: `wave` is monotone and
# `check_territory.py` (wired into preflight.sh) FAILS if it ever goes
# backwards. A fold that reverts the allocation now breaks the gate instead of
# misinforming the next brief.
#
# Rules this encodes, all of them earned:
#
#   A file whose stream's arm is QUEUED BUT NOT YET JUDGED is still claimed.
#   The arm measures one delta and a second edit lands inside it. The claim is
#   as long as the ARM, not as long as the issue.
#
#   When a finished fix spans two territories, GRANT one lane the other's file
#   rather than waiting for both to free. Waiting serialises on the slower lane
#   for no benefit.
#
#   Issues split from a common parent are never assigned concurrently, even to
#   lanes whose files do not overlap -- two agents would derive the same
#   mechanism twice. So `issues` is part of a claim, not decoration.

wave = 18
updated_utc = "2026-09-13T21:40:00Z"




[lane.remote]
issues = ["34", "39", "51", "60", "62", "66", "71", "72"]
files = ["hw/xbox/nv2a/pgraph/gl/*.c", "hw/xbox/nv2a/pgraph/glsl/common.c",
         "target/**", "ui/**", "audio/**", "tests/**"]
note = "glsl/common.c GRANTED for #72: the GL renderer never emits noperspective because the gate is `noperspective && location` and location is Vulkan-only -- the Texture_perspective suite splits PERFECTLY on that bit, TexPerspective_Textured 9,014 vs Vulkan's 1. Condition on the grant: the fix must distinguish DESKTOP GL from GLES, because noperspective is core in desktop GLSL 1.30+ and needs GL_NV_shader_noperspective_interpolation on GLES, where the failure is a shader that does not compile. ORDERING: #71 before #60 -- #60's stale-format bug is HIDING #71, because refusing the s2t fast path for the wrong reason is doing useful work, and #60's fix regresses four captures by 31,948 px that are entirely thirty s2t decisions flipping false->true. Also holds the desktop build and the GL renderer as a CAPABILITY: renderer = 'OPENGL' produces captures, so GL-only defects are measurable there and nowhere else in the fleet."



