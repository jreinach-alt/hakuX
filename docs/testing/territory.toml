note = "#38 MECHANISM 3, which has never had a lane and is the largest untouched directional signal on the board: Image_blit, 515,562 one-step pixels, 76,423 ours-high against 439,139 ours-low, bias -0.70. Read docs/investigations/depth-buffer-is-four-defects.md:150-176 -- it records the trap AND the lead in the same table. The trap: conditioning on DIFFERING pixels made the corpus-wide one-step error look one-sided at +0.67 to +1.07, and unconditioned it is +0.03. There is no single rounding bug behind the corpus. The lead is that Image_blit survives that correction -- it leans as hard negative as Texture_signed leans positive, so it is a real cause and not the artefact. 85% of its one-step pixels are ours-low by exactly one. vk/blit.c WAS IN NO ROW AND NOT IN [free] -- the same gap fleet.py was found in at wave 48; it is registered here rather than quietly taken. glsl/vsh.c is free if the lane needs mechanism 1's colorPrecision site, but it must ASK: a brief is not a claim. NOT #33, which is closed and whose blit divergence moved to #62 -- lane.remote holds that."

