note = "#52's LAST OPEN CELL: z16 float, 1,436 px, every one of them ONE ULP. The status note already establishes what it is NOT -- not a float-encoding defect (packing is RGB565, verified on 199,065,600 channel samples with 0 lattice violations), not structural (0 px differ in the 63,488-px grid covering every F16 exponent 0-15), and not the colour residual (that is #38's Gouraud interpolator, byte-identical histograms between the bit-exact z16 cell and the one-unit-out z24 one). What is left is the bottom quad's sub-ULP interpolation shortfall -- cell 2's barycentric-normalisation +-1 family at 1/30th the size. Cell 2 was closed in this same file by 91b0897e01 ('the depth floor cannot depend on fma() being fused'), PRE-REGISTERED PASS on all 72 checks, 72,138 -> 43,690 px. So the precedent, the mechanism and the tool all exist. NOT IN SCOPE: z24 float's 12,816 px is a MEASURED FLOOR, priced and deliberately left -- do not spend the arm on it. psh.c released by retiring lane.lows."


