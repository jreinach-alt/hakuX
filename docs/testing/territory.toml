# WHO HOLDS WHICH FILES. The live allocation, machine-checked.
#
# This used to be a table in docs/orchestration.md and it was SILENTLY
# REVERTED by folding a lane branch: a lane branches from the tip, works for an
# hour, and carries whatever that file said when it started, so cherry-picking
# its commits restores the older table with no conflict. That happened on
# 2026-09-13 -- the fifth-wave allocation was written, two lane branches were
# folded, and the file went back to the fourth wave. The #43 lane read the
# reverted row, saw `glsl/psh.c` listed as another lane's, and correctly
# reported its brief as wrong.
#
# A prose paragraph cannot notice that. This file can: `wave` is monotone and
# `check_territory.py` (wired into preflight.sh) FAILS if it ever goes
# backwards. A fold that reverts the allocation now breaks the gate instead of
# misinforming the next brief.
#
# Rules this encodes, all of them earned:
#
#   A file whose stream's arm is QUEUED BUT NOT YET JUDGED is still claimed.
#   The arm measures one delta and a second edit lands inside it. The claim is
#   as long as the ARM, not as long as the issue.
#
#   When a finished fix spans two territories, GRANT one lane the other's file
#   rather than waiting for both to free. Waiting serialises on the slower lane
#   for no benefit.
#
#   Issues split from a common parent are never assigned concurrently, even to
#   lanes whose files do not overlap -- two agents would derive the same
#   mechanism twice. So `issues` is part of a claim, not decoration.

wave = 33
updated_utc = "2026-09-14T00:10:00Z"




[lane.remote]
issues = ["34", "39", "51", "60", "62", "66", "71", "72"]
files = ["hw/xbox/nv2a/pgraph/gl/*.c", "hw/xbox/nv2a/pgraph/glsl/common.c",
         "target/**", "ui/**", "audio/**", "tests/**"]
note = "glsl/common.c GRANTED for #72: the GL renderer never emits noperspective because the gate is `noperspective && location` and location is Vulkan-only -- the Texture_perspective suite splits PERFECTLY on that bit, TexPerspective_Textured 9,014 vs Vulkan's 1. Condition on the grant: the fix must distinguish DESKTOP GL from GLES, because noperspective is core in desktop GLSL 1.30+ and needs GL_NV_shader_noperspective_interpolation on GLES, where the failure is a shader that does not compile. ORDERING: #71 before #60 -- #60's stale-format bug is HIDING #71, because refusing the s2t fast path for the wrong reason is doing useful work, and #60's fix regresses four captures by 31,948 px that are entirely thirty s2t decisions flipping false->true. Also holds the desktop build and the GL renderer as a CAPABILITY: renderer = 'OPENGL' produces captures, so GL-only defects are measurable there and nowhere else in the fleet."



[lane.galleon77]
issues = ["77"]
files = []
note = "#77, Galleon deck/ground stipple. PURE MEASUREMENT, no source files claimed -- the next step is the DRIVER A/B, and it needs no code change. NOT NOVA-BOUND, which is what unblocked it: Galleon is on the Thor (device_titles thor lists Galleon (USA).xiso.iso at /storage/388C-68F7/ROMS/xbox), and swap_driver.sh opens S=${SERIAL:-ee317437} so the Nova serial is a default, not a requirement. T30/T26 are generic Turnip Adreno builds at minApi 30; the Thor is adreno/kalama, the same part devices.sh measured byte-identical to the Nova on 62 of 62 captures. HARNESS: driver_ab.sh CANNOT be used -- it enumerates a suite's goldens and boots one disc per test. Use swap_driver.sh (t30/t26/stock/restore; restore() always puts T30 back) plus a soak through request.sh with --title and --seconds. The driver arm is FIRST for a reason recorded on the issue: every measurement so far reads EMULATOR state, and if the defect is ours it is a divergence between emulator state and what reached the GPU, which no state logging can see."

[lane.readfreq]
issues = ["54"]
files = ["hw/xbox/nv2a/pgraph/vk/texture.c",
         "hw/xbox/nv2a/pfifo.c"]
note = "#54's remaining half: a READ-SIDE frequency counter over the DIRTY_MEMORY_NV2A bitmap and r->texture_vram_gen. The barrier lever is DEAD and must not be retried -- with ALL guest barriers restored, 2D_BorderTex_SZ failed 6 of 10 runs, identical to the store-store variant and indistinguishable from the ~46% base rate, at +34.1% game frame time, with mb_emitted 0/80,411/347,473 proving the three arms were genuinely different binaries. That zero bounds whether barriers fix #44's capture; it does NOT bound how often the race fires, and the corpus cannot separate the two because it is nearly all static content. Hence a counter on a real title. NOT NOVA-BOUND: Galleon is on the Thor. target/** stays lane.remote's and accel/** is free but not claimed here -- say so if the counter needs either."

[free]
# A LANE THAT WAS NEVER CLAIMED, recorded because it worked and that is the
# problem. On 2026-09-14 an agent was dispatched as "lane.padwrite" for #59,
# briefed with four files as "yours", and NO [lane.padwrite] row was ever
# written here. It edited three of them. Nothing collided, because nothing
# else wanted them that hour -- which is luck, and is exactly how the earlier
# unworktreed Galleon lane also came out fine.
#
# The brief is not the claim. check_territory.py cannot see a lane that does
# not exist, so none of the guards that caught real collisions today -- the
# walled-blocker advisory among them -- could have fired for it. Write the row
# BEFORE dispatching, in the same commit as the brief if possible.
#
# RELEASED 2026-09-14 by retiring lane.lineext: glsl/geom.c, vk/draw.c and
# vk/shaders.c. Its #13 Vulkan fix LANDED (merged, 47.82% -> 99.58% against
# silicon), and a claim exists to stop two agents editing one file at once,
# not to reserve a file whose change is already in. I had told #43 and #59
# that vk/draw.c "cannot be released" -- true of the lane needing to EDIT it,
# false the moment the edit landed, and corrected in both entries.
#
# RELEASED 2026-09-14 by retiring lane.stencil: vk/surface.c and vk/command.c.
# Its agent reported, and the finding is precisely that NEITHER FILE IS THE
# SITE -- #79 is #44's guest<->pgraph skew on vertex data, fixed by a constant
# in pfifo.c. A lane holding files its own result exonerated is the purest
# form of the row this section already warns about. vk/surface.c is named by
# #59's blocker, so the release is not bookkeeping: it moves that issue from
# needing two held files to needing one.
#
# RELEASED by retiring lane.pacing, lane.writetrack and lane.blendstack, whose
# agents have all reported final results. Their issues (#44, #65, #54, #50,
# #52) now carry written blockers instead of a lane -- which is the honest
# state: a lane row whose agent has finished asserts coverage that does not
# exist, and check_coverage.py cannot tell the difference.
