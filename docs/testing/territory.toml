ternal invariant, which applies here too. And lane.remote has already landed the GL-side equivalent as b9d845d316. ALSO GRANTED: vk/surface.c, for #88 -- 292,446 px Vulkan loses that GL now gets, with the fix direction already decided and evidenced by the goldens. Ordered SECOND and explicitly so: #84 is memory safety and needs no arm, #88 needs an arm this fleet cannot currently run, so do not let the bigger number pull the ordering. vk/draw.c HELD (not started) and surface.h GRANTED at wave 89, both on this lane's own request and framing. It asked for a HOLD on vk/draw.c rather than a start, because #91's fix probably lives there and WHETHER IT IS THE RIGHT FIX DEPENDS ON TWO DIAGNOSIS ARMS NOBODY HAS JUDGED YET -- a conditional need is exactly what a hold is for, and starting would have been a fit. #92 comes with surface.h because this lane FOUND it and is already waiting on its own arms: SurfaceShape carries no address, so framebuffer_dirty() cannot see a DMA-context swap, and that is a plausible mechanism for Swap reading 165,447 on BOTH renderers before any of #88's work. ITS FIRST STEP IS AN INSTRUMENTED RUN, INDEPENDENT OF #91's OUTCOME -- log framebuffer_dirty()'s verdict across TestSwap()'s SET_CONTEXT_DMA_COLOR writes -- so it is not ordered behind anything. BLAST RADIUS BEFORE ANY EDIT: changing that struct changes SURFACE IDENTITY FOR BOTH RENDERERS, and #55 and #60 are both about surface-binding identity."


