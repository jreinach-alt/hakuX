ack animations) before the run's own timeout ended it cleanly. No longer DRAFT; nominated for a Nova fps confirmation (host-tools/nova-nominations.tsv). castlevania-cod.first-run.route is UNCHANGED, still DRAFT: it needs its own unattended replay on a disk with no existing save, which this disk no longer has (session 53 wrote a save to slot 1); that replay is still open work. Supersedes the never-replayed castlevania-cod.route (session 48) and the never-played lane.routeprep guess (session 42), both removed. Session 59: a dispatch route-check (1790902028-titleroutes-1005086) FAILED -- the newgame->Name-Entry screen transition had not loaded by the time the fixed-wait letter-press fired, so the route typed into a black screen for 900s; 'fixed' with a second blind press, assuming only the press (not the screen) had been missed. Session 60 (owner, ADDENDUM 11, 2026-10-01 ~18:30 PDT): the owner's own verification run (1790903439-titleroutes-1317193) showed session 59's fix did NOT work -- both presses landed on the still-black screen (name-a/name-a2 both black), and the route's later blind presses (meant for slot selection etc.) typed into the keyboard once it finally came up, leaving the name field 'AAIIIIII' with no Accept. The owner stopped the run and asked for a real closed-loop fix, not another guess. Session 60 built it: route.sh gained `waitfor`/`press-until` steps that poll a screencap region against a reference crop (routes/refs/castlevania-cod.first-run/*.png) rather than a fixed wait (see route.sh's grammar comment and docs/testing/titles/waitfor_selftest.py, which checks the comparator against fixture crops of this exact failure, including the still-black frame). castlevania-cod.first-run.route's newgame->Name-Entry section now waits for the Name Entry banner before pressing, then presses A on the letter tile up to 5 times, 1.5s apart, checking the field itself each time, instead of a fixed wait + blind press(es). STILL DRAFT: not yet replayed with this fix