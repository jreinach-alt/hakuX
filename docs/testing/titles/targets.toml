# Per-title targets for title_verdict.py, keyed on the canonical title_id of
# /home/justin/hakux-work/titles/xemu-compat-2026-09-25.csv (the XBE
# certificate's id; `canonical_title_id` column, which folds regional ids).
#
# A title with no entry here is judged on [defaults] with the generic route;
# the verdict still finds nothing to key it on, so title_id is null until an
# entry names its ISO. Entries need only what differs from the defaults.
#
#   name        the CSV's name
#   iso         the ISO's file name per device, under that device's
#               DEVICE_ISO_ROOT (devices.sh); this is how a run is matched
#   target_fps  the title's OWN frame target. The Playable bar is 30 for
#               every title; a title whose own target is 60 and that runs at
#               30 is flagged below_own_target, not failed -- many Xbox games
#               tie game speed to frame rate, so it may be in slow motion,
#               and a human decides.
#   route       its own route in routes/<route>.route (else generic); or,
#               for a title whose way in depends on a saved profile, the
#               variants routes/<route>.first-run.route and
#               routes/<route>.returning.route, which titlestate.py picks
#               between from the device's title state
#   notes       free text; where a value came from

[defaults]
playable_fps = 30          # the owner's bar, 2026-09-25
fps_share_min = 0.90       # of gameplay TIME at or above the bar
# A window counts as at the bar at >= bar * this. Guest vblank is not
# exactly 60 Hz everywhere (NTSC is 59.94), and a title locked to half of it
# measures 29.97, which is the bar met, not missed.
fps_tolerance = 0.95
# "No dropouts in audio", made mechanical: the share of APU sink callbacks
# that came up short after the first 10 s of gameplay. 0.1% of callbacks is
# about one 5 ms shortfall every five seconds; set 0.0 for literal zero.
audio_starve_max_share = 0.001
screening_s = 600
confirmation_s = 1200

